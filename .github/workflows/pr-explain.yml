# PR ごとの解説ページ(gh-pages/pr-explain/pr-{番号}/)の「変更の地図」を置き、PR が閉じたら消す。
#
# 解説の本文はセッションが `pr-explain` スキルで書いて同じフォルダへ直接 push する。ここが置くのは
# git の差分だけで決まる地図(change-map.json)と、解説がまだ無いときのテンプレートだけ。
# ページの URL は storybook-pr-preview.yml の固定コメントに載る。
#
# storybook-pr-preview.yml とは別のワークフローにしてあるのは、あちらが Storybook のビルドを
# 待つため(数分)。地図は差分だけで作れるので、ビルドを待たずに出す。
name: PR Explain

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write

# PR ごとに独立したグループにする(理由は storybook-pr-preview.yml の concurrency)。
concurrency:
  group: pr-explain-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  change-map:
    # フォークや Dependabot の PR では GITHUB_TOKEN が read-only になり gh-pages へ push できない
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # merge-base を求めるので履歴をすべて取る。認証は下の公開ステップで 1 本だけ渡すので、
      # checkout には残させない(残すと git が Authorization を 2 本送る)。
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build change map
        if: github.event.action != 'closed'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.number }}
        run: python3 .github/scripts/build-pr-change-map.py --base "$BASE_SHA" --head "$HEAD_SHA" --pr "$PR" > "$RUNNER_TEMP/change-map.json"

      # 環境変数の git 設定で認証ヘッダを渡す。pr-explain-pages.sh は gh-pages を作業用の別フォルダへ
      # clone するので、どのフォルダで走る git にも同じ設定が効く形にする。base64 にした値は
      # Actions が自動では伏せないので、ログに出ないよう登録する。
      - name: Publish to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.number }}
          ACTION: ${{ github.event.action }}
        run: |
          credential="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$credential"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $credential"
          if [ "$ACTION" = "closed" ]; then
            bash .github/scripts/pr-explain-pages.sh remove "$PR"
          else
            bash .github/scripts/pr-explain-pages.sh put-map "$PR" "$RUNNER_TEMP/change-map.json" .claude/skills/pr-explain/templates/index.html
          fi
