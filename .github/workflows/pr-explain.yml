# PR ごとの解説ページ(gh-pages/pr-explain/pr-{番号}/)の「変更の地図」を置く。PR が閉じてもフォルダは消さない。
# 閉じても消さないのは、マージ後に PR を辿った人が同じ URL で解説を読めるようにするため(#1394)。
# #1394 時点で 1 PR 約 0.6MB(大半は枠の index.html)。gh-pages の容量上限が近づいたら、消すのではなく枠の共有を別 Issue で検討する。
#
# 解説(explain.json)はセッションが `pr-explain` スキルで書いて同じフォルダへ置く。ここが置くのは
# git の差分だけで決まる地図(change-map.json)と、ページの枠(index.html。push のたびに置き直す)。
# ページの URL は storybook-pr-preview.yml の固定コメントに載る。
#
# storybook-pr-preview.yml とは別のワークフローにしてあるのは、あちらが Storybook のビルドを
# 待つため(数分)。地図は差分だけで作れるので、ビルドを待たずに出す。
#
# pr-explain-list.yml の `workflow_run` がこの名前を文字列で参照する(変えたら向こうも直す)。
name: PR Explain

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

# PR ごとに独立したグループにする(共有グループだと待機中の run が別 PR の run に置き換えられ、その PR の地図の更新が抜ける)。
concurrency:
  group: pr-explain-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  change-map:
    # フォークや Dependabot の PR では GITHUB_TOKEN が read-only になり gh-pages へ push できない
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # merge-base を求めるので履歴をすべて取る。`persist-credentials` の理由は `lib/git-token-auth.sh`。
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build change map
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR: ${{ github.event.number }}
        run: python3 .github/scripts/build-pr-change-map.py --base "$BASE_SHA" --head "$HEAD_SHA" --pr "$PR" --head-branch "$HEAD_BRANCH" --base-branch "$BASE_BRANCH" > "$RUNNER_TEMP/change-map.json"

      - name: Publish to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.number }}
        run: |
          . .github/scripts/lib/git-token-auth.sh
          export_git_token_header
          bash .github/scripts/pr-explain-pages.sh put-map "$PR" "$RUNNER_TEMP/change-map.json" .claude/skills/pr-explain/templates/index.html
