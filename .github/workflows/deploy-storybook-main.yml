# main ブランチの Storybook を gh-pages ルートへデプロイ
name: Deploy Storybook (main)

on:
  push:
    branches: [main]

permissions:
  contents: write

# gh-pages への push 競合はデプロイステップ内のリトライで吸収する
concurrency:
  group: deploy-storybook-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ubuntu-24.04 ランナーには CJK フォントが無く、日本語が豆腐(□)で描画される。
      # 豆腐は「差分なし」で baseline に焼き付いてしまうため、撮影前に必ず導入する。
      - name: Install Japanese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f
          fc-list :lang=ja family

      - name: Build Storybook
        run: pnpm build-storybook

      - name: Capture visual baseline
        run: pnpm visual:capture -- --storybook-dir storybook-static --out visual-baseline

      - name: Deploy to gh-pages (root)
        env:
          OUTPUT_DIR: storybook-static
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          success=false
          for attempt in 1 2 3 4 5; do
            git worktree remove --force /tmp/gh-pages 2>/dev/null || true
            git branch -D gh-pages 2>/dev/null || true

            # gh-pages ブランチが無ければ空の orphan として作成
            if git fetch origin +gh-pages:refs/remotes/origin/gh-pages 2>/dev/null; then
              git worktree add --detach /tmp/gh-pages origin/gh-pages
            else
              git worktree add --detach /tmp/gh-pages
              git -C /tmp/gh-pages checkout --orphan gh-pages
              git -C /tmp/gh-pages rm -rf --quiet . || true
            fi

            cd /tmp/gh-pages

            # pr-preview/ と visual-regression/ 以外を全削除してから main の成果物を配置
            find . -mindepth 1 -maxdepth 1 ! -name pr-preview ! -name visual-regression ! -name .git -exec rm -rf {} +
            cp -r "$GITHUB_WORKSPACE/$OUTPUT_DIR/." .
            rm -rf visual-baseline
            cp -r "$GITHUB_WORKSPACE/visual-baseline" visual-baseline
            touch .nojekyll

            git add -A
            if ! git commit -m "Deploy main @ ${GITHUB_SHA::7}"; then
              echo "no changes to deploy"
              success=true
              break
            fi

            # 他ワークフローの push と競合したら fetch からやり直す
            if git push origin HEAD:gh-pages; then
              success=true
              break
            fi
            echo "push failed (attempt $attempt), retrying..."
            cd "$GITHUB_WORKSPACE"
            sleep $((attempt * 2))
          done
          [ "$success" = "true" ]

          # gh-pages への push だけで Pages のビルドは走るので、ここでは何もしない。
          # かつては「GITHUB_TOKEN の push ではビルドされない」という前提で
          # `POST /pages/builds` を足していたが、実際には push でも走っており、
          # 1 コミットにつきデプロイが 2 本作られていた(全履歴で 673 本 / 338 コミット)。
          # Pages は同時に 1 つしかデプロイできないため、余分な 1 本が
          # `deployment_queued` のまま 10 分でタイムアウトし、公開が止まる(#109)。
