# PR がマージ時に閉じる Issue を持っているかの検査（AGENTS.md「着手した Issue は、その回で閉じる」）。
#
# frontend.yml とは別のワークフローにしてあるのは、**本文の編集（`edited`）で再実行する
# 必要がある**ため。frontend.yml へ `edited` を足すと、本文を直しただけで
# lint / typecheck / test が丸ごと走り直す。
#
# `GH_TOKEN: ${{ github.token }}` を env に置いて `gh api` を呼ぶ形は、frontend.yml の
# `report-comment` ジョブと ci-trace.yml に倣う（どちらも REST。`gh api graphql` はここが初）。
# ci-trace.yml の `workflows:` には載せない。トレースの目的は実行時間の可視化で、
# このジョブは数秒しかかからないため。
#
# `duplicate-issue-pr` ジョブは同じ `closingIssuesReferences` を読むが別ジョブにしてある。
# 閉じ忘れ(`closing-issue`)はマージを止めたい検査だが、重複はこの検査だけでは
# どちらが正しいか判定できない情報提供にとどまるため、**判定では赤にしない**
# （`harness/records/pr-604.md` 指摘 1 / `pr-605.md` 指摘 1）。
# そのぶん、このジョブの赤は「問い合わせが 3 回とも通らなかった」だけを意味する。
name: pr-closing-issue

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: pr-closing-issue-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  closing-issue:
    # **このジョブはまだ必須チェックに登録されていない。** 登録はリポジトリ側の
    # ブランチ保護の設定で、ここからは変更できない。登録されるまでは赤く出るだけで
    # マージは止まらないので、閉じ忘れた PR を止めたいなら登録が要る。
    # 登録したあとはジョブ名を変えない（名前で対応しているので外れる。
    # frontend.yml の `lint-suppress` が名前を据え置いているのと同じ理由）。
    name: PR が閉じる Issue のチェック
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # `closingIssuesReferences` が返すのは Issue なので、`pull-requests` だけでは足りない
    # （`permissions:` を書いた時点で、書かなかったスコープは none になる）
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      # PR 本文はシェルへ渡さない（PR 番号だけ渡す）ので、`${{ }}` の展開が
      # コマンドになる経路を作らない
      - name: 閉じる Issue
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_IS_OPENED: ${{ github.event.action == 'opened' }}
        run: bash .github/scripts/check-pr-closing-issue.sh

  duplicate-issue-pr:
    name: 同じ Issue を閉じる他の PR のチェック
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      issues: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      # `continue-on-error` は置かない。判定では赤にしない設計だが、それをステップ側で
      # 実現すると、クエリのフィールド名・`permissions` の破損や GraphQL の 3 回失敗まで
      # 緑になり、検査が動いていないことに誰も気づけない。コメントの投稿・差し替えの
      # 失敗だけをスクリプトの中で握る（このジョブの赤 = 問い合わせが通らなかった）
      - name: 重複を確認してコメントする
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash .github/scripts/check-duplicate-issue-pr.sh
