name: Storybook Visual Regression

on:
  pull_request:
    # labeled / unlabeled も受けるのは、意図した差分の承認をラベルで行うため。
    # ラベルの付け外しでチェックを green / red へ切り替えられるようにする。
    types: [opened, reopened, synchronize, closed, labeled, unlabeled]

env:
  # このラベルが付いている間、差分があってもチェックを通す(下の「意図した差分の承認」参照)。
  VISUAL_APPROVAL_LABEL: visual-approved

permissions:
  contents: write
  pull-requests: write
  issues: write
  # 取り残されたリビジョンの再デプロイ要求にだけ使う(#109)
  pages: write

concurrency:
  group: storybook-visual-regression-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  visual-regression:
    # ラベルの付け外しは承認ラベルのときだけ走らせる。全ラベルで再実行すると、
    # 無関係なラベルを付けるたびに撮影からやり直して数分待たされるため。
    #
    # ここだけ `env.VISUAL_APPROVAL_LABEL` ではなく綴りを直接書いている。
    # job レベルの `if` は env コンテキストを読めず、参照すると常に空文字と
    # 比較されて承認ラベルでの再実行が起きなくなるため(GitHub の式の制約)。
    if: >-
      (github.event.action != 'labeled' && github.event.action != 'unlabeled')
      || github.event.label.name == 'visual-approved'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        if: github.event.action != 'closed'
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Node.js
        if: github.event.action != 'closed'
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        if: github.event.action != 'closed'
        run: pnpm install --frozen-lockfile

      - name: Verify odiff binary
        if: github.event.action != 'closed'
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync, rmSync } from "node:fs";
          import { tmpdir } from "node:os";
          import { join } from "node:path";
          import { ODiffServer } from "odiff-bin";

          const fixture = Buffer.from("iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=", "base64");
          const root = join(tmpdir(), `odiff-smoke-${process.pid}`);
          const expected = `${root}-expected.png`;
          const actual = `${root}-actual.png`;
          const diff = `${root}-diff.png`;
          writeFileSync(expected, fixture);
          writeFileSync(actual, fixture);
          const server = new ODiffServer();
          try {
            const result = await server.compare(expected, actual, diff, { timeout: 30_000 });
            if (!result.match) throw new Error(`odiff smoke comparison failed: ${JSON.stringify(result)}`);
          } finally {
            server.stop();
            for (const path of [expected, actual, diff]) rmSync(path, { force: true });
          }
          NODE

      # ubuntu-24.04 ランナーには CJK フォントが無く、日本語が豆腐(□)で描画される。
      # 豆腐は「差分なし」で baseline に焼き付いてしまうため、撮影前に必ず導入する。
      - name: Install Japanese fonts
        if: github.event.action != 'closed'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f
          fc-list :lang=ja family

      - name: Build Storybook
        if: github.event.action != 'closed'
        run: pnpm build-storybook

      - name: Fetch visual baseline
        if: github.event.action != 'closed'
        run: |
          mkdir -p visual-baseline
          if git fetch origin +gh-pages:refs/remotes/origin/gh-pages 2>/dev/null; then
            git checkout origin/gh-pages -- visual-baseline 2>/dev/null || true
          fi

      - name: Capture Storybook screenshots
        if: github.event.action != 'closed'
        run: pnpm visual:capture -- --storybook-dir storybook-static --out visual-actual

      - name: Compare screenshots
        if: github.event.action != 'closed'
        id: compare
        continue-on-error: true
        run: >-
          pnpm visual:compare --
          --expected visual-baseline
          --actual visual-actual
          --out visual-report
          --max-diff-ratio 0.002
          --report-version ${{ github.event.pull_request.head.sha }}

      - name: Verify visual report UI
        id: verify-report
        if: always() && github.event.action != 'closed'
        env:
          REPORT_VERSION: ${{ github.event.pull_request.head.sha }}
        run: |
          test -f visual-report/index.html
          grep -Fq 'Visual report UI v8' visual-report/index.html
          # reg-viz と同じ5つの比較モードが揃っていること。
          grep -Fq 'data-view-mode="diff"' visual-report/index.html
          grep -Fq 'data-view-mode="slide"' visual-report/index.html
          grep -Fq 'data-view-mode="2up"' visual-report/index.html
          grep -Fq 'data-view-mode="blend"' visual-report/index.html
          grep -Fq 'data-view-mode="toggle"' visual-report/index.html
          grep -Fq 'id="report-data"' visual-report/index.html
          node -e 'const summary = require("./visual-report/summary.json"); if (summary.reportVersion !== process.env.REPORT_VERSION) process.exit(1)'
          # Changed / New / Deleted / Passed の集計がコメント生成の前提になる。
          node -e 'const summary = require("./visual-report/summary.json"); for (const key of ["changed", "new", "deleted", "passed"]) if (typeof summary[key] !== "number") process.exit(1)'
          RESULTS=$(node -e 'console.log(require("./visual-report/summary.json").results.length)')
          if [ "$RESULTS" -gt 0 ]; then
            grep -Fq 'id="story-navigation"' visual-report/index.html
            grep -Fq 'placeholder="Filter by file name"' visual-report/index.html
            find visual-report -mindepth 2 -maxdepth 2 -name index.html -print -quit | grep -q .
          fi

      - name: Upload visual report
        if: always() && github.event.action != 'closed'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: storybook-visual-report
          path: visual-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish visual report to gh-pages
        id: publish-report
        if: github.event.action == 'closed' || steps.verify-report.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          CLOSED: ${{ github.event.action == 'closed' }}
          VISUAL_REPORT_DIR: visual-report
          REPORT_VERSION: ${{ github.event.pull_request.head.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ "$CLOSED" = "true" ]; then ACTION=removed; else ACTION=updated; fi

          success=false
          for attempt in 1 2 3 4 5; do
            git worktree remove --force /tmp/gh-pages 2>/dev/null || true
            git branch -D gh-pages 2>/dev/null || true

            if git fetch origin +gh-pages:refs/remotes/origin/gh-pages 2>/dev/null; then
              git worktree add --detach /tmp/gh-pages origin/gh-pages
            else
              git worktree add --detach /tmp/gh-pages
              git -C /tmp/gh-pages checkout --orphan gh-pages
              git -C /tmp/gh-pages rm -rf --quiet . || true
            fi

            cd /tmp/gh-pages

            rm -rf "visual-regression/pr-$PR"
            if [ "$CLOSED" != "true" ]; then
              mkdir -p "visual-regression/pr-$PR"
              cp -r "$GITHUB_WORKSPACE/$VISUAL_REPORT_DIR/." "visual-regression/pr-$PR/"
              node -e 'const summary = require(`./visual-regression/pr-${process.env.PR}/summary.json`); if (summary.reportVersion !== process.env.REPORT_VERSION) process.exit(1)'
            fi
            touch .nojekyll

            git add -A
            if ! git commit -m "Visual regression report #$PR ($ACTION)"; then
              echo "no changes"
              success=true
              break
            fi

            if git push origin HEAD:gh-pages; then
              success=true
              break
            fi
            echo "push failed (attempt $attempt), retrying..."
            cd "$GITHUB_WORKSPACE"
            sleep $((attempt * 2))
          done
          [ "$success" = "true" ]

          # gh-pages への push だけで Pages のビルドは走る。ここで
          # `POST /pages/builds` を足すと 1 コミットにつきデプロイが 2 本になり、
          # 同時に 1 つしか走れない Pages でキューが詰まって、片方が
          # `deployment_queued` のまま 10 分でタイムアウトする(#109)。
          #
          # 公開の確認は push の有無で分岐させない。再実行などで push すべき差分が
          # 無かったときも、レポートが実際に配信されていることを確かめる
          # (見えていないのに緑になる状態を作らない)。
          #
          # 待ち時間を 10 分取るのは、キューに入ったデプロイが実測で 10 分 42 秒
          # かかったため。5 分では配信されているのに失敗と判定してしまう(#109)。
          wait_for_publication() {
            for attempt in $(seq 1 120); do
              if curl --fail --silent --show-error "$PUBLIC_SUMMARY" -o /tmp/published-visual-summary.json \
                && node -e 'const summary = require("/tmp/published-visual-summary.json"); if (summary.reportVersion !== process.env.REPORT_VERSION) process.exit(1)'; then
                return 0
              fi
              echo "Waiting for Pages report revision $REPORT_VERSION (attempt $attempt)..."
              sleep 5
            done
            return 1
          }

          if [ "$CLOSED" != "true" ]; then
            OWNER="${GITHUB_REPOSITORY%%/*}"
            REPO_NAME="${GITHUB_REPOSITORY#*/}"
            PUBLIC_SUMMARY="https://${OWNER}.github.io/${REPO_NAME}/visual-regression/pr-${PR}/summary.json?revision=${REPORT_VERSION}"

            # 通常は push が起こしたビルドで配信される。
            # ただし短い間隔で 2 回 push すると、後の push のツリーが
            # デプロイされないまま終わることがある(#110 で実際に発生。
            # プレビューの push と VRT の push が 1 分差で並び、
            # デプロイはプレビュー側のツリーだけを配信して完了した)。
            # その取り残しからは自力で復帰できないので、配信されていないときに
            # 限りビルドを 1 本だけ要求する。push 済みの分と二重にはならない。
            if ! wait_for_publication; then
              echo "revision is still not published; requesting a Pages build"
              # 既にビルド中(409)なら要求は通らないが、待つこと自体は正しいので続ける
              gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" \
                || echo "build request was rejected; waiting for the running build instead"
              wait_for_publication
            fi
          fi

      # 承認ラベルはリポジトリに実在しないと PR へ付けられない。差分が出て初めて
      # 要るものなので、案内を出す直前にこの場で用意する(既にあれば何もしない)。
      - name: Ensure visual approval label exists
        if: always() && github.event.action != 'closed' && steps.compare.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create "$VISUAL_APPROVAL_LABEL" \
            --description "Storybook の視覚差分をレビュー済みとして承認する" \
            --color BFD4F2 \
            || echo "ラベルは既にあるので作らない"

      - name: Comment visual report
        if: always() && github.event.action != 'closed'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMPARE_OUTCOME: ${{ steps.compare.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify-report.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish-report.outcome }}
        run: |
          MARKER="<!-- sticky-comment: storybook-visual-regression -->"
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          OWNER="${GITHUB_REPOSITORY%%/*}"
          PREVIEW_URL="https://${OWNER}.github.io/${REPO_NAME}/pr-preview/pr-${PR_NUMBER}/"
          REPORT_URL="https://${OWNER}.github.io/${REPO_NAME}/visual-regression/pr-${PR_NUMBER}/?revision=${{ github.event.pull_request.head.sha }}"
          SUMMARY="visual-report/summary.json"
          BODY_FILE=visual-comment.md

          if [ "$PUBLISH_OUTCOME" = "success" ] && [ -f "$SUMMARY" ]; then
            COUNTS=$(node -e 'const s = require("./visual-report/summary.json"); console.log(s.changed, s.new, s.deleted, s.passed)')
            set -- $COUNTS
            # 差分がある間はチェックが赤になる。赤を見た人が次に何をすればよいか
            # (レポートを見て、意図した変更ならラベルを付ける)をここに書いておく。
            # 見出しだけだと「壊したのか意図した変更なのか」を読み取れないため。
            if [ "$1" -gt 0 ]; then
              if gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels" --jq '.[].name' \
                | grep -Fxq "$VISUAL_APPROVAL_LABEL"; then
                HEADLINE="差分がありますが、\`${VISUAL_APPROVAL_LABEL}\` ラベルで承認済みのためチェックは通しています。"
              else
                HEADLINE="差分が見つかりました。レポートで確認し、意図した変更なら \`${VISUAL_APPROVAL_LABEL}\` ラベルを付けてください（付けるとチェックが通ります）。意図しない変更ならコードを直してください。"
              fi
            else
              HEADLINE="差分はありませんでした。"
            fi
            {
              echo "$MARKER"
              echo "## Storybook visual regression"
              echo ""
              echo "$HEADLINE"
              echo ""
              # 玉の色はレポート画面の分類アイコンと揃えてある。
              echo "| 🔴 Changed | ⚪ New | ⚫ Deleted | 🔵 Passed |"
              echo "| ---: | ---: | ---: | ---: |"
              echo "| $1 | $2 | $3 | $4 |"
              echo ""
              echo "- [VRT](${REPORT_URL})"
            } > "$BODY_FILE"
          else
            {
              echo "$MARKER"
              echo "## Storybook visual regression"
              echo ""
              if [ -f "$SUMMARY" ]; then
                echo "レポートを公開できませんでした。"
              else
                echo "レポートが見つかりませんでした。"
              fi
              echo ""
              # 括弧内はワークフローの各ステップ名なので英語のままにする。
              echo "- レポート未更新（compare: ${COMPARE_OUTCOME} / verify: ${VERIFY_OUTCOME} / publish: ${PUBLISH_OUTCOME}）"
            } > "$BODY_FILE"
          fi

          {
            echo "- [Actions](${RUN_URL})"
            echo "- [Storybook](${PREVIEW_URL})"
          } >> "$BODY_FILE"

          COMMENT_ID=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --jq "[.[] | select(.body | startswith(\"$MARKER\"))][0].id // empty")
          if [ -n "$COMMENT_ID" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}" --field body=@"$BODY_FILE"
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --field body=@"$BODY_FILE"
          fi

      # 差分は「壊した」と「意図して変えた」の区別が付かないので、既定では落として
      # レビューを止める。意図した変更だと確認できたら承認ラベルで通す。
      #
      # ラベルを見るのに event の payload(`github.event.pull_request.labels`)ではなく
      # API を引くのは、実行中にラベルが付いたときも今の状態で判定するため。
      # payload は実行開始時点のスナップショットなので、撮影中に承認しても古いままになる。
      - name: Fail on visual differences
        if: github.event.action != 'closed' && steps.compare.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels" --jq '.[].name' \
            | grep -Fxq "$VISUAL_APPROVAL_LABEL"; then
            echo "差分は ${VISUAL_APPROVAL_LABEL} ラベルで承認済みのため、チェックは通す。"
            exit 0
          fi
          echo "差分が見つかった。意図した変更なら ${VISUAL_APPROVAL_LABEL} ラベルを付けると通る。"
          exit 1
