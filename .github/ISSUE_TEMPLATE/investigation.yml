name: 調査（ソースを変えずに答えを書く）
description: ソースを変えずに調べて、答えを Issue に書いて閉じる作業
labels:
  - flow:investigation
body:
  - type: textarea
    id: goal
    attributes:
      label: ゴール
      description: 答えが出たとき、何ができるようになっているか
    validations:
      required: true
  - type: textarea
    id: completion
    attributes:
      label: 完了の確かめ方
      description: どこまで確かめたら答えとするか。使うコマンドや、症状を再現する・呼び出し元を数えきるなどの判定条件を書く
    validations:
      required: true
  - type: textarea
    id: basis
    attributes:
      label: 拠り所
      description: 仕様書の節、UI 案の画面名、既存のテストなど。無ければ「無し」と、決める必要があることを書く
    validations:
      required: true
  - type: textarea
    id: decision-scope
    attributes:
      label: 決めてよい範囲
      description: 聞かずに決めてよいことと、必ず人に聞くこと。追加の指定が無ければ「既定に従う」と書く
      placeholder: |
        - 聞かずに決めてよい:
        - 必ず聞く:
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: 問い
      description: 何に答えれば終わりか
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: 観測したこと
  - type: textarea
    id: background
    attributes:
      label: 背景
  - type: textarea
    id: split
    attributes:
      label: 分割の判断
      description: この Issue を子に分けるなら、その軸と理由。分けないなら、その理由。作る時点で決まっていなければ空でよく、決めたら書き足す
  - type: textarea
    id: out-of-scope
    attributes:
      label: スコープ外
