name: バグ（既存の振る舞いの誤り）
description: 既存の振る舞いの誤り。拠り所（仕様書の節や既存のテスト）と食い違う動き
labels:
  - bug
  - flow:bugfix
body:
  - type: textarea
    id: goal
    attributes:
      label: ゴール
      description: 直ったとき、何ができるようになっているか
    validations:
      required: true
  - type: textarea
    id: completion
    attributes:
      label: 完了の確かめ方
      description: 何をどう確かめるか。コマンド・観測・画面で書き、「テストが通る」だけにしない
    validations:
      required: true
  - type: textarea
    id: basis
    attributes:
      label: 拠り所
      description: 仕様書の節、UI 案の画面名、既存のテストなど。無ければ「無し」と、決める必要があることを書く
    validations:
      required: true
  - type: textarea
    id: decision-scope
    attributes:
      label: 決めてよい範囲
      description: 聞かずに決めてよいことと、必ず人に聞くこと。追加の指定が無ければ「既定に従う」と書く
      placeholder: |
        - 聞かずに決めてよい:
        - 必ず聞く:
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      description: どの入力・操作・状態から起きるか
      placeholder: |
        1.
        2.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待する結果
      description: 拠り所となる仕様書の節があれば添える
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 実際の結果
    validations:
      required: true
  - type: textarea
    id: split
    attributes:
      label: 分割の判断
      description: この Issue を子に分けるなら、その軸と理由。分けないなら、その理由。作る時点で決まっていなければ空でよく、決めたら書き足す
  - type: textarea
    id: out-of-scope
    attributes:
      label: スコープ外
