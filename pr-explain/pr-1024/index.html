.code-line[data-sign="-"] .sign { color: var(--del); }
.code-line[data-sign="-"] .code-text { color: #6B4B47; }
.hunk-code.is-code .code-line[data-sign="+"] { background: rgba(46, 157, 91, .045); }
.code-line.is-gap { background: rgba(210, 69, 58, .05); }
.code-line .bar { position: relative; }
.code-line .bar.is-on::before { content: ""; position: absolute; left: 0; right: 0; top: 0; bottom: 0; background: var(--add-mark); }
.code-line .bar.is-start::before { top: 4px; border-top-left-radius: 2px; border-top-right-radius: 2px; }
.code-line .bar.is-end::before { bottom: 4px; border-bottom-left-radius: 2px; border-bottom-right-radius: 2px; }
.code-text { white-space: pre; padding-right: 16px; }
.code-line.is-lit { background: rgba(47, 91, 234, .14); box-shadow: inset 3px 0 0 var(--accent); }
.code-line.is-lit .bar.is-on::before, .marker.is-lit { background: var(--accent); }
.note { display: flex; gap: 9px; align-items: flex-start; padding: 9px 11px; border-radius: 9px; background: var(--surface); border: 1px solid var(--line); transition: background .15s, border-color .15s; }
.note.is-lit { background: rgba(47, 91, 234, .08); border-color: var(--accent-ring); }
.note-badge { flex: none; width: 18px; height: 18px; margin-top: 1px; border-radius: 9px; background: var(--ink); color: #FFFFFF; font-size: 10.5px; font-weight: 600; display: flex; align-items: center; justify-content: center; }
.note.is-lit .note-badge { background: var(--accent); }
.note-body { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.note-lines { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); overflow-wrap: anywhere; }
.note-text { font-size: 12.5px; line-height: 1.7; text-wrap: pretty; }
.file-more { padding: 8px 16px; font-size: 12px; background: var(--panel); border-top: 1px solid var(--chip); }
.file-notes { padding: 10px 14px 12px; display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--chip); background: #FCFBF8; }
.file-notes-title { font-size: 11px; font-weight: 600; color: var(--ink-3); }
.tok-kw { color: var(--tok-kw); }
.tok-str { color: var(--tok-str); }
.tok-com { color: var(--tok-com); font-style: italic; }
.tok-num { color: var(--tok-num); }
.tok-fn { color: var(--tok-fn); }
.tok-key { color: var(--tok-key); }
.tok-var { color: var(--tok-var); }
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top"><span class="repo">PR 解説</span><span class="hint">読み込み中…</span></header>
</div>
<script>
(() => {
  "use strict";

  /** コードの色分け。キーワード・文字列・コメント・数値・関数呼び出しに加え、YAML はキー、シェルは変数、HTML はタグと属性名に色を付ける簡易なもの。 */
  const Highlighter = (() => {
    const words = (list) => new Set(list.split(" ").filter((word) => word !== ""));
    const Grammars = {
      python: { comment: "#", hashAnywhere: true, strings: ['"""', "'''", '"', "'"], keywords: words("def class return if elif else for while in not and or is None True False import from as with try except finally raise lambda yield pass continue break assert del async await global nonlocal") },
      js: { comment: "//", block: ["/*", "*/"], strings: ['"', "'", "`"], keywords: words("const let var function return if else for while of in new class extends import export from default switch case break continue try catch finally throw typeof instanceof null undefined true false this async await yield delete void") },
      shell: { comment: "#", strings: ['"', "'"], variables: true, keywords: words("if then else elif fi for in do done while until case esac function return local export set exit trap source echo readonly shift") },
      yaml: { comment: "#", strings: ['"', "'"], keys: true, keywords: words("true false null") },
      html: { block: ["<!--", "-->"], strings: ['"', "'"], tags: true, keywords: words("") },
    };
    const LanguageByExtension = { py: "python", js: "js", mjs: "js", ts: "js", tsx: "js", jsx: "js", json: "js", sh: "shell", bash: "shell", yml: "yaml", yaml: "yaml", html: "html" };
    const Identifier = /[A-Za-z_]\w*/y;
    const NumberLiteral = /\d+(?:\.\d+)?/y;
    const YamlKey = /[ \t]*(?:- )?[\w.$-]+(?=:(?:\s|$))/y;
    const ShellVariable = /\$(?:\{[^}\n]*\}|[A-Za-z_]\w*|[0-9#?@*$])/y;
    const TagName = /<\/?[A-Za-z][\w-]*/y;
    const AttributeName = /[A-Za-z_:][\w:.-]*(?==)/y;

    /** 字句。`opens` は閉じずに行が終わった文字列・コメントの閉じ記号で、次の行の頭から続ける。 */
    const Token = (cls, value, opens = null) => ({ cls, value, opens });

    const matchAt = (pattern, cursor) => {
      pattern.lastIndex = cursor.at;
      const match = pattern.exec(cursor.text);
      return match ? match[0] : null;
    };
    const restOfLine = (cursor) => {
      const end = cursor.text.indexOf("\n", cursor.at);
      return cursor.text.slice(cursor.at, end < 0 ? cursor.text.length : end);
    };

    /** 文字列の終わりまで。閉じずに行が終わったら、三重引用符とテンプレート文字列だけ次の行へ持ち越す。 */
    const stringAt = (cursor, grammar) => {
      const { text, at } = cursor;
      const quote = grammar.strings.find((candidate) => text.startsWith(candidate, at));
      if (!quote) return null;
      let end = at + quote.length;
      while (end < text.length && text[end] !== "\n") {
        if (text.startsWith(quote, end)) return Token("tok-str", text.slice(at, end + quote.length));
        end += text[end] === "\\" ? 2 : 1;
      }
      const spansLines = quote.length === 3 || quote === "`";
      return Token("tok-str", text.slice(at, Math.min(end, text.length)), spansLines ? quote : null);
    };

    const commentAt = (cursor, grammar) => {
      const { text, at } = cursor;
      const block = grammar.block;
      const isBlockCommentStart = block !== undefined && text.startsWith(block[0], at);
      if (isBlockCommentStart) {
        const close = text.indexOf(block[1], at + block[0].length);
        return close >= 0 ? Token("tok-com", text.slice(at, close + block[1].length)) : Token("tok-com", restOfLine(cursor), block[1]);
      }
      const isLineCommentStart = grammar.comment !== undefined && text.startsWith(grammar.comment, at);
      // `#` は Python 以外では行頭か空白の直後だけコメントにする(シェルの `$#`・URL の `#` を取り違えない)。
      const isHashAllowedHere = grammar.comment !== "#" || grammar.hashAnywhere === true || /\s/.test(cursor.prev);
      const isComment = isLineCommentStart && isHashAllowedHere;
      return isComment ? Token("tok-com", restOfLine(cursor)) : null;
    };

    /**
     * 位置から始まる字句を 1 つ返す。色の付かない識別子も、途中で切らないよう 1 字句(cls が null)で返す。
     * @returns 字句。どの規則にも当たらなければ null(呼び出し側が 1 文字だけ進める)
     */
    const tokenAt = (cursor, grammar) => {
      const isYamlKeyPosition = grammar.keys === true && cursor.lineStart;
      const key = isYamlKeyPosition ? matchAt(YamlKey, cursor) : null;
      if (key) return Token("tok-key", key);
      const quoted = commentAt(cursor, grammar) || stringAt(cursor, grammar);
      if (quoted) return quoted;
      const variable = grammar.variables === true ? matchAt(ShellVariable, cursor) : null;
      if (variable) return Token("tok-var", variable);
      const markup = grammar.tags === true ? matchAt(TagName, cursor) || matchAt(AttributeName, cursor) : null;
      if (markup) return Token(markup.startsWith("<") ? "tok-kw" : "tok-key", markup);
      if (/\w/.test(cursor.prev)) return null;
      const number = matchAt(NumberLiteral, cursor);
      if (number) return Token("tok-num", number);
      const word = matchAt(Identifier, cursor);
      if (!word) return null;
      if (grammar.keywords.has(word)) return Token("tok-kw", word);
      return Token(cursor.text[cursor.at + word.length] === "(" ? "tok-fn" : null, word);
    };

    /** 持ち越しの続き(前の行で閉じなかった文字列・コメント)を、閉じ記号まで 1 字句にする。 */
    const continuationOf = (cursor, open) => {
      const close = cursor.text.indexOf(open.close, cursor.at);
      if (close < 0) return Token(open.cls, cursor.text.slice(cursor.at), open.close);
      return Token(open.cls, cursor.text.slice(cursor.at, close + open.close.length));
    };

    /** 文字列を字句に分け、次へ持ち越す状態(carry)と一緒に返す。 */
    const tokenize = (text, grammar, carry) => {
      const tokens = [];
      let { open, lineStart } = carry;
      let at = 0;
      while (at < text.length) {
        const cursor = { text, at, prev: at > 0 ? text[at - 1] : carry.prev, lineStart };
        const token = open ? continuationOf(cursor, open) : tokenAt(cursor, grammar) || Token(null, text[at]);
        tokens.push(token);
        at += token.value.length;
        open = token.opens === null ? null : { cls: token.cls, close: token.opens };
        lineStart = token.value.endsWith("\n") || (lineStart && !/\S/.test(token.value));
      }
      return { tokens, carry: { open, lineStart, prev: text.length > 0 ? text[text.length - 1] : carry.prev } };
    };

    return Object.freeze({
      /** 1 行目の前の持ち越し(何も開いていない)。 */
      Start: Object.freeze({ open: null, lineStart: true, prev: "\n" }),
      /**
       * パスの拡張子から色分けの規則を引く。
       * @param path ファイルのパス
       * @returns 規則。知らない拡張子なら null(色を付けない)
       */
      grammarOf: (path) => {
        const extension = (path.match(/\.(\w+)$/) || [])[1] || "";
        const language = Object.hasOwn(LanguageByExtension, extension) ? LanguageByExtension[extension] : "";
        return Object.hasOwn(Grammars, language) ? Grammars[language] : null;
      },
      /**
       * 1 行を字句に分ける。行をまたぐ文字列・コメントだけを持ち越し、行頭の扱いは行ごとにやり直す。
       * @param carry 前の行から持ち越した状態(最初の行は `Start`)
       * @returns 字句の並び(`cls` が null のものは色を付けない)と、次の行へ持ち越す状態
       */
      tokenizeLine: (text, grammar, carry) => tokenize(text, grammar, { ...carry, lineStart: true, prev: "\n" }),
    });
  })();

  /** 確認の印の鍵。 */
  const ReviewMark = Object.freeze({
    /**
     * レビューの文 1 つに付ける確認の印の鍵を作る。
     * 番号で持つと、解説を書き直したときに別の文へ印が移る。だから文そのもので持つ。
     * @param sha その文を書いたコミットの sha
     * @param text レビューの文
     * @returns sha と文のどちらかが違えば別になる鍵
     */
    keyOf: (sha, text) => JSON.stringify([sha, text]),
  });

  const Screens = Object.freeze({ Map: "map", Story: "story", Test: "test" });
  const isScreen = (value) => Object.values(Screens).includes(value);

  /** どの画面を開くか。 */
  const ScreenChoice = Object.freeze({
    Screens,
    isScreen,
    /**
     * ハッシュ → 保存値 → 構造マップの順に選ぶ。
     * @param hash `location.hash`(`#` の有無は問わない)
     * @param saved 最後に開いた画面として保存してある値。無ければ null
     * @returns 開く画面
     */
    choose: ({ hash, saved }) => {
      const fromHash = hash.replace(/^#/, "");
      if (isScreen(fromHash)) return fromHash;
      if (isScreen(saved)) return saved;
      return Screens.Map;
    },
  });

  /** 変更の地図(change-map.json)と解説(explain.json)の合流。 */
  const ExplainedMap = (() => {
    const CurrentMapVersion = 2;
    const ExplainVersion = 1;
    const ExplainListKeys = ["features", "layers", "concepts", "messages", "flows", "commitNotes", "suites", "tests"];

    const isRecord = (value) => typeof value === "object" && value !== null && !Array.isArray(value);
    const isListOfRecords = (value) => Array.isArray(value) && value.every(isRecord);
    const isBrokenList = (value) => value !== undefined && !isListOfRecords(value);
    const listOf = (explain, key) => (explain !== null && Array.isArray(explain[key]) ? explain[key] : []);
    const sumOf = (values) => values.reduce((sum, value) => sum + (typeof value === "number" ? value : 0), 0);
    const missing = (reason) => ({ kind: "missing", reason });

    const parsedJson = (text) => {
      try {
        return { isParsed: true, value: JSON.parse(text) };
      } catch (error) {
        return { isParsed: false, detail: error.message };
      }
    };

    /**
     * ページが組み立てに使う骨組みだけを見る。細かい形は公開する前に build-pr-explain.py が見ている。
     * @returns 型の違うキー。違わなければ null
     */
    const shapeProblemOf = (explain) => {
      const overview = explain.overview;
      const hasOverview = isRecord(overview) && Array.isArray(overview.before) && Array.isArray(overview.after);
      if (typeof explain.sha !== "string") return "sha";
      if (!hasOverview) return "overview";
      const broken = ExplainListKeys.find((key) => isBrokenList(explain[key]));
      return broken === undefined ? null : broken;
    };

    /**
     * 読み込んだ解説を、使える解説か「解説なし」とその理由にする。
     * @param source `{kind: "text", text}`(読めた中身)/ `{kind: "absent"}`(置かれていない)/ `{kind: "failed", detail}`(読み込みの失敗)
     * @param pr 地図の PR 番号
     */
    const readingOf = (source, pr) => {
      if (source.kind === "absent") return missing({ kind: "absent" });
      if (source.kind === "failed") return missing({ kind: "unreadable", detail: source.detail });
      const json = parsedJson(source.text);
      if (!json.isParsed) return missing({ kind: "unreadable", detail: json.detail });
      const explain = json.value;
      if (!isRecord(explain)) return missing({ kind: "shape", key: null });
      if (explain.version !== ExplainVersion) return missing({ kind: "version", actual: explain.version });
      if (explain.pr !== pr) return missing({ kind: "pr", actual: explain.pr });
      const problem = shapeProblemOf(explain);
      return problem === null ? { kind: "explained", explain } : missing({ kind: "shape", key: problem });
    };

    /**
     * 箱と木に出すときのファイルの名前。`index.*` は名前がありふれているので親フォルダを付ける。
     * @returns `Hub.ts` / `px/index.ts` の形
     */
    const fileNameOf = (path) => {
      const parts = path.split("/");
      const name = parts[parts.length - 1];
      const isIndex = /^index\./.test(name) && parts.length > 1;
      return isIndex ? `${parts[parts.length - 2]}/${name}` : name;
    };

    // version 1 の地図は変更ファイルしか載せず、`changed` を持たない。
    const isChangedFile = (file) => file.changed !== false;

    const entryOf = (file, layer, concept) => {
      const changed = isChangedFile(file);
      const hasFeature = concept !== null && typeof concept.feature === "string";
      const isDrawn = concept === null || concept.graph !== false;
      return {
        path: file.path,
        layer,
        changed,
        status: changed ? file.status : null,
        oldPath: file.oldPath ?? null,
        additions: file.additions ?? null,
        deletions: file.deletions ?? null,
        target: file.target ?? null,
        conceptName: concept === null ? null : concept.name,
        fileName: fileNameOf(file.path),
        feature: hasFeature ? concept.feature : null,
        inGraph: isDrawn,
        concept,
      };
    };

    /** 木に出すファイル。変更ファイルと、concepts が名指ししたファイル(変更していなくても)。 */
    const entriesOf = (groups, conceptOf) => groups.flatMap((group) => group.files
      .filter((file) => isChangedFile(file) || conceptOf.has(file.path))
      .map((file) => entryOf(file, group.label, conceptOf.get(file.path) ?? null)));

    /** 依存の線の向こう側にあって箱にならないファイル(「ほかに n ファイル」に畳むもの)を、箱ごとに足す。 */
    const withOthers = (entries, dependencies) => {
      const boxes = new Set(entries.filter((entry) => entry.inGraph).map((entry) => entry.path));
      const neighborsOf = (path) => dependencies.flatMap((edge) => {
        if (edge.from === path) return [edge.to];
        if (edge.to === path) return [edge.from];
        return [];
      });
      return entries.map((entry) => ({ ...entry, others: [...new Set(neighborsOf(entry.path))].filter((path) => !boxes.has(path)).sort() }));
    };

    const pathsOf = (entries) => entries.filter((entry) => entry.inGraph).map((entry) => entry.path);
    const treePathsOf = (entries) => entries.map((entry) => entry.path);

    const layerGroupsOf = (groups, entries, layerNotes) => groups.map((group) => {
      const members = entries.filter((entry) => entry.layer === group.label);
      const named = new Set(treePathsOf(members));
      const note = layerNotes.find((layerNote) => layerNote.layer === group.label);
      return {
        kind: "layer",
        layer: group.label,
        role: note === undefined ? null : note.role,
        paths: pathsOf(members),
        treePaths: treePathsOf(members),
        others: group.files.map((file) => file.path).filter((path) => !named.has(path)),
      };
    });

    const featureGroupsOf = (features, entries) => {
      const known = new Set(features.map((feature) => feature.id));
      const assigned = features.map((feature) => {
        const members = entries.filter((entry) => entry.feature === feature.id);
        return { kind: "feature", feature, paths: pathsOf(members), treePaths: treePathsOf(members) };
      });
      const unassignedMembers = entries.filter((entry) => !known.has(entry.feature));
      if (unassignedMembers.length === 0) return assigned;
      return [...assigned, { kind: "unassigned", paths: pathsOf(unassignedMembers), treePaths: treePathsOf(unassignedMembers) }];
    };

    /** まとめ方ごとの組。`layer` は常にあり、`feature` は解説が features を持つときだけある。 */
    const groupingsOf = ({ groups, entries, explain }) => {
      const features = listOf(explain, "features");
      const byLayer = layerGroupsOf(groups, entries, listOf(explain, "layers"));
      if (features.length === 0) return { layer: byLayer };
      return { layer: byLayer, feature: featureGroupsOf(features, entries) };
    };

    const commitOf = (commit, isCurrent) => {
      if (isCurrent) return commit;
      return { sha: commit.sha, merge: false, author: null, date: null, subject: null, body: null, files: [] };
    };

    const freshnessOf = (explain, head, commits) => {
      if (explain === null) return { kind: "none" };
      if (explain.sha === head) return { kind: "latest", sha: explain.sha };
      const index = commits.findIndex((commit) => commit.sha === explain.sha);
      if (index < 0) return { kind: "unknown", sha: explain.sha };
      return { kind: "stale", sha: explain.sha, after: commits.length - 1 - index };
    };

    const commitsOf = (commits, explain) => {
      const notes = new Map(listOf(explain, "commitNotes").map((note) => [note.sha, note]));
      const explainedAt = explain === null ? -1 : commits.findIndex((commit) => commit.sha === explain.sha);
      return commits.map((commit, index) => {
        const additions = sumOf(commit.files.map((file) => file.additions));
        const deletions = sumOf(commit.files.map((file) => file.deletions));
        const afterExplained = explainedAt >= 0 && index > explainedAt;
        return { ...commit, additions, deletions, note: notes.get(commit.sha) ?? null, afterExplained };
      });
    };

    const testKeyOf = (file, name) => JSON.stringify([file, name]);

    /**
     * テストの一覧。解説があれば解説のテストを並べ、new / old は地図の追加から導く。解説に無い追加と、
     * 削除は地図から足す。
     */
    const testsOf = ({ mapTests, explain, targetOf }) => {
      const added = new Set(mapTests.added.map((test) => testKeyOf(test.file, test.name)));
      const fromMap = (status) => (test) => ({ name: test.name, file: test.file, status, targets: targetOf(test.file), test: null, suite: null });
      const removed = mapTests.removed.map(fromMap("removed"));
      const suites = new Map(listOf(explain, "suites").map((suite) => [suite.id, suite]));
      const statusOf = (test, file) => {
        if (test.todo === true) return "todo";
        return added.has(testKeyOf(file, test.name)) ? "new" : "old";
      };
      const explained = listOf(explain, "tests").map((test) => {
        const suite = suites.get(test.suite) ?? null;
        const file = suite === null ? null : suite.file;
        return { name: test.name, file, status: statusOf(test, file), targets: Array.isArray(test.targets) ? test.targets : [], test, suite };
      });
      const covered = new Set(explained.map((test) => testKeyOf(test.file, test.name)));
      const unexplained = mapTests.added.filter((test) => !covered.has(testKeyOf(test.file, test.name))).map(fromMap("new"));
      return [...explained, ...unexplained, ...removed];
    };

    /**
     * 地図と解説を合わせる。解説が無い・使えないときも、地図だけで 3 画面の材料を作る。
     * @param map change-map.json の中身(version 1 / 2)
     * @param source 解説の読み込み結果(`readingOf` の source と同じ)
     * @returns 画面が使う材料。解説の状態は `explain`(`explained` / `missing` と理由)と `freshness` に出る
     */
    const from = (map, source) => {
      const isCurrent = map.version === CurrentMapVersion;
      const reading = readingOf(source, map.pr);
      const explain = reading.kind === "explained" ? reading.explain : null;
      const concepts = listOf(explain, "concepts");
      const conceptOf = new Map(concepts.map((concept) => [concept.path, concept]));
      const mapPaths = new Set(map.groups.flatMap((group) => group.files.map((file) => file.path)));
      const dependencies = Array.isArray(map.dependencies) ? map.dependencies : [];
      const entries = withOthers(entriesOf(map.groups, conceptOf), dependencies);
      const mapCommits = map.commits.map((commit) => commitOf(commit, isCurrent));
      const targets = new Map(map.groups.flatMap((group) => group.files).map((file) => [file.path, file.target ?? null]));
      const targetOf = (path) => (targets.get(path) ? [targets.get(path)] : []);
      const changed = entries.filter((entry) => entry.changed);
      return Object.freeze({
        map: { version: map.version, isCurrent, pr: map.pr, head: map.head, mergeBase: map.mergeBase, headBranch: map.headBranch ?? null, baseBranch: map.baseBranch ?? null },
        explain: reading,
        freshness: freshnessOf(explain, map.head, mapCommits),
        entries,
        groupings: groupingsOf({ groups: map.groups, entries, explain }),
        unmappedConcepts: concepts.filter((concept) => !mapPaths.has(concept.path)),
        commits: commitsOf(mapCommits, explain),
        strayNotes: listOf(explain, "commitNotes").filter((note) => !mapCommits.some((commit) => commit.sha === note.sha)),
        tests: testsOf({ mapTests: isRecord(map.tests) ? map.tests : { added: [], removed: [] }, explain, targetOf }),
        totals: { files: changed.length, additions: sumOf(changed.map((entry) => entry.additions)), deletions: sumOf(changed.map((entry) => entry.deletions)), commits: mapCommits.length },
      });
    };

    return Object.freeze({
      from,
      /**
       * 箱と木に出す名前。
       * @param naming `concept`(concept 名。無ければファイル名)/ `file`(ファイル名)
       */
      nameOf: (entry, naming) => (naming === "concept" && entry.conceptName !== null ? entry.conceptName : entry.fileName),
    });
  })();

  /** コミットの差分。patch を hunk の行に分け、行への注釈を hunk に割り当て、コードの表示では消した行を畳む。 */
  const CommitDiff = (() => {
    const HunkHeader = /^@@ -(\d+)(?:,\d+)? \+(\d+)(?:,\d+)? @@/;
    const ChangeSigns = new Set(["+", "-"]);

    const sideOf = (note) => (note.side === "old" ? "old" : "new");
    const numberOn = (line, side) => (side === "old" ? line.oldNo : line.newNo);

    /**
     * 注釈の行の範囲に、その行が入るか。行番号は注釈の `side` の側で見る。
     * @param line hunk の行(`oldNo` / `newNo` は、その側に無い行なら null)
     */
    const covers = (note, line) => {
      const number = numberOn(line, sideOf(note));
      return number !== null && number >= note.start && number <= note.end;
    };

    /** hunk の見出しから後の 1 行を、記号と両側の行番号の付いた行にする。 */
    const lineOf = (raw, next) => {
      const sign = ChangeSigns.has(raw[0]) ? raw[0] : " ";
      return { sign, oldNo: sign === "+" ? null : next.old, newNo: sign === "-" ? null : next.new, text: raw.slice(1) };
    };

    /** patch を hunk に分ける。`\ No newline at end of file` は行ではないので落とす。 */
    const hunksOf = (patch) => {
      const hunks = [];
      let next = null;
      for (const raw of patch.split("\n")) {
        const header = HunkHeader.exec(raw);
        if (header !== null) {
          next = { old: Number(header[1]), new: Number(header[2]) };
          hunks.push({ header: raw, lines: [] });
          continue;
        }
        const isLine = next !== null && !raw.startsWith("\\");
        if (!isLine) continue;
        const line = lineOf(raw, next);
        next = { old: next.old + (line.oldNo === null ? 0 : 1), new: next.new + (line.newNo === null ? 0 : 1) };
        hunks[hunks.length - 1].lines.push(line);
      }
      return hunks;
    };

    /** 注釈に、ファイルの中で通した番号(`from` の次から)を付ける。 */
    const numbered = (notes, from) => notes.map((note, index) => ({ ...note, side: sideOf(note), n: from + index + 1 }));

    const hunkBodyOf = (file, notes) => {
      const hunks = hunksOf(file.patch);
      const placedAt = notes.map((note) => hunks.findIndex((hunk) => hunk.lines.some((line) => covers(note, line))));
      const placed = hunks.map((hunk, index) => notes.filter((note, noteIndex) => placedAt[noteIndex] === index));
      const firstNumbers = placed.map((group, index) => placed.slice(0, index).reduce((sum, earlier) => sum + earlier.length, 0));
      const placedCount = placed.reduce((sum, group) => sum + group.length, 0);
      const remaining = file.truncated === true ? file.patchLines - file.patch.split("\n").length : 0;
      return {
        body: { kind: "hunks", hunks: hunks.map((hunk, index) => ({ ...hunk, notes: numbered(placed[index], firstNumbers[index]) })), remaining },
        unplaced: numbered(notes.filter((note, index) => placedAt[index] < 0), placedCount),
      };
    };

    /** patch が null のとき。消したファイルなら、変更前の行への注釈をそこに付ける。 */
    const missingBodyOf = (file, notes) => {
      if (file.status !== "D") return { body: { kind: "binary" }, unplaced: numbered(notes, 0) };
      const lines = typeof file.deletions === "number" ? file.deletions : null;
      const isOnDeletedLine = (note) => sideOf(note) === "old" && (lines === null || note.start <= lines);
      const onDeleted = notes.filter(isOnDeletedLine);
      return { body: { kind: "deleted", lines, notes: numbered(onDeleted, 0) }, unplaced: numbered(notes.filter((note) => !isOnDeletedLine(note)), onDeleted.length) };
    };

    const fileOf = (file, notes) => {
      const shown = { path: file.path, oldPath: file.oldPath ?? null, status: file.status, additions: file.additions, deletions: file.deletions };
      if (file.patch === "") return { ...shown, body: { kind: "unchanged" }, unplaced: numbered(notes, 0) };
      if (file.patch === null) return { ...shown, ...missingBodyOf(file, notes) };
      return { ...shown, ...hunkBodyOf(file, notes) };
    };

    return Object.freeze({
      covers,
      /**
       * コミットのファイルごとに差分を組み、解説の注釈を `side` の行番号が入る最初の hunk に付ける(番号はファイルの
       * 中で hunk の順に通す)。どの hunk にも入らない注釈は `unplaced` に回す。
       * @param commit 地図のコミット(マージは files が空)
       * @param note そのコミットの commitNote。無ければ null
       * @returns `files`(本文の `body` は `hunks` / `unchanged`(patch が空)/ `deleted` / `binary`)と、そのコミットに無い
       *   パスへの注釈 `strayNotes`
       */
      of: (commit, note) => {
        const hasNotes = note !== null && Array.isArray(note.notes);
        const notes = hasNotes ? note.notes : [];
        const paths = new Set(commit.files.map((file) => file.path));
        return {
          files: commit.files.map((file) => fileOf(file, notes.filter((item) => item.path === file.path))),
          strayNotes: notes.filter((item) => !paths.has(item.path)),
        };
      },
      /**
       * コードの表示の行。続けて消した行は 1 つの畳み(`gap`)にまとめる。
       * @returns `{kind: "line", line}` と `{kind: "gap", lines}`(畳んだ消した行)の並び
       */
      codeRowsOf: (hunk) => {
        const rows = [];
        for (const line of hunk.lines) {
          const last = rows[rows.length - 1];
          const extendsGap = line.sign === "-" && last !== undefined && last.kind === "gap";
          if (extendsGap) rows[rows.length - 1] = { kind: "gap", lines: [...last.lines, line] };
          else rows.push(line.sign === "-" ? { kind: "gap", lines: [line] } : { kind: "line", line });
        }
        return rows;
      },
    });
  })();

  /** DOM に触らない部分(核)。判定表が node の vm で評価して叩く。 */
  const core = Object.freeze({ ExplainedMap, ScreenChoice, ReviewMark, Highlighter, CommitDiff });
  if (typeof document === "undefined") {

  const Repo = "DIO0550/design-composer";
  const RepoName = Repo.split("/")[1];

  /** 要素の組み立て。中身の文字は textContent で入れ、属性は setAttribute で付ける(HTML として解釈させない)。 */
  const Dom = Object.freeze({
    el: (tag, props, children) => {
      const node = document.createElement(tag);
      for (const [key, value] of Object.entries(props || {})) {
        if (key === "text") node.textContent = value;

      return node;
    },
    /**
     * 解説の文を要素にする。`` `…` `` で囲んだところは code 要素に入れる(どちらも textContent で入れる)。
     * 閉じていない `` ` `` は文字のまま残す。

    prose: (tag, props, text) => {
      const parts = text.split("`");
      const hasUnclosed = parts.length % 2 === 0;
      const paired = hasUnclosed ? [...parts.slice(0, -2), `${parts[parts.length - 2]}\`${parts[parts.length - 1]}`] : parts;
      const children = paired.map((part, index) => (index % 2 === 1 ? Dom.el("code", { text: part }) : part)).filter((child) => child !== "");
      const cls = typeof props.class === "string" ? `${props.class} prose` : "prose";

  /**

  const BrowserStore = Object.freeze({
    /** @returns 保存してある値。無い・読めないときは null */

      try {

  const ScreenLabels = { map: "構造マップ", story: "変更の経緯", test: "テスト" };
  const PageStoreKey = "prExplain.page";

  /** 画面ごとのパネルの既定の幅。左はどの画面にもあり、右は構造マップとテストだけにある。 */
  const PanelLayouts = {
    map: { left: "clamp(224px, 18vw, 264px)", right: "clamp(320px, 28vw, 404px)" },
    story: { left: "clamp(250px, 24vw, 330px)", right: null },

  /** パネルの幅をドラッグで変え、画面ごとに残す。ダブルクリックで既定の幅へ戻す。 */
  const PanelResizer = (() => {
    const MinWidth = 180;
    const MaxWidth = 640;
    const MainMinWidth = 320;

    const columnsOf = (layout, widths) => {
      const widthOf = (side) => (typeof widths[side] === "number" ? `${widths[side]}px` : layout[side]);
      const right = layout.right === null ? [] : [widthOf("right")];
      return [widthOf("left"), "minmax(0, 1fr)", ...right].join(" ");
    };

    const savedWidthsOf = (value) => {
      const isWidths = typeof value === "object" && value !== null;
      return isWidths ? value : {};
    };

    /** つまみを押したところからの移動量で幅を決める。本文の幅を 320px より狭くしない。 */
    const widthDuring = ({ drag, side, event }) => {
      const moved = side === "left" ? event.clientX - drag.x : drag.x - event.clientX;
      const room = drag.gridWidth - drag.otherWidth - MainMinWidth;
      return Math.round(Math.max(MinWidth, Math.min(MaxWidth, room, drag.width + moved)));
    };

    /**
     * @param screen 画面(保存の鍵に使う)
     * @param grid パネルと本文を並べている grid の要素
     * @param panels 幅を変えるパネル(`left` / `right`)
     */
    const attach = ({ screen, grid, panels }) => {
      const storeKey = `prExplain.panels.${screen}`;
      const layout = PanelLayouts[screen];
      let widths = savedWidthsOf(BrowserStore.read(storeKey));
      const apply = () => {
        grid.style.gridTemplateColumns = columnsOf(layout, widths);
      };
      for (const [side, panel] of Object.entries(panels)) {
        const handle = el("div", { class: "resize-handle", title: "ドラッグで幅を変更(ダブルクリックで元に戻す)" }, [el("span", { class: "resize-bar" })]);
        let drag = null;
        handle.addEventListener("pointerdown", (event) => {
          if (event.button !== 0) return;
          event.preventDefault();
          handle.setPointerCapture(event.pointerId);
          handle.classList.add("is-dragging");
          const otherWidth = Object.entries(panels).filter(([other]) => other !== side).reduce((sum, [, other]) => sum + other.getBoundingClientRect().width, 0);
          drag = { x: event.clientX, width: panel.getBoundingClientRect().width, gridWidth: grid.getBoundingClientRect().width, otherWidth };
        });
        handle.addEventListener("pointermove", (event) => {
          if (drag === null) return;
          widths = { ...widths, [side]: widthDuring({ drag, side, event }) };
          apply();
        });
        handle.addEventListener("pointerup", () => {
          if (drag === null) return;
          drag = null;
          handle.classList.remove("is-dragging");
          BrowserStore.write(storeKey, widths);
        });
        handle.addEventListener("dblclick", () => {
          widths = Object.fromEntries(Object.entries(widths).filter(([other]) => other !== side));
          apply();
          BrowserStore.write(storeKey, widths);
        });
        panel.append(handle);
      }
      apply();
    };

    return Object.freeze({ attach });
  })();

  const plus = (count) => `+${count}`;

  const shortSha = (sha) => sha.slice(0, 7);
  const dateLabel = (iso) => (typeof iso === "string" ? iso.slice(0, 16).replace("T", " ") : "");

  const panelHead = (title, sub) => el("div", { class: "panel-head" }, [el("span", { class: "panel-title", text: title }), el("span", { class: "panel-sub", text: sub })]);
  const panelOf = (side, children) => el("aside", { class: `panel is-${side}` }, children);
  const stageOf = (children) => el("main", { class: "stage" }, [el("div", { class: "stage-body" }, children)]);
  const statOf = (value, label) => el("div", { class: "stat" }, [el("span", { class: "stat-value", text: String(value) }), el("span", { class: "stat-label", text: label })]);
  const emptyOf = (text) => el("p", { class: "empty", text });

    const overview = explained.explain.explain.overview;

  };

  const fileRowOf = (entry) => {

  const othersOf = (paths) => {

  };

  /** 構造マップの器。層ごとに、箱になるファイルと畳んだファイルを並べる。 */
  const MapScreen = (explained) => {

      el("div", { class: "group-head" }, [el("span", { class: "group-title", text: group.layer }), el("span", { class: "group-role", text: group.role ?? "" })]),

    const unmapped = explained.unmappedConcepts.map((concept) => el("div", { class: "file-row" }, [el("span", { class: "status", text: "?" }), el("span", {}, [el("div", { class: "file-name", text: concept.name }), el("div", { class: "row-path", text: concept.path })]), el("span")]));

  const PhaseLabels = { prep: "下ごしらえ", core: "本体", hard: "安定化", review: "指摘の反映", fin: "仕上げ" };
  const MessageKindLabels = { cmd: "コマンド", qry: "クエリ", evt: "イベント" };
  const DiffViews = {

  const MoveKeys = { ArrowDown: 1, j: 1, ArrowUp: -1, k: -1 };

  const numberText = (number) => (number === null ? "" : String(number));
  const countsTextOf = (file) => {

  const orderStepOf = (commit, story) => {

  const orderOf = (story, eyebrow) => el("div", { class: "section" }, [

  const reviewCardOf = ({ text, isChecked, onToggle, go }) => {

  const reviewItemsOf = (story) => story.commits.flatMap((commit) => {
    const hasReview = commit.note !== null && Array.isArray(commit.note.review);
    const texts = hasReview ? commit.note.review : [];
    return texts.map((text) => ({ key: ReviewMark.keyOf(commit.sha, text), text, commit }));
  });

  const matchesFilter = (filter, isChecked) => {
    switch (filter) {
      case "all":
        return true;
      case "todo":
        return !isChecked;
      case "done":
        return isChecked;
    }
  };

  const reviewSectionOf = (story) => {
    const items = reviewItemsOf(story);
    if (items.length === 0) return [];
    const { checked, filter } = story.state;
    const counts = { all: items.length, done: items.filter((item) => checked.has(item.key)).length };
    const countOf = { ...counts, todo: counts.all - counts.done };
    const filters = Object.entries(ReviewFilters).map(([key, label]) => pressable("button", { "aria-pressed": String(filter === key) }, [label, el("span", { class: "n", text: String(countOf[key]) })], () => story.actions.setFilter(key)));
    const shown = items.filter((item) => matchesFilter(filter, checked.has(item.key)));
    const cards = shown.map((item) => reviewCardOf({
      text: item.text,
      isChecked: checked.has(item.key),
      onToggle: () => story.actions.toggleCheck(item.key),
      go: { label: `${story.steps.get(item.commit.sha)}. ${item.commit.subject ?? shortSha(item.commit.sha)}`, onPress: () => story.actions.select(item.commit.sha) },
    }));
    const empty = shown.length > 0 ? [] : [el("span", { class: "review-count", text: filter === "done" ? "まだ確認済みのものはありません。" : "すべて確認済みです。" })];
    return [el("div", { class: "section" }, [
      el("div", { class: "section-head" }, [
        el("span", { class: "eyebrow", text: "レビューポイント" }),
        el("span", { class: "review-count" }, ["確認済み ", el("b", { text: String(counts.done) }), ` / ${counts.all}`]),
        el("span", { class: "spacer" }),
        el("div", { class: "toggle-group" }, filters),
      ]),
      ...cards,
      ...empty,
    ])];
  };

  const strayNotesOf = (explained) => {
    if (explained.strayNotes.length === 0) return [];
    return [el("div", { class: "section" }, [
      el("span", { class: "eyebrow", text: `地図に無い解説(${explained.strayNotes.length})` }),
      ...explained.strayNotes.map((note) => el("div", { class: "row" }, [prose("span", { class: "row-title" }, note.role), el("span", { class: "row-meta" }, [el("span", { class: "sha", text: shortSha(note.sha) })])])),
    ])];
  };

  /** ブランチ全体の流れ。解説が無ければ、案内とコミットの件名だけの順番を出す。 */
  const storyOverviewOf = (story) => {
    const { explained, explain } = story;
    if (explain === null) {
      const guide = el("div", { class: "lede" }, [el("span", { class: "eyebrow", text: "ブランチ全体の流れ" }), emptyOf("解説はありません。変更の地図だけで組んでいます。左のコミットを選ぶと、件名・本文と差分を読めます。")]);
      return [guide, orderOf(story, "変更の順番")];
    }
    const lede = ledeOf(explained, "ブランチ全体の流れ");
    const behaviors = el("div", { class: "section" }, [
      el("span", { class: "eyebrow", text: "振る舞いの変化(ブランチ全体)" }),
      el("div", { class: "behaviors" }, [
        behaviorCardOf({ title: "これまで", sub: explained.map.baseBranch ?? "", behaviors: explain.overview.before, isAfter: false, mark: "—" }),
        behaviorCardOf({ title: "このブランチのあと", sub: explained.map.headBranch ?? "", behaviors: explain.overview.after, isAfter: true, mark: "+" }),
      ]),
    ]);
    return [lede, behaviors, orderOf(story, "変更の順番と、それぞれの役割"), ...reviewSectionOf(story), ...strayNotesOf(explained)];
  };

  const commitHeadOf = (commit, story) => {
    const index = story.commits.indexOf(commit);
    const older = index > 0 ? story.commits[index - 1].sha : OverviewId;
    const newer = index < story.commits.length - 1 ? story.commits[index + 1].sha : null;
    const total = story.steps.size;
    const stepText = commit.merge ? "マージ" : `${story.steps.get(commit.sha)} / ${total}`;
    const step = commit.note === null ? [el("span", { text: stepText })] : [el("span", { "data-phase": commit.note.phase, text: `${stepText} · ${phaseLabelOf(commit.note)}` })];
    const newerButton = pressable("button", { text: "次の変更 →" }, [], () => story.actions.select(newer));
    if (newer === null) newerButton.disabled = true;
    const message = commit.body ? [el("pre", { class: "commit-message", text: commit.body })] : [];
    return el("div", { class: "commit-head" }, [
      el("div", { class: "commit-facts" }, [
        el("span", { class: "sha-chip", text: shortSha(commit.sha) }),
        el("span", { text: commit.author ?? "" }),
        el("span", { class: "muted", text: dateLabel(commit.date) }),
        el("span", { class: "mono" }, [el("span", { class: "add", text: plus(commit.additions) }), " ", el("span", { class: "del", text: minus(commit.deletions) })]),
        el("span", { class: "muted", text: `${commit.files.length} ファイル` }),
        el("span", { class: "spacer" }),
        el("span", { class: "step-buttons" }, [pressable("button", { text: "← 前の変更" }, [], () => story.actions.select(older)), newerButton]),
      ]),
      el("div", { class: "commit-step" }, step),
      el("h1", { text: commit.subject ?? shortSha(commit.sha) }),
      ...message,
    ]);
  };

  /** 振る舞いの 1 行。やりとりを指していれば、種類・名前・送り手 → 受け手を添える。 */
  const behaviorItemOf = (behavior, story) => {
    const message = typeof behavior.message === "string" ? story.lookup.messages.get(behavior.message) : undefined;
    const nameOf = (path) => story.lookup.conceptNames.get(path) ?? path;
    const chip = message === undefined ? [] : [el("span", { class: "message-chip" }, [
      el("span", { class: "kind", "data-kind": message.kind, text: MessageKindLabels[message.kind] ?? message.kind }),
      el("span", { class: "message-name", text: message.name }),
      el("span", { class: "message-route", text: `${nameOf(message.from)} → ${nameOf(message.to)}` }),
    ])];
    return el("div", { class: "behavior-item" }, [prose("span", {}, behavior.text), ...chip]);
  };

  const commitBehaviorsOf = (note, story) => {
    const before = Array.isArray(note.before) ? note.before : [];
    const after = Array.isArray(note.after) ? note.after : [];
    if (before.length + after.length === 0) return [];
    const beforeItems = before.length === 0 ? [el("span", { class: "behavior-none", text: "(新しく足しただけで、変わる振る舞いはない)" })] : before.map((behavior) => behaviorItemOf(behavior, story));
    return [el("div", { class: "section" }, [
      el("span", { class: "eyebrow", text: "何の振る舞いが変わったか" }),
      el("div", { class: "behaviors" }, [
        el("div", { class: "behavior-card is-commit" }, [el("span", { class: "card-title", text: "これまで" }), ...beforeItems]),
        el("div", { class: "behavior-card is-commit is-after" }, [el("span", { class: "card-title", text: "この変更のあと" }), ...after.map((behavior) => behaviorItemOf(behavior, story))]),
      ]),
    ])];
  };

  /** コミットの解説(なぜ・影響する操作・レビューで見るところ・振る舞いの前後)。 */
  const commitNoteOf = (commit, story) => {
    const note = commit.note;
    const flows = (Array.isArray(note.flows) ? note.flows : []).map((id) => story.lookup.flows.get(id)).filter((flow) => flow !== undefined);
    const flowChips = flows.length === 0 ? [] : [el("div", { class: "flow-chips" }, [
      el("span", { class: "label", text: "影響する操作" }),
      ...flows.map((flow) => el("a", { class: "flow-chip", href: "#map", title: "構造マップで見る" }, [flow.label, el("span", { class: "arrow", text: "↗" })])),
    ])];
    const review = Array.isArray(note.review) ? note.review : [];
    const reviewBlock = review.length === 0 ? [] : [el("div", { class: "section" }, [
      el("span", { class: "eyebrow", text: "レビューで見るところ" }),
      ...review.map((text) => {
        const key = ReviewMark.keyOf(commit.sha, text);
        return reviewCardOf({ text, isChecked: story.state.checked.has(key), onToggle: () => story.actions.toggleCheck(key), go: null });
      }),
    ])];
    return [
      el("div", { class: "why-grid" }, [el("div", { class: "section" }, [el("span", { class: "eyebrow", text: "なぜこの変更?" }), prose("p", { class: "why-text" }, note.why), ...flowChips]), ...reviewBlock]),
      ...commitBehaviorsOf(note, story),
    ];
  };

  const unexplainedCommitOf = (commit) => {
    if (commit.merge) return [];
    const reason = commit.afterExplained ? "このコミットは解説を書いた後に積まれたので、解説がありません。" : "このコミットには解説がありません。";
    return [emptyOf(`${reason}件名・本文と差分だけを出します。`)];
  };

  const lineRangeOf = (note) => {
    const lines = note.start === note.end ? `${note.start} 行目` : `${note.start}〜${note.end} 行目`;
    return note.side === "old" ? `${lines}(変更前)` : lines;
  };

  /** 光らせる行を持たない注釈(差分に出ていない行・消したファイル・地図に無いパス)。 */
  const plainNoteOf = (note, where) => el("div", { class: "note" }, [
    el("span", { class: "note-badge", text: String(note.n ?? "·") }),
    el("div", { class: "note-body" }, [el("span", { class: "note-lines", text: where }), prose("span", { class: "note-text" }, note.text)]),
  ]);

  /** 行に付いた注釈のカード。載せる(フォーカスする)と、カードと `targets`(行と番号)を光らせる。 */
  const litNoteOf = (note, targets) => {
    const card = el("div", { class: "note", tabindex: "0" }, [el("span", { class: "note-badge", text: String(note.n) }), prose("span", { class: "note-text" }, note.text)]);
    const light = (isLit) => () => {
      for (const target of [card, ...targets]) target.classList.toggle("is-lit", isLit);
    };
    card.addEventListener("mouseenter", light(true));
    card.addEventListener("mouseleave", light(false));
    card.addEventListener("focus", light(true));
    card.addEventListener("blur", light(false));
    return card;
  };

  /** 1 行のコードを色分けした字句にする。 */
  const codeTextOf = (text, grammar, carry) => {
    if (grammar === null) return { node: el("span", { class: "code-text", text }), carry };
    const result = Highlighter.tokenizeLine(text, grammar, carry);
    const tokens = result.tokens.map((token) => (token.cls === null ? token.value : el("span", { class: token.cls, text: token.value })));
    return { node: el("span", { class: "code-text" }, tokens), carry: result.carry };
  };

  /**
   * hunk の行を色分けする。行をまたぐ文字列・コメントの持ち越しは、変更前(消した行)と変更後(足した行)で分けて持つ。
   * @returns 行ごとの code-text の要素(`hunk.lines` と同じ順)
   */
  const highlightedLinesOf = (lines, grammar) => {
    let carries = { old: Highlighter.Start, new: Highlighter.Start };
    return lines.map((line) => {
      const stream = line.sign === "-" ? "old" : "new";
      const { node, carry } = codeTextOf(line.text, grammar, carries[stream]);
      carries = line.sign === " " ? { old: carry, new: carry } : { ...carries, [stream]: carry };
      return node;
    });
  };

  const rowLinesOf = (row) => (row.kind === "gap" ? row.lines : [row.line]);

  // コードの表示の左端の線は、足した行のうち空でないものに引き、続く行どうしをつなげる。
  const hasBar = (row) => row !== undefined && row.kind === "line" && row.line.sign === "+" && row.line.text.trim() !== "";
  const barClassOf = (rows, index) => {
    if (!hasBar(rows[index])) return "bar";
    const start = hasBar(rows[index - 1]) ? "" : " is-start";
    const end = hasBar(rows[index + 1]) ? "" : " is-end";
    return `bar is-on${start}${end}`;
  };

  const diffRowOf = ({ row, text, markers }) => el("div", { class: "code-line", "data-sign": row.line.sign }, [
    el("span", { class: "ln", text: numberText(row.line.oldNo) }),
    el("span", { class: "ln", text: numberText(row.line.newNo) }),
    el("span", { class: "marks" }, markers),
    el("span", { class: "sign", text: row.line.sign === " " ? "" : row.line.sign }),
    text,
  ]);

  const codeRowOf = ({ row, text, markers, bar }) => {
    if (row.kind === "gap") return el("div", { class: "code-line is-gap" }, [el("span", { class: "ln" }), el("span", { class: "marks" }, markers), el("span", { class: "bar" }), el("span", { class: "code-text tok-com", text: `⋯ ここにあった ${row.lines.length} 行を削除` })]);
    return el("div", { class: "code-line", "data-sign": row.line.sign }, [el("span", { class: "ln", text: numberText(row.line.newNo) }), el("span", { class: "marks" }, markers), el("span", { class: bar }), text]);
  };

  /** hunk の見出しと、行・注釈。注釈の番号は、その注釈の範囲に入る最初の行に付ける。 */
  const hunkOf = (hunk, { grammar, view }) => {
    const isCode = view === "code";
    const texts = highlightedLinesOf(hunk.lines, grammar);
    const textOf = new Map(hunk.lines.map((line, index) => [line, texts[index]]));
    const rows = isCode ? CommitDiff.codeRowsOf(hunk) : hunk.lines.map((line) => ({ kind: "line", line }));
    const coveredBy = rows.map((row) => hunk.notes.filter((note) => rowLinesOf(row).some((line) => CommitDiff.covers(note, line))));
    const markerOf = new Map(hunk.notes.map((note) => [note, el("span", { class: "marker", text: String(note.n) })]));
    const rowNodes = rows.map((row, index) => {
      const markers = hunk.notes.filter((note) => coveredBy.findIndex((notes) => notes.includes(note)) === index).map((note) => markerOf.get(note));
      const text = row.kind === "gap" ? null : textOf.get(row.line);
      return isCode ? codeRowOf({ row, text, markers, bar: barClassOf(rows, index) }) : diffRowOf({ row, text, markers });
    });
    const litTargetsOf = (note) => [...rowNodes.filter((node, index) => coveredBy[index].includes(note)), markerOf.get(note)];
    const firstNew = hunk.lines.find((line) => line.newNo !== null);
    const header = isCode ? (firstNew === undefined ? "" : `${firstNew.newNo} 行目から`) : hunk.header;
    const notes = hunk.notes.length === 0 ? [] : [el("div", { class: "hunk-notes" }, hunk.notes.map((note) => litNoteOf(note, litTargetsOf(note))))];
    return [el("div", { class: "hunk-head", text: header }), el("div", { class: "hunk" }, [el("div", { class: isCode ? "hunk-code is-code" : "hunk-code" }, rowNodes), ...notes])];
  };

  /** ファイルの中身。patch の値ごとに出し方を変える。 */
  const fileBodyOf = (file, context) => {
    const body = file.body;
    switch (body.kind) {
      case "hunks": {
        const more = body.remaining > 0 ? [el("div", { class: "file-more" }, [el("a", { href: context.commitUrl, text: `残り ${body.remaining} 行は GitHub で` })])] : [];
        return [...body.hunks.flatMap((hunk) => hunkOf(hunk, context)), ...more];
      }
      case "unchanged":
        return [el("div", { class: "file-omit", text: "中身の変更なし" })];
      case "deleted": {
        const text = body.lines === null ? "ファイルごと削除" : `ファイルごと削除(${body.lines} 行)`;
        const notes = body.notes.length === 0 ? [] : [el("div", { class: "file-notes" }, body.notes.map((note) => plainNoteOf(note, lineRangeOf(note))))];
        return [el("div", { class: "file-omit is-deleted", text }), ...notes];
      }
      case "binary":
        return [el("div", { class: "file-omit", text: "バイナリのため差分は出しません" })];
    }
  };

  const fileCardOf = (file, context) => {
    const conceptName = context.lookup.conceptNames.get(file.path);
    const unplaced = file.unplaced.length === 0 ? [] : [el("div", { class: "file-notes" }, [
      el("span", { class: "file-notes-title", text: "差分に出ていない行への注釈" }),
      ...file.unplaced.map((note) => plainNoteOf(note, lineRangeOf(note))),
    ])];
    const card = el("details", { class: "file-card", "data-status": file.status }, [
      el("summary", {}, [
        el("span", { class: "chev" }),
        el("span", { class: "status", "data-status": file.status, text: file.status }),
        el("span", { class: "file-path", title: file.path, text: file.oldPath === null ? file.path : `${file.oldPath} → ${file.path}` }),
        ...(conceptName === undefined ? [] : [el("span", { class: "concept-chip", text: conceptName })]),
        el("span", { class: "spacer" }),
        el("span", { class: "file-counts" }, countsTextOf(file)),
      ]),
      ...fileBodyOf(file, context),
      ...unplaced,
    ]);
    const key = `${context.sha}:${file.path}`;
    card.open = !context.closed.has(key);
    card.addEventListener("toggle", () => context.setOpen(key, card.open));
    return card;
  };

  /** 実際のコード。差分 / コードの切り替え、すべて開閉、ファイルのカードと、そのコミットに無いパスへの注釈。 */
  const codeSectionOf = (commit, story) => {
    const { view, closed } = story.state;
    const eyebrow = el("span", { class: "eyebrow", text: "実際のコード" });
    const diff = CommitDiff.of(commit, commit.note);
    const strays = diff.strayNotes.length === 0 ? [] : [el("div", { class: "file-notes" }, [
      el("span", { class: "file-notes-title", text: `地図に無いパスへの注釈(${diff.strayNotes.length})` }),
      ...diff.strayNotes.map((note) => plainNoteOf(note, `${note.path} ${lineRangeOf(note)}`)),
    ])];
    if (commit.merge) return el("div", { class: "section" }, [eyebrow, emptyOf("マージコミットなので、差分は出しません。"), ...strays]);
    const context = { view, closed, sha: commit.sha, lookup: story.lookup, commitUrl: `https://github.com/${Repo}/commit/${commit.sha}`, setOpen: story.actions.setOpen };
    const cards = diff.files.map((file) => fileCardOf(file, { ...context, grammar: Highlighter.grammarOf(file.path) }));
    const openAll = (isOpen) => () => {
      for (const card of cards) card.open = isOpen;
    };
    const views = Object.entries(DiffViews).map(([key, choice]) => pressable("button", { "aria-pressed": String(view === key), title: choice.title, text: choice.label }, [], () => story.actions.setView(key)));
    return el("div", { class: "section" }, [
      el("div", { class: "code-head" }, [
        eyebrow,
        el("div", { class: "toggle-group" }, views),
        el("span", { class: "hint", text: DiffViews[view].hint }),
        el("span", { class: "spacer" }),
        pressable("button", { class: "text-button plain-button", text: "すべて開く" }, [], openAll(true)),
        pressable("button", { class: "text-button plain-button", text: "すべて閉じる" }, [], openAll(false)),
      ]),
      ...cards,
      ...strays,
    ]);
  };

  const commitViewOf = (commit, story) => [
    commitHeadOf(commit, story),
    ...(commit.note === null ? unexplainedCommitOf(commit) : commitNoteOf(commit, story)),
    codeSectionOf(commit, story),
  ];

  /** 解説から、ページが名前で引く一覧。 */
  const lookupOf = (explain) => {
    const listOf = (key) => (explain !== null && Array.isArray(explain[key]) ? explain[key] : []);
    return {
      conceptNames: new Map(listOf("concepts").map((concept) => [concept.path, concept.name])),
      flows: new Map(listOf("flows").map((flow) => [flow.id, flow])),
      messages: new Map(listOf("messages").map((message) => [message.id, message])),
    };
  };

  /** 変更の経緯。左にコミットを新しい順に並べ、右に全体の流れか、選んだコミットの説明と差分を出す。 */
  const StoryScreen = (explained) => {
    const explain = explained.explain.kind === "explained" ? explained.explain.explain : null;
    const commits = explained.commits;
    const checkedKey = `prExplain.${explained.map.pr}.checked`;
    const fixed = { explained, explain, commits, lookup: lookupOf(explain), steps: new Map(commits.filter((commit) => !commit.merge).map((commit, index) => [commit.sha, index + 1])) };
    const commitAt = new Map(commits.map((commit) => [commit.sha, commit]));
    const order = [OverviewId, ...commits.toReversed().map((commit) => commit.sha)];
    let state = { selected: OverviewId, view: "diff", filter: "all", checked: savedChecksOf(BrowserStore.read(checkedKey)), closed: new Set() };
    const body = el("div", { class: "stage-body" });
    const main = el("main", { class: "stage" }, [body]);
    const rows = new Map();

    const render = () => {
      const story = { ...fixed, state, actions };
      const isOverview = state.selected === OverviewId;
      body.replaceChildren(...(isOverview ? storyOverviewOf(story) : commitViewOf(commitAt.get(state.selected), story)));
      for (const [id, row] of rows) row.classList.toggle("is-current", id === state.selected);
    };
    const update = (change) => {
      state = { ...state, ...change };
      render();
    };
    const withToggled = (set, key, isMember) => new Set(isMember ? [...set, key] : [...set].filter((member) => member !== key));
    const actions = {
      select: (id) => {
        update({ selected: id });
        main.scrollTop = 0;
        rows.get(id).scrollIntoView({ block: "nearest" });
      },
      toggleCheck: (key) => {
        const checked = withToggled(state.checked, key, !state.checked.has(key));
        BrowserStore.write(checkedKey, [...checked]);
        update({ checked });
      },
      setFilter: (filter) => update({ filter }),
      setView: (view) => update({ view }),
      // 開閉は details が持っているので描き直さない。差分 / コードを切り替えたときに引き継ぐためだけに覚える。
      setOpen: (key, isOpen) => {
        state = { ...state, closed: withToggled(state.closed, key, !isOpen) };
      },
    };

    const story = { ...fixed, state, actions };
    rows.set(OverviewId, pressable("button", { class: "row overview-row plain-button" }, [el("span", { class: "row-title", text: "ブランチ全体の流れ" }), el("span", { class: "row-sub", text: "なぜ・何がこの順番で変わったか" })], () => actions.select(OverviewId)));
    for (const commit of commits.toReversed()) rows.set(commit.sha, commitRowOf(commit, story));
    render();

    /** ↑ ↓ / j k で左の並びを 1 つずつ移る。入力欄の中と、修飾キーを押しているときは移らない。 */
    const onKey = (event) => {
      const isTyping = event.target instanceof Element && event.target.closest("input, textarea, select, [contenteditable]") !== null;
      const hasModifier = event.metaKey || event.ctrlKey || event.altKey;
      const step = Object.hasOwn(MoveKeys, event.key) ? MoveKeys[event.key] : 0;
      const isMove = step !== 0 && !isTyping && !hasModifier;
      if (!isMove) return;
      event.preventDefault();
      const next = Math.max(0, Math.min(order.length - 1, order.indexOf(state.selected) + step));
      actions.select(order[next]);
    };

    const overviewRow = rows.get(OverviewId);
    const commitRows = commits.toReversed().map((commit) => rows.get(commit.sha));
    return {
      controls: [countsOf(`${explained.totals.commits} commits`, explained.totals.additions, explained.totals.deletions), el("span", { class: "hint", text: "↑ ↓ でコミットを移動" })],
      left: panelOf("left", [panelHead("コミット", "新しい順"), el("div", { class: "panel-scroll" }, [overviewRow, el("div", { class: "commit-list" }, commitRows)])]),
      main,
      right: null,
      onKey,
    };
  };

  const TestStatusTags = {
    new: { label: "追加", cls: "tag is-new" },
    old: { label: "既存", cls: "tag" },
    todo: { label: "未実装", cls: "tag is-todo" },
    removed: { label: "削除", cls: "tag is-gone" },
  };

  const testRowOf = (test) => el("div", { class: "row" }, [
    el("span", { class: "row-title", text: test.name }),
    el("div", { class: "tags" }, [el("span", { class: TestStatusTags[test.status].cls, text: TestStatusTags[test.status].label })]),
    el("span", { class: "row-path", text: test.file ?? "" }),
  ]);

  /** テストの器。suite(解説が無ければファイル)ごとに並べる。 */
  const TestScreen = (explained) => {
    const groupLabelOf = (test) => (test.suite === null ? test.file ?? "" : test.suite.label);
    const labels = [...new Set(explained.tests.map(groupLabelOf))];
    const blocks = labels.flatMap((label) => [
      el("div", { class: "group-head" }, [el("span", { class: "group-title", text: label })]),
      ...explained.tests.filter((test) => groupLabelOf(test) === label).map(testRowOf),
    ]);
    const countOf = (status) => explained.tests.filter((test) => test.status === status).length;
    const stats = Object.entries(TestStatusTags).map(([status, tag]) => statOf(countOf(status), tag.label));
    const body = explained.tests.length === 0 ? [emptyOf("この PR で増減したテストはありません。")] : blocks;
    return {
      controls: [el("span", { class: "counts" }, [el("span", { class: "total", text: `${explained.tests.length} tests` })])],
      left: panelOf("left", [panelHead("テスト", `${explained.tests.length} 件`), el("div", { class: "panel-scroll" }, body)]),
      main: stageOf([ledeOf(explained, "テスト"), el("div", { class: "stat-grid" }, stats)]),
      right: panelOf("right", [panelHead("全体", ""), el("dl", { class: "facts" }, Object.entries(TestStatusTags).flatMap(([status, tag]) => [el("dt", { text: tag.label }), el("dd", { text: `${countOf(status)} 件` })]))]),
    };
  };

  const ScreenBuilders = { map: MapScreen, story: StoryScreen, test: TestScreen };

  /** 解説が使えない理由を帯の 1 行にする。 */
  const missingTextOf = (reason) => {
    switch (reason.kind) {
      case "absent":
        return "解説なし(explain.json がまだ置かれていません)。変更の地図だけで組んでいます";
      case "unreadable":
        return `解説なし(explain.json を読めません: ${reason.detail})`;
      case "version":
        return `解説なし(explain.json の version が ${JSON.stringify(reason.actual)} で、このページが読めるのは 1)`;
      case "pr":
        return `解説なし(explain.json は PR ${JSON.stringify(reason.actual)} のもの)`;
      case "shape":
        return `解説なし(explain.json の ${reason.key ?? "トップ"} の型が想定と違います)`;
    }
  };

  const freshnessTextOf = (freshness) => {
    switch (freshness.kind) {
      case "stale":
        return `解説は ${shortSha(freshness.sha)} 時点、以降 ${freshness.after} コミットは解説なし`;
      case "unknown":
        return `解説の sha(${shortSha(freshness.sha)})が地図に無い。force push などで履歴が変わった可能性があります`;
      case "latest":
      case "none":
        return null;
    }
  };

  /** 上の帯に出す文。解説なし(理由)/ 古い / sha が地図に無い / 地図に無い解説 / 地図が v1。 */
  const bandTextsOf = (explained) => [
    explained.explain.kind === "missing" ? missingTextOf(explained.explain.reason) : null,
    freshnessTextOf(explained.freshness),
    explained.strayNotes.length > 0 ? `地図に無い解説 ${explained.strayNotes.length} 件(地図のコミットに無い sha への commitNotes)` : null,
    explained.map.isCurrent ? null : `地図が古い(v${explained.map.version})。次の push で Actions が作り直します`,
  ].filter((text) => text !== null);

  const linksOf = (pr, issue) => {
    const prLink = pr === null ? [] : [el("a", { href: `https://github.com/${Repo}/pull/${pr}`, text: `PR #${pr}` })];
    const issueLink = issue === null ? [] : [el("a", { href: `https://github.com/${Repo}/issues/${issue}`, text: `Issue #${issue}` })];
    return el("nav", { class: "links" }, [...prLink, ...issueLink]);
  };

  /** 地図が読めないときの全体の案内。画面は組めないので、ヘッダと案内だけを出す。 */
  const mountGuide = (root, { pr, detail }) => {
    document.title = pr === null ? "PR 解説" : `PR #${pr} · PR 解説`;
    root.replaceChildren(
      el("header", { class: "top" }, [el("span", { class: "repo", text: RepoName }), el("span", { class: "top-main" }), linksOf(pr, null)]),
      el("div", { class: "bands" }),
      el("div", { class: "screens" }, [el("div", { class: "guide" }, [
        el("h1", { text: "変更の地図がまだありません" }),
        el("p", { text: `change-map.json を読めませんでした(${detail})。PR に push すると、Actions が地図とこのページを置き直します。地図が置かれると、解説が無くても構造マップ・変更の経緯・テストの 3 画面が出ます。` }),
      ])]),
    );
  };

  /** ヘッダ・帯・3 画面を組み、画面を切り替える。 */
  const Frame = Object.freeze({
    mount: (root, explained) => {
      const pr = explained.map.pr;
      const explain = explained.explain.kind === "explained" ? explained.explain.explain : null;
      const hasIssue = explain !== null && typeof explain.issue === "number";
      const issue = hasIssue ? explain.issue : null;
      document.title = explain === null ? `PR #${pr} · PR 解説` : `${explain.overview.title} · PR #${pr}`;
      const built = Object.fromEntries(Object.values(Screens).map((screen) => [screen, ScreenBuilders[screen](explained)]));
      const tabs = Object.values(Screens).map((screen) => el("a", { href: `#${screen}`, "data-screen": screen, text: ScreenLabels[screen] }));
      const controls = el("div", { class: "screen-controls" });
      const branch = el("span", { class: "branch" }, [explained.map.headBranch ?? shortSha(explained.map.head), el("span", { class: "arrow", text: "→" }), explained.map.baseBranch ?? shortSha(explained.map.mergeBase)]);
      const sections = Object.values(Screens).map((screen) => {
        const parts = built[screen];
        const grid = el("section", { class: "screen", "data-screen": screen, "aria-label": ScreenLabels[screen] }, [parts.left, parts.main, ...(parts.right === null ? [] : [parts.right])]);
        PanelResizer.attach({ screen, grid, panels: parts.right === null ? { left: parts.left } : { left: parts.left, right: parts.right } });
        return grid;
      });
      root.replaceChildren(
        el("header", { class: "top" }, [el("span", { class: "repo", text: RepoName }), el("nav", { class: "segmented", "aria-label": "画面" }, tabs), el("div", { class: "top-main" }, [branch]), controls, linksOf(pr, issue)]),
        el("div", { class: "bands" }, bandTextsOf(explained).map((text) => el("div", { class: "band", role: "status", text }))),
        el("div", { class: "screens" }, sections),
      );
      let current = null;
      const show = (screen) => {
        current = screen;
        for (const tab of tabs) {
          if (tab.dataset.screen === screen) tab.setAttribute("aria-current", "page");
          else tab.removeAttribute("aria-current");
        }
        for (const section of sections) section.hidden = section.dataset.screen !== screen;
        controls.replaceChildren(...built[screen].controls);
      };
      const choose = () => ScreenChoice.choose({ hash: location.hash, saved: BrowserStore.read(PageStoreKey) });
      const openScreen = (screen) => {
        BrowserStore.write(PageStoreKey, screen);
        show(screen);
      };
      for (const tab of tabs) {
        tab.addEventListener("click", (event) => {
          event.preventDefault();
          history.replaceState(null, "", `#${tab.dataset.screen}`);
          openScreen(tab.dataset.screen);
        });
      }
      window.addEventListener("hashchange", () => openScreen(choose()));
      window.addEventListener("keydown", (event) => {
        const onKey = built[current].onKey;
        if (onKey !== undefined) onKey(event);
      });
      show(choose());
    },
  });

  const fetchFresh = (name) => fetch(`${name}?t=${Date.now()}`, { cache: "no-store" });
  const prFromPath = (location.pathname.match(/pr-(\d+)/) || [])[1] ?? null;

  /** 読み込みの失敗だけを受ける。組み立ての失敗は握らず、コンソールにそのまま出す。 */
  const mapRequest = fetchFresh("change-map.json")
    .then((response) => (response.ok ? response.json() : Promise.reject(new Error(`HTTP ${response.status}`))))
    .then((map) => ({ isLoaded: true, map }), (error) => ({ isLoaded: false, detail: error.message }));
  const explainRequest = fetchFresh("explain.json")
    .then((response) => {
      if (response.status === 404) return { kind: "absent" };
      if (!response.ok) return { kind: "failed", detail: `HTTP ${response.status}` };
      return response.text().then((text) => ({ kind: "text", text }));
    })
    .catch((error) => ({ kind: "failed", detail: error.message }));

  Promise.all([mapRequest, explainRequest]).then(([mapResult, source]) => {
    const root = document.getElementById("app");
    if (!mapResult.isLoaded) {
      mountGuide(root, { pr: prFromPath, detail: mapResult.detail });
      return;
    }
    Frame.mount(root, ExplainedMap.from(mapResult.map, source));
  });
})();
</script>
</body>
</html>
