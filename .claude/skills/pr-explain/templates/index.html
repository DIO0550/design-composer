       * 送られてきた時点のページ全体のスクロール量は送ってきた画面のもので、離れるタブの位置ではないため。
       * @param position 節の位置(`PrimerTopics.positionsOf` の値)
       */
      showTopic: (position) => {
        if (position.tab !== currentTab) restoreTab(position.tab);
        parts[position.tab].columns.sendTo(position.index);
      },
    };
  };

  // 構成の前後の箱と線の状態の名前と色の区分。状態の無いもの(変えていない)はここに無い。
  const CompareStatuses = { added: { tone: "A", label: "増えた" }, removed: { tone: "D", label: "消えた" }, changed: { tone: "M", label: "変えた" } };
  const CompareGrainChoices = [{ value: CompareGrains.Calls, label: "呼び出し" }, { value: CompareGrains.Modules, label: "モジュール" }];
  const CompareArrangements = Object.freeze({ Side: "side", Stack: "stack" });
  const CompareArrangementChoices = [{ value: CompareArrangements.Side, label: "左右" }, { value: CompareArrangements.Stack, label: "上下" }];
  const CompareDimChoices = [{ value: false, label: "そのまま" }, { value: true, label: "薄く" }];
  // 選べる箱・線が無い理由(`CompareDiagram.unselectedOf` の reason)の文。変化なしは粒度ごとに言い分ける。
  const CompareReasonTexts = { unexplained: "解説なし", unwritten: "書かれていない" };
  const CompareUnchangedTexts = { calls: "呼び出しの変化なし", modules: "モジュールの変化なし" };
  const CompareFigurePad = 12;
  const CompareLabelLimit = 40;
  // 図を縮めてよい下限(図の大きさに対する割合)。これより狭い欄では、図の欄を横にスクロールする。
  const CompareMinScale = 0.8;

  /** 選べる箱・線が無い理由の文。 */
  const compareReasonTextOf = (reason, grain) => (reason === "unchanged" ? CompareUnchangedTexts[grain] : CompareReasonTexts[reason]);

  /** 箱の幅に収まるように、名前を後ろから詰めて「…」を付ける。幅の見積もりは `GraphLayout.textWidthOf`。 */
  const fittedTextOf = (text, width) => {
    if (GraphLayout.textWidthOf(text) <= width) return text;
    const chars = [...text];
    const fits = (count) => GraphLayout.textWidthOf(`${chars.slice(0, count).join("")}…`) <= width;
    const count = chars.findLastIndex((_, index) => fits(index + 1)) + 1;
    return `${chars.slice(0, count).join("")}…`;
  };

  /** 構成の前後の状態の札。状態の無いもの(変えていない)は「そのまま」。 */
  const compareStatusChipOf = (status) => (status === null ? el("span", { class: "chip", text: "そのまま" }) : el("span", { class: "chip", "data-tone": CompareStatuses[status].tone, text: CompareStatuses[status].label }));

  /** 前後の一言の行。増えたものの変更前と消えたものの変更後は、書かれていないので「無かった / 無くなった」と出す。 */
  const compareSidesOf = (item) => {
    switch (item.status) {
      case "added":
        return [["変更前", null, "(無かった)"], ["変更後", item.now, null]];
      case "removed":
        return [["変更前", item.was, null], ["変更後", null, "(無くなった)"]];
      case "changed":
        return [["変更前", item.was, null], ["変更後", item.now, null]];
      case null:
        return item.was === null ? [["前後とも", item.now, null]] : [["変更前", item.was, null], ["変更後", item.now, null]];
    }
  };

  /** 構成の前後の画面。左に変わったところ、中に変更前と変更後の 2 枚の図、右に選んだ箱・線の前後か、選んでいないときの全体を出す。 */
  const CompareScreen = (explained, go) => {
    const diagrams = { calls: CompareDiagram.fromCalls(explained), modules: CompareDiagram.fromModules(explained) };
    const figures = Object.fromEntries(Object.entries(diagrams).filter(([, diagram]) => diagram.kind === "drawn").map(([grain, diagram]) => [grain, CompareDiagram.figuresOf(diagram)]));
    const calls = explained.explain !== null && isRecord(explained.explain.calls) ? explained.explain.calls : null;
    const sides = [
      { key: "before", title: "変更前", ref: `${explained.map.baseBranch} · ${shortSha(explained.map.mergeBase)}`, absent: "変更前には無い" },
      { key: "after", title: "変更後", ref: `${explained.map.headBranch} · ${shortSha(explained.map.head)}`, absent: "変更後には無い" },
    ];

    let state = { grain: CompareGrains.Calls, arrangement: CompareArrangements.Side, isDimmed: false, selected: null };
    const update = (patch) => {
      state = { ...state, ...patch };
      render();
    };
    const pick = (id) => update({ selected: state.selected === id ? null : id });

    const toolbar = el("div", { class: "compare-toolbar" });
    const figureArea = el("div", { class: "compare-figures" });
    const body = el("div", { class: "stage-body compare-body" }, [
      el("div", { class: "lede" }, [
        el("span", { class: "eyebrow", text: "構成の前後" }),
        el("h1", { text: "変更前と変更後の箱と線" }),
        el("p", { text: "変更前(マージベース)と変更後(このブランチ)の箱と線を、同じ位置に並べています。片方にしか無い箱は、もう片方に点線の枠だけを残します。" }),
      ]),
      toolbar,
      figureArea,
    ]);
    const main = el("main", { class: "stage" }, [body]);
    const leftSub = el("span", { class: "panel-sub" });
    const leftBody = el("div", { class: "panel-scroll compare-changes" });
    const side = el("div", { class: "side" });

    const isPickedEdgeEnd = (diagram, boxId) => {
      const picked = CompareDiagram.pickedOf(diagram, state.selected);
      return picked !== null && picked.kind === "edge" && (picked.edge.from === boxId || picked.edge.to === boxId);
    };
    const isPickedBoxEnd = (edge) => edge.from === state.selected || edge.to === state.selected;

    const boxNodeOf = ({ placed, diagram, side: drawnSide }) => {
      const { box } = placed;
      const isPicked = state.selected === box.id;
      const isRelated = isPickedEdgeEnd(diagram, box.id);
      // 選んだものがあればそれと線の端のほかを、無ければ「薄く」のとき変えていない箱を薄くする。
      const isOutOfPick = state.selected !== null && !isPicked && !isRelated;
      const isDimmedUnchanged = state.isDimmed && placed.isUnchanged && !isPicked;
      const name = drawnSide.key === "before" && box.beforeName !== undefined ? box.beforeName : box.name;
      const textWidth = placed.width - 16;
      const labels = placed.isPresent
        ? [Dom.svg("text", { x: placed.x + 8, y: placed.y + placed.height / 2 + 4 }, [fittedTextOf(name, textWidth)])]
        : [
          Dom.svg("text", { x: placed.x + 8, y: placed.y + 13 }, [fittedTextOf(name, textWidth)]),
          Dom.svg("text", { class: "compare-box-note", x: placed.x + 8, y: placed.y + 25 }, [drawnSide.absent]),
        ];
      const tooltip = [name, ...(box.role === undefined || box.role === null ? [] : [box.role])].join("\n");
      const node = Dom.svg("g", {
        class: classesOf("compare-box", { "is-absent": !placed.isPresent, "is-picked": isPicked, "is-dim": isOutOfPick || isDimmedUnchanged }),
        "data-status": placed.isPresent && box.status !== null ? box.status : "",
        tabindex: "0",
        role: "button",
        "aria-label": `${name}(${placed.isPresent ? (box.status === null ? "そのまま" : CompareStatuses[box.status].label) : drawnSide.absent})`,
      }, [Dom.svg("title", {}, [tooltip]), Dom.svg("rect", { x: placed.x, y: placed.y, width: placed.width, height: placed.height, rx: 7 }), ...labels]);
      node.addEventListener("click", () => pick(box.id));
      node.addEventListener("keydown", (event) => {
        if (event.key !== "Enter" && event.key !== " ") return;
        event.preventDefault();
        pick(box.id);
      });
      return node;
    };

    const edgeNodeOf = ({ drawn, diagram }) => {
      const { edge, route } = drawn;
      const isPicked = state.selected === edge.id;
      const isOutOfPick = state.selected !== null && !isPicked && !isPickedBoxEnd(edge);
      const title = edge.code === undefined || edge.code === null ? CompareDiagram.nameOf(diagram, edge.id) : edge.code;
      const node = Dom.svg("g", { class: classesOf("compare-edge", { "is-picked": isPicked, "is-dim": isOutOfPick }), "data-status": edge.status ?? "" }, [
        Dom.svg("title", {}, [title]),
        Dom.svg("path", { class: "compare-edge-line", d: route.path }),
        Dom.svg("path", { class: "compare-edge-head", d: route.head }),
        Dom.svg("path", { class: "compare-edge-hit", d: route.path }),
      ]);
      node.addEventListener("click", () => pick(edge.id));
      return node;
    };

    /** 選んだ線の呼び出しの綴り(`code`)を、線の中ほどに出す。 */
    const edgeLabelsOf = (edges, figure) => edges.filter(({ edge }) => edge.id === state.selected && typeof edge.code === "string").map(({ edge, route }) => {
      const [x0, y0, c1x, c1y, c2x, c2y, x1, y1] = route.bezier;
      const room = figure.width + CompareFigurePad * 2;
      const text = fittedTextOf(edge.code, Math.min(GraphLayout.textWidthOf("x") * CompareLabelLimit, room - 18));
      const width = GraphLayout.textWidthOf(text) + 14;
      const centerX = Math.min(Math.max((x0 + 3 * c1x + 3 * c2x + x1) / 8, width / 2 - CompareFigurePad + 2), figure.width + CompareFigurePad - width / 2 - 2);
      const centerY = (y0 + 3 * c1y + 3 * c2y + y1) / 8;
      return Dom.svg("g", { class: "compare-edge-label" }, [
        Dom.svg("rect", { x: centerX - width / 2, y: centerY - 10, width, height: 20, rx: 5 }),
        Dom.svg("text", { x: centerX - width / 2 + 7, y: centerY + 4 }, [text]),
      ]);
    });

    const figureOf = (figure, diagram, drawnSide) => {
      const sideFigure = figure[drawnSide.key];
      const groups = figure.groups.map((group) => Dom.svg("g", { class: "compare-group" }, [
        Dom.svg("rect", { x: group.x, y: group.y, width: group.width, height: group.height, rx: 10 }),
        Dom.svg("text", { x: group.x + 12, y: group.y + 22 }, [fittedTextOf(group.label, group.width - 24)]),
      ]));
      const viewBox = [-CompareFigurePad, -CompareFigurePad, figure.width + CompareFigurePad * 2, figure.height + CompareFigurePad * 2].join(" ");
      const svg = Dom.svg("svg", { class: "wide-figure compare-figure", viewBox, "aria-label": `${drawnSide.title}の構成` }, [
        ...groups,
        ...sideFigure.edges.map((drawn) => edgeNodeOf({ drawn, diagram })),
        ...sideFigure.boxes.map((placed) => boxNodeOf({ placed, diagram, side: drawnSide })),
        ...edgeLabelsOf(sideFigure.edges, figure),
      ]);
      // 幅は欄に合わせるが、図の大きさより大きくせず(狭い図を引き伸ばさない)、下限より縮めない。倍率で割って、文字の大きさの倍率では変えない。
      const naturalWidth = figure.width + CompareFigurePad * 2;
      svg.style.maxWidth = `calc(${naturalWidth}px / var(--text-size-ratio, 1))`;
      svg.style.minWidth = `calc(${Math.round(naturalWidth * CompareMinScale)}px / var(--text-size-ratio, 1))`;
      return el("div", { class: "compare-side" }, [
        el("div", { class: "compare-side-head" }, [el("span", { class: "compare-side-title", text: drawnSide.title }), el("span", { class: "compare-side-ref", text: drawnSide.ref })]),
        el("div", { class: "compare-side-body" }, [svg]),
      ]);
    };

    const legendOf = () => el("div", { class: "legend compare-legend" }, [
      ...Object.values(CompareStatuses).map((status) => el("span", { "data-tone": status.tone }, [el("span", { class: "status-dot" }), status.label])),
      el("span", {}, [el("span", { class: "legend-line" }), state.grain === CompareGrains.Calls ? "呼び出し" : "依存"]),
      el("span", {}, [el("span", { class: "legend-line is-removed" }), "変更後に無い線"]),
      el("span", {}, [el("span", { class: "compare-legend-absent" }), "片方にしか無い箱"]),
    ]);

    const renderToolbar = () => toolbar.replaceChildren(
      ...labeledToggleOf("粒度", { options: CompareGrainChoices, current: state.grain, onPick: (grain) => update({ grain, selected: null }) }),
      ...labeledToggleOf("並べ方", { options: CompareArrangementChoices, current: state.arrangement, onPick: (arrangement) => update({ arrangement }) }),
      ...labeledToggleOf("変わっていない箱", { options: CompareDimChoices, current: state.isDimmed, onPick: (isDimmed) => update({ isDimmed }) }),
    );

    const renderFigures = (diagram) => {
      const unselected = CompareDiagram.unselectedOf(diagram, calls);
      if (unselected.kind === "unselectable") {
        figureArea.replaceChildren(emptyOf(compareReasonTextOf(unselected.reason, state.grain)));
        return;
      }
      const figure = figures[state.grain];
      figureArea.replaceChildren(
        el("div", { class: classesOf("compare-pair", { "is-stacked": state.arrangement === CompareArrangements.Stack }) }, sides.map((drawnSide) => figureOf(figure, diagram, drawnSide))),
        legendOf(),
      );
    };

    const countLinesOf = (counts) => [["箱", counts.boxes], ["線", counts.edges]].map(([what, count]) => el("div", { class: "compare-count" }, [
      el("span", { class: "compare-count-what", text: what }),
      el("span", { class: "add", text: plus(count.added) }),
      el("span", { class: "del", text: minus(count.removed) }),
      el("span", { class: "mod", text: `~${count.changed}` }),
    ]));

    const renderLeft = (diagram) => {
      const changes = CompareDiagram.changeListOf(diagram);
      const unselected = CompareDiagram.unselectedOf(diagram, calls);
      leftSub.textContent = `${changes.items.length} 件`;
      if (unselected.kind === "unselectable") {
        leftBody.replaceChildren(emptyOf(compareReasonTextOf(unselected.reason, state.grain)));
        return;
      }
      const rows = changes.items.map((item) => pressable("button", { class: classesOf("compare-change plain-button", { "is-picked": state.selected === item.id }) }, [
        el("span", { class: "compare-change-head" }, [compareStatusChipOf(item.status), el("span", { class: "compare-change-kind", text: item.kind === "box" ? "箱" : "線" })]),
        el("span", { class: "compare-change-name", text: item.name }),
      ], () => pick(item.id)));
      const list = rows.length === 0 ? [emptyOf("状態の付いた箱・線はありません")] : rows;
      leftBody.replaceChildren(el("div", { class: "compare-counts" }, countLinesOf(changes.counts)), ...list);
    };

    const writtenBlocksOf = (written) => {
      const review = written.review.length === 0 ? [] : [el("div", { class: "side-block" }, [
        el("span", { class: "eyebrow", text: "見てほしいところ" }),
        el("ul", { class: "compare-review" }, written.review.map((text) => prose("li", {}, text))),
      ])];
      return [
        el("div", { class: "side-block" }, [
          el("span", { class: "eyebrow", text: "この PR の構成の変化" }),
          ...(written.gist === null ? [] : [prose("h2", {}, written.gist)]),
          ...(written.text === null ? [] : [prose("p", { class: "side-sub" }, written.text)]),
        ]),
        ...review,
      ];
    };

    const unselectedBlocksOf = (diagram) => {
      const unselected = CompareDiagram.unselectedOf(diagram, calls);
      switch (unselected.kind) {
        case "unselectable":
          return [
            el("div", { class: "side-block" }, [el("span", { class: "eyebrow", text: "選べる箱・線がありません" }), el("p", { class: "side-sub", text: compareReasonTextOf(unselected.reason, state.grain) })]),
            ...(unselected.written === null ? [] : writtenBlocksOf(unselected.written)),
          ];
        case "written":
          return writtenBlocksOf(unselected.written);
        case "counts":
          return [el("div", { class: "side-block" }, [
            el("span", { class: "eyebrow", text: "変わったところ" }),
            el("div", { class: "compare-counts" }, countLinesOf(unselected.counts)),
            el("p", { class: "side-note", text: "左の一覧か図から選ぶと前後が出ます" }),
          ])];
      }
    };

    /** 前後の一言の表(呼び出しの粒度)。 */
    const sidesTableOf = (item) => el("div", { class: "gwt" }, compareSidesOf(item).flatMap(([key, text, missing]) => [
      el("span", { class: "gwt-key", text: key }),
      text === null ? el("span", { class: "gwt-value muted", text: missing }) : prose("span", { class: "gwt-value" }, text),
    ]));

    /** その箱を端に持つ依存の一覧(モジュールの粒度)。 */
    const dependencyBlocksOf = (dependencies) => [["増えた依存", dependencies.added], ["消えた依存", dependencies.removed], ["残った依存", dependencies.kept]].map(([title, items]) => el("div", { class: "side-block" }, [
      eyebrowOf(title, `${items.length} 件`),
      ...items.map((item) => el("div", { class: "compare-dependency", title: item.path }, [
        el("span", { class: "compare-dependency-direction", text: item.direction === "uses" ? "使う →" : "使われる ←" }),
        el("span", { class: "compare-dependency-name", text: item.name }),
      ])),
    ]));

    const pickedBlocksOf = (diagram, picked) => {
      switch (picked.kind) {
        case "box": {
          const { box } = picked;
          const path = diagram.grain === CompareGrains.Calls ? box.module : box.path;
          const facts = diagram.grain === CompareGrains.Calls
            ? [...(box.role === null ? [] : [prose("p", { class: "detail-role" }, box.role)]), sidesTableOf(box)]
            : dependencyBlocksOf(box.dependencies);
          return [
            el("div", { class: "side-block" }, [el("div", { class: "side-head" }, [el("span", { class: "chip", text: "箱" }), compareStatusChipOf(box.status)]), el("h2", { text: box.name }), el("span", { class: "side-path", text: path })]),
            ...facts,
          ];
        }
        case "edge": {
          const { edge } = picked;
          const endOf = (end, fallback) => (end === null ? fallback : end.name);
          const facts = diagram.grain === CompareGrains.Calls
            ? [...(edge.code === null ? [] : [el("code", { class: "compare-code", text: edge.code })]), sidesTableOf(edge)]
            : [el("div", { class: "side-block" }, [
              eyebrowOf("両端"),
              el("div", { class: "compare-dependency", title: edge.from }, [el("span", { class: "compare-dependency-direction", text: "使う側" }), el("span", { class: "compare-dependency-name", text: endOf(picked.from, edge.from) })]),
              el("div", { class: "compare-dependency", title: edge.to }, [el("span", { class: "compare-dependency-direction", text: "使われる側" }), el("span", { class: "compare-dependency-name", text: endOf(picked.to, edge.to) })]),
            ])];
          return [
            el("div", { class: "side-block" }, [el("div", { class: "side-head" }, [el("span", { class: "chip", text: "線" }), compareStatusChipOf(edge.status)]), el("h2", { text: CompareDiagram.nameOf(diagram, edge.id) })]),
            ...facts,
          ];
        }
      }
    };

    /** 右の欄の「どこで変わったか」。押すと変更の経緯の、そのコミットのそのファイルへ。 */
    const changingCommitsBlockOf = (diagram) => {
      const changes = CompareDiagram.changingCommitsOf(diagram, state.selected, explained);
      const links = changes.map(({ sha, path }) => commitLinkOf({ sha, label: ExplainedMap.fileNameOf(path), commitAt: explained.commitAt, onPress: () => go.toCommitFile({ sha, path, lineRange: null }) }));
      const empty = links.length === 0 ? [el("p", { class: "side-note", text: "このファイルを変えたコミットは、このブランチにありません" })] : [];
      return el("div", { class: "side-block" }, [eyebrowOf("どこで変わったか", `${links.length} コミット`), ...links, ...empty]);
    };

    /** 右の欄の「ほかの画面で見る」。押すと流れ図のその流れへ。 */
    const flowsBlockOf = (diagram) => {
      const flows = CompareDiagram.flowsThrough(diagram, state.selected, explained);
      const chips = flows.map((flow) => pressable("button", { class: "flow-chip", title: "流れ図でこの流れを見る" }, [`${ScreenLabels[Screens.Trace]}: ${flow.label}`, el("span", { class: "arrow", text: "↗" })], () => go.toTrace(flow.id)));
      const empty = chips.length === 0 ? [el("p", { class: "side-note", text: "このファイルを端に持つやりとりを手順に含む流れはありません" })] : [];
      return el("div", { class: "side-block" }, [eyebrowOf("ほかの画面で見る", `${chips.length} 件`), ...(chips.length === 0 ? [] : [el("div", { class: "flow-chips" }, chips)]), ...empty]);
    };

    const renderSide = (diagram) => {
      const picked = state.selected === null ? null : CompareDiagram.pickedOf(diagram, state.selected);
      if (picked === null) {
        side.replaceChildren(...unselectedBlocksOf(diagram));
        return;
      }
      const clear = pressable("button", { class: "outline-button", text: "選択を外す" }, [], () => update({ selected: null }));
      side.replaceChildren(...pickedBlocksOf(diagram, picked), changingCommitsBlockOf(diagram), flowsBlockOf(diagram), el("div", { class: "side-block" }, [clear]));
      side.scrollTop = 0;
    };

    const render = () => {
      const diagram = diagrams[state.grain];
      renderToolbar();
      renderLeft(diagram);
      renderFigures(diagram);
      renderSide(diagram);
    };
    render();

    /** Target(callBox / callEdge / module)の粒度と、そこで選ぶ id。構成の前後が行き先でなければ null。 */
    const pickOfTarget = (target) => {
      const destination = Target.destinationOf(target);
      if (destination.screen !== Screens.Compare) return null;
      return { grain: destination.grain, id: destination.grain === CompareGrains.Calls ? destination.id : destination.path };
    };

    return {
      summary: [],
      controls: [],
      tablist: null,
      left: panelOf("left", [panelHead("変わったところ", "", [leftSub]), leftBody]),
      main,
      right: panelOf("right", [panelHead("詳しいところ", "選んだ箱・線の前後"), side]),
      /** @returns 構成の前後が行き先の Target で、その粒度の図に指す箱・線があるか */
      canShow: (target) => {
        const found = pickOfTarget(target);
        return found !== null && CompareDiagram.isSelectable(diagrams[found.grain], found.id);
      },
      /** その Target の粒度に切り替え、指す箱・線を選んだ状態にする。`canShow` が真のものだけを渡す。 */
      showTarget: (target) => {
        const found = pickOfTarget(target);
        update({ grain: found.grain, selected: found.id });
        figureArea.querySelector(".compare-side:last-child :is(.compare-box, .compare-edge).is-picked")?.scrollIntoView({ block: "center" });
      },
    };
  };

  const TraceEraChoices = [{ value: TraceEras.Compare, label: "比べる" }, { value: TraceEras.After, label: "変更後だけ" }, { value: TraceEras.Before, label: "変更前だけ" }];
  // 手順の対応の状態の名前と色の区分。そのまま(状態なし)はここに無い(札は「そのまま」)。
  const TraceStatuses = { added: { tone: "A", label: "増えた" }, removed: { tone: "D", label: "消えた" }, changed: { tone: "M", label: "変わった" } };
  // カードの下に添える文(`TraceLayout.cardsIn` の presence)。使う端(used)には添えない。
  const TracePresenceNotes = { idle: "この操作では使わない", missingBefore: "変更前には無い", missingAfter: "変更後には無い", added: "この PR で増えた", removed: "この PR で消えた" };
  const TraceSpellingNote = "綴り(code / payload / returns)は変更後のもの";
  // 手順のカードが 2 列のときの列の見出しと、その側の手順が無いときの文。
  const TraceColumnTexts = { before: { label: "変更前", missing: "この手順は無かった" }, after: { label: "変更後", missing: "この手順は無くなった" } };
  // 図の余白。右は同じ列の弧と輪のふくらみ、下はカードの下に添える文の分を足す。
  const TraceFigurePad = Object.freeze({ top: 52, right: 96, bottom: 34, left: 16 });
  const TraceMinScale = 0.7;
  const TraceHeadSize = { base: 9, current: 12 };

  /** 流れ図のカードの絵(語彙 `cardIcons` のキーごと)。`(x, y)` は絵の中心。 */
  const TraceIcons = {
    person: (x, y) => [Dom.svg("circle", { cx: x, cy: y - 6, r: 6 }), Dom.svg("path", { d: `M${x - 10},${y + 12} q10,-14 20,0` })],
    widget: (x, y) => [Dom.svg("rect", { x: x - 11, y: y - 9, width: 22, height: 18, rx: 2 }), Dom.svg("path", { d: `M${x - 11},${y + 3} h22` })],
    store: (x, y) => [Dom.svg("path", { d: `M${x},${y - 10} l11,5 -11,5 -11,-5 z M${x - 11},${y} l11,5 11,-5 M${x - 11},${y + 5} l11,5 11,-5` })],
    cache: (x, y) => [Dom.svg("rect", { x: x - 9, y: y - 11, width: 18, height: 22, rx: 2 }), Dom.svg("path", { d: `M${x - 5},${y - 4} h10 M${x - 5},${y + 1} h10 M${x - 5},${y + 6} h6` })],
    scan: (x, y) => [Dom.svg("circle", { cx: x - 2, cy: y - 2, r: 7 }), Dom.svg("path", { d: `M${x + 3},${y + 3} l7,7` })],
  };
  /** icon を書いていない concept と、語彙に無い icon の絵(箱)。 */
  const traceBoxIconOf = (x, y) => [Dom.svg("path", { d: `M${x - 10},${y - 5} l10,-5 10,5 v11 l-10,5 -10,-5 z M${x - 10},${y - 5} l10,5 10,-5 M${x},${y} v11` })];

  /** 矢じり。tip が先、direction が向きの単位ベクトル。 */
  const traceHeadOf = ([x, y], [ux, uy], size) => `M${x},${y} L${x - ux * size - uy * size * 0.5},${y - uy * size + ux * size * 0.5} L${x - ux * size + uy * size * 0.5},${y - uy * size - ux * size * 0.5} z`;

  /** 流れ図の画面。左に操作(流れ)の一覧、中に人とモジュールのカードと番号付きの矢印、右に手順の一覧を出す。 */
  const TraceScreen = (explained) => {
    const flows = explained.explain === null ? [] : listOf(explained.explain.flows);
    const flowAt = explained.lookup.flows;
    const messages = explained.lookup.messages;
    const layout = TraceLayout.create(flows, messages);
    const endNameOf = (end) => explained.lookup.endNames.get(end) ?? end;

    let state = { flowId: flows.length === 0 ? null : flows[0].id, era: flows.length === 0 ? TraceEras.After : TraceRows.erasOf(flows[0])[0], index: 0 };
    const flowOf = () => flowAt.get(state.flowId) ?? null;
    const update = (patch) => {
      state = { ...state, ...patch };
      render();
    };
    /** 流れを選ぶ。今の表示がその流れで選べなければ、その流れの既定の表示にする。 */
    const pickFlow = (id) => {
      const eras = TraceRows.erasOf(flowAt.get(id));
      update({ flowId: id, era: eras.includes(state.era) ? state.era : eras[0], index: 0 });
    };

    const leftSub = el("span", { class: "panel-sub", text: `${flows.length} 件` });
    const leftBody = el("div", { class: "panel-scroll trace-flows" });
    const body = el("div", { class: "stage-body trace-body" });
    const main = el("main", { class: "stage" }, [body]);
    const sideSub = el("span", { class: "panel-sub" });
    const side = el("div", { class: "side" });

    const stepsTextOf = (flow) => {
      const summary = TraceRows.summaryOf(flow);
      return TraceRows.erasOf(flow).includes(TraceEras.Before) ? `手順 ${summary.steps.before} → ${summary.steps.after}` : `手順 ${summary.steps.after}`;
    };
    const measureNodesOf = (measure) => [prose("span", {}, measure.what), " ", prose("span", {}, measure.before), " → ", prose("span", {}, measure.after)];

    const renderLeft = () => leftBody.replaceChildren(...flows.map((flow, index) => {
      const gist = optionalText(flow.gist);
      const { measure } = TraceRows.summaryOf(flow);
      return pressable("button", { class: classesOf("trace-flow plain-button", { "is-picked": flow.id === state.flowId }) }, [
        el("span", { class: "trace-flow-meta", text: `操作 ${index + 1} · ${stepsTextOf(flow)}` }),
        el("span", { class: "trace-flow-label", text: flow.label }),
        ...(gist === null ? [] : [prose("span", { class: "trace-flow-gist" }, gist)]),
        ...(measure === null ? [] : [el("span", { class: "trace-flow-measure" }, measureNodesOf(measure))]),
      ], () => pickFlow(flow.id));
    }));

    const summaryOf = (flow) => {
      const { steps, counts, measure } = TraceRows.summaryOf(flow);
      const gist = optionalText(flow.gist);
      const itemOf = (key, children, extra = {}) => el("div", { class: classesOf("trace-summary-item", extra) }, [el("span", { class: "trace-summary-key", text: key }), el("span", { class: "trace-summary-value" }, children)]);
      return el("div", { class: "trace-summary" }, [
        ...(gist === null ? [] : [itemOf("この PR で変わったこと", Dom.proseParts(gist), { "is-head": true })]),
        itemOf("手順の数", [el("span", { class: "mono", text: `${steps.before} → ${steps.after}` })]),
        itemOf("増えた / 消えた / 変わった", [
          el("span", { class: "add mono", text: plus(counts.added) }), " / ", el("span", { class: "del mono", text: minus(counts.removed) }), " / ", el("span", { class: "mod mono", text: `~${counts.changed}` }),
        ]),
        ...(measure === null ? [] : [itemOf(measure.what, [prose("span", {}, measure.before), " → ", prose("span", {}, measure.after)])]),
      ]);
    };

    /** 矢印の色の区分。比べるときは増えた / 消えた を、そうでなければ手順の重さを使い、どちらも無ければやりとりの種類の色。 */
    const arrowToneOf = (row, side) => {
      const isMoved = state.era === TraceEras.Compare && (row.status === "added" || row.status === "removed");
      if (isMoved) return row.status;
      return side.cost ?? "";
    };

    const arrowNodeOf = ({ row, arrow, index }) => {
      const sideOfRow = TraceRows.drawnSideOf(row);
      const isCurrent = index === state.index;
      const isChanged = state.era === TraceEras.Compare && row.status === "changed";
      const node = Dom.svg("g", {
        class: classesOf("trace-arrow", { "is-current": isCurrent, "is-changed": isChanged }),
        "data-kind": sideOfRow.message.kind,
        "data-step-tone": arrowToneOf(row, sideOfRow),
        tabindex: "0",
        role: "button",
        "aria-label": `${row.badge}. ${sideOfRow.message.name}`,
      }, [
        Dom.svg("title", {}, [`${row.badge}. ${sideOfRow.message.name}`]),
        Dom.svg("path", { class: "trace-arrow-line", d: arrow.path }),
        Dom.svg("path", { class: "trace-arrow-hit", d: arrow.path }),
        Dom.svg("path", { class: "trace-arrow-head", d: traceHeadOf(arrow.tip, arrow.direction, isCurrent ? TraceHeadSize.current : TraceHeadSize.base) }),
        Dom.svg("g", { class: "trace-badge" }, [
          Dom.svg("circle", { cx: arrow.badge[0], cy: arrow.badge[1], r: isCurrent ? 12 : 10 }),
          Dom.svg("text", { x: arrow.badge[0], y: arrow.badge[1] }, [row.badge]),
        ]),
      ]);
      node.addEventListener("click", () => update({ index }));
      node.addEventListener("keydown", (event) => {
        if (event.key !== "Enter" && event.key !== " ") return;
        event.preventDefault();
        update({ index });
      });
      return node;
    };

    const cardNodeOf = (card, isInvolved) => {
      const name = endNameOf(card.end);
      const icon = explained.lookup.endIcons.get(card.end) ?? null;
      const centerX = card.x + card.width / 2;
      const iconNodes = (icon === null ? traceBoxIconOf : TraceIcons[icon])(centerX, card.y + 30);
      const note = TracePresenceNotes[card.presence];
      const tooltip = [name, card.end].join("\n");
      return Dom.svg("g", { class: classesOf("trace-card", { "is-involved": isInvolved, "is-actor": explained.lookup.actors.has(card.end) }), "data-presence": card.presence }, [
        Dom.svg("title", {}, [tooltip]),
        Dom.svg("rect", { class: "trace-card-bg", x: card.x, y: card.y, width: card.width, height: card.height, rx: 12 }),
        Dom.svg("g", { class: "trace-card-icon" }, iconNodes),
        Dom.svg("text", { class: "trace-card-name", x: centerX, y: card.y + 66 }, [fittedTextOf(name, card.width - 16)]),
        ...(note === undefined ? [] : [Dom.svg("text", { class: "trace-card-note", x: centerX, y: card.y + card.height + 17 }, [note])]),
      ]);
    };

    const figureOf = (rows) => {
      const cards = TraceLayout.cardsIn(layout, rows, { era: state.era, entryAt: explained.entryAt });
      const arrows = TraceLayout.arrowsOf(layout, rows);
      const current = rows[state.index] === undefined ? null : TraceRows.drawnSideOf(rows[state.index]);
      const involved = new Set(current === null || current.message === null ? [] : [current.message.from, current.message.to]);
      const drawn = rows.map((row, index) => ({ row, arrow: arrows[index], index })).filter(({ arrow }) => arrow !== null);
      // 今の矢印はほかの矢印に隠れないよう、最後に描く。
      const ordered = [...drawn.filter(({ index }) => index !== state.index), ...drawn.filter(({ index }) => index === state.index)];
      const pad = TraceFigurePad;
      const naturalWidth = layout.width + pad.left + pad.right;
      const viewBox = [-pad.left, -pad.top, naturalWidth, layout.height + pad.top + pad.bottom].join(" ");
      const svg = Dom.svg("svg", { class: "wide-figure trace-figure", viewBox, role: "img", "aria-label": "操作の流れ図" }, [
        ...cards.map((card) => cardNodeOf(card, involved.has(card.end))),
        ...ordered.map(arrowNodeOf),
      ]);
      // 幅は欄に合わせるが、図の大きさより大きくせず、下限より縮めない。倍率で割って、文字の大きさの倍率では変えない(構成の前後と同じ)。
      svg.style.maxWidth = `calc(${naturalWidth}px / var(--text-size-ratio, 1))`;
      svg.style.minWidth = `calc(${Math.round(naturalWidth * TraceMinScale)}px / var(--text-size-ratio, 1))`;
      return el("div", { class: "trace-stage" }, [svg]);
    };

    /** 手順のカードの 1 列。その側の送り手 → 受け手・やりとりの名前・説明・渡すもの / 返すもの・コード。 */
    const columnFactsOf = (stepSide, label) => {
      const heading = (route) => (label === null ? route : `${label} · ${route}`);
      if (stepSide.message === null) return [el("div", { class: "trace-col-head", text: heading(stepSide.messageId) }), el("p", { class: "side-note", text: "このやりとりは解説の messages にありません" })];
      const { message } = stepSide;
      const values = [
        ...(isString(message.payload) ? [["渡すもの", message.payload]] : []),
        ...(isString(message.returns) ? [["返すもの", message.returns]] : []),
      ];
      return [
        el("div", { class: "trace-col-head", text: heading(`${endNameOf(message.from)} → ${endNameOf(message.to)}`) }),
        el("div", { class: "trace-col-name" }, [kindChipOf(message.kind), el("span", { text: message.name })]),
        ...(stepSide.text === null ? [] : [prose("p", { class: "trace-col-text" }, stepSide.text)]),
        ...(values.length === 0 ? [] : [el("span", { class: "kv" }, values.flatMap(([key, value]) => [el("span", { class: "kv-key", text: key }), prose("span", { class: "kv-value" }, value)]))]),
        el("pre", { class: "trace-code", text: message.code }),
        ...(stepSide.showsAfterSpelling ? [el("p", { class: "trace-spelling", text: TraceSpellingNote })] : []),
      ];
    };

    const statusChipOf = (status) => (status === null ? el("span", { class: "chip", text: "そのまま" }) : el("span", { class: "chip", "data-tone": TraceStatuses[status].tone, text: TraceStatuses[status].label }));

    const stepCardOf = (row) => {
      const columns = TraceRows.cardColumnsOf(row, state.era);
      const changeNote = row.change === null ? [] : [prose("div", { class: "trace-change" }, row.change)];
      const head = state.era === TraceEras.Compare ? [el("div", { class: "trace-step-head" }, [statusChipOf(row.status), el("span", { class: "trace-step-pos", text: `番号 ${row.badge}` })])] : [];
      const columnOf = ({ side: which, step }) => {
        if (which === "only") return el("div", { class: "trace-col" }, columnFactsOf(step, null));
        const texts = TraceColumnTexts[which];
        if (step === null) return el("div", { class: "trace-col is-none" }, [el("div", { class: "trace-col-head", text: texts.label }), el("p", { class: "side-note", text: texts.missing })]);
        return el("div", { class: "trace-col" }, columnFactsOf(step, texts.label));
      };
      const body = columns.length === 1 ? columnOf(columns[0]) : el("div", { class: "trace-columns" }, columns.map(columnOf));
      return el("div", { class: "trace-step" }, [...head, body, ...changeNote]);
    };

    const playerOf = (rows) => {
      const previous = pressable("button", { class: "outline-button", text: "◀ 前へ" }, [], () => update({ index: state.index - 1 }));
      const next = pressable("button", { class: "outline-button", text: "次へ ▶" }, [], () => update({ index: state.index + 1 }));
      previous.disabled = state.index <= 0;
      next.disabled = state.index >= rows.length - 1;
      const unit = state.era === TraceEras.Compare ? "行" : "手順";
      return el("div", { class: "trace-player" }, [previous, next, el("span", { class: "trace-player-pos", text: `${unit} ${Math.min(state.index + 1, rows.length)} / ${rows.length}` })]);
    };

    const legendOf = () => el("div", { class: "legend trace-legend" }, [
      ...MessageKindOrder.map((kind) => el("span", {}, [el("span", { class: "trace-swatch", "data-kind": kind }), `${Vocabulary.messageKinds[kind].label}${kind === "evt" ? "(破線)" : ""}`])),
      ...Object.entries(Vocabulary.stepCosts).map(([cost, names]) => el("span", {}, [el("span", { class: "trace-swatch", "data-step-tone": cost }), names.label])),
      ...(state.era === TraceEras.Compare
        ? [
          el("span", {}, [el("span", { class: "trace-swatch", "data-step-tone": "added" }), "+n 増えた手順"]),
          el("span", {}, [el("span", { class: "trace-swatch", "data-step-tone": "removed" }), "× 消えた手順"]),
          el("span", {}, [el("span", { class: "trace-swatch is-changed" }), "輪 中身が変わった手順"]),
        ]
        : []),
    ]);

    const renderMain = (flow, rows) => {
      const text = optionalText(flow.text);
      const eras = TraceRows.erasOf(flow);
      const toolbar = el("div", { class: "trace-toolbar" }, labeledToggleOf("見る流れ", { options: TraceEraChoices.filter((choice) => eras.includes(choice.value)), current: state.era, onPick: (era) => update({ era, index: 0 }) }));
      const current = rows[state.index];
      body.replaceChildren(
        el("div", { class: "lede" }, [
          el("span", { class: "eyebrow", text: "流れ図" }),
          el("h1", { text: flow.label }),
          ...(text === null ? [] : [prose("p", {}, text)]),
        ]),
        ...(state.era === TraceEras.Compare ? [summaryOf(flow)] : []),
        toolbar,
        figureOf(rows),
        playerOf(rows),
        ...(current === undefined ? [emptyOf("この表示には手順がありません")] : [stepCardOf(current)]),
        legendOf(),
      );
    };

    const renderSide = (rows) => {
      const isComparing = state.era === TraceEras.Compare;
      sideSub.textContent = `${rows.length} ${isComparing ? "行" : "手順"}`;
      const itemOf = (row, index) => {
        const stepSide = TraceRows.drawnSideOf(row);
        const name = stepSide.message === null ? stepSide.messageId : stepSide.message.name;
        const wasName = row.before !== null && row.before.message !== null ? row.before.message.name : null;
        const marks = isComparing
          ? [
            ...(row.status === null ? [] : [statusChipOf(row.status)]),
            ...(row.status === "changed" && wasName !== null ? [el("span", { class: "trace-row-was", text: `前: ${wasName}` })] : []),
          ]
          : (row.status === null ? [] : [el("span", { class: "trace-row-flag", text: "この PR で変わった" })]);
        const tone = isComparing && (row.status === "added" || row.status === "removed") ? row.status : (stepSide.cost ?? "");
        return pressable("button", { class: classesOf("trace-row plain-button", { "is-current": index === state.index, "is-removed": isComparing && row.status === "removed" }) }, [
          el("span", { class: "trace-dot", "data-kind": stepSide.message === null ? "" : stepSide.message.kind, "data-step-tone": tone, text: row.badge }),
          el("span", { class: "trace-row-body" }, [el("span", { class: "trace-row-name", text: name }), ...marks]),
        ], () => update({ index }));
      };
      side.replaceChildren(el("div", { class: "side-block" }, [
        el("span", { class: "eyebrow", text: isComparing ? "変更前と変更後の手順" : "この操作の手順" }),
        el("div", { class: "trace-rows" }, rows.map(itemOf)),
      ]));
    };

    const render = () => {
      renderLeft();
      const flow = flowOf();
      if (flow === null) return;
      const rows = TraceRows.rowsOf(flow, state.era, messages);
      renderMain(flow, rows);
      renderSide(rows);
    };

    const emptyText = explained.explain === null ? "解説なし" : "書かれていない";
    if (flows.length === 0) {
      body.replaceChildren(el("div", { class: "lede" }, [el("span", { class: "eyebrow", text: "流れ図" }), emptyOf(emptyText)]));
      leftBody.replaceChildren(emptyOf(emptyText));
    } else {
      render();
    }

    /** stepChange の Target の流れと番号。流れ図が行き先でなければ null。 */
    const pickOfTarget = (target) => {
      const destination = Target.destinationOf(target);
      return destination.screen === Screens.Trace ? destination : null;
    };

    return {
      summary: [],
      controls: [],
      tablist: null,
      left: panelOf("left", [panelHead("操作", "", [leftSub]), leftBody]),
      main,
      right: panelOf("right", [panelHead("手順", "", [sideSub]), side]),
      /** @returns 流れ図が行き先の Target で、その流れの「比べる」にその行があるか */
      canShow: (target) => {
        const found = pickOfTarget(target);
        return found !== null && flowAt.has(found.flow) && TraceRows.isSelectable(flowAt.get(found.flow), found.stepChange);
      },
      /** その Target の流れを「比べる」で開き、指す行を選んだ状態にする。`canShow` が真のものだけを渡す。 */
      showTarget: (target) => {
        const found = pickOfTarget(target);
        update({ flowId: found.flow, era: TraceEras.Compare, index: found.stepChange - 1 });
      },
      /** その流れを、その流れの既定の表示の最初の手順で開く。flows に無い流れは開かない。 */
      showFlow: (id) => {
        if (!flowAt.has(id)) return;
        update({ flowId: id, era: TraceRows.erasOf(flowAt.get(id))[0], index: 0 });
      },
    };
  };

  const ScreenBuilders = { map: MapScreen, story: StoryScreen, test: TestScreen, impact: ImpactScreen, primer: PrimerScreen, compare: CompareScreen, trace: TraceScreen };

  /** 解説が使えない理由を帯の 1 行にする。 */
  const missingTextOf = (reason) => {
    switch (reason.kind) {
      case "absent":
        return "解説なし(explain.json がまだ置かれていません)。変更の地図だけで組んでいます";
      case "unreadable":
        return `解説なし(explain.json を読めません: ${reason.detail})`;
      case "version":
        return `解説なし(explain.json の version が ${JSON.stringify(reason.actual)} で、このページが読めるのは 1)`;
      case "pr":
        return `解説なし(explain.json は PR ${JSON.stringify(reason.actual)} のもの)`;
      case "shape":
        return `解説なし(explain.json の ${reason.key ?? "トップ"} の形が想定と違います)`;
    }
  };

  const freshnessTextOf = (freshness) => {
    switch (freshness.kind) {
      case "stale":
        return `解説は ${shortSha(freshness.sha)} 時点、以降 ${freshness.after} コミットは解説なし`;
      case "unknown":
        return `解説の sha(${shortSha(freshness.sha)})が地図に無い。force push などで履歴が変わった可能性があります`;
      case "latest":
      case "none":
        return null;
    }
  };

  /** 上の帯に出す文。解説なし(理由)/ 古い / sha が地図に無い / 地図に無い解説。 */
  const bandTextsOf = (explained) => [
    explained.reading.kind === "missing" ? missingTextOf(explained.reading.reason) : null,
    freshnessTextOf(explained.freshness),
    explained.strayStories.length > 0 ? `地図に無い解説 ${explained.strayStories.length} 件(地図のコミットに無い sha への commitStories)` : null,
  ].filter((text) => text !== null);

  const linksOf = (pr, issue) => {
    const prLink = pr === null ? [] : [el("a", { href: `https://github.com/${Repo}/pull/${pr}`, title: `PR #${pr}` }, [el("span", { class: "link-kind", text: "PR " }), `#${pr}`])];
    const issueLink = issue === null ? [] : [el("a", { href: `https://github.com/${Repo}/issues/${issue}`, title: `Issue #${issue}` }, [el("span", { class: "link-kind", text: "Issue " }), `#${issue}`])];
    return el("nav", { class: "links" }, [...prLink, ...issueLink]);
  };

  /** 地図が読めないときの全体の案内。画面は組めないので、ヘッダと案内だけを出す。 */
  const mountGuide = (root, { pr, detail }) => {
    document.title = pr === null ? "PR 解説" : `PR #${pr} · PR 解説`;
    const screenNames = Object.values(Screens).map((screen) => ScreenLabels[screen]);
    root.replaceChildren(
      el("header", { class: "top" }, [el("span", { class: "repo", text: RepoName }), el("span", { class: "top-main" }), linksOf(pr, null)]),
      el("div", { class: "bands" }),
      el("div", { class: "screens" }, [el("div", { class: "guide" }, [
        el("h1", { text: "変更の地図を読めません" }),
        el("p", { text: `change-map.json を読めませんでした(${detail})。PR に push すると、Actions が地図とこのページを置き直します。地図が置かれると、解説が無くても${screenNames.join("・")}の ${screenNames.length} 画面が出ます。` }),
      ])]),
    );
  };

  /** ヘッダ・帯・5 画面を組み、画面を切り替える。 */
  const Frame = Object.freeze({
    mount: (root, explained) => {
      const pr = explained.map.pr;
      const explain = explained.explain;
      const hasIssue = explain !== null && typeof explain.issue === "number";
      const issue = hasIssue ? explain.issue : null;
      document.title = explain === null ? `PR #${pr} · PR 解説` : `${explain.overview.title} · PR #${pr}`;
      /** 画面をまたぐ移動。移った先の画面で、渡したものを選んだ状態にする。 */
      const go = {
        toCommit: (sha) => {
          navigateTo(Screens.Story);
          built.story.select(sha);
        },
        toFlow: (id) => {
          navigateTo(Screens.Map);
          built.map.showFlow(id);
        },
        toMessage: (id) => {
          navigateTo(Screens.Map);
          built.map.showMessage(id);
        },
        toTest: (explainTestId) => {
          navigateTo(Screens.Test);
          built.test.showTest(explainTestId);
        },
        toImpact: (mention) => {
          navigateTo(Screens.Impact);
          built.impact.showMention(mention);
        },
        toCommitFile: (target) => {
          navigateTo(Screens.Story);
          built.story.showFile(target);
        },
        toPrimer: (position) => {
          navigateTo(Screens.Primer);
          built.primer.showTopic(position);
        },
        toCompare: (target) => {
          navigateTo(Screens.Compare);
          built.compare.showTarget(target);
        },
        toTrace: (flowId) => {
          navigateTo(Screens.Trace);
          built.trace.showFlow(flowId);
        },
        /** Target の行き先の画面へ移り、指すものを選んだ状態にする。`canShow` が真のものだけを渡す。 */
        toTarget: (target) => {
          const screen = Target.destinationOf(target).screen;
          switch (screen) {
            case Screens.Map:
              navigateTo(Screens.Map);
              built.map.showTarget(target);
              return;
            case Screens.Compare:
              go.toCompare(target);
              return;
            case Screens.Trace:
              navigateTo(Screens.Trace);
              built.trace.showTarget(target);
              return;
          }
        },
        /** @returns Target の行き先の画面で、指すものを選べるか */
        canShow: (target) => built[Target.destinationOf(target).screen].canShow(target),
      };
      // 構造マップは組むときに、highlights の行き先がほかの画面で選べるか(`go.canShow`)を聞くので、行き先になる構成の前後と流れ図を先に組む。
      const Destinations = [Screens.Compare, Screens.Trace];
      const BuildOrder = [...Destinations, ...Object.values(Screens).filter((screen) => !Destinations.includes(screen))];
      const built = {};
      for (const screen of BuildOrder) built[screen] = ScreenBuilders[screen](explained, go);
      const tabs = Object.values(Screens).map((screen) => el("a", { href: `#${screen}`, "data-screen": screen, text: ScreenLabels[screen] }));
      const controls = el("div", { class: "screen-controls" });
      const summary = el("span", { class: "screen-summary" });
      const branch = el("span", { class: "branch" }, [explained.map.headBranch, el("span", { class: "arrow", text: "→" }), explained.map.baseBranch]);
      const sections = Object.values(Screens).map((screen) => {
        const parts = built[screen];
        const tablist = parts.tablist === null ? [] : [parts.tablist];
        const grid = el("section", { class: "screen", "data-screen": screen, "aria-label": ScreenLabels[screen] }, [...tablist, parts.left, parts.main, ...(parts.right === null ? [] : [parts.right])]);
        PanelResizer.attach({ screen, grid, panels: parts.right === null ? { left: parts.left } : { left: parts.left, right: parts.right } });
        return grid;
      });
      const screens = el("div", { class: "screens" }, sections);
      // 文字の大きさの持ち主はこの整数の percent だけで、CSS 変数・% の表示・端の `disabled` はここから描く。
      let textSize = TextSize.Initial;
      const textSizePercent = el("span", { class: "text-size-percent" });
      /** 文字の大きさを 1 段変える。読んでいた節を読む線に残せる画面では、その包みの中で変える。 */
      const stepTextSize = (next) => {
        if (next === null) return;
        const apply = () => applyTextSize(next);
        const keepReading = built[current].keepReading;
        if (keepReading === undefined) apply();
        else keepReading(apply);
      };
      const smallerButton = pressable("button", { class: "is-step", title: "文字を小さく", text: "−" }, [], () => stepTextSize(TextSize.smaller(textSize)));
      const largerButton = pressable("button", { class: "is-step", title: "文字を大きく", text: "+" }, [], () => stepTextSize(TextSize.larger(textSize)));
      const applyTextSize = (percent) => {
        textSize = percent;
        screens.style.setProperty("--text-size-ratio", TextSize.ratioOf(percent));
        textSizePercent.textContent = `${percent}%`;
        smallerButton.disabled = TextSize.smaller(percent) === null;
        largerButton.disabled = TextSize.larger(percent) === null;
      };
      applyTextSize(TextSize.Initial);
      const textSizeControls = el("div", { class: "text-size-controls", role: "group", "aria-label": "文字の大きさ" }, [smallerButton, textSizePercent, largerButton]);
      root.replaceChildren(
        el("header", { class: "top" }, [el("span", { class: "repo", text: RepoName }), el("div", { class: "tabs-scroll" }, [el("nav", { class: "segmented", "aria-label": "画面" }, tabs)]), el("div", { class: "top-main" }, [branch, summary]), controls, textSizeControls, linksOf(pr, issue)]),
        el("div", { class: "bands" }, bandTextsOf(explained).map((text) => el("div", { class: "band", role: "status", text }))),
        screens,
      );
      let current = null;
      const show = (screen) => {
        current = screen;
        for (const tab of tabs) {
          if (tab.dataset.screen === screen) tab.setAttribute("aria-current", "page");
          else tab.removeAttribute("aria-current");
        }
        for (const section of sections) section.hidden = section.dataset.screen !== screen;
        summary.replaceChildren(...built[screen].summary);
        controls.replaceChildren(...built[screen].controls);
      };
      const choose = () => ScreenChoice.choose(location.hash);
      /** ハッシュをその画面のものに書き換えてから開く。 */
      const navigateTo = (screen) => {
        history.replaceState(null, "", `#${screen}`);
        show(screen);
      };
      for (const tab of tabs) {
        tab.addEventListener("click", (event) => {
          event.preventDefault();
          navigateTo(tab.dataset.screen);
        });
      }
      window.addEventListener("hashchange", () => show(choose()));
      window.addEventListener("keydown", (event) => {
        const onKey = built[current].onKey;
        if (onKey !== undefined) onKey(event);
      });
      show(choose());
    },
  });

  const fetchFresh = (name) => fetch(`${name}?t=${Date.now()}`, { cache: "no-store" });
  const prFromPath = (location.pathname.match(/pr-(\d+)/) || [])[1] ?? null;

  /** 読み込みの失敗だけを受ける。組み立ての失敗は握らず、コンソールにそのまま出す。 */
  const mapRequest = fetchFresh("change-map.json")
    .then((response) => (response.ok ? response.json() : Promise.reject(new Error(`HTTP ${response.status}`))))
    .then((map) => ({ isLoaded: true, map }), (error) => ({ isLoaded: false, detail: error.message }));
  const explainRequest = fetchFresh("explain.json")
    .then((response) => {
      if (response.status === 404) return { kind: "absent" };
      if (!response.ok) return { kind: "failed", detail: `HTTP ${response.status}` };
      return response.text().then((text) => ({ kind: "text", text }));
    })
    .catch((error) => ({ kind: "failed", detail: error.message }));

  /** 地図を読めない理由。読めれば null。 */
  const mapProblemOf = (mapResult) => {
    if (!mapResult.isLoaded) return mapResult.detail;
    if (!ExplainedMap.isReadableMap(mapResult.map)) return `version が ${JSON.stringify(mapResult.map?.version ?? null)} で、このページが読めるのは 2`;
    return null;
  };

  Promise.all([mapRequest, explainRequest]).then(([mapResult, source]) => {
    const root = document.getElementById("app");
    const problem = mapProblemOf(mapResult);
    if (problem !== null) {
      mountGuide(root, { pr: prFromPath, detail: problem });
      return;
    }
    Frame.mount(root, ExplainedMap.create(mapResult.map, source));
  });
})();
</script>
</body>
</html>
