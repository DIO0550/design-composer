       */
      fromCalls: (explained) => {
        if (explained.explain === null) return { kind: "unexplained" };
        const calls = explained.explain.calls;
        if (!isRecord(calls)) return { kind: "unwritten" };
        const sidesOf = (item) => ({ status: statusOf(item.status), was: optionalText(item.was), now: optionalText(item.now) });
        const boxes = listOf(calls.boxes).map((box) => ({ id: box.id, name: box.name, role: optionalText(box.role), module: box.module, ...sidesOf(box) }));
        const edges = listOf(calls.edges).map((edge) => ({ id: edge.id, from: edge.from, to: edge.to, code: optionalText(edge.code), ...sidesOf(edge) }));
        return { kind: "drawn", grain: CompareGrains.Calls, boxes, edges, groups: callGroupsOf(boxes, explained.entries) };
      },
      /**
       * モジュールの粒度の図。箱は、図に出す(`inGraph`)変更ファイルと、増えた・消えた依存の端のファイル(図に出さない concept の
       * ファイルを除く)。箱の状態は地図の status が A なら added、D なら removed、ほかの変更は changed で、端にしか出ない
       * 変えていないファイルは null。線は両端が箱の依存で、増えた(added)・消えた(removed)・残った(null)のどれか。
       * @param explained `ExplainedMap.create` の戻り値
       * @returns `{kind: "drawn", grain: "modules", boxes, edges, groups}`。箱は `{id(パス), path, oldPath, name, beforeName, layer, status,
       *   dependencies}`(beforeName は変更前の側の名前で、移動したファイルは前のパスのファイル名。dependencies はその箱を端に持つ依存
       *   `{added, removed, kept}`)。線の id は両端のパスの組。groups は層ごとの組で、地図の層の順
       */
      fromModules: (explained) => {
        const { entryAt, dependencies } = explained;
        const isHidden = (path) => entryAt.has(path) && !entryAt.get(path).inGraph;
        const changed = explained.entries.filter((entry) => entry.changed && entry.inGraph).map((entry) => entry.path);
        const ends = dependencies.filter((link) => link.status !== "kept").flatMap((link) => [link.from, link.to]).filter((path) => !isHidden(path));
        const paths = [...new Set([...changed, ...ends])];
        const nameOfPath = (path) => (entryAt.has(path) ? ExplainedMap.nameOf(entryAt.get(path), "concept") : ExplainedMap.fileNameOf(path));
        const layerAt = layerAtOf(explained.groupings.layer);
        const boxOf = (path) => {
          const entry = entryAt.get(path);
          const isChanged = entry !== undefined && entry.changed;
          const oldPath = entry === undefined ? null : entry.oldPath;
          const name = nameOfPath(path);
          return {
            id: path,
            path,
            oldPath,
            name,
            beforeName: oldPath === null ? name : ExplainedMap.fileNameOf(oldPath),
            layer: layerAt.get(path) ?? null,
            status: isChanged ? FileStatuses[entry.status] ?? "changed" : null,
            dependencies: dependenciesOf(path, { dependencies, nameOfPath }),
          };
        };
        const boxes = paths.map(boxOf);
        const isBox = new Set(paths);
        const edges = dependencies
          .filter((link) => isBox.has(link.from) && isBox.has(link.to))
          .map((link) => ({ id: JSON.stringify([link.from, link.to]), from: link.from, to: link.to, status: statusOf(link.status) }));
        const groups = explained.groupings.layer
          .map((group) => ({ id: group.layer, label: group.layer, boxes: boxes.filter((box) => box.layer === group.layer).map((box) => box.id) }))
          .filter((group) => group.boxes.length > 0);
        return { kind: "drawn", grain: CompareGrains.Modules, boxes, edges, groups };
      },
      /** @returns 図が描けていて、その id の箱か線があるか(構成の前後で選べるか) */
      isSelectable: (diagram, id) => isDrawn(diagram) && (boxIn(diagram, id) !== undefined || edgeIn(diagram, id) !== undefined),
      /** @returns 箱の名前か、線の「〈端の箱の名前〉 → 〈端の箱の名前〉」。図が描けていないか、その id が無ければ null */
      nameOf: (diagram, id) => {
        if (!isDrawn(diagram)) return null;
        const box = boxIn(diagram, id);
        if (box !== undefined) return box.name;
        const edge = edgeIn(diagram, id);
        if (edge === undefined) return null;
        const endNameOf = (end) => boxIn(diagram, end)?.name ?? end;
        return `${endNameOf(edge.from)} → ${endNameOf(edge.to)}`;
      },
      /**
       * 何も選んでいないときの右の欄。
       * @param calls 解説の calls(解説が無いか calls が無ければ null)。gist・text・review はどちらの粒度でも出す
       * @returns 選べる箱・線が無ければ `{kind: "unselectable", reason, written}`(reason は図の kind の `unexplained` / `unwritten` か、
       *   箱も線も 0 件の `unchanged`)。あれば、calls の gist・text・review のどれかを書いたとき `{kind: "written", written}`、
       *   どれも書いていなければ `{kind: "counts", counts}`。written は `{gist, text, review}`(gist / text は無ければ null、review は
       *   無ければ [])で、unselectable では書いていなければ null。counts は `{boxes, edges}` の状態ごとの件数(`{added, removed, changed}`)
       */
      unselectedOf: (diagram, calls) => {
        const written = writtenOf(calls);
        if (!isDrawn(diagram)) return { kind: "unselectable", reason: diagram.kind, written };
        const isEmpty = diagram.boxes.length === 0 && diagram.edges.length === 0;
        if (isEmpty) return { kind: "unselectable", reason: "unchanged", written };
        if (written !== null) return { kind: "written", written };
        return { kind: "counts", counts: { boxes: statusCountsOf(diagram.boxes), edges: statusCountsOf(diagram.edges) } };
      },
      /**
       * 左の欄の、変わったところ。図が描けていなければ件数は 0 で、一覧は空。
       * @returns `counts`(`unselectedOf` と同じ形)と、状態のある箱 → 線の順の `items`(`{kind: "box" | "edge", id, status, name}`)
       */
      changeListOf: (diagram) => {
        if (!isDrawn(diagram)) return { counts: { boxes: statusCountsOf([]), edges: statusCountsOf([]) }, items: [] };
        const itemsOf = (kind, list) => list.filter((item) => item.status !== null).map((item) => ({ kind, id: item.id, status: item.status, name: CompareDiagram.nameOf(diagram, item.id) }));
        return { counts: { boxes: statusCountsOf(diagram.boxes), edges: statusCountsOf(diagram.edges) }, items: [...itemsOf("box", diagram.boxes), ...itemsOf("edge", diagram.edges)] };
      },
      /**
       * 選んだ箱・線。
       * @returns 箱は `{kind: "box", box}`、線は `{kind: "edge", edge, from, to}`(端の箱)。無ければ null
       */
      pickedOf: (diagram, id) => {
        if (!isDrawn(diagram)) return null;
        const box = boxIn(diagram, id);
        if (box !== undefined) return { kind: "box", box };
        const edge = edgeIn(diagram, id);
        if (edge === undefined) return null;
        return { kind: "edge", edge, from: boxIn(diagram, edge.from) ?? null, to: boxIn(diagram, edge.to) ?? null };
      },
      /**
       * 右の欄の「どこで変わったか」。選んだ箱・線のファイル(呼び出しの粒度は箱の module)を変えた、マージ以外のコミット。
       * @param explained `ExplainedMap.create` の戻り値
       * @returns 古い順の `{sha, path}`(path はそのコミットが変えた、選んだもののファイルの最初のもの)
       */
      changingCommitsOf: (diagram, id, explained) => {
        const files = filesOf(diagram, id);
        return explained.commits.filter((commit) => !commit.merge).flatMap((commit) => {
          const touched = files.find((path) => commit.files.some((file) => file.path === path || file.oldPath === path));
          return touched === undefined ? [] : [{ sha: commit.sha, path: touched }];
        });
      },
      /**
       * 右の欄の「ほかの画面で見る」。選んだ箱・線のファイルを端に持つやりとりを、変更後の手順(`steps`)か変更前の手順
       * (`beforeSteps`)に含む流れ。
       * @param explained `ExplainedMap.create` の戻り値
       * @returns 解説の flows の順の流れ
       */
      flowsThrough: (diagram, id, explained) => {
        const files = new Set(filesOf(diagram, id));
        const touches = (messageId) => {
          const message = explained.lookup.messages.get(messageId);
          return message !== undefined && (files.has(message.from) || files.has(message.to));
        };
        return [...explained.lookup.flows.values()].filter((flow) => [...listOf(flow.steps), ...listOf(flow.beforeSteps)].some(touches));
      },
      /**
       * 変更前と変更後の 2 枚の図。前後の箱と線を合わせたものを `GraphLayout.create` で 1 回だけ並べる(線はどれも残った依存として
       * 渡す)ので、2 枚の箱は同じ位置にあり、片方にしか無い箱も、もう片方に位置を持つ。
       * @returns `{width, height, groups, before, after}`。groups は組の枠(`{id, label, x, y, width, height}`)。before / after は
       *   `boxes`(`{box, x, y, width, height, isPresent, isUnchanged}`。isPresent はその側にあるか、isUnchanged は状態の無い箱か)と
       *   `edges`(その側にある線の `{edge, route}`。route は `GraphLayout.edgesOf` の道筋)
       */
      figuresOf: (diagram) => {
        const groups = diagram.groups.map((group) => ({ id: group.id, boxes: group.boxes.map((id) => ({ path: id, lines: 0 })) }));
        const links = diagram.edges.map((edge) => ({ from: edge.from, to: edge.to, status: "kept" }));
        const layout = GraphLayout.create({ groups, links, expanded: groups.map((group) => group.id), room: { width: RoomWidth, height: Infinity } });
        const unitAt = new Map(layout.units.map((unit) => [unit.path, unit]));
        const labelOfGroup = new Map(diagram.groups.map((group) => [group.id, group.label]));
        const sideOf = (absent) => ({
          boxes: diagram.boxes.filter((box) => unitAt.has(box.id)).map((box) => {
            const { x, y, width, height } = unitAt.get(box.id);
            return { box, x, y, width, height, isPresent: box.status !== absent, isUnchanged: box.status === null };
          }),
          edges: diagram.edges.filter((edge) => edge.status !== absent).flatMap((edge) => GraphLayout.edgesOf(layout, [{ from: edge.from, to: edge.to, item: edge, leads: true }]).map((drawn) => ({ edge, route: drawn.route }))),
        });
        return {
          width: layout.width,
          height: layout.height,
          groups: layout.containers.map((container) => ({ id: container.group, label: labelOfGroup.get(container.group), x: container.x, y: container.y, width: container.width, height: container.height })),
          before: sideOf("added"),
          after: sideOf("removed"),
        };
      },
    });
  })();

  /** 流れ図の表示。比べる(変更前と変更後の手順を対応の行で重ねる)/ 変更後だけ / 変更前だけ。 */
  const TraceEras = Object.freeze({ Compare: "compare", After: "after", Before: "before" });

  /**
   * 流れ図の手順の行。解説の流れの変更後の手順(`steps`)・変更前の手順(`beforeSteps`)・その対応(`stepChanges`)を、表示ごとの
   * 行にする。行は `{status, badge, before, after, change}` で、status は対応の状態(`added` / `removed` / `changed`、そのままなら
   * null)、badge は矢印と一覧の番号、change は対応の注記(無ければ null)。before / after はその側の手順
   * `{n, messageId, message, text, cost, showsAfterSpelling}`(無い側は null。message は messages に無ければ null、cost は
   * 語彙 `stepCosts` のキーか null。showsAfterSpelling は、前後が同じやりとりの changed の変更前の手順で、やりとりの綴りが
   * 変更後のものであること)。
   */
  const TraceRows = (() => {
    const Statuses = ["added", "removed", "changed"];

    const statusOf = (value) => (Statuses.includes(value) ? value : null);
    const costOf = (value) => (isString(value) && Object.hasOwn(Vocabulary.stepCosts, value) ? value : null);
    const changesOf = (flow) => listOf(flow.stepChanges).filter(isRecord);
    const hasChanges = (flow) => changesOf(flow).length > 0;
    /** 手順の n 番目(1 始まり)のやりとりの id。番号が手順に無ければ null。 */
    const idAt = (ids, n) => {
      const steps = listOf(ids);
      return Number.isInteger(n) && n >= 1 && n <= steps.length ? steps[n - 1] : null;
    };
    /** 手順の 1 つを、その側の説明・重さを添えた行の側にする。id が無ければ null。 */
    const sideOf = ({ id, n, messages }, written) => (id === null ? null : {
      n,
      messageId: id,
      message: messages.get(id) ?? null,
      text: optionalText(written.text),
      cost: costOf(written.cost),
      showsAfterSpelling: written.showsAfterSpelling === true,
    });
    /** 比べるときの番号。増えた手順は「+n」、消えた手順は「×」、ほかは変更後の番号。 */
    const badgeOf = (status, after) => {
      if (after === null) return "×";
      return status === "added" ? `+${after.n}` : String(after.n);
    };

    const comparedRowsOf = (flow, messages) => changesOf(flow).map((change) => {
      const status = statusOf(change.status);
      const beforeId = idAt(flow.beforeSteps, change.beforeStep);
      const afterId = idAt(flow.steps, change.afterStep);
      const isSameMessage = beforeId !== null && beforeId === afterId;
      const before = sideOf({ id: beforeId, n: change.beforeStep, messages }, { text: change.beforeText, cost: change.beforeCost, showsAfterSpelling: status === "changed" && isSameMessage });
      const after = sideOf({ id: afterId, n: change.afterStep, messages }, { text: change.afterText, cost: change.afterCost });
      return { status, badge: badgeOf(status, after), before, after, change: optionalText(change.change) };
    });

    /** 変更後だけ / 変更前だけの行。手順の順に 1 から番号を振り、その手順を指す対応の状態・説明・重さ・注記を添える。 */
    const sideRowsOf = (flow, { era, messages }) => {
      const isAfter = era === TraceEras.After;
      const changes = changesOf(flow);
      return listOf(isAfter ? flow.steps : flow.beforeSteps).map((id, index) => {
        const n = index + 1;
        const change = changes.find((candidate) => (isAfter ? candidate.afterStep : candidate.beforeStep) === n) ?? null;
        const status = change === null ? null : statusOf(change.status);
        const isAfterSpelling = !isAfter && status === "changed" && idAt(flow.steps, change.afterStep) === id;
        const written = change === null ? {} : { text: isAfter ? change.afterText : change.beforeText, cost: isAfter ? change.afterCost : change.beforeCost, showsAfterSpelling: isAfterSpelling };
        const side = sideOf({ id, n, messages }, written);
        return { status, badge: String(n), before: isAfter ? null : side, after: isAfter ? side : null, change: change === null ? null : optionalText(change.change) };
      });
    };

    const drawnSideOf = (row) => row.after ?? row.before;

    return Object.freeze({
      /** @returns 流れで選べる表示(既定が先頭)。対応(`stepChanges`)の無い流れ(この形より前に書いた解説)は変更後だけ */
      erasOf: (flow) => (hasChanges(flow) ? [TraceEras.Compare, TraceEras.After, TraceEras.Before] : [TraceEras.After]),
      /**
       * 表示ごとの行。比べるときは対応の順、変更後だけ / 変更前だけは、その側の手順の順。
       * @param messages やりとりの id から解説のやりとりを引く表(`ExplainedMap` の `lookup.messages`)
       */
      rowsOf: (flow, era, messages) => (era === TraceEras.Compare ? comparedRowsOf(flow, messages) : sideRowsOf(flow, { era, messages })),
      /** @returns 行の矢印として描く側。比べるときは変更後の手順があればそれ、無ければ変更前の手順 */
      drawnSideOf,
      /**
       * 手順のカードの列。比べるときのそのままの行と、変更後だけ / 変更前だけの行は 1 列、比べるときのほかの行は変更前と変更後の 2 列。
       * @returns `{side, step}` の並び。side は `only`(1 列)/ `before` / `after`、step はその側の手順(無い側は null)
       */
      cardColumnsOf: (row, era) => {
        if (era !== TraceEras.Compare) return [{ side: "only", step: drawnSideOf(row) }];
        if (row.status === null && row.after !== null) return [{ side: "only", step: row.after }];
        return [{ side: "before", step: row.before }, { side: "after", step: row.after }];
      },
      /**
       * 比べるときの要約。
       * @returns `{steps: {before, after}, counts: {added, removed, changed}, measure}`。steps は手順の数、counts は対応の状態ごとの
       *   件数、measure は量の前後 `{what, before, after}`(書いていなければ null)
       */
      summaryOf: (flow) => {
        const statuses = changesOf(flow).map((change) => statusOf(change.status));
        const measure = isRecord(flow.measure) ? flow.measure : null;
        const isMeasured = measure !== null && [measure.what, measure.before, measure.after].every(isString);
        return {
          steps: { before: listOf(flow.beforeSteps).length, after: listOf(flow.steps).length },
          counts: Object.fromEntries(Statuses.map((status) => [status, statuses.filter((candidate) => candidate === status).length])),
          measure: isMeasured ? { what: measure.what, before: measure.before, after: measure.after } : null,
        };
      },
      /** @returns 流れに対応があり、番号(1 始まり)がその数の中か(流れ図の「比べる」でその行を選べるか) */
      isSelectable: (flow, stepChange) => Number.isInteger(stepChange) && stepChange >= 1 && stepChange <= changesOf(flow).length,
    });
  })();

  /**
   * 流れ図のカード(やりとりの端)の配置と、矢印の道筋。カードは全部の流れの手順(変更後 → 変更前)の端を 1 回だけ置くので、流れや
   * 表示を替えても位置は動かない。
   *
   * 列は、最初の流れの最初の手順の送り手を 0 とし、手順を向きを問わずにたどった最短の数にする。たどり着けない端が残れば、その端を
   * 含む最初の流れの最初の送り手から、列 0 で数え直す。列の中は、1 つ前の列で
   * つながる端の位置の平均の小さい順に並べ、同じなら先に出た端(流れの順、流れの中は変更後 → 変更前)を上にする。列 0 は先に出た順。
   */
  const TraceLayout = (() => {
    const Card = Object.freeze({ width: 150, height: 92 });
    const Gap = Object.freeze({ column: 130, row: 64 });
    // 同じ 2 者のあいだの矢印をずらす幅と、番号の丸を線から離す幅。
    const Spread = 16;
    const BadgeOffset = 14;
    // 同じ列のあいだの弧が、カードの右の辺からふくらむ幅と、弧を重ねるときに足す幅。
    const Bow = Object.freeze({ base: 46, step: 20 });
    // 送り手と受け手が同じ手順の輪の大きさ。
    const Loop = 34;

    /** 流れごとの、手順の端の組(`[from, to]`)。変更後の手順 → 変更前の手順の順で、messages に無いやりとりは飛ばす。 */
    const endPairsOf = (flows, messages) => flows.map((flow) => [...listOf(flow.steps), ...listOf(flow.beforeSteps)]
      .map((id) => messages.get(id))
      .filter((message) => message !== undefined && isString(message.from) && isString(message.to))
      .map((message) => [message.from, message.to]));

    const neighborsOf = (pairs) => {
      const table = new Map();
      const link = (end, other) => table.set(end, new Set([...(table.get(end) ?? []), ...(end === other ? [] : [other])]));
      pairs.forEach(([from, to]) => {
        link(from, to);
        link(to, from);
      });
      return table;
    };

    /** start からたどれる、まだ置いていない端を、たどった数ごとの並びにする(0 番目は start だけ)。 */
    const layersFrom = (start, { neighbors, placed }) => {
      const visit = (frontier, seen, layers) => {
        if (frontier.length === 0) return layers;
        const next = [...new Set(frontier.flatMap((end) => [...neighbors.get(end)]))].filter((end) => !seen.has(end));
        return visit(next, new Set([...seen, ...next]), [...layers, frontier]);
      };
      return visit([start], new Set([...placed, start]), []);
    };

    /**
     * 端ごとの列。起点は、先に出た順で最初の、まだ置いていない端。流れの端は送り手から先に出るので、これは最初の流れの最初の送り手と、
     * 数え直すときの「その端を含む最初の流れの最初の送り手」に当たる。その送り手が置いてある(流れの中に、送り手からたどり着けない
     * 手順がある)ときは、その端から数える。
     */
    const endColumnsOf = ({ order, neighbors }, columnAt) => {
      const start = order.find((end) => !columnAt.has(end));
      if (start === undefined) return columnAt;
      const layers = layersFrom(start, { neighbors, placed: new Set(columnAt.keys()) });
      const placedNow = layers.flatMap((layer, column) => layer.map((end) => [end, column]));
      return endColumnsOf({ order, neighbors }, new Map([...columnAt, ...placedNow]));
    };

    /** 列ごとの端の並び。列 0 は先に出た順、ほかは 1 つ前の列でつながる端の位置の平均(同じなら先に出た順)。 */
    const orderedColumnsOf = ({ columnAt, order, neighbors }) => {
      const count = columnAt.size === 0 ? 0 : Math.max(...columnAt.values()) + 1;
      const columns = Array.from({ length: count }, (_, column) => order.filter((end) => columnAt.get(end) === column));
      return columns.reduce((placed, ends, column) => {
        if (column === 0) return [ends];
        const previous = placed[column - 1];
        const meanOf = (end) => {
          const positions = [...neighbors.get(end)].filter((other) => columnAt.get(other) === column - 1).map((other) => previous.indexOf(other));
          return positions.length === 0 ? Infinity : positions.reduce((sum, position) => sum + position, 0) / positions.length;
        };
        const byMean = (a, b) => meanOf(a) - meanOf(b) || order.indexOf(a) - order.indexOf(b);
        return [...placed, ends.toSorted(byMean)];
      }, []);
    };

    const centerOf = (card) => [card.x + card.width / 2, card.y + card.height / 2];
    /** カードの中心から toward へ向かう線が、カードの縁(pad だけ外)と交わる点。 */
    const rimPointOf = (card, toward, pad) => {
      const [cx, cy] = centerOf(card);
      const dx = toward[0] - cx;
      const dy = toward[1] - cy;
      const t = Math.min((card.width / 2 + pad) / Math.abs(dx || 1e-6), (card.height / 2 + pad) / Math.abs(dy || 1e-6));
      return [cx + dx * t, cy + dy * t];
    };
    const unitOf = (from, to) => {
      const length = Math.hypot(to[0] - from[0], to[1] - from[1]) || 1;
      return [(to[0] - from[0]) / length, (to[1] - from[1]) / length];
    };

    /** 列の違う 2 者のあいだの直線。同じ 2 者のあいだに複数あれば、向きを問わずに横へずらして並べる。 */
    const straightOf = ({ from, to, lane, lanes, isForward }) => {
      const [ca, cb] = [centerOf(from), centerOf(to)];
      const [ux, uy] = unitOf(ca, cb);
      const offset = lanes > 1 ? (lane - (lanes - 1) / 2) * Spread * (isForward ? 1 : -1) : 0;
      const [a, b] = [rimPointOf(from, cb, 8), rimPointOf(to, ca, 8)].map(([x, y]) => [x - uy * offset, y + ux * offset]);
      const side = offset < 0 ? -1 : 1;
      const badge = [(a[0] + b[0]) / 2 - uy * BadgeOffset * side, (a[1] + b[1]) / 2 + ux * BadgeOffset * side];
      return { path: `M${a[0]},${a[1]} L${b[0]},${b[1]}`, tip: b, direction: [ux, uy], badge };
    };

    /**
     * 同じ列の 2 者のあいだの弧。カードの右の辺の、相手の側の端から出て、右へふくらむ。番号の丸は、重なる弧ごとに弧の上の位置を
     * ずらす(ふくらみの差だけでは丸どうしが重なる)。
     */
    const arcOf = ({ from, to, lane, lanes }) => {
      const isDownward = to.y > from.y;
      const rimY = (card, towardBelow) => card.y + card.height * (towardBelow ? 0.82 : 0.18) + (towardBelow ? -1 : 1) * lane * 6;
      const a = [from.x + from.width + 4, rimY(from, isDownward)];
      const b = [to.x + to.width + 4, rimY(to, !isDownward)];
      const control = [from.x + from.width + Bow.base + lane * Bow.step, (a[1] + b[1]) / 2];
      // 弧の上の位置は、上のカードから測る(向きの違う弧どうしでも、丸が上下に分かれる)。
      const fromTop = Math.min(Math.max(0.5 + (lane - (lanes - 1) / 2) * 0.3, 0.2), 0.8);
      const t = isDownward ? fromTop : 1 - fromTop;
      const along = (index) => (1 - t) ** 2 * a[index] + 2 * (1 - t) * t * control[index] + t ** 2 * b[index];
      return { path: `M${a[0]},${a[1]} Q${control[0]},${control[1]} ${b[0]},${b[1]}`, tip: b, direction: unitOf(control, b), badge: [along(0), along(1)] };
    };

    /** 送り手と受け手が同じ手順の輪。カードの右上の角から出て、右の辺へ戻る。 */
    const loopOf = ({ from, lane }) => {
      const reach = Loop + lane * 12;
      const start = [from.x + from.width - 24, from.y];
      const end = [from.x + from.width, from.y + 24];
      const [c1, c2] = [[start[0], start[1] - reach], [end[0] + reach, end[1]]];
      const badge = [(start[0] + 3 * c1[0] + 3 * c2[0] + end[0]) / 8, (start[1] + 3 * c1[1] + 3 * c2[1] + end[1]) / 8];
      return { path: `M${start[0]},${start[1]} C${c1[0]},${c1[1]} ${c2[0]},${c2[1]} ${end[0]},${end[1]}`, tip: end, direction: unitOf(c2, end), badge };
    };

    return Object.freeze({
      Card,
      /**
       * カードを置く。
       * @param flows 解説の流れ(全部)
       * @param messages やりとりの id から解説のやりとりを引く表(`ExplainedMap` の `lookup.messages`)
       * @returns `{width, height, cards}`。cards は `{end, column, row, x, y, width, height}`(end は concepts の path か actors の id)で、
       *   列の順、列の中は上から。列ごとに縦の中ほどへ寄せる
       */
      create: (flows, messages) => {
        const flowPairs = endPairsOf(flows, messages);
        const order = [...new Set(flowPairs.flat(2))];
        const neighbors = neighborsOf(flowPairs.flat());
        const columnAt = endColumnsOf({ order, neighbors }, new Map());
        const columns = orderedColumnsOf({ columnAt, order, neighbors });
        const heightOf = (count) => count * Card.height + Math.max(count - 1, 0) * Gap.row;
        const height = heightOf(Math.max(0, ...columns.map((ends) => ends.length)));
        const cards = columns.flatMap((ends, column) => {
          const top = (height - heightOf(ends.length)) / 2;
          return ends.map((end, row) => ({ end, column, row, x: column * (Card.width + Gap.column), y: top + row * (Card.height + Gap.row), width: Card.width, height: Card.height }));
        });
        return { width: columns.length === 0 ? 0 : columns.length * Card.width + (columns.length - 1) * Gap.column, height, cards };
      },
      /**
       * 今の表示でのカードの出方。
       * @param rows `TraceRows.rowsOf` の行
       * @param entryAt パスから木の項目を引く表(`ExplainedMap` の `entryAt`)。端のファイルを足した(A)・消した(D)かを読む
       * @returns カードに `presence` を足したもの。presence は、足したファイルの変更前だけ / 消したファイルの変更後だけなら
       *   `missingBefore` / `missingAfter`(その側には無い)、そうでなく今の行の矢印に出ない端は `idle`(この操作では使わない)、比べるときの
       *   足した / 消したファイルは `added` / `removed`、ほかは `used`
       */
      cardsIn: (layout, rows, { era, entryAt }) => {
        const drawn = rows.map(TraceRows.drawnSideOf).filter((side) => side !== null && side.message !== null);
        const used = new Set(drawn.flatMap((side) => [side.message.from, side.message.to]));
        const fileStatusOf = (end) => (entryAt.has(end) && entryAt.get(end).changed ? entryAt.get(end).status : null);
        const presenceOf = (end) => {
          const status = fileStatusOf(end);
          if (era === TraceEras.Before && status === "A") return "missingBefore";
          if (era === TraceEras.After && status === "D") return "missingAfter";
          if (!used.has(end)) return "idle";
          if (era === TraceEras.Compare && status === "A") return "added";
          if (era === TraceEras.Compare && status === "D") return "removed";
          return "used";
        };
        return layout.cards.map((card) => ({ ...card, presence: presenceOf(card.end) }));
      },
      /**
       * 行ごとの矢印の道筋。列の違う 2 者は直線、同じ列の 2 者は右へふくらむ弧、送り手と受け手が同じなら輪にする。同じ 2 者の
       * あいだに複数あれば、ずらして並べる。
       * @param rows `TraceRows.rowsOf` の行
       * @returns 行と同じ並びの `{path, tip, direction, badge}`(tip は矢じりの先、direction はその向きの単位ベクトル、badge は
       *   番号の丸の中心)。やりとりが messages に無いか、端のカードが無い行は null
       */
      arrowsOf: (layout, rows) => {
        const cardAt = new Map(layout.cards.map((card) => [card.end, card]));
        const pairKeyOf = (message) => JSON.stringify([message.from, message.to].toSorted());
        const messages = rows.map((row) => TraceRows.drawnSideOf(row)?.message ?? null);
        const isDrawable = (message) => message !== null && cardAt.has(message.from) && cardAt.has(message.to);
        const keys = messages.map((message) => (isDrawable(message) ? pairKeyOf(message) : null));
        return messages.map((message, index) => {
          if (!isDrawable(message)) return null;
          const lane = keys.slice(0, index).filter((key) => key === keys[index]).length;
          const lanes = keys.filter((key) => key === keys[index]).length;
          const [from, to] = [cardAt.get(message.from), cardAt.get(message.to)];
          if (from === to) return loopOf({ from, lane });
          if (from.column === to.column) return arcOf({ from, to, lane, lanes });
          return straightOf({ from, to, lane, lanes, isForward: message.from < message.to });
        });
      },
    });
  })();

  /** DOM に触らない部分(核)。判定表が node の vm で評価して叩く。 */
  const core = Object.freeze({ ExplainedMap, ExplainShape, ImpactTopics, PrimerTopics, CodeSpans, TermMarks, ExcerptRows, TopicScroll, TextSize, ScreenChoice, ReviewCheck, Tokenizer, CommitDiff, FeatureMatrix, GraphLayout, ConnectionSentences, SelectionHistory, Vocabulary, Target, CompareDiagram, TraceRows, TraceLayout });
  if (typeof document === "undefined") {
    globalThis.prExplainCore = core;
    return;
  }

  const Repo = "DIO0550/design-composer";
  const RepoName = Repo.split("/")[1];

  const SvgNamespace = "http://www.w3.org/2000/svg";

  /** 要素の組み立て。中身の文字は textContent で入れ、属性は setAttribute で付ける(HTML として解釈させない)。 */
  const Dom = Object.freeze({
    el: (tag, props, children) => {
      const node = document.createElement(tag);
      for (const [key, value] of Object.entries(props || {})) {
        if (key === "text") node.textContent = value;
        else node.setAttribute(key, value);
      }
      node.append(...(children || []));
      return node;
    },
    /**
     * 解説の文を、文字列と code 要素の並びにする。コードの切れ端(割り方は `CodeSpans`)は code 要素に入れる(どちらも textContent
     * で入れる)。空の文字列は出さない。

    proseParts: (text) => CodeSpans.create(text).map((span) => (span.isCode ? Dom.el("code", { text: span.text }) : span.text)).filter((child) => child !== ""),
    /** 解説の文を要素にする(中身は `proseParts`)。 */
    prose: (tag, props, text) => Dom.el(tag, { ...props, class: Dom.proseClassOf(props) }, Dom.proseParts(text)),
    /** 文を入れる要素のクラス。`.prose` が中の code 要素の見た目を決める。 */
    proseClassOf: (props) => (typeof props.class === "string" ? `${props.class} prose` : "prose"),
    /** SVG の要素。属性は setAttribute で付ける。 */
    svg: (tag, attributes, children) => {
      const node = document.createElementNS(SvgNamespace, tag);
      for (const [key, value] of Object.entries(attributes || {})) node.setAttribute(key, value);
      node.append(...(children || []));
      return node;
    },
  });
  const el = Dom.el;
  const prose = Dom.prose;
  const proseParts = Dom.proseParts;

  /**
   * 用語の印を付けた文を要素にする。印の外の文字と印の表示は、それぞれ `proseParts` で入れる(`` ` `` は印をまたいで対にならない)。
   * @param pieces 用語に解いた文の切れ端(`PrimerTopics` の `gist` などの並び)
   * @param onMark 印の要素(`span.primer-mark`)と、その用語を受け取る
   */
  const markedProseOf = ({ tag, props, pieces, onMark }) => {
    const children = pieces.flatMap((piece) => {
      switch (piece.kind) {

        case "term": {

  /**
   * 読み手のブラウザにだけ残す値。localStorage は使えない環境(保存の無効化・プライベートブラウズ)で
   * 例外を投げるので、ここで受けて「残っていない」「残さない」として扱う。
   */
  const BrowserStore = Object.freeze({
    /** @returns 保存してある値。無い・読めないときは null */
    read: (key) => {
      try {
        const raw = localStorage.getItem(key);
        return raw === null ? null : JSON.parse(raw);
      } catch {
        return null;
      }
    },
    write: (key, value) => {
      try {
        localStorage.setItem(key, JSON.stringify(value));
      } catch {
        // 残せないだけで、いま開いているページでは効いている。
      }
    },
  });

  /** 画面ごとのパネルの既定の幅。左はどの画面にもあり、右は変更の経緯のほかのどの画面にもある。 */
  const PanelLayouts = {
    map: { left: "clamp(224px, 18vw, 264px)", right: "clamp(320px, 28vw, 404px)" },
    story: { left: "clamp(250px, 24vw, 330px)", right: null },
    test: { left: "clamp(260px, 22vw, 320px)", right: "clamp(330px, 30vw, 430px)" },
    impact: { left: "clamp(220px, 18vw, 260px)", right: "clamp(300px, 26vw, 360px)" },
    primer: { left: "clamp(220px, 18vw, 260px)", right: "clamp(300px, 26vw, 360px)" },
    compare: { left: "clamp(220px, 18vw, 260px)", right: "clamp(300px, 26vw, 360px)" },
    trace: { left: "clamp(230px, 20vw, 280px)", right: "clamp(280px, 24vw, 340px)" },
  };

  /** パネルの幅をドラッグで変え、画面ごとに残す。ダブルクリックで既定の幅へ戻す。 */
  const PanelResizer = (() => {
    const MinWidth = 180;
    const MaxWidth = 640;
    const MainMinWidth = 320;

    const columnsOf = (layout, widths) => {
      const widthOf = (side) => (typeof widths[side] === "number" ? `${widths[side]}px` : layout[side]);
      const right = layout.right === null ? [] : [widthOf("right")];
      return [widthOf("left"), "minmax(0, 1fr)", ...right].join(" ");
    };

    const savedWidthsOf = (value) => {
      const isWidths = typeof value === "object" && value !== null;
      return isWidths ? value : {};
    };

    /** つまみを押したところからの移動量で幅を決める。本文の幅を 320px より狭くしない。 */
    const widthDuring = ({ drag, side, event }) => {
      const moved = side === "left" ? event.clientX - drag.x : drag.x - event.clientX;
      const room = drag.gridWidth - drag.otherWidth - MainMinWidth;
      return Math.round(Math.max(MinWidth, Math.min(MaxWidth, room, drag.width + moved)));
    };

    /**
     * @param screen 画面(保存の鍵に使う)
     * @param grid パネルと本文を並べている grid の要素
     * @param panels 幅を変えるパネル(`left` / `right`)
     */
    const attach = ({ screen, grid, panels }) => {
      const storeKey = `prExplain.panels.${screen}`;
      const layout = PanelLayouts[screen];
      let widths = savedWidthsOf(BrowserStore.read(storeKey));
      const apply = () => {
        grid.style.gridTemplateColumns = columnsOf(layout, widths);
      };
      for (const [side, panel] of Object.entries(panels)) {
        const handle = el("div", { class: "resize-handle", title: "ドラッグで幅を変更(ダブルクリックで元に戻す)" }, [el("span", { class: "resize-bar" })]);
        let drag = null;
        handle.addEventListener("pointerdown", (event) => {
          if (event.button !== 0) return;
          event.preventDefault();
          handle.setPointerCapture(event.pointerId);
          handle.classList.add("is-dragging");
          const otherWidth = Object.entries(panels).filter(([other]) => other !== side).reduce((sum, [, other]) => sum + other.getBoundingClientRect().width, 0);
          drag = { x: event.clientX, width: panel.getBoundingClientRect().width, gridWidth: grid.getBoundingClientRect().width, otherWidth };
        });
        handle.addEventListener("pointermove", (event) => {
          if (drag === null) return;
          widths = { ...widths, [side]: widthDuring({ drag, side, event }) };
          apply();
        });
        handle.addEventListener("pointerup", () => {
          if (drag === null) return;
          drag = null;
          handle.classList.remove("is-dragging");
          BrowserStore.write(storeKey, widths);
        });
        handle.addEventListener("dblclick", () => {
          widths = Object.fromEntries(Object.entries(widths).filter(([other]) => other !== side));
          apply();
          BrowserStore.write(storeKey, widths);
        });
        panel.append(handle);
      }
      apply();
    };

    return Object.freeze({ attach });
  })();

  const plus = (count) => `+${count}`;
  const minus = (count) => `−${count}`;
  const shortSha = (sha) => sha.slice(0, 7);
  const dateLabel = (iso) => (typeof iso === "string" ? iso.slice(0, 16).replace("T", " ") : "");

  /** 足した行数と消した行数の組。 */
  const lineCountsOf = (additions, deletions) => [el("span", { class: "add", text: plus(additions) }), el("span", { class: "del", text: minus(deletions) })];
  const countsOf = (total, additions, deletions) => el("span", { class: "counts" }, [el("span", { class: "total", text: total }), ...lineCountsOf(additions, deletions)]);
  /** パネルの見出し。`extra` は右端に並べるもの。 */
  const panelHead = (title, sub, extra = []) => el("div", { class: "panel-head" }, [el("span", { class: "panel-title", text: title }), el("span", { class: "panel-sub", text: sub }), ...extra]);
  const panelOf = (side, children) => el("aside", { class: `panel is-${side}` }, children);
  const emptyOf = (text) => el("p", { class: "empty", text });
  /** 右のパネルの小見出し。`note` は横に添える補足。 */
  const eyebrowOf = (text, note) => el("span", { class: "eyebrow-row" }, [el("span", { class: "eyebrow", text }), ...(note === undefined ? [] : [el("span", { class: "eyebrow-note", text: note })])]);
  /** やりとりの種類の札。 */
  const kindChipOf = (kind) => el("span", { class: "kind", "data-kind": kind, text: Object.hasOwn(Vocabulary.messageKinds, kind) ? Vocabulary.messageKinds[kind].label : kind });

  /** 解説の題と要約。 */
  const ledeOf = (overview, eyebrow) => el("div", { class: "lede" }, [el("span", { class: "eyebrow", text: eyebrow }), prose("h1", {}, overview.title), prose("p", {}, overview.lead)]);

  const DiffViews = {
    diff: { label: "差分", title: "git diff の形で、消えた行と増えた行を並べる", hint: "番号つきの注釈にマウスを乗せると、該当する行が光ります" },
    code: { label: "コード", title: "変更後のコードをそのまま読む。変わった行は左端の線で示す", hint: "変更後のコード。左端の緑線が今回変わった行。注釈にマウスを乗せると該当行が光ります" },
  };
  const ReviewFilters = { all: "すべて", todo: "未確認", done: "確認済み" };
  const MoveKeys = { ArrowDown: 1, j: 1, ArrowUp: -1, k: -1 };
  const OverviewId = "overview";

  const phaseLabelOf = (story) => `${Vocabulary.phases[story.phase] ?? story.phase}：${story.role}`;
  const numberText = (number) => (number === null ? "" : String(number));
  const countsTextOf = (file) => {
    if (file.additions === null) return [el("span", { class: "muted", text: "バイナリ" })];

  };

  /** 確認の印の保存値。読めない値は「印なし」にする。 */
  const savedChecksOf = (value) => new Set(Array.isArray(value) ? value.filter((key) => typeof key === "string") : []);

  /** 押せる要素。`onPress` はクリックで呼ぶ。 */
  const pressable = (tag, props, children, onPress) => {

  /** 機能の表示で選ぶ行の鍵。機能の鍵は `feature:` を頭に付けるので、`OverviewId` とも機能なしの鍵とも重ならない。 */
  const NoFeatureKey = "no-feature";

  const featureNameOf = (row) => (row.feature === null ? "機能なし" : row.feature.label);

  const featureDotOf = (row) => el("span", { class: "feature-dot", "data-feature-hue": row.hue, text: featureNameOf(row) });

  const featureChipOf = (row, onPress) => pressable("button", { class: "feature-chip", "data-feature-hue": row.hue, title: "機能で見る", text: featureNameOf(row) }, [], onPress);

  const commitRowOf = (commit, story) => {
    const isUnexplained = commit.story === null && !commit.merge;
    const concepts = [...new Set(commit.files.map((file) => story.lookup.conceptNames.get(file.path)).filter((name) => name !== undefined))].slice(0, 3);

  /** 振る舞いの 1 行。やりとりを指していれば、種類・名前・送り手 → 受け手のチップを添える。`mark` は行頭の印(無ければ null)。 */

  /**

   * @param cards 前(これまで)と後のカードの `{title, sub, lines, empty}`。`empty` は行が無いときの文(出さないなら null)
   * @param itemOf 1 行を描く。行と、その行のカードを受け取る

  const beforeAfterCardsOf = ({ cards, itemOf }) => el("div", { class: "behaviors" }, cards.map((card, index) => el("div", { class: index === 0 ? "behavior-card" : "behavior-card is-after" }, [

  ])));

  /**
   * 振る舞いの前後のカード 2 枚の節。
   * @param cards 前(これまで)と後のカードの `{title, sub, lines, mark, empty}`。`lines` は振る舞い、`empty` は振る舞いが無いときの文
