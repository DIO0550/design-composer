  };

  const othersOf = (paths) => {
    if (paths.length === 0) return [];
    return [el("details", { class: "others" }, [el("summary", { text: `ほかに ${paths.length} ファイル` }), el("ul", {}, paths.map((path) => el("li", { text: path })))])];
  };

  /** 構造マップの器。層ごとに、箱になるファイルと畳んだファイルを並べる。 */
  const MapScreen = (explained) => {
    const entryAt = new Map(explained.entries.map((entry) => [entry.path, entry]));
    const blocks = explained.groupings.layer.filter((group) => group.treePaths.length > 0).flatMap((group) => [
      el("div", { class: "group-head" }, [el("span", { class: "group-title", text: group.layer }), el("span", { class: "group-role", text: group.role ?? "" })]),
      ...group.treePaths.map((path) => fileRowOf(entryAt.get(path))),
      ...othersOf(group.others),
    ]);
    const boxes = explained.entries.filter((entry) => entry.inGraph).length;
    const groupingLabels = Object.keys(explained.groupings).map((grouping) => (grouping === "layer" ? "層" : "機能"));
    const unmapped = explained.unmappedConcepts.map((concept) => el("div", { class: "file-row" }, [el("span", { class: "status", text: "?" }), el("span", {}, [el("div", { class: "file-name", text: concept.name }), el("div", { class: "row-path", text: concept.path })]), el("span")]));
    return {
      controls: [countsOf(`${explained.totals.files} files`, explained.totals.additions, explained.totals.deletions)],
      left: panelOf("left", [panelHead("ファイル", "層ごと"), el("div", { class: "panel-scroll" }, blocks)]),
      main: stageOf([
        ledeOf(explained, "構造マップ"),
        el("div", { class: "stat-grid" }, [statOf(boxes, "箱にするファイル"), statOf(explained.totals.files, "変更ファイル"), statOf(explained.groupings.layer.length, "層")]),
      ]),
      right: panelOf("right", [
        panelHead("概要", ""),
        el("dl", { class: "facts" }, [el("dt", { text: "まとめ方" }), el("dd", { text: groupingLabels.join(" / ") }), el("dt", { text: "地図に無い concept" }), el("dd", { text: `${explained.unmappedConcepts.length} 件` })]),
        el("div", { class: "panel-scroll" }, unmapped),
      ]),
    };
  };

  const PhaseLabels = { prep: "下ごしらえ", core: "本体", hard: "安定化", review: "指摘の反映", fin: "仕上げ" };
  const MessageKindLabels = { cmd: "コマンド", qry: "クエリ", evt: "イベント" };
  const DiffViews = {
    diff: { label: "差分", title: "git diff の形で、消えた行と増えた行を並べる", hint: "番号つきの注釈にマウスを乗せると、該当する行が光ります" },
    code: { label: "コード", title: "変更後のコードをそのまま読む。変わった行は左端の線で示す", hint: "変更後のコード。左端の緑線が今回変わった行。注釈にマウスを乗せると該当行が光ります" },
  };
  const ReviewFilters = { all: "すべて", todo: "未確認", done: "確認済み" };
  const MoveKeys = { ArrowDown: 1, j: 1, ArrowUp: -1, k: -1 };
  const OverviewId = "overview";

  const phaseLabelOf = (note) => `${PhaseLabels[note.phase] ?? note.phase}：${note.role}`;
  const numberText = (number) => (number === null ? "" : String(number));
  const countsTextOf = (file) => {
    if (file.additions === null) return [el("span", { class: "muted", text: "バイナリ" })];
    return [el("span", { class: "add", text: plus(file.additions) }), " ", el("span", { class: "del", text: minus(file.deletions ?? 0) })];
  };

  /** 確認の印の保存値。読めない値は「印なし」にする。 */
  const savedChecksOf = (value) => new Set(Array.isArray(value) ? value.filter((key) => typeof key === "string") : []);

  /** 押せる要素。`onPress` はクリックで呼ぶ。 */
  const pressable = (tag, props, children, onPress) => {
    const node = el(tag, tag === "button" ? { type: "button", ...props } : props, children);
    node.addEventListener("click", onPress);
    return node;
  };

  const commitRowOf = (commit, story) => {
    const isUnexplained = commit.note === null && !commit.merge;
    const concepts = [...new Set(commit.files.map((file) => story.lookup.conceptNames.get(file.path)).filter((name) => name !== undefined))].slice(0, 3);
    const tags = [
      commit.merge ? el("span", { class: "tag", text: "マージ" }) : null,
      isUnexplained ? el("span", { class: "tag is-warn", text: "解説なし" }) : null,
      ...concepts.map((name) => el("span", { class: "tag", text: name })),
    ].filter((tag) => tag !== null);
    return pressable("button", { class: "commit-row plain-button" }, [
      el("div", { class: "commit-rail" }, [el("span", { class: "commit-dot" })]),
      el("div", { class: "commit-body" }, [
        el("span", { class: "row-title", text: commit.subject ?? shortSha(commit.sha) }),
        el("div", { class: "row-meta" }, [el("span", { class: "sha", text: shortSha(commit.sha) }), el("span", { text: dateLabel(commit.date) }), el("span", { class: "add", text: plus(commit.additions) }), el("span", { class: "del", text: minus(commit.deletions) })]),
        el("div", { class: "tags" }, tags),
      ]),
    ], () => story.actions.select(commit.sha));
  };

  const behaviorCardOf = ({ title, sub, behaviors, isAfter, mark }) => el("div", { class: isAfter ? "behavior-card is-after" : "behavior-card" }, [
    el("span", { class: "card-head" }, [el("span", { class: "card-title", text: title }), el("span", { class: "muted", text: sub })]),
    ...behaviors.map((behavior) => el("div", { class: "behavior" }, [el("span", { class: "mark", text: mark }), prose("span", {}, behavior.text)])),
  ]);

  /** 変更の順番の 1 段。解説があれば役割と理由も出す。 */
  const orderStepOf = (commit, story) => {
    const note = commit.note;
    const explained = note === null ? [] : [el("span", { class: "order-role", "data-phase": note.phase, text: phaseLabelOf(note) })];
    const why = note === null ? [] : [prose("span", { class: "order-why" }, note.why)];
    return pressable("button", { class: "order-step plain-button" }, [
      el("div", { class: "order-rail" }, [el("span", { class: "order-num", text: String(story.steps.get(commit.sha)) })]),
      el("div", { class: "order-body" }, [
        ...explained,
        el("span", { class: "order-subject", text: commit.subject ?? shortSha(commit.sha) }),
        ...why,
        el("span", { class: "order-meta", text: `${shortSha(commit.sha)} · ${commit.files.length} ファイル` }),
      ]),
    ], () => story.actions.select(commit.sha));
  };

  const orderOf = (story, eyebrow) => el("div", { class: "section" }, [
    el("span", { class: "eyebrow", text: eyebrow }),
    el("div", { class: "order" }, story.commits.filter((commit) => !commit.merge).map((commit) => orderStepOf(commit, story))),
  ]);

  /** 確認の印を付けられるレビューの文。`go` を渡すと、そのコミットへ移るボタンを添える。 */
  const reviewCardOf = ({ text, isChecked, onToggle, go }) => {
    const goButton = go === null ? [] : [pressable("button", { class: "review-go plain-button", text: `${go.label} →` }, [], (event) => {
      event.stopPropagation();
      go.onPress();
    })];
    const card = el("div", { class: isChecked ? "review-card is-checked" : "review-card", role: "checkbox", "aria-checked": String(isChecked), tabindex: "0", title: isChecked ? "未確認に戻す" : "確認済みにする" }, [
      el("span", { class: "check-box" }),
      el("div", { class: "review-body" }, [prose("span", { class: "review-text" }, text), ...goButton]),
    ]);
    card.addEventListener("click", onToggle);
    card.addEventListener("keydown", (event) => {
      const isActivationKey = event.key === " " || event.key === "Enter";
      if (!isActivationKey) return;
      event.preventDefault();
      onToggle();
    });
    return card;
  };

  /** ブランチ全体のレビューの文。古いコミットから順に、コミットごとの書いた順で並べる。 */
  const reviewItemsOf = (story) => story.commits.flatMap((commit) => {
    const hasReview = commit.note !== null && Array.isArray(commit.note.review);
    const texts = hasReview ? commit.note.review : [];
    return texts.map((text) => ({ key: ReviewMark.keyOf(commit.sha, text), text, commit }));
  });

  const matchesFilter = (filter, isChecked) => {
    switch (filter) {
      case "all":
        return true;
      case "todo":
        return !isChecked;
      case "done":
        return isChecked;
    }
  };

  const reviewSectionOf = (story) => {
    const items = reviewItemsOf(story);
    if (items.length === 0) return [];
    const { checked, filter } = story.state;
    const counts = { all: items.length, done: items.filter((item) => checked.has(item.key)).length };
    const countOf = { ...counts, todo: counts.all - counts.done };
    const filters = Object.entries(ReviewFilters).map(([key, label]) => pressable("button", { "aria-pressed": String(filter === key) }, [label, el("span", { class: "n", text: String(countOf[key]) })], () => story.actions.setFilter(key)));
    const shown = items.filter((item) => matchesFilter(filter, checked.has(item.key)));
    const cards = shown.map((item) => reviewCardOf({
      text: item.text,
      isChecked: checked.has(item.key),
      onToggle: () => story.actions.toggleCheck(item.key),
      go: { label: `${story.steps.get(item.commit.sha)}. ${item.commit.subject ?? shortSha(item.commit.sha)}`, onPress: () => story.actions.select(item.commit.sha) },
    }));
    const empty = shown.length > 0 ? [] : [el("span", { class: "review-count", text: filter === "done" ? "まだ確認済みのものはありません。" : "すべて確認済みです。" })];
    return [el("div", { class: "section" }, [
      el("div", { class: "section-head" }, [
        el("span", { class: "eyebrow", text: "レビューポイント" }),
        el("span", { class: "review-count" }, ["確認済み ", el("b", { text: String(counts.done) }), ` / ${counts.all}`]),
        el("span", { class: "spacer" }),
        el("div", { class: "toggle-group" }, filters),
      ]),
      ...cards,
      ...empty,
    ])];
  };

  const strayNotesOf = (explained) => {
    if (explained.strayNotes.length === 0) return [];
    return [el("div", { class: "section" }, [
      el("span", { class: "eyebrow", text: `地図に無い解説(${explained.strayNotes.length})` }),
      ...explained.strayNotes.map((note) => el("div", { class: "row" }, [prose("span", { class: "row-title" }, note.role), el("span", { class: "row-meta" }, [el("span", { class: "sha", text: shortSha(note.sha) })])])),
    ])];
  };

  /** ブランチ全体の流れ。解説が無ければ、案内とコミットの件名だけの順番を出す。 */
  const storyOverviewOf = (story) => {
    const { explained, explain } = story;
    if (explain === null) {
      const guide = el("div", { class: "lede" }, [el("span", { class: "eyebrow", text: "ブランチ全体の流れ" }), emptyOf("解説はありません。変更の地図だけで組んでいます。左のコミットを選ぶと、件名・本文と差分を読めます。")]);
      return [guide, orderOf(story, "変更の順番")];
    }
    const lede = ledeOf(explained, "ブランチ全体の流れ");
    const behaviors = el("div", { class: "section" }, [
      el("span", { class: "eyebrow", text: "振る舞いの変化(ブランチ全体)" }),
      el("div", { class: "behaviors" }, [
        behaviorCardOf({ title: "これまで", sub: explained.map.baseBranch ?? "", behaviors: explain.overview.before, isAfter: false, mark: "—" }),
        behaviorCardOf({ title: "このブランチのあと", sub: explained.map.headBranch ?? "", behaviors: explain.overview.after, isAfter: true, mark: "+" }),
      ]),
    ]);
    return [lede, behaviors, orderOf(story, "変更の順番と、それぞれの役割"), ...reviewSectionOf(story), ...strayNotesOf(explained)];
  };

  const commitHeadOf = (commit, story) => {
    const index = story.commits.indexOf(commit);
    const older = index > 0 ? story.commits[index - 1].sha : OverviewId;
    const newer = index < story.commits.length - 1 ? story.commits[index + 1].sha : null;
    const total = story.steps.size;
    const stepText = commit.merge ? "マージ" : `${story.steps.get(commit.sha)} / ${total}`;
    const step = commit.note === null ? [el("span", { text: stepText })] : [el("span", { "data-phase": commit.note.phase, text: `${stepText} · ${phaseLabelOf(commit.note)}` })];
    const newerButton = pressable("button", { text: "次の変更 →" }, [], () => story.actions.select(newer));
    if (newer === null) newerButton.disabled = true;
    const message = commit.body ? [el("pre", { class: "commit-message", text: commit.body })] : [];
    return el("div", { class: "commit-head" }, [
      el("div", { class: "commit-facts" }, [
        el("span", { class: "sha-chip", text: shortSha(commit.sha) }),
        el("span", { text: commit.author ?? "" }),
        el("span", { class: "muted", text: dateLabel(commit.date) }),
        el("span", { class: "mono" }, [el("span", { class: "add", text: plus(commit.additions) }), " ", el("span", { class: "del", text: minus(commit.deletions) })]),
        el("span", { class: "muted", text: `${commit.files.length} ファイル` }),
        el("span", { class: "spacer" }),
        el("span", { class: "step-buttons" }, [pressable("button", { text: "← 前の変更" }, [], () => story.actions.select(older)), newerButton]),
      ]),
      el("div", { class: "commit-step" }, step),
      el("h1", { text: commit.subject ?? shortSha(commit.sha) }),
      ...message,
    ]);
  };

  /** 振る舞いの 1 行。やりとりを指していれば、種類・名前・送り手 → 受け手を添える。 */
  const behaviorItemOf = (behavior, story) => {
    const message = typeof behavior.message === "string" ? story.lookup.messages.get(behavior.message) : undefined;
    const nameOf = (path) => story.lookup.conceptNames.get(path) ?? path;
    const chip = message === undefined ? [] : [el("span", { class: "message-chip" }, [
      el("span", { class: "kind", "data-kind": message.kind, text: MessageKindLabels[message.kind] ?? message.kind }),
      el("span", { class: "message-name", text: message.name }),
      el("span", { class: "message-route", text: `${nameOf(message.from)} → ${nameOf(message.to)}` }),
    ])];
    return el("div", { class: "behavior-item" }, [prose("span", {}, behavior.text), ...chip]);
  };

  const commitBehaviorsOf = (note, story) => {
    const before = Array.isArray(note.before) ? note.before : [];
    const after = Array.isArray(note.after) ? note.after : [];
    if (before.length + after.length === 0) return [];
    const beforeItems = before.length === 0 ? [el("span", { class: "behavior-none", text: "(新しく足しただけで、変わる振る舞いはない)" })] : before.map((behavior) => behaviorItemOf(behavior, story));
    return [el("div", { class: "section" }, [
      el("span", { class: "eyebrow", text: "何の振る舞いが変わったか" }),
      el("div", { class: "behaviors" }, [
        el("div", { class: "behavior-card is-commit" }, [el("span", { class: "card-title", text: "これまで" }), ...beforeItems]),
        el("div", { class: "behavior-card is-commit is-after" }, [el("span", { class: "card-title", text: "この変更のあと" }), ...after.map((behavior) => behaviorItemOf(behavior, story))]),
      ]),
    ])];
  };

  /** コミットの解説(なぜ・影響する操作・レビューで見るところ・振る舞いの前後)。 */
  const commitNoteOf = (commit, story) => {
    const note = commit.note;
    const flows = (Array.isArray(note.flows) ? note.flows : []).map((id) => story.lookup.flows.get(id)).filter((flow) => flow !== undefined);
    const flowChips = flows.length === 0 ? [] : [el("div", { class: "flow-chips" }, [
      el("span", { class: "label", text: "影響する操作" }),
      ...flows.map((flow) => el("a", { class: "flow-chip", href: "#map", title: "構造マップで見る" }, [flow.label, el("span", { class: "arrow", text: "↗" })])),
    ])];
    const review = Array.isArray(note.review) ? note.review : [];
    const reviewBlock = review.length === 0 ? [] : [el("div", { class: "section" }, [
      el("span", { class: "eyebrow", text: "レビューで見るところ" }),
      ...review.map((text) => {
        const key = ReviewMark.keyOf(commit.sha, text);
        return reviewCardOf({ text, isChecked: story.state.checked.has(key), onToggle: () => story.actions.toggleCheck(key), go: null });
      }),
    ])];
    return [
      el("div", { class: "why-grid" }, [el("div", { class: "section" }, [el("span", { class: "eyebrow", text: "なぜこの変更?" }), prose("p", { class: "why-text" }, note.why), ...flowChips]), ...reviewBlock]),
      ...commitBehaviorsOf(note, story),
    ];
  };

  const unexplainedCommitOf = (commit) => {
    if (commit.merge) return [];
    const reason = commit.afterExplained ? "このコミットは解説を書いた後に積まれたので、解説がありません。" : "このコミットには解説がありません。";
    return [emptyOf(`${reason}件名・本文と差分だけを出します。`)];
  };

  const lineRangeOf = (note) => {
    const lines = note.start === note.end ? `${note.start} 行目` : `${note.start}〜${note.end} 行目`;
    return note.side === "old" ? `${lines}(変更前)` : lines;
  };

  /** 光らせる行を持たない注釈(差分に出ていない行・消したファイル・地図に無いパス)。 */
  const plainNoteOf = (note, where) => el("div", { class: "note" }, [
    el("span", { class: "note-badge", text: String(note.n ?? "·") }),
    el("div", { class: "note-body" }, [el("span", { class: "note-lines", text: where }), prose("span", { class: "note-text" }, note.text)]),
  ]);

  /** 行に付いた注釈のカード。載せる(フォーカスする)と、カードと `targets`(行と番号)を光らせる。 */
  const litNoteOf = (note, targets) => {
    const card = el("div", { class: "note", tabindex: "0" }, [el("span", { class: "note-badge", text: String(note.n) }), prose("span", { class: "note-text" }, note.text)]);
    const light = (isLit) => () => {
      for (const target of [card, ...targets]) target.classList.toggle("is-lit", isLit);
    };
    card.addEventListener("mouseenter", light(true));
    card.addEventListener("mouseleave", light(false));
    card.addEventListener("focus", light(true));
    card.addEventListener("blur", light(false));
    return card;
  };

  /** 1 行のコードを色分けした字句にする。 */
  const codeTextOf = (text, grammar, carry) => {
    if (grammar === null) return { node: el("span", { class: "code-text", text }), carry };
    const result = Highlighter.tokenizeLine(text, grammar, carry);
    const tokens = result.tokens.map((token) => (token.cls === null ? token.value : el("span", { class: token.cls, text: token.value })));
    return { node: el("span", { class: "code-text" }, tokens), carry: result.carry };
  };

  /**
   * hunk の行を色分けする。行をまたぐ文字列・コメントの持ち越しは、変更前(消した行)と変更後(足した行)で分けて持つ。
   * @returns 行ごとの code-text の要素(`hunk.lines` と同じ順)
   */
  const highlightedLinesOf = (lines, grammar) => {
    let carries = { old: Highlighter.Start, new: Highlighter.Start };
    return lines.map((line) => {
      const stream = line.sign === "-" ? "old" : "new";
      const { node, carry } = codeTextOf(line.text, grammar, carries[stream]);
      carries = line.sign === " " ? { old: carry, new: carry } : { ...carries, [stream]: carry };
      return node;
    });
  };

  const rowLinesOf = (row) => (row.kind === "gap" ? row.lines : [row.line]);

  // コードの表示の左端の線は、足した行のうち空でないものに引き、続く行どうしをつなげる。
  const hasBar = (row) => row !== undefined && row.kind === "line" && row.line.sign === "+" && row.line.text.trim() !== "";
  const barClassOf = (rows, index) => {
    if (!hasBar(rows[index])) return "bar";
    const start = hasBar(rows[index - 1]) ? "" : " is-start";
    const end = hasBar(rows[index + 1]) ? "" : " is-end";
    return `bar is-on${start}${end}`;
  };

  const diffRowOf = ({ row, text, markers }) => el("div", { class: "code-line", "data-sign": row.line.sign }, [
    el("span", { class: "ln", text: numberText(row.line.oldNo) }),
    el("span", { class: "ln", text: numberText(row.line.newNo) }),
    el("span", { class: "marks" }, markers),
    el("span", { class: "sign", text: row.line.sign === " " ? "" : row.line.sign }),
    text,
  ]);

  const codeRowOf = ({ row, text, markers, bar }) => {
    if (row.kind === "gap") return el("div", { class: "code-line is-gap" }, [el("span", { class: "ln" }), el("span", { class: "marks" }, markers), el("span", { class: "bar" }), el("span", { class: "code-text tok-com", text: `⋯ ここにあった ${row.lines.length} 行を削除` })]);
    return el("div", { class: "code-line", "data-sign": row.line.sign }, [el("span", { class: "ln", text: numberText(row.line.newNo) }), el("span", { class: "marks" }, markers), el("span", { class: bar }), text]);
  };

  /** hunk の見出しと、行・注釈。注釈の番号は、その注釈の範囲に入る最初の行に付ける。 */
  const hunkOf = (hunk, { grammar, view }) => {
    const isCode = view === "code";
    const texts = highlightedLinesOf(hunk.lines, grammar);
    const textOf = new Map(hunk.lines.map((line, index) => [line, texts[index]]));
    const rows = isCode ? CommitDiff.codeRowsOf(hunk) : hunk.lines.map((line) => ({ kind: "line", line }));
    const coveredBy = rows.map((row) => hunk.notes.filter((note) => rowLinesOf(row).some((line) => CommitDiff.covers(note, line))));
    const markerOf = new Map(hunk.notes.map((note) => [note, el("span", { class: "marker", text: String(note.n) })]));
    const rowNodes = rows.map((row, index) => {
      const markers = hunk.notes.filter((note) => coveredBy.findIndex((notes) => notes.includes(note)) === index).map((note) => markerOf.get(note));
      const text = row.kind === "gap" ? null : textOf.get(row.line);
      return isCode ? codeRowOf({ row, text, markers, bar: barClassOf(rows, index) }) : diffRowOf({ row, text, markers });
    });
    const litTargetsOf = (note) => [...rowNodes.filter((node, index) => coveredBy[index].includes(note)), markerOf.get(note)];
    const firstNew = hunk.lines.find((line) => line.newNo !== null);
    const header = isCode ? (firstNew === undefined ? "" : `${firstNew.newNo} 行目から`) : hunk.header;
    const notes = hunk.notes.length === 0 ? [] : [el("div", { class: "hunk-notes" }, hunk.notes.map((note) => litNoteOf(note, litTargetsOf(note))))];
    return [el("div", { class: "hunk-head", text: header }), el("div", { class: "hunk" }, [el("div", { class: isCode ? "hunk-code is-code" : "hunk-code" }, rowNodes), ...notes])];
  };

  /** ファイルの中身。patch の値ごとに出し方を変える。 */
  const fileBodyOf = (file, context) => {
    const body = file.body;
    switch (body.kind) {
      case "hunks": {
        const more = body.remaining > 0 ? [el("div", { class: "file-more" }, [el("a", { href: context.commitUrl, text: `残り ${body.remaining} 行は GitHub で` })])] : [];
        return [...body.hunks.flatMap((hunk) => hunkOf(hunk, context)), ...more];
      }
      case "unchanged":
        return [el("div", { class: "file-omit", text: "中身の変更なし" })];
      case "deleted": {
        const text = body.lines === null ? "ファイルごと削除" : `ファイルごと削除(${body.lines} 行)`;
        const notes = body.notes.length === 0 ? [] : [el("div", { class: "file-notes" }, body.notes.map((note) => plainNoteOf(note, lineRangeOf(note))))];
        return [el("div", { class: "file-omit is-deleted", text }), ...notes];
      }
      case "binary":
        return [el("div", { class: "file-omit", text: "バイナリのため差分は出しません" })];
    }
  };

  const fileCardOf = (file, context) => {
    const conceptName = context.lookup.conceptNames.get(file.path);
    const unplaced = file.unplaced.length === 0 ? [] : [el("div", { class: "file-notes" }, [
      el("span", { class: "file-notes-title", text: "差分に出ていない行への注釈" }),
      ...file.unplaced.map((note) => plainNoteOf(note, lineRangeOf(note))),
    ])];
    const card = el("details", { class: "file-card", "data-status": file.status }, [
      el("summary", {}, [
        el("span", { class: "chev" }),
        el("span", { class: "status", "data-status": file.status, text: file.status }),
        el("span", { class: "file-path", title: file.path, text: file.oldPath === null ? file.path : `${file.oldPath} → ${file.path}` }),
        ...(conceptName === undefined ? [] : [el("span", { class: "concept-chip", text: conceptName })]),
        el("span", { class: "spacer" }),
        el("span", { class: "file-counts" }, countsTextOf(file)),
      ]),
      ...fileBodyOf(file, context),
      ...unplaced,
    ]);
    const key = `${context.sha}:${file.path}`;
    card.open = !context.closed.has(key);
    card.addEventListener("toggle", () => context.setOpen(key, card.open));
    return card;
  };

  /** 実際のコード。差分 / コードの切り替え、すべて開閉、ファイルのカードと、そのコミットに無いパスへの注釈。 */
  const codeSectionOf = (commit, story) => {
    const { view, closed } = story.state;
    const eyebrow = el("span", { class: "eyebrow", text: "実際のコード" });
    const diff = CommitDiff.of(commit, commit.note);
    const strays = diff.strayNotes.length === 0 ? [] : [el("div", { class: "file-notes" }, [
      el("span", { class: "file-notes-title", text: `地図に無いパスへの注釈(${diff.strayNotes.length})` }),
      ...diff.strayNotes.map((note) => plainNoteOf(note, `${note.path} ${lineRangeOf(note)}`)),
    ])];
    if (commit.merge) return el("div", { class: "section" }, [eyebrow, emptyOf("マージコミットなので、差分は出しません。"), ...strays]);
    const context = { view, closed, sha: commit.sha, lookup: story.lookup, commitUrl: `https://github.com/${Repo}/commit/${commit.sha}`, setOpen: story.actions.setOpen };
    const cards = diff.files.map((file) => fileCardOf(file, { ...context, grammar: Highlighter.grammarOf(file.path) }));
    const openAll = (isOpen) => () => {
      for (const card of cards) card.open = isOpen;
    };
    const views = Object.entries(DiffViews).map(([key, choice]) => pressable("button", { "aria-pressed": String(view === key), title: choice.title, text: choice.label }, [], () => story.actions.setView(key)));
    return el("div", { class: "section" }, [
      el("div", { class: "code-head" }, [
        eyebrow,
        el("div", { class: "toggle-group" }, views),
        el("span", { class: "hint", text: DiffViews[view].hint }),
        el("span", { class: "spacer" }),
        pressable("button", { class: "text-button plain-button", text: "すべて開く" }, [], openAll(true)),
        pressable("button", { class: "text-button plain-button", text: "すべて閉じる" }, [], openAll(false)),
      ]),
      ...cards,
      ...strays,
    ]);
  };

  const commitViewOf = (commit, story) => [
    commitHeadOf(commit, story),
    ...(commit.note === null ? unexplainedCommitOf(commit) : commitNoteOf(commit, story)),
    codeSectionOf(commit, story),
  ];

  /** 解説から、ページが名前で引く一覧。 */
  const lookupOf = (explain) => {
    const listOf = (key) => (explain !== null && Array.isArray(explain[key]) ? explain[key] : []);
    return {
      conceptNames: new Map(listOf("concepts").map((concept) => [concept.path, concept.name])),
      flows: new Map(listOf("flows").map((flow) => [flow.id, flow])),
      messages: new Map(listOf("messages").map((message) => [message.id, message])),
    };
  };

  /** 変更の経緯。左にコミットを新しい順に並べ、右に全体の流れか、選んだコミットの説明と差分を出す。 */
  const StoryScreen = (explained) => {
    const explain = explained.explain.kind === "explained" ? explained.explain.explain : null;
    const commits = explained.commits;
    const checkedKey = `prExplain.${explained.map.pr}.checked`;
    const fixed = { explained, explain, commits, lookup: lookupOf(explain), steps: new Map(commits.filter((commit) => !commit.merge).map((commit, index) => [commit.sha, index + 1])) };
    const commitAt = new Map(commits.map((commit) => [commit.sha, commit]));
    const order = [OverviewId, ...commits.toReversed().map((commit) => commit.sha)];
    let state = { selected: OverviewId, view: "diff", filter: "all", checked: savedChecksOf(BrowserStore.read(checkedKey)), closed: new Set() };
    const body = el("div", { class: "stage-body" });
    const main = el("main", { class: "stage" }, [body]);
    const rows = new Map();

    const render = () => {
      const story = { ...fixed, state, actions };
      const isOverview = state.selected === OverviewId;
      body.replaceChildren(...(isOverview ? storyOverviewOf(story) : commitViewOf(commitAt.get(state.selected), story)));
      for (const [id, row] of rows) row.classList.toggle("is-current", id === state.selected);
    };
    const update = (change) => {
      state = { ...state, ...change };
      render();
    };
    const withToggled = (set, key, isMember) => new Set(isMember ? [...set, key] : [...set].filter((member) => member !== key));
    const actions = {
      select: (id) => {
        update({ selected: id });
        main.scrollTop = 0;
        rows.get(id).scrollIntoView({ block: "nearest" });
      },
      toggleCheck: (key) => {
        const checked = withToggled(state.checked, key, !state.checked.has(key));
        BrowserStore.write(checkedKey, [...checked]);
        update({ checked });
      },
      setFilter: (filter) => update({ filter }),
      setView: (view) => update({ view }),
      // 開閉は details が持っているので描き直さない。差分 / コードを切り替えたときに引き継ぐためだけに覚える。
      setOpen: (key, isOpen) => {
        state = { ...state, closed: withToggled(state.closed, key, !isOpen) };
      },
    };

    const story = { ...fixed, state, actions };
    rows.set(OverviewId, pressable("button", { class: "row overview-row plain-button" }, [el("span", { class: "row-title", text: "ブランチ全体の流れ" }), el("span", { class: "row-sub", text: "なぜ・何がこの順番で変わったか" })], () => actions.select(OverviewId)));
    for (const commit of commits.toReversed()) rows.set(commit.sha, commitRowOf(commit, story));
    render();

    /** ↑ ↓ / j k で左の並びを 1 つずつ移る。入力欄の中と、修飾キーを押しているときは移らない。 */
    const onKey = (event) => {
      const isTyping = event.target instanceof Element && event.target.closest("input, textarea, select, [contenteditable]") !== null;
      const hasModifier = event.metaKey || event.ctrlKey || event.altKey;
      const step = Object.hasOwn(MoveKeys, event.key) ? MoveKeys[event.key] : 0;
      const isMove = step !== 0 && !isTyping && !hasModifier;
      if (!isMove) return;
      event.preventDefault();
      const next = Math.max(0, Math.min(order.length - 1, order.indexOf(state.selected) + step));
      actions.select(order[next]);
    };

    const overviewRow = rows.get(OverviewId);
    const commitRows = commits.toReversed().map((commit) => rows.get(commit.sha));
    return {
      controls: [countsOf(`${explained.totals.commits} commits`, explained.totals.commitLines.additions, explained.totals.commitLines.deletions), el("span", { class: "hint", text: "↑ ↓ でコミットを移動" })],
      left: panelOf("left", [panelHead("コミット", "新しい順"), el("div", { class: "panel-scroll" }, [overviewRow, el("div", { class: "commit-list" }, commitRows)])]),
      main,
      right: null,
      onKey,
      /** 他の画面から、そのコミットを選んだ状態にする。地図に無い sha なら全体の流れを出す。 */
      select: (sha) => actions.select(commitAt.has(sha) ? sha : OverviewId),
    };
  };

  /** 図の中の位置と大きさを要素に付ける。 */
  const placedAt = (node, rect) => {
    Object.assign(node.style, { left: `${rect.x}px`, top: `${rect.y}px`, width: `${rect.width}px`, height: `${rect.height}px` });
    return node;
  };

  /** 真のものだけをクラスに足す。 */
  const classesOf = (base, flags) => [base, ...Object.entries(flags).filter(([, isOn]) => isOn).map(([name]) => name)].join(" ");

  /**
   * 箱の図を載せるキャンバス。4px 動かしてからのドラッグで動かし、ホイールと −/+ で 0.2〜2.5 倍に拡大縮小し、
   * 全体表示で収める。キャンバスの大きさが変わったときと、書体を読み込んだあと(読み手が動かしていなければ)にも
   * 収め直す。
   */
  const GraphView = (() => {
    const MinScale = 0.2;
    const MaxScale = 2.5;
    const MaxFitScale = 1.05;
    const ZoomStep = 1.2;
    const WheelRate = 0.0015;
    const DragThreshold = 4;
    const FitMargin = 24;
    const MinFreeHeight = 80;
    const ResizeSettle = 30;
    const clampScale = (scale) => Math.min(MaxScale, Math.max(MinScale, scale));

    /**
     * @param top 図の上に重ねるもの
     * @param legend 図の下に重ねる凡例
     * @param onBackground 何も無いところを押したときに呼ぶ
     * @param onFirstFit 初めて収めたときに、そのときの縮尺で呼ぶ
     * @returns キャンバスの要素(`element`)と、図の中身を差し替える `show`
     */
    const create = ({ top, legend, onBackground, onFirstFit }) => {
      const world = el("div", { class: "graph-world" });
      const percent = el("span", { class: "zoom-percent", text: "100%" });
      const empty = el("div", { class: "graph-empty", text: "図に出す箱がありません", hidden: "" });
      const topOverlay = el("div", { class: "graph-overlay is-top" }, top);
      const zoomControls = el("div", { class: "zoom-controls" });
      const bottomOverlay = el("div", { class: "graph-overlay is-bottom" }, [...legend, zoomControls]);
      const canvas = el("main", { class: "graph-canvas" }, [world, empty, topOverlay, bottomOverlay]);
      let state = { view: { scale: 1, x: 0, y: 0 }, size: { width: 0, height: 0 }, signature: null, fitted: false, userMoved: false, box: null, measured: null, suppressClick: false };

      const moveTo = (view, animate) => {
        state = { ...state, view };
        world.classList.toggle("is-animated", animate);
        world.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.scale})`;
        percent.textContent = `${Math.round(view.scale * 100)}%`;
      };

      /** `center`(キャンバスの中の点)の下にあるものを動かさずに拡大縮小する。 */
      const zoomAround = (scale, center, animate) => {
        const { view } = state;
        const next = clampScale(scale);
        moveTo({ scale: next, x: center.x - ((center.x - view.x) * next) / view.scale, y: center.y - ((center.y - view.y) * next) / view.scale }, animate);
      };

      /**
       * 図を上下の重ねもののあいだに収める。1.05 倍より大きくはしない。
       * @returns 収めた縮尺。キャンバスが隠れている・図が空で測れなければ null
       */
      const fit = (animate) => {
        const rect = canvas.getBoundingClientRect();
        const isMeasurable = rect.width > 0 && rect.height > 0 && state.size.width > 0;
        if (!isMeasurable) return null;
        const topEdge = topOverlay.getBoundingClientRect().bottom - rect.top + FitMargin;
        const bottomEdge = rect.bottom - bottomOverlay.getBoundingClientRect().top + FitMargin;
        const free = Math.max(MinFreeHeight, rect.height - topEdge - bottomEdge);
        const { width, height } = state.size;
        const scale = clampScale(Math.min(MaxFitScale, (rect.width - FitMargin * 2) / width, free / height));
        moveTo({ scale, x: (rect.width - width * scale) / 2, y: topEdge + (free - height * scale) / 2 }, animate);
        return scale;
      };

      /** 収め直して、読み手が動かした印を消す。初めて収めたときは `onFirstFit` を呼ぶ。 */
      const refit = (animate) => {
        const scale = fit(animate);
        if (scale === null) return;
        const isFirst = !state.fitted;
        state = { ...state, fitted: true, userMoved: false };
        if (isFirst) onFirstFit(scale);
      };

      const onResize = () => {
        const rect = canvas.getBoundingClientRect();
        const isHidden = rect.width === 0 || rect.height === 0;
        if (isHidden) return;
        const box = `${Math.round(rect.width)}x${Math.round(rect.height)}`;
        const measured = `${box}|${Math.round(topOverlay.offsetHeight)}|${Math.round(bottomOverlay.offsetHeight)}`;
        const isUnchanged = measured === state.measured;
        // 読み手が動かした後は、重ねものの高さが変わっただけなら収め直さない。キャンバスの大きさが変われば収め直す。
        const keepsUserView = state.userMoved && box === state.box;
        const keepsView = state.fitted && (isUnchanged || keepsUserView);
        state = { ...state, box, measured };
        if (!keepsView) refit(false);
      };

      const zoomBy = (factor) => {
        const rect = canvas.getBoundingClientRect();
        state = { ...state, userMoved: true };
        zoomAround(state.view.scale * factor, { x: rect.width / 2, y: rect.height / 2 }, true);
      };
      zoomControls.append(
        pressable("button", { class: "is-step", title: "縮小", text: "−" }, [], () => zoomBy(1 / ZoomStep)),
        percent,
        pressable("button", { class: "is-step", title: "拡大", text: "+" }, [], () => zoomBy(ZoomStep)),
        el("span", { class: "zoom-sep" }),
        pressable("button", { text: "全体表示" }, [], () => refit(true)),
      );

      canvas.addEventListener("wheel", (event) => {
        event.preventDefault();
        const rect = canvas.getBoundingClientRect();
        state = { ...state, userMoved: true };
        zoomAround(state.view.scale * Math.exp(-event.deltaY * WheelRate), { x: event.clientX - rect.left, y: event.clientY - rect.top }, false);
      }, { passive: false });

      canvas.addEventListener("pointerdown", (event) => {
        const isPan = event.button === 0 && event.target.closest("button") === null;
        if (!isPan) return;
        const start = { x: event.clientX, y: event.clientY, view: state.view };
        let isMoving = false;
        const onMove = (move) => {
          const dx = move.clientX - start.x;
          const dy = move.clientY - start.y;
          const isStill = !isMoving && Math.hypot(dx, dy) < DragThreshold;
          if (isStill) return;
          isMoving = true;
          canvas.classList.add("is-dragging");
          state = { ...state, userMoved: true };
          moveTo({ ...start.view, x: start.view.x + dx, y: start.view.y + dy }, false);
        };
        const onUp = () => {
          window.removeEventListener("pointermove", onMove);
          window.removeEventListener("pointerup", onUp);
          if (!isMoving) return;
          canvas.classList.remove("is-dragging");
          // 離した直後の click はドラッグの終わりで、箱や線を押したのではない。
          state = { ...state, suppressClick: true };
          setTimeout(() => {

      const texts = shown.map((message) => {
        const isReversed = view.model.layout.unitOf.get(message.from) !== look.edge.from;
        return `${isReversed ? "↩ " : ""}${messageNameOf(message)}`;
      });
      const more = listed.length - shown.length;
      const priority = isImportant ? 3 : look.isOn ? 2 : look.gaps.length > 0 ? 1 : 0;
      const allowance = isImportant ? Infinity : look.isOn ? 0.25 : 0;
      const width = Math.max(...texts.map(GraphLayout.textWidthOf)) + LabelPadding;
      const height = shown.length * LabelChipHeight + (more > 0 ? LabelMoreHeight : 0);
      return { look, isPicked, isImportant, shown, texts, more, candidate: { key: look.edge.key, bezier: look.edge.route.bezier, width, height, priority, allowance } };
    };

    const coverageTagOf = (message, model) => {
      const count = model.coverage.get(message.id).length;
      if (count > 0) return el("span", { class: "coverage-tag is-tested", text: `✓${count}` });
      if (model.isGap(message)) return el("span", { class: "coverage-tag is-gap", text: "未テスト" });
      return el("span", { class: "coverage-tag", text: "—" });
    };

    const renderGraph = (view) => {
      const { model } = view;
      const looks = model.edges.map((edge) => edgeLookOf(edge, view)).toSorted((a, b) => Number(a.isOn) - Number(b.isOn));
      const hovered = new Map(looks.map((look) => [look.edge.key, []]));
      const hoverable = (key, node) => {
        hovered.get(key).push(node);
        node.addEventListener("mouseenter", () => {
          for (const target of hovered.get(key)) target.classList.add("is-hover");
        });
        node.addEventListener("mouseleave", () => {
          for (const target of hovered.get(key)) target.classList.remove("is-hover");
        });
        return node;
      };
      const edgeNodes = looks.map((look) => {
        const flags = { "is-dependency": !hasMessages, "is-covered": look.isCovered, "is-gap": state.showGaps && look.gaps.length > 0 && !look.isOn, "is-on": look.isOn, "is-dim": look.isDim, "is-faint": look.isFaint };
        const hit = hasMessages ? [Dom.svg("path", { class: "edge-hit", d: look.edge.route.path })] : [];
        const group = Dom.svg("g", { class: classesOf("edge", flags) }, [Dom.svg("path", { class: "edge-line", d: look.edge.route.path }), Dom.svg("path", { class: "edge-head", d: look.edge.route.head }), ...hit]);
        if (hasMessages) group.addEventListener("click", () => select({ kind: "edge", id: look.edge.key }));
        return hasMessages ? hoverable(look.edge.key, group) : group;
      });
      const svg = Dom.svg("svg", { class: "graph-edges", width: String(model.layout.width), height: String(model.layout.height) }, edgeNodes);
      const labels = hasMessages ? looks.map((look) => labelOf(look, view)) : [];
      const placed = GraphLayout.placeLabels({ candidates: labels.map((label) => label.candidate), obstacles: GraphLayout.obstaclesOf(model.layout) });
      const labelAt = new Map(labels.map((label) => [label.look.edge.key, label]));
      const labelNodes = placed.map((spot) => {
        const label = labelAt.get(spot.key);
        const chips = label.shown.map((message, index) => el("span", { class: classesOf("label-chip", { "is-code": state.naming === "file" }), "data-kind": message.kind }, [el("span", { text: label.texts[index] }), coverageTagOf(message, model)]));
        const more = label.more > 0 ? [el("span", { class: "label-more", text: `+${label.more} 件` })] : [];
        const flags = { "is-important": label.isImportant, "is-on": label.look.isOn, "is-picked": label.isPicked, "is-dim": label.look.isDim, "is-faint": label.look.isFaint };
        const node = el("div", { class: classesOf("graph-label", flags) }, [...chips, ...more]);
        Object.assign(node.style, { left: `${spot.x}px`, top: `${spot.y}px` });
        node.addEventListener("click", () => select({ kind: "edge", id: spot.key }));
        return hoverable(spot.key, node);
      });
      const children = [...model.layout.containers.map((container) => containerNodeOf(container, view)), svg, ...model.layout.units.map((unit) => unitNodeOf(unit, view)), ...labelNodes];
      const expanded = state.expanded[state.grouping].toSorted().join(",");
      hint.textContent = hintTextOf(view);
      graph.show({ signature: `${state.grouping}|${expanded}`, size: { width: model.layout.width, height: model.layout.height }, children });
    };

    const side = el("div", { class: "side" });
    const eyebrowOf = (text, note) => el("span", { class: "eyebrow-row" }, [el("span", { class: "eyebrow", text }), ...(note === undefined ? [] : [el("span", { class: "eyebrow-note", text: note })])]);
    const clearButton = () => pressable("button", { class: "mini-button", text: "選択解除" }, [], () => update({ selected: null }));

    const messageBodyOf = (message, model) => [
      el("span", { class: "message-chip" }, [el("span", { class: "kind", "data-kind": message.kind, text: MessageKindLabels[message.kind] ?? message.kind }), el("span", { class: classesOf("message-name", { "is-code": state.naming === "file" }), text: messageNameOf(message) })]),
      el("span", { class: "message-route", text: `${endNameOf(model, message.from)} → ${endNameOf(model, message.to)}` }),
    ];

    /** やりとりのカード。図に線があれば、押すとその線を選ぶ。 */
    const gapCardOf = (message, model, isPressable) => {
      const key = edgeKeyBetween(model, message);
      const body = messageBodyOf(message, model);
      const isStatic = !isPressable || key === null;
      if (isStatic) return el("div", { class: "gap-card" }, body);
      return pressable("button", { class: "gap-card plain-button" }, body, () => select({ kind: "edge", id: key }));
    };

    const testCardOf = (test) => pressable("button", { class: "test-card plain-button" }, [
      el("span", { class: "test-name", text: test.name }),
      el("span", { class: "test-facts" }, [...test.techniques.map(techniqueChipOf), el("span", { class: "test-status", "data-status": test.status, text: TestStatuses[test.status].long })]),
    ], () => select({ kind: "test", id: test.id }));

    const overviewOf = (model) => {
      const countOf = (status) => tests.filter((test) => test.status === status).length;
      const statuses = Object.keys(TestStatuses).filter((status) => status !== "removed" || countOf(status) > 0);
      const head = el("div", { class: "side-block" }, [
        el("span", { class: "eyebrow", text: "テストの全体像" }),
        el("h2", { text: "このブランチで何を確かめたか" }),
        el("div", { class: "side-counts" }, statuses.map((status) => el("span", { class: `is-${status}` }, [`${TestStatuses[status].label} `, el("b", { text: String(countOf(status)) })]))),
      ]);
      if (explain === null) return [head, el("p", { class: "side-note", text: "解説が無いので、変更の地図にあるテストの追加・削除と、テストファイルの対象だけで組んでいます。左のテストを選ぶと、対象の箱が光ります。" })];
      const techniqueCountOf = (key) => tests.filter((test) => test.techniques.includes(key)).length;
      const most = Math.max(1, ...Object.keys(Techniques).map(techniqueCountOf));
      const bars = Object.entries(Techniques).map(([key, technique]) => {
        const fill = el("span", { class: "tech-bar-fill" });
        fill.style.width = `${(techniqueCountOf(key) / most) * 100}%`;
        return pressable("button", { class: "tech-bar plain-button", "data-technique": key, title: "この観点で絞り込む" }, [
          el("span", { class: "tech-bar-line" }, [el("span", { class: "tech-bar-label" }, [el("span", { class: "swatch" }), technique.label]), el("span", { class: "tech-bar-track" }, [fill]), el("span", { class: "tech-bar-count", text: String(techniqueCountOf(key)) })]),
          el("span", { class: "tech-bar-desc", text: technique.description }),
        ], () => update({ techniques: [key] }));
      });
      const gaps = messages.filter(model.isGap);
      const gapBlock = hasMessages ? [el("div", { class: "side-block" }, [
        eyebrowOf("テストがないやりとり", "このブランチで追加したもの"),
        ...gaps.map((message) => gapCardOf(message, model, true)),
        ...(gaps.length === 0 ? [el("span", { class: "side-sub", text: "すべてテストされています。" })] : []),
      ])] : [];
      return [
        head,
        el("div", { class: "side-block" }, [el("span", { class: "eyebrow", text: "観点ごとの内訳" }), ...bars]),
        ...gapBlock,
        el("p", { class: "side-note", text: "左のテストを選ぶと、確かめている範囲がマップ上で光ります。マップの箱やラベルを選ぶと、そこを確かめているテストが分かります。" }),
      ];
    };

    const valuesOf = (values) => {
      const columns = values.columns.length;
      const hasBoundary = values.rows.some((row) => row.boundary === true);
      const grid = el("div", { class: "values-grid" }, [
        ...values.columns.map((column) => el("span", { class: "values-head", text: column })),
        ...values.rows.flatMap((row) => row.cells.map((cell, index) => {
          const tag = row.boundary === true && index === 0 ? [el("span", { class: "boundary-tag", text: "境目" })] : [];
          return el("span", { class: classesOf("values-cell", { "is-first": index === 0, "is-boundary": row.boundary === true }) }, [prose("span", {}, cell), ...tag]);
        })),
      ]);
      grid.style.gridTemplateColumns = `repeat(${columns}, minmax(max-content, 1fr))`;
      return el("div", { class: "side-block" }, [eyebrowOf("試している値", hasBoundary ? "「境目」は境界値として選んだ値" : undefined), el("div", { class: "values" }, [grid])]);
    };

    const excerptOf = (excerpt) => {
      const grammar = Highlighter.grammarOf(excerpt.path);
      const lines = excerpt.text.split("\n");
      const rows = lines.reduce((sofar, text, index) => {
        const { node, carry } = codeTextOf(text, grammar, sofar.carry);
        return { carry, nodes: [...sofar.nodes, el("div", { class: "excerpt-line" }, [el("span", { class: "ln", text: String(excerpt.start + index) }), node])] };
      }, { carry: Highlighter.Start, nodes: [] });
      return el("div", { class: "side-block" }, [eyebrowOf("テストコード", `${excerpt.path}:${excerpt.start}-${excerpt.end}`), el("div", { class: "excerpt" }, rows.nodes)]);
    };

    const commitLinkOf = (sha) => {
      const commit = commitAt.get(sha);

        el("span", { class: "arrow", text: "↗" }),
      ], () => go.toCommit(sha));
    };

    /** 解説の無いテスト(地図の追加・削除)の対象。押すとその箱を選ぶ。 */
    const targetsOf = (test, model) => {
      const places = [...new Set(test.targets.map((path) => model.layout.unitOf.get(path)).filter((id) => id !== undefined))].map((id) => model.places.get(id));

    };

    const testDetailOf = (test, model) => {
      const suiteLabel = test.suite === null ? (test.file ?? "").split("/").pop() : test.suite.label;
      const pending = test.status === "todo" ? [el("span", { class: "pending", text: "○ まだ書かれていない" })] : [];
      const head = el("div", { class: "side-block" }, [
        el("div", { class: "side-head" }, [el("span", { class: "chip", text: suiteLabel }), el("span", { class: "chip", "data-status": test.status, text: TestStatuses[test.status].long }), ...pending, el("span", { class: "spacer" }), clearButton()]),
        el("h2", { text: test.name }),
        el("span", { class: "side-path", text: test.file ?? "" }),
      ]);
      if (test.test === null) {
        const reason = test.status === "removed" ? "このブランチで消したテストです。" : "解説に無いテストです。";
        return [head, el("p", { class: "side-sub", text: `${reason}変更の地図にある名前と、テストファイルの対象だけを出しています。` }), targetsOf(test, model)];
      }
      const detail = test.test;
      const covered = test.covers.map((id) => lookup.messages.get(id)).filter((message) => message !== undefined);
      const values = detail.values === undefined ? [] : [valuesOf(detail.values)];
      const coverBlock = covered.length === 0 ? [] : [el("div", { class: "side-block" }, [
        eyebrowOf("確かめているやりとり", `${covered.length} 件`),
        ...covered.map((message, index) => {
          const key = edgeKeyBetween(model, message);
          const body = [el("span", { class: "message-row-n", text: String(index + 1) }), el("span", { class: "message-row-body" }, messageBodyOf(message, model))];
          return key === null ? el("div", { class: "message-row" }, body) : pressable("button", { class: "message-row plain-button" }, body, () => select({ kind: "edge", id: key }));
        }),
      ])];
      const hasExcerptText = detail.excerpt !== undefined && typeof detail.excerpt.text === "string";
      const code = hasExcerptText ? [excerptOf(detail.excerpt)] : [];
      const commit = typeof detail.commit === "string" ? [commitLinkOf(detail.commit)] : [];
      return [
        head,
        el("div", { class: "side-block" }, [
          el("span", { class: "eyebrow", text: "テストの観点" }),
          ...test.techniques.map((key) => el("div", { class: "tech-line" }, [techniqueChipOf(key), el("span", { class: "tech-line-desc", text: Techniques[key].description })])),
          prose("p", { class: "why" }, detail.why),
        ]),
        el("div", { class: "gwt" }, [["前提", detail.given], ["操作", detail.when], ["期待", detail.then]].flatMap(([key, text]) => [el("span", { class: "gwt-key", text: key }), prose("span", { class: "gwt-value" }, text)])),
        ...values,
        ...coverBlock,

    };

    /** 選んだ箱・線を確かめているテスト(未実装の提案も足す)と、テストの無いやりとり。 */
    const targetDetailOf = (selected, model) => {

      const place = isEdge ? null : model.places.get(selected.id);

      const touches = isEdge ? touchesEdge : touchesPlace;
      const verified = isEdge ? [...new Set(edge.items.flatMap((message) => model.coverage.get(message.id)))] : model.placeTests(place);
      const proposed = tests.filter((test) => test.status === "todo" && touches(test) && !verified.includes(test));
      const listed = [...verified, ...proposed];
      const gaps = isEdge ? edge.items.filter(model.isGap) : model.placeGaps(place);
      const title = isEdge ? `${placeNameOf(model.places.get(edge.from))} ⇄ ${placeNameOf(model.places.get(edge.to))}` : placeNameOf(place);
      const kind = isEdge ? "つながり" : place.kind === "box" ? "要素" : "グループ";
      const sub = isEdge ? `${edge.items.length} 件のやりとり:${edge.items.map((message) => `〈${message.name}〉`).join("")}` : placeSubOf(place);
      return [
        el("div", { class: "side-block" }, [el("div", { class: "side-head" }, [el("span", { class: "chip", text: kind }), el("span", { class: "spacer" }), clearButton()]), el("h2", { text: title }), el("p", { class: "side-sub", text: sub })]),
        el("div", { class: "side-block" }, [eyebrowOf("ここを確かめているテスト", `${listed.length}`), ...listed.map(testCardOf), ...(listed.length === 0 ? [el("span", { class: "warn-text", text: "まだテストがありません。" })] : [])]),
        ...(gaps.length === 0 ? [] : [el("div", { class: "side-block" }, [el("span", { class: "eyebrow", text: "テストがないやりとり" }), ...gaps.map((message) => gapCardOf(message, model, false))])]),
      ];
    };

    /** 箱の補足。概念名で出しているならパス、ファイル名で出しているなら concept 名(無ければパス)。組なら中の数。 */
    const placeSubOf = (place) => {
      if (place.kind !== "box") return `${place.paths.length} 要素をまとめた箱`;

    const renderSide = (view) => {

  const ScreenBuilders = { map: MapScreen, story: StoryScreen, test: TestScreen };

  /** 解説が使えない理由を帯の 1 行にする。 */
  const missingTextOf = (reason) => {
    switch (reason.kind) {
      case "absent":

  const freshnessTextOf = (freshness) => {

  };

  /** 上の帯に出す文。解説なし(理由)/ 古い / sha が地図に無い / 地図に無い解説 / 地図が v1。 */
  const bandTextsOf = (explained) => [
    explained.explain.kind === "missing" ? missingTextOf(explained.explain.reason) : null,
    freshnessTextOf(explained.freshness),
    explained.strayNotes.length > 0 ? `地図に無い解説 ${explained.strayNotes.length} 件(地図のコミットに無い sha への commitNotes)` : null,
    explained.map.isCurrent ? null : `地図が古い(v${explained.map.version})。次の push で Actions が作り直します`,
  ].filter((text) => text !== null);

  const linksOf = (pr, issue) => {
    const prLink = pr === null ? [] : [el("a", { href: `https://github.com/${Repo}/pull/${pr}`, text: `PR #${pr}` })];
    const issueLink = issue === null ? [] : [el("a", { href: `https://github.com/${Repo}/issues/${issue}`, text: `Issue #${issue}` })];
    return el("nav", { class: "links" }, [...prLink, ...issueLink]);
  };

  /** 地図が読めないときの全体の案内。画面は組めないので、ヘッダと案内だけを出す。 */
  const mountGuide = (root, { pr, detail }) => {
    document.title = pr === null ? "PR 解説" : `PR #${pr} · PR 解説`;
    root.replaceChildren(
      el("header", { class: "top" }, [el("span", { class: "repo", text: RepoName }), el("span", { class: "top-main" }), linksOf(pr, null)]),
      el("div", { class: "bands" }),
      el("div", { class: "screens" }, [el("div", { class: "guide" }, [
        el("h1", { text: "変更の地図がまだありません" }),
        el("p", { text: `change-map.json を読めませんでした(${detail})。PR に push すると、Actions が地図とこのページを置き直します。地図が置かれると、解説が無くても構造マップ・変更の経緯・テストの 3 画面が出ます。` }),
      ])]),
    );
  };

  /** ヘッダ・帯・3 画面を組み、画面を切り替える。 */
  const Frame = Object.freeze({
    mount: (root, explained) => {
      const pr = explained.map.pr;
      const explain = explained.explain.kind === "explained" ? explained.explain.explain : null;
      const hasIssue = explain !== null && typeof explain.issue === "number";
      const issue = hasIssue ? explain.issue : null;
      document.title = explain === null ? `PR #${pr} · PR 解説` : `${explain.overview.title} · PR #${pr}`;
      /** 画面をまたぐ移動。ハッシュは開く画面のものにする。 */
      const go = {
        toCommit: (sha) => {
          history.replaceState(null, "", `#${Screens.Story}`);
          openScreen(Screens.Story);
          built.story.select(sha);
        },
      };
      const built = Object.fromEntries(Object.values(Screens).map((screen) => [screen, ScreenBuilders[screen](explained, go)]));
      const tabs = Object.values(Screens).map((screen) => el("a", { href: `#${screen}`, "data-screen": screen, text: ScreenLabels[screen] }));
      const controls = el("div", { class: "screen-controls" });
      const branch = el("span", { class: "branch" }, [explained.map.headBranch ?? shortSha(explained.map.head), el("span", { class: "arrow", text: "→" }), explained.map.baseBranch ?? shortSha(explained.map.mergeBase)]);
      const sections = Object.values(Screens).map((screen) => {
        const parts = built[screen];
        const grid = el("section", { class: "screen", "data-screen": screen, "aria-label": ScreenLabels[screen] }, [parts.left, parts.main, ...(parts.right === null ? [] : [parts.right])]);
        PanelResizer.attach({ screen, grid, panels: parts.right === null ? { left: parts.left } : { left: parts.left, right: parts.right } });
        return grid;
      });
      root.replaceChildren(
        el("header", { class: "top" }, [el("span", { class: "repo", text: RepoName }), el("nav", { class: "segmented", "aria-label": "画面" }, tabs), el("div", { class: "top-main" }, [branch]), controls, linksOf(pr, issue)]),
        el("div", { class: "bands" }, bandTextsOf(explained).map((text) => el("div", { class: "band", role: "status", text }))),
        el("div", { class: "screens" }, sections),
      );
      let current = null;
      const show = (screen) => {
        current = screen;
        for (const tab of tabs) {
          if (tab.dataset.screen === screen) tab.setAttribute("aria-current", "page");
          else tab.removeAttribute("aria-current");
        }
        for (const section of sections) section.hidden = section.dataset.screen !== screen;
        controls.replaceChildren(...built[screen].controls);
      };
      const choose = () => ScreenChoice.choose({ hash: location.hash, saved: BrowserStore.read(PageStoreKey) });
      const openScreen = (screen) => {
        BrowserStore.write(PageStoreKey, screen);
        show(screen);
      };
      for (const tab of tabs) {
        tab.addEventListener("click", (event) => {
          event.preventDefault();
          history.replaceState(null, "", `#${tab.dataset.screen}`);
          openScreen(tab.dataset.screen);
        });
      }
      window.addEventListener("hashchange", () => openScreen(choose()));
      window.addEventListener("keydown", (event) => {
        const onKey = built[current].onKey;
        if (onKey !== undefined) onKey(event);
      });
      show(choose());
    },
  });

  const fetchFresh = (name) => fetch(`${name}?t=${Date.now()}`, { cache: "no-store" });
  const prFromPath = (location.pathname.match(/pr-(\d+)/) || [])[1] ?? null;

  /** 読み込みの失敗だけを受ける。組み立ての失敗は握らず、コンソールにそのまま出す。 */
  const mapRequest = fetchFresh("change-map.json")
    .then((response) => (response.ok ? response.json() : Promise.reject(new Error(`HTTP ${response.status}`))))
    .then((map) => ({ isLoaded: true, map }), (error) => ({ isLoaded: false, detail: error.message }));
  const explainRequest = fetchFresh("explain.json")
    .then((response) => {
      if (response.status === 404) return { kind: "absent" };
      if (!response.ok) return { kind: "failed", detail: `HTTP ${response.status}` };
      return response.text().then((text) => ({ kind: "text", text }));
    })
    .catch((error) => ({ kind: "failed", detail: error.message }));

  Promise.all([mapRequest, explainRequest]).then(([mapResult, source]) => {
    const root = document.getElementById("app");
    if (!mapResult.isLoaded) {
      mountGuide(root, { pr: prFromPath, detail: mapResult.detail });
      return;
    }
    Frame.mount(root, ExplainedMap.from(mapResult.map, source));
  });
})();
</script>
</body>
</html>
