<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root {
  --bg: #f3f8fd;
  --surface: #ffffff;
  --surface-2: #e8f1fb;
  --border: #d2e1f1;
  --text: #13233a;
  --text-2: #3e5571;
  --text-3: #5f7590;
  --accent: #1f6fd1;
  --accent-soft: #deecfc;
  --green: #2f7d4f;
  --green-soft: #e1f3e8;
  --rose: #b23a48;
  --rose-soft: #fbe6e9;
  --amber: #9a6b12;
  --amber-soft: #fdf2dc;
  --code-bg: #f5f9fe;
  --tok-kw: #1d4fc4;
  --tok-str: #0f7a6c;
  --tok-com: #637893;
  --tok-num: #b45309;
  --tok-fn: #7c3aed;
  --tok-key: #0b63b6;
  --tok-var: #c0266d;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
  --header-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1724;
    --surface: #152033;
    --surface-2: #1b2a40;
    --border: #2a3c56;
    --text: #e2ebf6;
    --text-2: #a8bcd5;
    --text-3: #7288a5;
    --accent: #7fb3ff;
    --accent-soft: #1d3353;
    --green: #7cc79a;
    --green-soft: #1b3326;
    --rose: #ec8f9b;
    --rose-soft: #3d2328;
    --amber: #e3b45a;
    --amber-soft: #3a2f19;
    --code-bg: #111c2c;
    --tok-kw: #82aaff;
    --tok-str: #7fd6c2;
    --tok-com: #6f84a0;
    --tok-num: #f0b46b;
    --tok-fn: #c4a3ff;
    --tok-key: #6fc1ff;
    --tok-var: #ff8fb8;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.75 var(--sans); }
a { color: var(--accent); }
code { font-family: var(--mono); font-size: 0.88em; background: var(--surface-2); padding: 0.1em 0.35em; border-radius: 4px; }
.page { max-width: 1180px; margin: 0 auto; padding: 0 16px 64px; }
.top { position: sticky; top: 0; z-index: 10; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 12px 0; background: var(--bg); border-bottom: 1px solid var(--border); }
.code-toggle { font: 12px var(--sans); padding: 4px 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--text-2); cursor: pointer; }
.code-toggle:hover { color: var(--accent); border-color: var(--accent); }
.links { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; margin-left: auto; }
.explain-pages { display: flex; flex-wrap: wrap; gap: 4px; }
.explain-pages a, .explain-pages span { padding: 4px 12px; border-radius: 999px; font-size: 13px; text-decoration: none; color: var(--text-2); border: 1px solid var(--border); }
.explain-pages a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); font-weight: 600; }
.explain-pages span { color: var(--text-3); border-style: dashed; }
.banner { margin: 16px 0 0; padding: 12px 14px; border-radius: 8px; background: var(--amber-soft); color: var(--text); border: 1px solid var(--border); font-size: 14px; }
.banner ul { margin: 6px 0 0; padding-left: 20px; }
.layout { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 32px; margin-top: 24px; }
.toc { position: sticky; top: calc(var(--header-h) + 16px); align-self: start; max-height: calc(100vh - var(--header-h) - 32px); overflow-y: auto; font-size: 13px; }
h2[id], h3[id], tr[id] { scroll-margin-top: calc(var(--header-h) + 12px); }
.toc a { display: block; padding: 3px 0 3px 10px; color: var(--text-2); text-decoration: none; border-left: 2px solid var(--border); }
.toc a:hover { color: var(--accent); border-left-color: var(--accent); }
@media (max-width: 860px) { .layout { grid-template-columns: minmax(0, 1fr); } .toc { position: static; max-height: none; } .links { flex-wrap: nowrap; overflow-x: auto; white-space: nowrap; margin-left: 0; max-width: 100%; } }
main { min-width: 0; }
h1 { font-size: 28px; line-height: 1.35; margin: 0 0 8px; }
h2 { font-size: 20px; margin: 48px 0 12px; padding-top: 8px; border-top: 1px solid var(--border); }
h3 { font-size: 16px; margin: 28px 0 8px; }
.kicker { display: inline-block; margin-right: 8px; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); font-weight: 700; vertical-align: 0.15em; }
.explain-meta { color: var(--text-3); font-size: 13px; margin: 0 0 16px; }
.lead { font-size: 17px; color: var(--text-2); }
.empty-note { padding: 20px; border: 1px dashed var(--border); border-radius: 8px; color: var(--text-2); background: var(--surface); }
table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 14px; background: var(--surface); }
th, td { border: 1px solid var(--border); padding: 8px 10px; text-align: left; vertical-align: top; }
th { background: var(--surface-2); font-weight: 600; }
table.behavior td:nth-child(2) { background: var(--rose-soft); }
table.behavior td:nth-child(3) { background: var(--green-soft); }
.decision { margin: 16px 0; padding: 14px 16px; background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--accent); border-radius: 8px; }
.decision[data-kind="逸脱"] { border-left-color: var(--amber); }
.decision[data-kind="見送り"] { border-left-color: var(--text-3); }
.decision h3 { margin: 0 0 8px; }
.decision::before { content: attr(data-kind); display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; padding: 1px 8px; border-radius: 999px; background: var(--surface-2); color: var(--text-2); margin-bottom: 6px; }
.decision dl { display: grid; grid-template-columns: 7em minmax(0, 1fr); gap: 4px 12px; margin: 0; }
.decision dt { color: var(--text-3); font-size: 13px; }
.decision dd { margin: 0; }
article.tech { margin: 24px 0; }
figure.diagram { margin: 16px 0; padding: 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow-x: auto; }
figure.diagram svg { display: block; max-width: 100%; height: auto; margin: 0 auto; }
figure.diagram figcaption { margin-top: 8px; font-size: 13px; color: var(--text-3); text-align: center; }
.d-box { fill: var(--surface-2); stroke: var(--border); stroke-width: 1.5; }
.d-accent { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.5; }
.d-line { stroke: var(--text-2); stroke-width: 1.5; fill: none; }
.d-text { fill: var(--text); font: 13px var(--sans); }
.d-muted { fill: var(--text-3); font: 12px var(--sans); }
pre.code { margin: 12px 0; padding: 12px 14px; background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px; overflow-x: auto; font: 13px/1.6 var(--mono); }
pre.code code { background: none; padding: 0; font-size: inherit; }
pre.code .ln { display: inline-block; min-width: 3.5ch; margin-right: 14px; color: var(--text-3); text-align: right; user-select: none; }
.where-ref { margin: 4px 0 0; color: var(--text-2); font-size: 14px; }
details.code-fold { margin: 12px 0; border: 1px solid var(--border); border-radius: 8px; background: var(--code-bg); }
details.code-fold > summary { padding: 6px 12px; font-size: 13px; color: var(--text-2); cursor: pointer; background: var(--surface-2); border-radius: 8px; }
details.code-fold[open] > summary { border-bottom: 1px solid var(--border); border-radius: 8px 8px 0 0; }
details.code-fold > summary code { background: none; padding: 0; }
details.code-fold .fold-count { margin-left: 8px; color: var(--text-3); }
details.code-fold > pre.code { margin: 0; border: 0; border-radius: 0 0 8px 8px; }
.tok-kw { color: var(--tok-kw); font-weight: 600; }
.tok-str { color: var(--tok-str); }
.tok-com { color: var(--tok-com); font-style: italic; }
.tok-num { color: var(--tok-num); }
.tok-fn { color: var(--tok-fn); }
.tok-key { color: var(--tok-key); }
.tok-var { color: var(--tok-var); }
.diff-add, .diff-del { display: inline-block; min-width: 100%; }
.diff-add { background: var(--green-soft); }
.diff-del { background: var(--rose-soft); }
.note { margin: 14px 0; padding: 10px 14px; border-radius: 8px; font-size: 14px; }
.note.info { background: var(--accent-soft); }
.note.warn { background: var(--amber-soft); }
ul.focus li { margin: 6px 0; }
.map h3 { font-size: 14px; color: var(--text-2); margin: 20px 0 6px; }
.map ul { list-style: none; margin: 0; padding: 0; }
.map li { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; padding: 4px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.map .status { font: 11px var(--mono); min-width: 1.6em; text-align: center; border-radius: 4px; background: var(--surface-2); color: var(--text-2); }
.map .count { font: 12px var(--mono); color: var(--text-3); }
.muted { color: var(--text-3); }
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <span class="kicker">PR 解説</span>
    <nav class="explain-pages" id="explain-pages" aria-label="解説のページ"></nav>
    <nav class="links" id="links"></nav>
    <span id="code-controls"></span>
  </header>
  <div class="banner" id="staleness" hidden></div>
  <div class="layout">
    <nav class="toc" id="toc" aria-label="目次"></nav>
    <main>
      <article id="explain">
<!-- EXPLAIN:BEGIN -->
<p class="empty-note">解説はまだ書かれていません。下の「変更の地図」は push のたびに自動で更新されます。振る舞い・技術・テストのページも、書かれると上のナビから開けるようになります。</p>
<!-- EXPLAIN:END -->
      </article>
      <section class="map" id="map-section" hidden>
        <h2 id="map-section-heading"></h2>
        <div id="map-section-body"><p class="muted">読み込み中…</p></div>
      </section>
    </main>
  </div>
</div>
<script>
(() => {
  const Repo = "DIO0550/design-composer";
  const ExplainPages = [
    { name: "index", href: "./", label: "入口" },
    { name: "behavior", href: "behavior.html", label: "振る舞い" },
    { name: "tech", href: "tech.html", label: "技術" },
    { name: "tests", href: "tests.html", label: "テスト" },
  ];
  const explain = document.getElementById("explain");
  const meta = explain.querySelector(".explain-meta");
  const explainedSha = meta ? meta.dataset.explainedSha : "";
  const prFromPath = (location.pathname.match(/pr-(\d+)/) || [])[1] || "";
  const pr = meta ? meta.dataset.pr : prFromPath;
  // explain-meta が無いのは、Actions が入口に置いたテンプレートだけ。
  const page = meta ? meta.dataset.page : "index";

  const el = (tag, props, children) => {
    const node = document.createElement(tag);
    for (const [key, value] of Object.entries(props || {})) {
      if (key === "text") node.textContent = value;
      else node.setAttribute(key, value);
    }
    for (const child of children || []) node.append(child);
    return node;
  };

  const heading = explain.querySelector("h1");
  if (heading) document.title = `${heading.textContent.trim()} · PR 解説`;

  for (const code of explain.querySelectorAll("code.ref")) {
    const match = code.textContent.trim().match(/^(.+?)(?::(\d+)(?:-(\d+))?)?$/);
    if (!match) continue;
    const [, path, start, end] = match;
    const lines = start ? `#L${start}${end ? `-L${end}` : ""}` : "";
    const link = el("a", { href: `https://github.com/${Repo}/blob/${explainedSha}/${path}${lines}` });
    code.replaceWith(link);
    link.append(code);
  }

  // 上部の固定ヘッダの高さ。目次の固定位置と、見出しへ飛んだときにヘッダの下へ隠れない余白に使う(折り返すと変わる)。
  const header = document.querySelector(".top");
  new ResizeObserver(() => document.documentElement.style.setProperty("--header-h", `${header.offsetHeight}px`)).observe(header);

  // コード抜粋の色分けの規則。キーワード・文字列・コメント・数値・関数呼び出しに加え、YAML はキー、
  // シェルは変数、HTML はタグと属性名に色を付ける簡易なもの。
  const words = (list) => new Set(list.split(" ").filter((word) => word !== ""));
  const Grammars = {
    python: { comment: "#", hashAnywhere: true, strings: ['"""', "'''", '"', "'"], keywords: words("def class return if elif else for while in not and or is None True False import from as with try except finally raise lambda yield pass continue break assert del async await global nonlocal") },
    js: { comment: "//", block: ["/*", "*/"], strings: ['"', "'", "`"], keywords: words("const let var function return if else for while of in new class extends import export from default switch case break continue try catch finally throw typeof instanceof null undefined true false this async await yield delete void") },
    shell: { comment: "#", strings: ['"', "'"], variables: true, keywords: words("if then else elif fi for in do done while until case esac function return local export set exit trap source echo readonly shift") },
    yaml: { comment: "#", strings: ['"', "'"], keys: true, keywords: words("true false null") },
    html: { block: ["<!--", "-->"], strings: ['"', "'"], tags: true, keywords: words("") },
  };
  const LanguageByExtension = { py: "python", js: "js", mjs: "js", ts: "js", tsx: "js", jsx: "js", json: "js", sh: "shell", bash: "shell", yml: "yaml", yaml: "yaml", html: "html" };
  const Identifier = /[A-Za-z_]\w*/y;
  const NumberLiteral = /\d+(?:\.\d+)?/y;
  const YamlKey = /[ \t]*(?:- )?[\w.$-]+(?=:(?:\s|$))/y;
  const ShellVariable = /\$(?:\{[^}\n]*\}|[A-Za-z_]\w*|[0-9#?@*$])/y;
  const TagName = /<\/?[A-Za-z][\w-]*/y;
  const AttributeName = /[A-Za-z_:][\w:.-]*(?==)/y;

  // 字句。`opens` は閉じずに行が終わった文字列・コメントの閉じ記号で、次の行の頭から続ける。
  const Token = (cls, value, opens = null) => ({ cls, value, opens });

  // cursor は { text, at, prev(直前の文字。ノードの頭では前のノードの末尾), lineStart }。
  const matchAt = (pattern, cursor) => {
    pattern.lastIndex = cursor.at;
    const match = pattern.exec(cursor.text);
    return match ? match[0] : null;
  };
  const restOfLine = (cursor) => {
    const end = cursor.text.indexOf("\n", cursor.at);
    return cursor.text.slice(cursor.at, end < 0 ? cursor.text.length : end);
  };

  // 文字列の終わりまで。閉じずに行が終わったら、三重引用符とテンプレート文字列だけ次の行へ持ち越す。
  const stringAt = (cursor, grammar) => {
    const { text, at } = cursor;
    const quote = grammar.strings.find((candidate) => text.startsWith(candidate, at));
    if (!quote) return null;
    let end = at + quote.length;
    while (end < text.length && text[end] !== "\n") {
      if (text.startsWith(quote, end)) return Token("tok-str", text.slice(at, end + quote.length));
      end += text[end] === "\\" ? 2 : 1;
    }
    const spansLines = quote.length === 3 || quote === "`";
    return Token("tok-str", text.slice(at, Math.min(end, text.length)), spansLines ? quote : null);
  };

  const commentAt = (cursor, grammar) => {
    const { text, at } = cursor;
    const block = grammar.block;
    const isBlockCommentStart = block !== undefined && text.startsWith(block[0], at);
    if (isBlockCommentStart) {
      const close = text.indexOf(block[1], at + block[0].length);
      return close >= 0 ? Token("tok-com", text.slice(at, close + block[1].length)) : Token("tok-com", restOfLine(cursor), block[1]);
    }
    const isLineCommentStart = grammar.comment !== undefined && text.startsWith(grammar.comment, at);
    // `#` は Python 以外では行頭か空白の直後だけコメントにする(シェルの `$#`・URL の `#` を取り違えない)。
    const isHashAllowedHere = grammar.comment !== "#" || grammar.hashAnywhere === true || /\s/.test(cursor.prev);
    const isComment = isLineCommentStart && isHashAllowedHere;
    return isComment ? Token("tok-com", restOfLine(cursor)) : null;
  };

  // 位置から始まる字句を 1 つ返す。色の付かない識別子も、途中で切らないよう 1 字句(cls が null)で返す。
  // どの規則にも当たらなければ null(呼び出し側が 1 文字だけ進める)。
  const tokenAt = (cursor, grammar) => {
    const isYamlKeyPosition = grammar.keys === true && cursor.lineStart;
    const key = isYamlKeyPosition ? matchAt(YamlKey, cursor) : null;
    if (key) return Token("tok-key", key);
    const quoted = commentAt(cursor, grammar) || stringAt(cursor, grammar);
    if (quoted) return quoted;
    const variable = grammar.variables === true ? matchAt(ShellVariable, cursor) : null;
    if (variable) return Token("tok-var", variable);
    const markup = grammar.tags === true ? matchAt(TagName, cursor) || matchAt(AttributeName, cursor) : null;
    if (markup) return Token(markup.startsWith("<") ? "tok-kw" : "tok-key", markup);
    if (/\w/.test(cursor.prev)) return null;
    const number = matchAt(NumberLiteral, cursor);
    if (number) return Token("tok-num", number);
    const word = matchAt(Identifier, cursor);
    if (!word) return null;
    if (grammar.keywords.has(word)) return Token("tok-kw", word);
    return Token(cursor.text[cursor.at + word.length] === "(" ? "tok-fn" : null, word);
  };

  // 持ち越しの続き(前の行で閉じなかった文字列・コメント)を、閉じ記号まで 1 字句にする。
  const continuationOf = (cursor, open) => {
    const close = cursor.text.indexOf(open.close, cursor.at);
    if (close < 0) return Token(open.cls, cursor.text.slice(cursor.at), open.close);
    return Token(open.cls, cursor.text.slice(cursor.at, close + open.close.length));
  };

  // 1 つの text ノードを字句に分け、次のノードへ持ち越す状態(carry)と一緒に返す。
  const tokenize = (text, grammar, carry) => {
    const tokens = [];
    let { open, lineStart } = carry;
    let at = 0;
    while (at < text.length) {
      const cursor = { text, at, prev: at > 0 ? text[at - 1] : carry.prev, lineStart };
      const token = open ? continuationOf(cursor, open) : tokenAt(cursor, grammar) || Token(null, text[at]);
      tokens.push(token);
      at += token.value.length;
      open = token.opens === null ? null : { cls: token.cls, close: token.opens };
      lineStart = token.value.endsWith("\n") || (lineStart && !/\S/.test(token.value));
    }
    return { tokens, carry: { open, lineStart, prev: text.length > 0 ? text[text.length - 1] : carry.prev } };
  };

  // 色は span の textContent で付ける。抜粋が HTML として解釈される経路は作らない。
  const paint = (code, grammar) => {
    const walker = document.createTreeWalker(code, NodeFilter.SHOW_TEXT);
    const textNodes = [];
    for (let node = walker.nextNode(); node; node = walker.nextNode()) {
      if (!node.parentElement.closest(".ln")) textNodes.push(node);
    }
    const Start = { open: null, lineStart: true, prev: "\n" };
    textNodes.reduce((carry, node) => {
      const result = tokenize(node.data, grammar, carry);
      node.replaceWith(...result.tokens.map(({ cls, value }) => (cls ? el("span", { class: cls, text: value }) : document.createTextNode(value))));
      return result.carry;
    }, Start);
  };

  // 抜粋の本文の行(行番号の span は含めない前提で呼ぶ)。
  const excerptLines = (code) => code.textContent.replace(/\n$/, "").split("\n");

  // diff の抜粋は、行頭の + / - で行ごとに背景を付ける。行番号(`.ln`)はいったん外して本文だけで行を割り、同じ行の頭へ戻す。
  const markDiff = (code) => {
    const numberSpans = [...code.querySelectorAll(".ln")];
    const numbers = numberSpans.map((ln) => ln.textContent);
    for (const ln of numberSpans) ln.remove();
    const lines = excerptLines(code);
    const DiffLine = { "+": "diff-add", "-": "diff-del" };
    code.replaceChildren(...lines.flatMap((line, index) => [
      ...(index < numbers.length ? [el("span", { class: "ln", text: numbers[index] })] : []),
      el("span", Object.hasOwn(DiffLine, line[0]) ? { class: DiffLine[line[0]], text: line } : { text: line }),
      ...(index < lines.length - 1 ? ["\n"] : []),
    ]));
  };

  // 言語は `data-lang`(言語名か拡張子)、無ければ抜粋の上の `path:行` か `data-file` の拡張子で決める。
  // 断片由来の値なので、規則表は自分のキーだけを引く(`constructor` などでプロトタイプを引くと止まる)。
  const languageOf = (pre, label) => {
    const named = pre.dataset.lang || (label.match(/\.(\w+)(?::[\d-]+)?$/) || [])[1] || "";
    const isLanguageName = named === "diff" || Object.hasOwn(Grammars, named);
    if (isLanguageName) return named;
    return Object.hasOwn(LanguageByExtension, named) ? LanguageByExtension[named] : "";
  };

  const colorize = (pre, label) => {
    const code = pre.querySelector("code") || pre;
    const language = languageOf(pre, label);
    if (language === "diff") markDiff(code);
    else if (Object.hasOwn(Grammars, language)) paint(code, Grammars[language]);
  };

  // 抜粋を開閉できる枠に入れる。見出しには抜粋の上の `path:行`(where-ref。無ければ data-file)と行数を出す。
  const fold = (pre, ref, label) => {
    const code = pre.querySelector("code") || pre;
    const lineCount = pre.querySelectorAll(".ln").length || excerptLines(code).length;
    const summary = el("summary", {}, ref ? [...ref.childNodes] : [el("code", { text: label || "コード" })]);
    summary.append(el("span", { class: "fold-count", text: `${lineCount} 行` }));
    const details = el("details", { class: "code-fold", open: "" });
    pre.replaceWith(details);
    details.append(summary, pre);
    if (ref) ref.remove();
  };

  const whereRefOf = (pre) => {
    const above = pre.previousElementSibling;
    const hasWhereRef = above !== null && above.classList.contains("where-ref");
    return hasWhereRef ? above : null;
  };

  const codeBlocks = [...explain.querySelectorAll("pre.code")];
  for (const pre of codeBlocks) {
    const ref = whereRefOf(pre);
    const label = ref ? ref.textContent.trim() : pre.dataset.file || "";
    colorize(pre, label);
    fold(pre, ref, label);
  }
  if (codeBlocks.length > 0) {
    const folds = () => [...explain.querySelectorAll("details.code-fold")];
    const toggle = el("button", { type: "button", class: "code-toggle" });
    const syncLabel = () => {
      toggle.textContent = folds().some((details) => details.open) ? "コードをすべて畳む" : "コードをすべて開く";
    };
    toggle.addEventListener("click", () => {
      const shouldOpen = !folds().some((details) => details.open);
      for (const details of folds()) details.open = shouldOpen;
      syncLabel();
    });
    explain.addEventListener("toggle", syncLabel, true);
    syncLabel();
    document.getElementById("code-controls").append(toggle);
  }

  // 書かれていないページ(404)は「なし」として出す(ドキュメントだけの PR はテストのページを書かない)。
  // 404 以外の失敗は有無が分からないので、リンクのまま残す。
  const pagesNav = document.getElementById("explain-pages");
  for (const target of ExplainPages) {
    const isCurrent = target.name === page;
    const item = el("a", isCurrent ? { href: target.href, "aria-current": "page", text: target.label } : { href: target.href, text: target.label });
    pagesNav.append(item);
    if (isCurrent) continue;
    fetch(target.href, { method: "HEAD", cache: "no-store" }).then((response) => {
      if (response.status === 404) item.replaceWith(el("span", { text: `${target.label}(なし)` }));
    });
  }

  const links = document.getElementById("links");
  if (pr) {
    links.append(
      el("a", { href: `https://github.com/${Repo}/pull/${pr}`, text: `PR #${pr}` }),
      el("a", { href: `../../pr-preview/pr-${pr}/`, text: "Storybook プレビュー" }),
      el("a", { href: `../../visual-regression/pr-${pr}/`, text: "VRT レポート(差分が無い回・撮影で落ちた回は無い)" }),
    );
  }

  const isKicker = (node) => node.classList !== undefined && node.classList.contains("kicker");
  const buildToc = () => {
    const toc = document.getElementById("toc");
    toc.replaceChildren();
    for (const h2 of document.querySelectorAll("main h2[id]")) {
      if (h2.closest("[hidden]")) continue;
      const label = [...h2.childNodes].filter((node) => !isKicker(node)).map((node) => node.textContent).join("").trim();
      toc.append(el("a", { href: `#${h2.id}`, text: label }));
    }
  };

  // パスの直後にパスの文字が続く出現は数えない(`index.ts` を `index.tsx` の言及と取り違えない)。
  const explainText = explain.textContent;
  const isMentioned = (path) => {
    let at = explainText.indexOf(path);
    while (at >= 0) {
      if (!/[\w./-]/.test(explainText.charAt(at + path.length))) return true;
      at = explainText.indexOf(path, at + 1);
    }
    return false;
  };

  const showStaleness = (map) => {
    const isOutdated = explainedSha !== "" && map.head !== explainedSha;
    if (!isOutdated) return;
    const banner = document.getElementById("staleness");
    const index = map.commits.findIndex((commit) => commit.sha === explainedSha);
    banner.hidden = false;
    if (index < 0) {
      banner.append(`解説を書いた時点のコミット(${explainedSha.slice(0, 7)})が、この PR のコミット一覧に見つかりません。force push などで履歴が変わった可能性があります。`);
      return;
    }
    const changed = [...new Set(map.commits.slice(index + 1).flatMap((commit) => commit.files))].sort();
    banner.append(`このページは ${explainedSha.slice(0, 7)} 時点のものです。以降のコミットで変わったファイル:`);
    banner.append(el("ul", {}, changed.map((path) => el("li", {}, [el("code", { text: path })]))));
  };

  const lineCount = (file) => (file.additions === null ? "バイナリ" : `+${file.additions} −${file.deletions}`);
  const fileItem = (file) => {
    const children = [el("span", { class: "status", text: file.status }), el("code", { text: file.path })];
    if (file.oldPath) children.push(el("span", { class: "muted", text: `← ${file.oldPath}` }));
    children.push(el("span", { class: "count", text: lineCount(file) }));
    return el("li", {}, children);
  };
  const testItem = (test) => el("li", {}, [el("span", { text: test.name }), el("code", { text: test.file })]);

  // 見出し(件数)と一覧の組を 1 つ足す。
  const appendList = (body, title, items) => {
    body.append(el("h3", { text: `${title}(${items.length})` }), el("ul", {}, items));
  };

  // ページごとに、地図から足す節。振る舞いのページには足さない。
  const MapSections = {
    index: {
      heading: "変更の地図",
      render: (body, map) => {
        body.append(el("p", { class: "muted", text: `head ${map.head.slice(0, 7)} · base との分岐点 ${map.mergeBase.slice(0, 7)} · 上から読む順(内側の層から外側へ)に並べています。` }));
        for (const group of map.groups) appendList(body, group.label, group.files.map(fileItem));
        if (map.groups.length === 0) body.append(el("p", { class: "muted", text: "変更されたファイルはありません。" }));
      },
    },
    tech: {
      heading: "解説に出てこない変更ファイル",
      render: (body, map) => {
        const unmentioned = map.groups.flatMap((group) => group.files).filter((file) => !isMentioned(file.path));
        body.append(el("p", { class: "muted", text: "このページの本文にフルパスで出てこない変更ファイル。コードの読み方が触れていないものです。" }));
        appendList(body, "解説に出てこない", unmentioned.map(fileItem));
      },
    },
    tests: {
      heading: "追加・削除されたテスト",
      render: (body, map) => {
        appendList(body, "追加されたテスト", map.tests.added.map(testItem));
        appendList(body, "削除されたテスト", map.tests.removed.map(testItem));
      },
    },
  };
  const mapSection = MapSections[page];

  const renderMap = (map) => {
    showStaleness(map);
    if (!mapSection) return;
    const body = document.getElementById("map-section-body");
    body.replaceChildren();
    mapSection.render(body, map);
  };

  // 読み込みの失敗だけを受ける。描画の失敗は握らず、コンソールにそのまま出す。
  // 古さを確かめられないことは、地図の節を持たないページでも見えるよう帯に出す。
  const mapUnreadable = (error) => {
    const message = `change-map.json を読めませんでした(${error.message})。このページが最新かを確かめられません。ローカルで開いたときと、地図がまだ置かれていないときに出ます。`;
    const banner = document.getElementById("staleness");
    banner.hidden = false;
    banner.append(message);
    document.getElementById("map-section-body").replaceChildren(el("p", { class: "muted", text: "地図はありません。" }));
  };

  if (mapSection) {
    document.getElementById("map-section").hidden = false;
    document.getElementById("map-section-heading").append(el("span", { class: "kicker", text: "自動生成" }), mapSection.heading);
  }
  buildToc();
  fetch(`change-map.json?t=${Date.now()}`, { cache: "no-store" })
    .then((response) => (response.ok ? response.json() : Promise.reject(new Error(`HTTP ${response.status}`))))
    .then(renderMap, mapUnreadable)
    .then(buildToc);
})();
</script>
</body>
</html>
