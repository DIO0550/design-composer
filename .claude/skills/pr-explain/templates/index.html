    const tableTopicOf = (table, index, { testAt }) => {
      const rowHeads = firstById(listOf(table.rowHeads));
      const columnHeads = firstById(listOf(table.columnHeads));
      const outcomes = listOf(table.outcomes);
      const rows = rowHeads.map((row) => ({ head: headOf(row), outcomes: columnHeads.map((column) => outcomeOf({ outcomes, row, column, testAt })) }));
      const filled = rows.flatMap((row) => row.outcomes).filter((outcome) => outcome !== null);
      return {
        kind: "table",
        id: `table-${index}`,
        label: table.label,
        gist: optionalText(table.gist),
        text: optionalText(table.text),
        columns: columnHeads.map(headOf),
        rows,
        outcomes: filled,
        changedCount: filled.filter((outcome) => outcome.isChanged).length,
      };
    };

    const addedTopicOf = (added, index, context) => ({
      kind: "added",
      id: `added-${index}`,
      label: added.label,
      ...sidesOf(added, context),
      tests: testEvidenceOf(added.tests, context.testAt),
      primers: valuesIn(context.primerPositionAt, added.primers),
    });

    /** 仕様の場所(変わったこと・変わらないことで共通のパス・位置・文)。 */
    const specOf = (spec) => ({ path: spec.path, locator: spec.locator, text: spec.text });

    /** 変えた仕様の場所。`destinations` は `shas` を書いた順の届く先で、行の範囲を持たないのでファイルまでしか届かない。 */
    const changedSpecOf = (spec, destinationsOf) => ({
      ...specOf(spec),
      destinations: destinationsOf({ path: spec.path, lineRange: null, shas: listOf(spec.shas) }),
    });

    const changedTopicsOf = (changed, context) => {
      if (!isRecord(changed)) return [];
      const specs = listOf(changed.specs).map((spec) => changedSpecOf(spec, context.destinationsOf));
      const relatedIssues = listOf(changed.relatedIssues).map((related) => ({ issue: related.issue, text: related.text }));
      const primers = valuesIn(context.primerPositionAt, changed.primers);
      return [{ kind: "changed", id: "changed", label: Labels.changed, ...sidesOf(changed, context), specs, relatedIssues, primers }];
    };

    const keptTopicsOf = (impact, { testAt }) => {
      const lines = listOf(impact.kept).map((line) => ({ text: line.text, tests: testEvidenceOf(line.tests, testAt) }));
      const specs = listOf(impact.keptSpecs).map(specOf);
      return lines.length === 0 ? [] : [{ kind: "kept", id: "kept", label: Labels.kept, specs, lines }];
    };

    /**
     * 節の中で根拠のテストを挙げている箇所を、節の中の順に並べる。表はマスごと、増えた状況は節ごと、変わらないことは行ごと。
     * @returns `{evidence, cell, placeText}` の並び。`cell` は表のマス(`{row, column}`。表のほかは null)、`placeText` はその箇所の
     *   文(マスの状況・変わらないことの行。増えた状況は null)
     */
    const evidencePlacesOf = (topic) => {
      switch (topic.kind) {
        case "changed":
          return [];
        case "table":
          return topic.outcomes.map((outcome) => ({ evidence: outcome.tests, cell: { row: outcome.row, column: outcome.column }, placeText: outcome.situation }));
        case "added":
          return [{ evidence: topic.tests, cell: null, placeText: null }];
        case "kept":
          return topic.lines.map((line) => ({ evidence: line.tests, cell: null, placeText: line.text }));
      }
    };

    /** 根拠がそのテストを挙げているか(確かめているもの・無いもののどちらで挙げていても)。 */
    const isMentionedIn = (evidence, explainTestId) => [...evidence.verifying, ...evidence.missing].some((test) => test.test.id === explainTestId);

    return Object.freeze({
      /** 使える解説が無いとき。 */
      Unexplained: Object.freeze({ kind: "none" }),
      /**
       * 解説の `impact` を節の並びにする。書かなかった節は作らない(変わらないことの行が 0 件のときは、仕様の場所を書いていても)。
       * @param impact 形の検査を通った解説の `impact`(書いていなければ undefined)
       * @param testAt 解説のテストの id から、テスト画面と同じテストを引く表(`ExplainedMap` の `testAt`)
       * @param entryAt パスから木の項目を引く表(やりとりの両端が図の箱かを見る)
       * @param messages 解説のやりとりを id で引く表
       * @param destinationsOf ファイルの場所(`{path, lineRange, shas}`)から、sha を書いた順の届く先を返す
       * @param primerPositionAt 技術の手引きの節の id から、その節の位置を引く表(`PrimerTopics.positionsOf`)
       * @returns `{kind: "unwritten"}`(`impact` が無い)か `{kind: "written", title, lead, topics}`。変わったことと増えた状況の節の
       *   `primers` は、指した技術の手引きの節の位置(`{tab, index, label}`)を書いた順に並べたもの(`primers` に無い id は外す)
       */
      create: ({ impact, testAt, entryAt, messages, destinationsOf, primerPositionAt }) => {
        if (impact === undefined) return { kind: "unwritten" };
        const context = { testAt, entryAt, messages, destinationsOf, primerPositionAt };
        const topics = [
          ...changedTopicsOf(impact.changed, context),
          ...listOf(impact.tables).map((table, index) => tableTopicOf(table, index, context)),
          ...listOf(impact.added).map((added, index) => addedTopicOf(added, index, context)),
          ...keptTopicsOf(impact, context),
        ];
        return { kind: "written", title: impact.title, lead: impact.lead, topics };
      },
      evidencePlacesOf,
      /**
       * 表で初めに選んでおくマス。行の順で最初の「変わった」マス、それが無ければ先頭のマス。
       * @param topic 表の節
       * @returns `{row, column}`。マスが 1 つも無ければ null
       */
      firstCellOf: (topic) => {
        const outcome = topic.outcomes.find((candidate) => candidate.isChanged) ?? topic.outcomes[0];
        return outcome === undefined ? null : { row: outcome.row, column: outcome.column };
      },
      /**
       * そのテストを根拠に挙げている箇所を、節の順に引く(テストの画面の「この状況を確かめている」)。
       * @param explainTestId 解説のテストの id(テスト画面の中の位置ではない)
       * @returns `{topic, topicLabel, cell, placeText}` の並び(`cell` と `placeText` は `evidencePlacesOf` と同じ)
       */
      mentionsOf: (impactTopics, explainTestId) => {
        if (impactTopics.kind !== "written") return [];
        return impactTopics.topics.flatMap((topic) => evidencePlacesOf(topic)
          .filter((place) => isMentionedIn(place.evidence, explainTestId))
          .map((place) => ({ topic: topic.id, topicLabel: topic.label, cell: place.cell, placeText: place.placeText })));
      },
    });
  })();

  /** 振る舞いと技術の手引きの画面の「今の節」。本文のスクロールの位置から、目次と右の欄が指す節を決める。 */
  const TopicScroll = (() => {
    // 読む線。本文の欄の CSS px で 140(見た目では 140 × 文字の倍率)。本文の末尾には「欄の高さ − 読む線」の余白を CSS で取ってあり(`.topic-body`)、どの節も読む線まで送れる。
    const ReadingLine = 140;
    /** 見た目の px での読む線の位置。 */
    const lineAt = (ratio) => ReadingLine * ratio;
    return Object.freeze({
      /**
       * 読む線(スクロールする領域の上端から、見た目で 140 × 倍率 px)より上に来た最後の節を、今の節にする。
       * @param tops 節の上端の、スクロールする領域の上端からの距離(見た目の px・節の順)
       * @param ratio 本文の欄に掛かっている文字の倍率
       * @returns 今の節の添字。上端が読む線(140 × 倍率 を含む)まで来た最後の節で、どれも来ていなければ最初の節。節が無ければ null
       */
      currentOf: (tops, ratio) => {
        if (tops.length === 0) return null;
        const passed = tops.findLastIndex((top) => top <= lineAt(ratio));
        return passed < 0 ? 0 : passed;
      },
      /**
       * 倍率を変える前に読む線にあった今の節の点を、変えたあとの読む線へ置くときの、節の上端の位置を求める。
       * 点は節の高さに対する割合で持ち、読む線が節の下の隙間にあったときは節の下端(割合 1)にする。
       * @param before 変える前の節の上端(見た目の px)・高さ(見た目の px)・倍率
       * @param after 変えたあとの節の高さ(見た目の px)・倍率
       * @returns 変えたあとの節の上端の、スクロールする領域の上端からの距離(見た目の px)
       */
      keptTopOf: ({ before, after }) => {
        const share = Math.min((lineAt(before.ratio) - before.top) / before.height, 1);
        return lineAt(after.ratio) - share * after.height;
      },
    });
  })();

  /** ページが組み立てに使う解説の形。道筋とその先の値の種類(`Routes`)と、欠けてはいけない道筋(`Required`)で持つ。 */
  const ExplainShape = (() => {
    // 形を見る道筋と、その先の値の種類。`build-pr-explain.py` の Shapes から導いたものと同じ並びで、`pr-explain-core-cases.sh` が
    // 突き合わせる。primers・terms と、features の review・commitStories の featureRanges・calls・actors と、flows の gist・text・
    // beforeSteps・stepChanges・measure の下は Shapes から機械的に導くので、文字列をすべて見る(組み立てが落ちるキーを選り分けない)。
    // 必須の欠けも kind ごとに見る(`Required`)。`Dom.proseParts` と `TermMarks.piecesOf` は文を文字列として割り、抜粋の段は
    // `excerptBoxesOf` が `excerpt` の中を読むので、文字列でない値も欠けた値も組み立てを落とし、ページ全体を出なくする。impact は
    // 構造と、短くして描く sha の並び(`impact.changed.specs[].shas`。文字列でないと組み立てが落ちる)だけを見る(文は文字として
    // 入れるだけなので、表示できている解説を「解説なし」に変えない)。tests の下は Excerpt の中だけ
    // 見る(`ExcerptRows` が強調の要素を読む)。
    const ShapeKinds = Object.freeze({
      record: isRecord,
      records: isListOfRecords,
      ids: isStringList,
      id: isString,
      texts: isStringList,
      text: isString,
    });
    const Routes = Object.freeze([
      ["impact", "record"],
      ["impact.changed", "record"],
      ["impact.changed.before", "records"],
      ["impact.changed.before[].message", "id"],
      ["impact.changed.after", "records"],
      ["impact.changed.after[].message", "id"],
      ["impact.changed.specs", "records"],
      ["impact.changed.specs[].shas", "texts"],
      ["impact.changed.relatedIssues", "records"],
      ["impact.changed.primers", "ids"],
      ["impact.tables", "records"],
      ["impact.tables[].rowHeads", "records"],
      ["impact.tables[].rowHeads[].id", "id"],
      ["impact.tables[].columnHeads", "records"],
      ["impact.tables[].columnHeads[].id", "id"],
      ["impact.tables[].outcomes", "records"],
      ["impact.tables[].outcomes[].rowHead", "id"],
      ["impact.tables[].outcomes[].columnHead", "id"],
      ["impact.tables[].outcomes[].tests", "ids"],
      ["impact.added", "records"],
      ["impact.added[].before", "records"],
      ["impact.added[].before[].message", "id"],
      ["impact.added[].after", "records"],
      ["impact.added[].after[].message", "id"],
      ["impact.added[].tests", "ids"],
      ["impact.added[].primers", "ids"],
      ["impact.kept", "records"],
      ["impact.kept[].tests", "ids"],
      ["impact.keptSpecs", "records"],
      ["primers", "records"],
      ["primers[].id", "id"],
      ["primers[].category", "text"],
      ["primers[].label", "text"],
      ["primers[].gist", "text"],
      ["primers[].passages", "records"],
      ["primers[].passages[].text", "text"],
      ["primers[].passages[].code", "text"],
      ["primers[].passages[].parameters", "records"],
      ["primers[].passages[].parameters[].name", "text"],
      ["primers[].passages[].parameters[].type", "text"],
      ["primers[].passages[].parameters[].text", "text"],
      ["primers[].passages[].parameters[].note", "text"],
      ["primers[].passages[].excerpt", "record"],
      ["primers[].passages[].excerpt.path", "text"],
      ["primers[].passages[].excerpt.emphasis", "records"],
      ["primers[].occurrences", "records"],
      ["primers[].occurrences[].path", "text"],
      ["primers[].occurrences[].lineRange", "record"],
      ["primers[].occurrences[].text", "text"],
      ["primers[].occurrences[].shas", "texts"],
      ["primers[].seeAlso", "ids"],
      ["primers[].tests", "ids"],
      ["primers[].flows", "ids"],
      ["terms", "records"],
      ["terms[].id", "id"],
      ["terms[].label", "text"],
      ["terms[].text", "text"],
      ["features[].review", "texts"],
      ["commitStories[].featureRanges", "records"],
      ["commitStories[].featureRanges[].path", "text"],
      ["commitStories[].featureRanges[].feature", "id"],
      ["commitStories[].featureRanges[].text", "text"],
      ["calls", "record"],
      ["calls.boxes", "records"],
      ["calls.boxes[].id", "id"],
      ["calls.boxes[].name", "text"],
      ["calls.boxes[].role", "text"],
      ["calls.boxes[].module", "text"],
      ["calls.boxes[].was", "text"],
      ["calls.boxes[].now", "text"],
      ["calls.edges", "records"],
      ["calls.edges[].id", "id"],
      ["calls.edges[].from", "id"],
      ["calls.edges[].to", "id"],
      ["calls.edges[].code", "text"],
      ["calls.edges[].was", "text"],
      ["calls.edges[].now", "text"],
      ["calls.gist", "text"],
      ["calls.text", "text"],
      ["calls.review", "texts"],
      ["actors", "records"],
      ["actors[].id", "id"],
      ["actors[].label", "text"],
      ["actors[].role", "text"],
      ["flows[].gist", "text"],
      ["flows[].text", "text"],
      ["flows[].beforeSteps", "ids"],
      ["flows[].stepChanges", "records"],
      ["flows[].stepChanges[].beforeText", "text"],
      ["flows[].stepChanges[].afterText", "text"],
      ["flows[].stepChanges[].change", "text"],
      ["flows[].measure", "record"],
      ["flows[].measure.what", "text"],
      ["flows[].measure.before", "text"],
      ["flows[].measure.after", "text"],
      ["tests[].excerpt.emphasis", "records"],
    ]);
    // 欠けていれば崩れとする道筋。primers・terms の下の必須のキーのうち、値が文(text)か 1 つのオブジェクト(record)のもの。
    // `kinds` は、手前のオブジェクトが kind で持つキーの決まるもの(Variant)なら、そのキーを必須とする kind の並びで、それ以外の
    // kind のオブジェクトには求めない。kind に依らないオブジェクト(Shape)なら null で、どれにも求める。Shapes と Variants から
    // 導いたものと同じ並びで、`pr-explain-core-cases.sh` が突き合わせる。配列は欠けても `listOf` が空として読むので入れない。
    const Required = Object.freeze([
      { route: "primers[].category", kinds: ["language", "codebase"] },
      { route: "primers[].label", kinds: ["language", "codebase"] },
      { route: "primers[].gist", kinds: ["language", "codebase"] },
      { route: "primers[].passages[].text", kinds: ["text", "caution", "memo", "rule", "spec", "history"] },
      { route: "primers[].passages[].code", kinds: ["declaration"] },
      { route: "primers[].passages[].parameters[].name", kinds: null },
      { route: "primers[].passages[].parameters[].type", kinds: null },
      { route: "primers[].passages[].parameters[].text", kinds: null },
      { route: "primers[].passages[].excerpt", kinds: ["excerpt"] },
      { route: "primers[].passages[].excerpt.path", kinds: null },
      { route: "primers[].occurrences[].path", kinds: null },
      { route: "primers[].occurrences[].text", kinds: null },
      { route: "terms[].label", kinds: null },
      { route: "terms[].text", kinds: null },
    ]);

    /** 道筋の先の値を集める。途中が欠けていれば集めない(必須の欠けは `lacks` が見る)。 */
    const valuesAt = (value, steps) => {
      if (steps.length === 0) return [value];
      const [step, ...rest] = steps;
      const { key, isEach } = routeStepOf(step);
      if (!isRecord(value) || value[key] === undefined) return [];
      const inner = value[key];
      if (!isEach) return valuesAt(inner, rest);
      return Array.isArray(inner) ? inner.flatMap((item) => valuesAt(item, rest)) : [];
    };
    /** `Required` の 1 件の道筋の最後の段のキーが、その手前のオブジェクトのうち、そのキーを求めるもの(`kinds`)のどれかに無いか。 */
    const lacks = (explain, { route, kinds }) => {
      const steps = route.split(".");
      const key = steps[steps.length - 1];
      const isAsked = (owner) => isRecord(owner) && (kinds === null || kinds.includes(owner.kind));
      return valuesAt(explain, steps.slice(0, -1)).some((owner) => isAsked(owner) && owner[key] === undefined);
    };
    const depthOf = (route) => route.split(".").length;

    return Object.freeze({
      Routes,
      Required,
      /**
       * ページが組み立てに使う形を見る。
       * @returns 型の違う道筋か、必須のキー(`Required`)が欠けた道筋(`impact.tables[].outcomes` の形)。崩れが 2 か所以上なら最も外側のもの。
       *   崩れていなければ null
       */
      problemOf: (explain) => {
        const mistyped = Routes.filter(([route, kind]) => valuesAt(explain, route.split(".")).some((value) => !ShapeKinds[kind](value))).map(([route]) => route);
        const lacking = Required.filter((required) => lacks(explain, required)).map(({ route }) => route);
        const broken = [...mistyped, ...lacking];
        if (broken.length === 0) return null;
        return broken.reduce((outer, candidate) => (depthOf(candidate) < depthOf(outer) ? candidate : outer));
      },
    });
  })();

  /** 解説の文の中の `` `…` ``(コード)。 */
  const CodeSpans = Object.freeze({
    /**
     * 文を `` ` `` で割り、コードの切れ端とそうでない切れ端を文の順に並べる。閉じていない最後の `` ` `` はコードにせず、文字のまま
     * 前の切れ端につなぐ(閉じているかは、渡した文の単位で決まる)。割り方は `build-pr-explain.py` の `code_spans_of` と同じで、
     * `pr-explain-core-cases.sh` が突き合わせる。
     * @returns `{isCode, text}` の並び。空の切れ端も出す
     */
    create: (text) => {
      const parts = text.split("`");
      const hasUnclosed = parts.length % 2 === 0;
      const paired = hasUnclosed ? [...parts.slice(0, -2), `${parts[parts.length - 2]}\`${parts[parts.length - 1]}`] : parts;
      return paired.map((part, index) => ({ isCode: index % 2 === 1, text: part }));
    },
  });

  /** 技術の手引きの本文に書く用語の印 `[[表示|用語の id]]`。 */
  const TermMarks = (() => {
    // 綴りは `build-pr-explain.py` の `TermMarkPattern` と同じで、`pr-explain-core-cases.sh` が突き合わせる。
    const Pattern = /\[\[([^\[\]|]+)\|([A-Za-z0-9][A-Za-z0-9_-]{0,63})\]\]/g;
    // 印を読む道筋。`build-pr-explain.py` の `routes_with(MarkedText)` と同じ綴り・同じ並びで、`pr-explain-core-cases.sh` が突き合わせる。
    const Routes = Object.freeze(["primers[].gist", "primers[].passages[].text", "primers[].passages[].parameters[].text"]);
    // 節の中の道筋(`primers[].` を外し、段に割ったもの)。
    const InPrimer = Routes.map((route) => route.replace(/^primers\[\]\./, "").split("."));
    /** 道筋の並びの最初の段を、並びの順に重複なく。 */
    const headsOf = (routes) => [...new Set(routes.map(([step]) => step))];
    /** 最初の段が `step` の道筋の、残りの段。 */
    const restsOf = (routes, step) => routes.filter(([head]) => head === step).map(([, ...rest]) => rest);
    const isRouteEnd = (routes) => routes.some((route) => route.length === 0);

    /**
     * 文を、印の外の文字と印に割る。空の文字は出さず、印になっていない `[[` は文字のまま残す。
     * @returns `{kind: "plain", text}` と `{kind: "term", label, id}` の並び(文の順)
     */
    const piecesOf = (text) => {
      const parts = text.split(Pattern);
      const plainAt = (index) => (parts[index] === "" ? [] : [{ kind: "plain", text: parts[index] }]);
      const marks = Array.from({ length: (parts.length - 1) / 3 }, (_, index) => ({ kind: "term", label: parts[index * 3 + 1], id: parts[index * 3 + 2] }));
      return [...plainAt(0), ...marks.flatMap((mark, index) => [mark, ...plainAt(index * 3 + 3)])];
    };

    /**
     * 道筋の先の値を `replace` で置き換える。途中が欠けていれば、その先は置き換えない。
     * @returns 置き換えた写し(`value`)と、置き換えた値を文書の順(道筋の段を並びの順に進む)に並べたもの(`ends`)
     */
    const replacedAlong = (value, routes, replace) => {
      if (isRouteEnd(routes)) {
        const replaced = replace(value);
        return { value: replaced, ends: [replaced] };
      }
      return headsOf(routes).reduce((sofar, step) => {
        const { key, isEach } = routeStepOf(step);
        if (sofar.value[key] === undefined) return sofar;
        const rests = restsOf(routes, step);
        const items = (isEach ? sofar.value[key] : [sofar.value[key]]).map((item) => replacedAlong(item, rests, replace));
        const inner = items.map((item) => item.value);
        return { value: { ...sofar.value, [key]: isEach ? inner : inner[0] }, ends: [...sofar.ends, ...items.flatMap((item) => item.ends)] };
      }, { value, ends: [] });
    };

    return Object.freeze({
      Pattern,
      Routes,
      piecesOf,
      /**
       * 節の、印を読む道筋の先の文を `piecesOf` の並びに置き換えた写しを返す。
       * @param primer 形の検査を通った解説の primers の 1 件
       */
      withPieces: (primer) => replacedAlong(primer, InPrimer, piecesOf).value,
      /**
       * 節の印が指す用語の id を、文書の順(要するに → 段を書いた順。段の中は text → 引数の順)に重複なく並べる。JSON に
       * キーを書いた順には依らない。
       * @param primer `withPieces` を通した節
       */
      termIdsOf: (primer) => {
        const pieces = replacedAlong(primer, InPrimer, (written) => written).ends.flat();
        return [...new Set(pieces.filter((piece) => piece.kind === "term").map((piece) => piece.id))];
      },
    });
  })();

  /** 抜粋の行。 */
  const ExcerptRows = Object.freeze({
    /**
     * 抜粋の行を、ファイルの行番号と強調の有無と字句にする。
     *
     * 強調の要素がオブジェクトかどうかは、骨組みの検査が見ている。start / end が数でなくても組み立ては落ちない(どの行が強調に
     * なるかは比較の型変換しだい。数かどうかは解説の検査が落とす)。
     * @param excerpt 中身(`text`)と、あれば開いた行(`openingLine`)を足した抜粋
     * @returns `{number, text, isEmphasized, tokens}` の並び。`number` は抜粋の `start` から数え、強調を省けばどの行も強調しない。
     *   `tokens` は 1 行目から読み進めた字句で、開いた行が文字列ならその埋め込みの中から読み始める
     */
    create: (excerpt) => {
      const emphasis = listOf(excerpt.emphasis);
      const grammar = Tokenizer.grammarOf(excerpt.path);
      const texts = excerpt.text.split("\n");
      const read = Tokenizer.tokenizeLines(texts, grammar, Tokenizer.startAfter(isString(excerpt.openingLine) ? excerpt.openingLine : null, grammar));
      return texts.map((text, index) => {
        const number = excerpt.start + index;
        return { number, text, isEmphasized: emphasis.some((span) => isWithin(number, span)), tokens: read[index].tokens };
      });
    },
  });

  /**
   * 技術の手引きの節の並び。解説の `primers` を、kind ごとのタブ(言語・フレームワーク / この PR の実装)に、書いた順で分ける。
   * 用語は `terms` を印から引き、節の用語とタブの用語集はどちらも印から導く(書かせない)。
   */
  const PrimerTopics = (() => {
    const PrimerKinds = Object.freeze({ Language: "language", Codebase: "codebase" });
    // この PR の実装の節で、状態を省いたもの(前からある)。言語・フレームワークの節は状態を持たない(null)。
    const Existing = "existing";
    // 段の kind。順と綴りは `build-pr-explain.py` の Variants の Passage と同じで、`pr-explain-core-cases.sh` が突き合わせる。
    const PassageKinds = Object.freeze(["text", "declaration", "parameters", "excerpt", ...Object.keys(Vocabulary.remarkKinds)]);

    /** 印を、用語に解く。terms に無い id の印は、表示の文字のまま(plain)にする。 */
    const resolvedPiecesOf = (pieces, termAt) => listOf(pieces).map((piece) => {
      if (piece.kind === "plain") return piece;
      if (!termAt.has(piece.id)) return { kind: "plain", text: piece.label };
      return { kind: "term", label: piece.label, term: termAt.get(piece.id) };
    });

    /** 段を描く形にそろえる。知らない kind の段は外す。 */
    const passagesOf = (passage, resolve) => {
      if (Object.hasOwn(Vocabulary.remarkKinds, passage.kind)) {
        const remark = Vocabulary.remarkKinds[passage.kind];
        return [{ kind: "remark", remark: passage.kind, label: remark.label, pieces: resolve(passage.text) }];
      }
      switch (passage.kind) {
        case "text":
          return [{ kind: "text", pieces: resolve(passage.text) }];
        case "declaration":
          return [{ kind: "declaration", code: passage.code }];
        case "parameters":
          return [{ kind: "parameters", parameters: listOf(passage.parameters).map((parameter) => ({ name: parameter.name, type: parameter.type, pieces: resolve(parameter.text), note: parameter.note ?? null })) }];
        case "excerpt":
          return [{ kind: "excerpt", excerpt: passage.excerpt }];
      }
      return [];
    };

    /** 出てくる場所。`destinations` は `shas` を書いた順の届く先(sha・パス・届き方)。 */
    const occurrenceOf = (occurrence, destinationsOf) => {
      const lineRange = occurrence.lineRange ?? null;
      const destinations = destinationsOf({ path: occurrence.path, lineRange, shas: listOf(occurrence.shas) });
      return { path: occurrence.path, lineRange, text: occurrence.text, destinations };
    };

    const statusOf = (primer) => {
      if (primer.kind !== PrimerKinds.Codebase) return null;
      return Object.hasOwn(Vocabulary.primerStatuses, primer.status) ? primer.status : Existing;
    };

    const topicOf = (primer, { termAt, positionAt, testAt, flows, destinationsOf }) => {
      const marked = TermMarks.withPieces(primer);
      const resolve = (pieces) => resolvedPiecesOf(pieces, termAt);
      return {
        id: primer.id,
        kind: primer.kind,
        category: primer.category,
        label: primer.label,
        gist: resolve(marked.gist),
        passages: listOf(marked.passages).flatMap((passage) => passagesOf(passage, resolve)),
        occurrences: listOf(primer.occurrences).map((occurrence) => occurrenceOf(occurrence, destinationsOf)),
        seeAlso: valuesIn(positionAt, primer.seeAlso),
        terms: valuesIn(termAt, TermMarks.termIdsOf(marked)),
        status: statusOf(primer),
        tests: testEvidenceOf(primer.tests, testAt),
        flows: valuesIn(flows, primer.flows),
      };
    };

    /** タブの節と用語集。用語集は、節の用語を最初に出た順に重複なくつなぐ(1 つも無ければ null)。 */
    const tabOf = (topics) => {
      const terms = [...new Map(topics.flatMap((topic) => topic.terms).map((term) => [term.id, term])).values()];
      return { topics, glossary: terms.length === 0 ? null : { terms } };
    };

    /** 解説の `primers` を、kind ごとのタブに書いた順で分ける。知らない kind の節はどのタブにも入れない。 */
    const byTabOf = (primers) => Object.fromEntries(Object.values(PrimerKinds).map((tab) => [tab, listOf(primers).filter((primer) => primer.kind === tab)]));

    /**
     * 節の id から、その節の位置を引く表。
     * @param primers 形の検査を通った解説の `primers`(書いていなければ undefined)
     * @returns 節の id → `{tab, index, label}`(タブ・タブの中の位置・題)。書いていなければ空の表
     */
    const positionsOf = (primers) => new Map(Object.entries(byTabOf(primers)).flatMap(([tab, list]) => list.map((primer, index) => [primer.id, { tab, index, label: primer.label }])));

    return Object.freeze({
      PrimerKinds,
      Existing,
      PassageKinds,
      positionsOf,
      /** 使える解説が無いとき。 */
      Unexplained: Object.freeze({ kind: "none" }),
      /**
       * 最初に開くタブ。
       * @param primerTopics `create` が返した、書かれている技術の手引き
       * @returns 言語・フレームワークに節があればそれ、無くてこの PR の実装にあればそれ。どちらにも無ければ言語・フレームワーク
       */
      firstTabOf: (primerTopics) => {
        const hasLanguage = primerTopics.tabs[PrimerKinds.Language].topics.length > 0;
        const hasOnlyCodebase = !hasLanguage && primerTopics.tabs[PrimerKinds.Codebase].topics.length > 0;
        return hasOnlyCodebase ? PrimerKinds.Codebase : PrimerKinds.Language;
      },
      /**
       * 解説の `primers` を、タブごとの節の並びにする。
       * @param primers 形の検査を通った解説の `primers`(書いていなければ undefined)
       * @param terms 解説の `terms`(書いていなければ undefined)
       * @param testAt 解説のテストの id から、テスト画面と同じテストを引く表(`ExplainedMap` の `testAt`)
       * @param flows 解説の流れを id で引く表
       * @param destinationsOf ファイルの場所(`{path, lineRange, shas}`)から、sha を書いた順の届く先を返す
       * @returns `{kind: "unwritten"}`(`primers` が無いか空)か `{kind: "written", tabs}`。`tabs` はタブ(kind)ごとの
       *   `{topics, glossary}`。節の `status` は、この PR の実装の節なら added / changed / `Existing`、言語・フレームワークの節は null
       */
      create: ({ primers, terms, testAt, flows, destinationsOf }) => {
        const written = listOf(primers);
        if (written.length === 0) return { kind: "unwritten" };
        const termAt = new Map(listOf(terms).map((term) => [term.id, { id: term.id, label: term.label, text: term.text }]));
        const byTab = byTabOf(written);
        const context = { termAt, positionAt: positionsOf(written), testAt, flows, destinationsOf };
        return { kind: "written", tabs: Object.fromEntries(Object.entries(byTab).map(([tab, list]) => [tab, tabOf(list.map((primer) => topicOf(primer, context)))])) };
      },
    });
  })();

  /** 変更の地図(change-map.json)と解説(explain.json)の合流。 */
  const ExplainedMap = (() => {
    const MapVersion = 2;
    const ExplainVersion = 1;
    const ExplainListKeys = ["features", "layerRoles", "concepts", "messages", "flows", "commitStories", "suites", "tests"];

    const isBrokenList = (value) => value !== undefined && !isListOfRecords(value);
    const explainListOf = (explain, key) => (explain === null ? [] : listOf(explain[key]));
    const sumOf = (values) => values.reduce((sum, value) => sum + (typeof value === "number" ? value : 0), 0);
    const missing = (reason) => ({ kind: "missing", reason });

    const parsedJson = (text) => {
      try {
        return { isParsed: true, value: JSON.parse(text) };
      } catch (error) {
        return { isParsed: false, detail: error.message };
      }
    };

    /**
     * ページが組み立てに使う大まかな形だけを見る。細かい形は公開する前に build-pr-explain.py が見ている。
     * @returns 型が違うか、必須なのに欠けたキー(`impact`・`primers`・`terms`・`features[].review`・`commitStories[].featureRanges`・
     *   `calls`・`actors`・flows の gist・text・beforeSteps・stepChanges・measure・`tests[].excerpt.emphasis` は道筋)。どちらも無ければ null
     */
    const shapeProblemOf = (explain) => {
      const overview = explain.overview;
      const hasOverview = isRecord(overview) && Array.isArray(overview.before) && Array.isArray(overview.after);
      if (typeof explain.sha !== "string") return "sha";
      if (!hasOverview) return "overview";
      const broken = ExplainListKeys.find((key) => isBrokenList(explain[key]));
      return broken === undefined ? ExplainShape.problemOf(explain) : broken;
    };

    /**
     * 読み込んだ解説を、使える解説か「解説なし」とその理由にする。
     * @param source `{kind: "text", text}`(読めた中身)/ `{kind: "absent"}`(置かれていない)/ `{kind: "failed", detail}`(読み込みの失敗)
     * @param pr 地図の PR 番号
     */
    const readingOf = (source, pr) => {
      if (source.kind === "absent") return missing({ kind: "absent" });
      if (source.kind === "failed") return missing({ kind: "unreadable", detail: source.detail });
      const json = parsedJson(source.text);
      if (!json.isParsed) return missing({ kind: "unreadable", detail: json.detail });
      const explain = json.value;
      if (!isRecord(explain)) return missing({ kind: "shape", key: null });
      if (explain.version !== ExplainVersion) return missing({ kind: "version", actual: explain.version });
      if (explain.pr !== pr) return missing({ kind: "pr", actual: explain.pr });
      const problem = shapeProblemOf(explain);
      return problem === null ? { kind: "explained", explain } : missing({ kind: "shape", key: problem });
    };

    /**
     * 箱と木に出すときのファイルの名前。`index.*` は名前がありふれているので親フォルダを付ける。
     * @returns `Hub.ts` / `px/index.ts` の形
     */
    const fileNameOf = (path) => {
      const parts = path.split("/");
      const name = parts[parts.length - 1];
      const isIndex = /^index\./.test(name) && parts.length > 1;
      return isIndex ? `${parts[parts.length - 2]}/${name}` : name;
    };

    const entryOf = (file, layer, concept) => {
      const hasFeature = concept !== null && typeof concept.feature === "string";
      const isDrawn = concept === null || concept.graph !== false;
      return {
        path: file.path,
        layer,
        changed: file.changed,
        status: file.changed ? file.status : null,
        oldPath: file.oldPath ?? null,
        additions: file.additions ?? null,
        deletions: file.deletions ?? null,
        target: file.target ?? null,
        conceptName: concept === null ? null : concept.name,
        fileName: fileNameOf(file.path),
        feature: hasFeature ? concept.feature : null,
        inGraph: isDrawn,
        concept,
      };
    };

    /** 木に出すファイル。変更ファイルと、concepts が名指ししたファイル(変更していなくても)。 */
    const entriesOf = (groups, conceptOf) => groups.flatMap((group) => group.files
      .filter((file) => file.changed || conceptOf.has(file.path))
      .map((file) => entryOf(file, group.label, conceptOf.get(file.path) ?? null)));

    /** 依存の線の向こう側にあって箱にならないファイル(「ほかに n ファイル」に畳むもの)を、箱ごとに足す。 */
    const withOthers = (entries, dependencies) => {
      const boxes = new Set(entries.filter((entry) => entry.inGraph).map((entry) => entry.path));
      const neighborsOf = (path) => dependencies.flatMap((edge) => {
        if (edge.from === path) return [edge.to];
        if (edge.to === path) return [edge.from];
        return [];
      });
      return entries.map((entry) => ({ ...entry, others: [...new Set(neighborsOf(entry.path))].filter((path) => !boxes.has(path)).sort() }));
    };

    const pathsOf = (entries) => entries.filter((entry) => entry.inGraph).map((entry) => entry.path);
    const treePathsOf = (entries) => entries.map((entry) => entry.path);

    const layerGroupsOf = (groups, entries, layerRoles) => groups.map((group) => {
      const members = entries.filter((entry) => entry.layer === group.label);
      const named = new Set(treePathsOf(members));
      const layerRole = layerRoles.find((candidate) => candidate.layer === group.label);
      return {
        kind: "layer",
        layer: group.label,
        role: layerRole === undefined ? null : layerRole.role,
        paths: pathsOf(members),
        treePaths: treePathsOf(members),
        others: group.files.map((file) => file.path).filter((path) => !named.has(path)),
      };
    });

    const featureGroupsOf = (features, entries) => {
      const known = new Set(features.map((feature) => feature.id));
      const assigned = features.map((feature) => {
        const members = entries.filter((entry) => entry.feature === feature.id);
        return { kind: "feature", feature, paths: pathsOf(members), treePaths: treePathsOf(members) };
      });
      const unassignedMembers = entries.filter((entry) => !known.has(entry.feature));
      if (unassignedMembers.length === 0) return assigned;
      return [...assigned, { kind: "unassigned", paths: pathsOf(unassignedMembers), treePaths: treePathsOf(unassignedMembers) }];
    };

    /** まとめ方ごとの組。`layer` は常にあり、`feature` は解説が features を持つときだけある。 */
    const groupingsOf = ({ groups, entries, explain }) => {
      const features = explainListOf(explain, "features");
      const byLayer = layerGroupsOf(groups, entries, explainListOf(explain, "layerRoles"));
      if (features.length === 0) return { layer: byLayer };
      return { layer: byLayer, feature: featureGroupsOf(features, entries) };
    };

    /**
     * 解説がいつの時点のものか。
     * @param explainedAt 解説の sha が地図のコミットの何番目か(無ければ -1)
     */
    const freshnessOf = ({ explain, head, commits, explainedAt }) => {
      if (explain === null) return { kind: "none" };
      if (explain.sha === head) return { kind: "latest", sha: explain.sha };
      if (explainedAt < 0) return { kind: "unknown", sha: explain.sha };
      return { kind: "stale", sha: explain.sha, after: commits.length - 1 - explainedAt };
    };

    /**
     * ファイルの場所(出てくる場所・仕様の場所)の sha ごとに、変更の経緯のどこまで届くかを決める関数を作る。
     * @param commits 地図のコミット(古い順)
     * @param explainedAt 解説の sha が地図のコミットの何番目か(無ければ -1)
     * @returns `{path, lineRange, shas}` を受け取り、`shas` を書いた順の届く先 `{sha, path, reach}` を返す関数。届き方(`reach`)は、
     *   地図に無い sha は `unmapped`、マージコミットは `merge`、そのコミットが `path` のファイルを変えていなければ `untouched`。
     *   行まで(`line`)届くのは、`lineRange` があり、そのコミットが解説の sha 以前で、あいだ(解説の sha を含む)にマージコミットも
     *   `path` を変えたコミットも無いときだけで、ほかは `file`
     */
    const destinationsOfIn = (commits, explainedAt) => {
      const reachOf = ({ sha, path, lineRange }) => {
        const index = commits.findIndex((commit) => commit.sha === sha);
        if (index < 0) return { kind: "unmapped" };
        const commit = commits[index];
        if (commit.merge) return { kind: "merge" };
        if (!commit.files.some((file) => file.path === path)) return { kind: "untouched" };
        const shiftsLines = (later) => later.merge || later.files.some((file) => file.path === path || file.oldPath === path);
        const isLatestChange = index <= explainedAt && !commits.slice(index + 1, explainedAt + 1).some(shiftsLines);
        const reachesLine = lineRange !== null && isLatestChange;
        return reachesLine ? { kind: "line", lineRange } : { kind: "file" };
      };
      return ({ path, lineRange, shas }) => shas.map((sha) => ({ sha, path, reach: reachOf({ sha, path, lineRange }) }));
    };

    const commitsOf = ({ commits, explain, explainedAt }) => {
      const stories = new Map(explainListOf(explain, "commitStories").map((story) => [story.sha, story]));
      return commits.map((commit, index) => {
        const additions = sumOf(commit.files.map((file) => file.additions));
        const deletions = sumOf(commit.files.map((file) => file.deletions));
        const afterExplained = explainedAt >= 0 && index > explainedAt;
        return { ...commit, additions, deletions, story: stories.get(commit.sha) ?? null, afterExplained };
      });
    };

    const testKeyOf = (file, name) => JSON.stringify([file, name]);

    /**
     * テストの一覧。解説があれば解説のテストを並べ、解説に無い追加と、削除は地図から足す。
     * 追加か既存かは、テスト名を調べたファイルなら地図の追加にあるかで、このブランチで足したファイルなら追加、
     * それ以外のファイル(テスト名を調べていない)は判定なし(`unjudged`)にする。
     * @param addedFiles このブランチで足したファイルのパス
     */
    const testsOf = ({ mapTests, explain, targetOf, addedFiles }) => {
      const added = new Set(mapTests.added.map((test) => testKeyOf(test.file, test.name)));
      const examined = new Set(mapTests.files);
      const fromMap = (status) => (test) => ({ name: test.name, file: test.file, status, targets: targetOf(test.file), test: null, suite: null });
      const removed = mapTests.removed.map(fromMap("removed"));
      const suites = new Map(explainListOf(explain, "suites").map((suite) => [suite.id, suite]));
      const statusOf = (test, file) => {
        if (test.todo === true) return "todo";
        if (examined.has(file)) return added.has(testKeyOf(file, test.name)) ? "new" : "old";
        return addedFiles.has(file) ? "new" : "unjudged";
      };
      const explained = explainListOf(explain, "tests").map((test) => {
        const suite = suites.get(test.suite) ?? null;
        const file = suite === null ? null : suite.file;
        return { name: test.name, file, status: statusOf(test, file), targets: Array.isArray(test.targets) ? test.targets : [], test, suite };
      });
      const covered = new Set(explained.map((test) => testKeyOf(test.file, test.name)));
      const unexplained = mapTests.added.filter((test) => !covered.has(testKeyOf(test.file, test.name))).map(fromMap("new"));
      return [...explained, ...unexplained, ...removed];
    };

    /** 流れ図のカードの絵。語彙(`Vocabulary.cardIcons`)に無い綴りと書いていないものは null(箱の絵)。 */
    const cardIconOf = (icon) => (isString(icon) && Object.hasOwn(Vocabulary.cardIcons, icon) ? icon : null);

    /**
     * 解説から、ページが名前で引く一覧。`endNames` と `endIcons` は、やりとりの端(concepts の path か actors の id)の名前と
     * 流れ図のカードの絵。名前は concept の name、無ければ actor の label。絵は書いた icon で、書かなければ actor は person、
     * concept は null(箱の絵)。
     */
    const lookupOf = (explain) => {
      const concepts = explainListOf(explain, "concepts");
      const actors = explainListOf(explain, "actors");
      return {
        conceptNames: new Map(concepts.map((concept) => [concept.path, concept.name])),
        flows: new Map(explainListOf(explain, "flows").map((flow) => [flow.id, flow])),
        messages: new Map(explainListOf(explain, "messages").map((message) => [message.id, message])),
        actors: new Map(actors.map((actor) => [actor.id, actor])),
        endNames: new Map([...actors.map((actor) => [actor.id, actor.label]), ...concepts.map((concept) => [concept.path, concept.name])]),
        endIcons: new Map([
          ...actors.map((actor) => [actor.id, actor.icon === undefined ? "person" : cardIconOf(actor.icon)]),
          ...concepts.map((concept) => [concept.path, cardIconOf(concept.icon)]),
        ]),
      };
    };

    /**
     * 地図と解説を合わせる。解説が無い・使えないときも、地図だけで 5 画面の材料を作る。
     * @param map change-map.json の中身(`isReadableMap` が真のもの)
     * @param source 解説の読み込み結果(`readingOf` の source と同じ)
     * @returns 画面が使う材料。解説の状態は `reading`(`explained` / `missing` と理由)と `freshness` に出る。
     *   `explain` は使える解説(無ければ null)、`lookup` はそこから名前で引く一覧、`entryAt` はパスから木の項目を、
     *   `testAt` は解説のテストの id から `tests` の 1 件を引く表、`commitAt` は地図のコミットを sha で引く表、`impactTopics` は
     *   振る舞いの節の並び(`ImpactTopics`。振る舞いとテストの 2 画面が読む。指した技術の手引きの節は、解説の `primers` から引いた位置で持つ)、`primerTopics` は技術の手引きの節の並び(`PrimerTopics`)
     */
    const create = (map, source) => {
      const reading = readingOf(source, map.pr);
      const explain = reading.kind === "explained" ? reading.explain : null;
      const concepts = explainListOf(explain, "concepts");
      const conceptOf = new Map(concepts.map((concept) => [concept.path, concept]));
      const files = map.groups.flatMap((group) => group.files);
      const mapPaths = new Set(files.map((file) => file.path));
      const entries = withOthers(entriesOf(map.groups, conceptOf), map.dependencies);
      const targets = new Map(files.map((file) => [file.path, file.target ?? null]));
      const targetOf = (path) => (targets.get(path) ? [targets.get(path)] : []);
      const addedFiles = new Set(files.filter((file) => file.changed && file.status === "A").map((file) => file.path));
      const explainedAt = explain === null ? -1 : map.commits.findIndex((commit) => commit.sha === explain.sha);
      const changed = entries.filter((entry) => entry.changed);
      const commits = commitsOf({ commits: map.commits, explain, explainedAt });
      const ownCommits = commits.filter((commit) => !commit.merge);
      const lookup = lookupOf(explain);
      const tests = testsOf({ mapTests: map.tests, explain, targetOf, addedFiles });
      const entryAt = new Map(entries.map((entry) => [entry.path, entry]));
      const testAt = new Map(tests.filter((test) => test.test !== null).map((test) => [test.test.id, test]));
      const destinationsOf = destinationsOfIn(map.commits, explainedAt);
      return Object.freeze({
        map: { pr: map.pr, head: map.head, mergeBase: map.mergeBase, headBranch: map.headBranch, baseBranch: map.baseBranch },
        reading,
        explain,
        lookup,
        freshness: freshnessOf({ explain, head: map.head, commits: map.commits, explainedAt }),
        entries,
        entryAt,
        dependencies: map.dependencies,
        groupings: groupingsOf({ groups: map.groups, entries, explain }),
        unmappedConcepts: concepts.filter((concept) => !mapPaths.has(concept.path)),
        commits,
        commitAt: new Map(commits.map((commit) => [commit.sha, commit])),
        strayStories: explainListOf(explain, "commitStories").filter((story) => !map.commits.some((commit) => commit.sha === story.sha)),
        tests,
        testAt,
        impactTopics: explain === null
          ? ImpactTopics.Unexplained
          : ImpactTopics.create({ impact: explain.impact, testAt, entryAt, messages: lookup.messages, destinationsOf, primerPositionAt: PrimerTopics.positionsOf(explain.primers) }),
        primerTopics: explain === null
          ? PrimerTopics.Unexplained
          : PrimerTopics.create({ primers: explain.primers, terms: explain.terms, testAt, flows: lookup.flows, destinationsOf }),
        totals: {
          files: changed.length,
          additions: sumOf(changed.map((entry) => entry.additions)),
          deletions: sumOf(changed.map((entry) => entry.deletions)),
          commits: map.commits.length,
          // 変更の経緯のヘッダの数。ファイルごとの差し引きと違い、あとのコミットで書き直した行もコミットごとに数える。
          commitLines: { additions: sumOf(ownCommits.map((commit) => commit.additions)), deletions: sumOf(ownCommits.map((commit) => commit.deletions)) },
        },
      });
    };

    return Object.freeze({
      create,
      fileNameOf,
      /** @returns このページが読める版(2)の地図か。違えば画面を組まず、版を添えて案内を出す */
      isReadableMap: (map) => isRecord(map) && map.version === MapVersion,
      /**
       * 箱と木に出す名前。
       * @param naming `concept`(concept 名。無ければファイル名)/ `file`(ファイル名)
       */
      nameOf: (entry, naming) => (naming === "concept" && entry.conceptName !== null ? entry.conceptName : entry.fileName),
    });
  })();

  /** コミットの差分。patch を hunk の行に分け、行への注釈と機能の範囲を hunk に割り当て、行を字句に分け、コードの表示では消した行を畳む。 */
  const CommitDiff = (() => {
    const HunkHeader = /^@@ -(\d+)(?:,\d+)? \+(\d+)(?:,\d+)? @@/;
    const ChangeSigns = new Set(["+", "-"]);

    const sideOf = (span) => (span.side === "old" ? "old" : "new");
    const numberOn = (line, side) => (side === "old" ? line.oldNo : line.newNo);

    /**
     * 注釈・機能の範囲の行の範囲に、その行が入るか。行番号は範囲の `side` の側で見る。
     * @param span 注釈か機能の範囲(`side` / `start` / `end`)
     * @param line hunk の行(`oldNo` / `newNo` は、その側に無い行なら null)
     */
    const hasLine = (span, line) => {
      const number = numberOn(line, sideOf(span));
      return number !== null && isWithin(number, span);
    };

    /** hunk の見出しから後の 1 行を、記号と両側の行番号の付いた行にする。 */
    const lineOf = (raw, next) => {
      const sign = ChangeSigns.has(raw[0]) ? raw[0] : " ";
      return { sign, oldNo: sign === "+" ? null : next.old, newNo: sign === "-" ? null : next.new, text: raw.slice(1) };
    };

    /** 地図の開いた行の 1 つ。オブジェクトのときだけ読み、`old` / `new` はそれぞれ文字列でなければ null にする。 */
    const openingLinesOf = (hunkOpening) => {
      const openingLineOn = (side) => (isRecord(hunkOpening) && isString(hunkOpening[side]) ? hunkOpening[side] : null);
      return { old: openingLineOn("old"), new: openingLineOn("new") };
    };

    // 地図とページは pr-explain.yml の put-map が同じ checkout から一緒に置くので、開いた行は普通は欠けない。ただし外から読む JSON なので、形を確かめてから読む。
    // 開いた行は hunk の並び順で対応させる。`@@` の読み方はここ(`HunkHeader`)と地図の `HunkHeader` の 2 か所にあり、ずれると隣の hunk の色になるので、数が合わなければすべて頭から読む。
    /**
     * patch を hunk に分け、n 番目の hunk に地図の開いた行の n 番目を `openingLines` として付ける。`\ No newline at end of file` は
     * 行ではないので落とす。
     * @param hunkOpeningLines 地図のファイルの `hunkOpeningLines`。配列で長さが hunk の数と同じときだけ読み、そうでなければどの hunk も
     *   `{old: null, new: null}`
     */
    const hunksOf = (patch, hunkOpeningLines) => {
      const hunks = [];
      let next = null;
      for (const raw of patch.split("\n")) {
        const header = HunkHeader.exec(raw);
        if (header !== null) {
          next = { old: Number(header[1]), new: Number(header[2]) };
          hunks.push({ header: raw, lines: [] });
          continue;
        }
        const isLine = next !== null && !raw.startsWith("\\");
        if (!isLine) continue;
        const line = lineOf(raw, next);
        next = { old: next.old + (line.oldNo === null ? 0 : 1), new: next.new + (line.newNo === null ? 0 : 1) };
        hunks[hunks.length - 1].lines.push(line);
      }
      const fits = Array.isArray(hunkOpeningLines) && hunkOpeningLines.length === hunks.length;
      return hunks.map((hunk, index) => ({ ...hunk, openingLines: openingLinesOf(fits ? hunkOpeningLines[index] : null) }));
    };

    /** 注釈に、コミットの中で通した番号(`from` の次から)を付ける。 */
    const numbered = (notes, from) => notes.map((note, index) => ({ ...note, side: sideOf(note), n: from + index + 1 }));

    /**
     * まとまり(hunk か消したファイルの本文)の機能。入る範囲のうち最初に書いたものの機能にする。
     * @param ranges そのファイルへの機能の範囲(書いた順)
     * @param covers 範囲がそのまとまりに入るか
     * @returns `{id, texts}`(`texts` はその機能の入った範囲の文を、書いた順に重複なく並べたもの)。どの範囲も入らなければ null
     */
    const featureOf = (ranges, covers) => {
      const covering = ranges.filter(covers);
      if (covering.length === 0) return null;
      const id = covering[0].feature;
      return { id, texts: [...new Set(covering.filter((range) => range.feature === id).map((range) => range.text))] };
    };

    /** @param from そのファイルの最初の注釈の番号の手前(コミットの中で前のファイルの注釈の数) */
    const hunkBodyOf = (file, { notes, ranges }, from) => {
      const hunks = hunksOf(file.patch, file.hunkOpeningLines);
      const placedAt = notes.map((note) => hunks.findIndex((hunk) => hunk.lines.some((line) => hasLine(note, line))));
      const placed = hunks.map((hunk, index) => notes.filter((note, noteIndex) => placedAt[noteIndex] === index));
      const firstNumbers = placed.map((group, index) => from + placed.slice(0, index).reduce((sum, earlier) => sum + earlier.length, 0));
      const placedCount = placed.reduce((sum, group) => sum + group.length, 0);
      const remaining = file.truncated === true ? file.patchLines - file.patch.split("\n").length : 0;
      const featureOfHunk = (hunk) => featureOf(ranges, (range) => hunk.lines.some((line) => hasLine(range, line)));
      return {
        body: { kind: "hunks", hunks: hunks.map((hunk, index) => ({ ...hunk, notes: numbered(placed[index], firstNumbers[index]), feature: featureOfHunk(hunk) })), remaining },
        unplaced: numbered(notes.filter((note, index) => placedAt[index] < 0), from + placedCount),
      };
    };

    /** patch が null のとき。消したファイルなら、変更前の行への注釈と機能の範囲をそこに付ける。 */
    const missingBodyOf = (file, { notes, ranges }, from) => {
      if (file.status !== "D") return { body: { kind: "binary" }, unplaced: numbered(notes, from) };
      const lines = typeof file.deletions === "number" ? file.deletions : null;
      const isOnDeletedLine = (span) => sideOf(span) === "old" && (lines === null || span.start <= lines);
      const onDeleted = notes.filter(isOnDeletedLine);
      return {
        body: { kind: "deleted", lines, notes: numbered(onDeleted, from), feature: featureOf(ranges, isOnDeletedLine) },
        unplaced: numbered(notes.filter((note) => !isOnDeletedLine(note)), from + onDeleted.length),
      };
    };

    /**
     * @param spans そのファイルへの注釈(`notes`)と機能の範囲(`ranges`)
     * @param from そのファイルの最初の注釈の番号の手前
     */
    const fileOf = (file, spans, from) => {
      const shown = { path: file.path, oldPath: file.oldPath ?? null, status: file.status, additions: file.additions, deletions: file.deletions };
      if (file.patch === "") return { ...shown, body: { kind: "unchanged" }, unplaced: numbered(spans.notes, from) };
      if (file.patch === null) return { ...shown, ...missingBodyOf(file, spans, from) };
      return { ...shown, ...hunkBodyOf(file, spans, from) };
    };

    const storyListOf = (story, key) => (story !== null && Array.isArray(story[key]) ? story[key] : []);

    return Object.freeze({
      hasLine,
      /**
       * コミットのファイルごとに差分を組み、解説の注釈を `side` の行番号が入る最初の hunk に付ける。番号はコミットの中で、
       * ファイルの順に「hunk(または消したファイルの本文)の注釈 → 差分に出ていない注釈」と通す。どの hunk にも入らない注釈は
       * `unplaced` に回す。hunk と消したファイルの本文には、行が 1 つでも入る機能の範囲(`featureRanges`)から機能を付ける。
       *
       * 番号をファイルの中で通さないのは、機能の表示で同じまとまりだけを抜き出しても番号が変わらないようにするため。
       * @param commit 地図のコミット(マージは files が空)
       * @param story そのコミットの commitStory。無ければ null
       * @returns `files`(本文の `body` は `hunks` / `unchanged`(patch が空)/ `deleted` / `binary`)と、そのコミットに無い
       *   パスへの注釈 `strayNotes`(番号なし)。`hunks` の hunk は `header` / `lines` / `openingLines`(変更前と変更後の開いた行)/
       *   `notes` / `feature` を持ち、`deleted` の本文は `lines` / `notes` / `feature` を持つ。`feature` は `{id, texts}` か null
       */
      create: (commit, story) => {
        const notes = storyListOf(story, "notes");
        const ranges = storyListOf(story, "featureRanges");
        const paths = new Set(commit.files.map((file) => file.path));
        const notesOn = (file) => notes.filter((item) => item.path === file.path);
        const firstNumbers = commit.files.map((file, index) => commit.files.slice(0, index).reduce((sum, earlier) => sum + notesOn(earlier).length, 0));
        return {
          files: commit.files.map((file, index) => fileOf(file, { notes: notesOn(file), ranges: ranges.filter((range) => range.path === file.path) }, firstNumbers[index])),
          strayNotes: notes.filter((item) => !paths.has(item.path)),
        };
      },
      /**
       * hunk の行を字句に分ける。変更前は `openingLines.old`、変更後は `openingLines.new` から読み始め、`-` の行は変更前だけ、`+` の
       * 行は変更後だけ、前後の行は両方で読み進める。
       * @param grammar ファイルの文法(`Tokenizer.grammarOf`)
       * @returns 行ごとの字句の並び(`hunk.lines` と同じ順)。前後の行は変更後の字句
       */
      lineTokensOf: (hunk, grammar) => {
        const tokensBy = (lines, openingLine) => {
          const read = Tokenizer.tokenizeLines(lines.map((line) => line.text), grammar, Tokenizer.startAfter(openingLine, grammar));
          return new Map(lines.map((line, index) => [line, read[index].tokens]));
        };
        const before = tokensBy(hunk.lines.filter((line) => line.sign !== "+"), hunk.openingLines.old);
        const after = tokensBy(hunk.lines.filter((line) => line.sign !== "-"), hunk.openingLines.new);
        return hunk.lines.map((line) => after.get(line) ?? before.get(line));
      },
      /**
       * コードの表示の行。続けて消した行は 1 つの畳み(`gap`)にまとめる。
       * @returns `{kind: "line", line}` と `{kind: "gap", lines}`(畳んだ消した行)の並び
       */
      codeRowsOf: (hunk) => {
        const rows = [];
        for (const line of hunk.lines) {
          const last = rows[rows.length - 1];
          const extendsGap = line.sign === "-" && last !== undefined && last.kind === "gap";
          if (extendsGap) rows[rows.length - 1] = { kind: "gap", lines: [...last.lines, line] };
          else rows.push(line.sign === "-" ? { kind: "gap", lines: [line] } : { kind: "line", line });
        }
        return rows;
      },
    });
  })();

  /** 機能 × コミットの表。コミットの差分のまとまり(hunk と消したファイルの本文)を、`CommitDiff` が付けた機能ごとに集める。 */
  const FeatureMatrix = (() => {
    // 機能の色は固定の 8 色を features の順に回す。機能の数だけ色を作ると、数が増えたときに隣の色を見分けられない。
    const HueCount = 8;
    const NoHue = "none";

    const lineCountOf = (lines, sign) => lines.filter((line) => line.sign === sign).length;

    /** 差分のまとまりを、機能・パス・行数の組にする。切った patch の残りの行は数えない。 */
    const unitsOf = (diff) => diff.files.flatMap((file) => {
      const body = file.body;
      switch (body.kind) {
        case "hunks":
          return body.hunks.map((hunk) => ({ path: file.path, feature: hunk.feature, additions: lineCountOf(hunk.lines, "+"), deletions: lineCountOf(hunk.lines, "-") }));
        case "deleted":
          return [{ path: file.path, feature: body.feature, additions: 0, deletions: body.lines ?? 0 }];
        case "unchanged":
        case "binary":
          return [];
      }
    });

    const sumOf = (units, key) => units.reduce((sum, unit) => sum + unit[key], 0);

    /**
     * @param features 解説の features
     * @param id 機能の id。機能なしは null
     * @returns 色の番号(`"1"`〜`"8"`。features の順に回す)。機能なしと、features に無い id は `"none"`
     */
    const hueOf = (features, id) => {
      const index = features.findIndex((feature) => feature.id === id);
      return index < 0 ? NoHue : String((index % HueCount) + 1);
    };

    /** features に無い機能を指す範囲を外した commitStory(外した範囲にしか入らない hunk は、機能なしになる)。 */
    const storyWithKnownRanges = (story, known) => {
      if (story === null || !Array.isArray(story.featureRanges)) return story;
      return { ...story, featureRanges: story.featureRanges.filter((range) => known.has(range.feature)) };
    };

    /** マスの一言。その機能のまとまりに入った範囲の文を、commitStory に書いた順に重複なく並べる。 */
    const cellTextsOf = (units, story) => {
      const texts = new Set(units.flatMap((unit) => unit.feature.texts));
      const written = story === null || !Array.isArray(story.featureRanges) ? [] : story.featureRanges.map((range) => range.text);
      return [...new Set(written)].filter((text) => texts.has(text));
    };

    return Object.freeze({
      hueOf,
      /**
       * 機能 × コミットの表を作る。
       * @param features 解説の features(書いた順)
       * @param commits 地図のコミット(古い順。`ExplainedMap` の `commits`)
       * @returns `isAvailable`(どれかのコミットの commitStory に featureRanges が 1 件以上あるか)・`commits`(列。マージ以外のコミットの
       *   古い順)・`diffAt`(列のコミットの sha → `CommitDiff.create` の差分。features に無い機能を指す範囲は外す)・`rows`(行)。行は
       *   features の順に、変更が 1 行以上ある機能だけを並べ、機能なしのまとまりがあれば最後に機能なしの行を足す。行は
       *   `feature`(機能なしは null)・`hue`・`cells`(列ごとに `{sha, additions, deletions, texts}`、まとまりが無ければ null)・
       *   `additions` / `deletions`・`commitCount`・`fileCount` を持つ
       */
      create: ({ features, commits }) => {
        const known = new Set(features.map((feature) => feature.id));
        const columns = commits.filter((commit) => !commit.merge);
        const diffAt = new Map(columns.map((commit) => [commit.sha, CommitDiff.create(commit, storyWithKnownRanges(commit.story, known))]));
        const unitsAt = new Map(columns.map((commit) => [commit.sha, unitsOf(diffAt.get(commit.sha))]));
        const rowOf = (feature) => {
          const id = feature === null ? null : feature.id;
          const isMine = (unit) => (unit.feature === null ? null : unit.feature.id) === id;
          const cells = columns.map((commit) => {
            const mine = unitsAt.get(commit.sha).filter(isMine);
            if (mine.length === 0) return null;
            const texts = id === null ? [] : cellTextsOf(mine, commit.story);
            return { sha: commit.sha, additions: sumOf(mine, "additions"), deletions: sumOf(mine, "deletions"), texts };
          });
          const units = columns.flatMap((commit) => unitsAt.get(commit.sha).filter(isMine));
          return {
            feature,
            hue: hueOf(features, id),
            cells,
            additions: sumOf(units, "additions"),
            deletions: sumOf(units, "deletions"),
            commitCount: cells.filter((cell) => cell !== null).length,
            fileCount: new Set(units.map((unit) => unit.path)).size,
          };
        };
        const rows = [...features.map(rowOf), rowOf(null)].filter((row) => row.additions + row.deletions > 0);
        const hasRanges = commits.some((commit) => commit.story !== null && Array.isArray(commit.story.featureRanges) && commit.story.featureRanges.length > 0);
        return { isAvailable: hasRanges, commits: columns, diffAt, rows };
      },
      /** @returns 機能の一覧の並び。変更行数の多い順(同じなら features の順)で、機能なしは最後 */
      rankedRowsOf: (matrix) => {
        const linesOf = (row) => row.additions + row.deletions;
        const featured = matrix.rows.filter((row) => row.feature !== null).toSorted((a, b) => linesOf(b) - linesOf(a));
        return [...featured, ...matrix.rows.filter((row) => row.feature === null)];
      },
      /** @returns そのコミットにまとまりのある行(表の行の順) */
      rowsIn: (matrix, sha) => {
        const column = matrix.commits.findIndex((commit) => commit.sha === sha);
        return column < 0 ? [] : matrix.rows.filter((row) => row.cells[column] !== null);
      },
      /** @returns 「機能ごとに見てほしいところ」に出す行。review を 1 件以上書いた機能の行を、表の行の順(features の順)に */
      reviewRowsOf: (matrix) => matrix.rows.filter((row) => row.feature !== null && Array.isArray(row.feature.review) && row.feature.review.length > 0),
    });
  })();

  /**
   * 箱の図の配置。まとめ方の組と箱を依存の深さで段に並べ、線の道筋とラベルの置き場を決める。どの画面の図も
   * これで並べる。
   */
  const GraphLayout = (() => {
    const Group = Object.freeze({ width: 212, height: 72, head: 42, padX: 14, padBottom: 14 });
    const Box = Object.freeze({ width: 152, height: 30, gap: 12, rowGap: 40 });
    const Spacing = Object.freeze({ rowGap: 100, columnGap: 72 });
    const PerRow = 4;
    // 組を 1 段に並べる数の候補。置ける広さが渡されたら、この中から図が最も大きく(等倍まで)収まるものを選ぶ。
    const PerRowChoices = [PerRow, 3, 2, 1];
    // 横に並んだ組のあいだを、線のラベルが入る幅まで広げるときの上限。広げすぎると、組が 1 段に並んだときに図全体が
    // 縮んでどのラベルも読めなくなる。入らないラベルは置ける位置が無ければ出さない(線を押せば詳しいところは読める)。
    const MaxLabelGap = 240;
    const Levels = Object.freeze({ High: "high", Mid: "mid", Low: "low" });
    // 線の中ほどから端へ向かって、ラベルを置く位置を試す順(ベジェ曲線の媒介変数)。
    const LabelSpots = [0.5, 0.42, 0.58, 0.34, 0.66, 0.26, 0.74, 0.18, 0.82];
    const ObstaclePad = 4;
    const ContainerHeadHeight = 38;

    const sumOf = (values) => values.reduce((sum, value) => sum + value, 0);
    const chunksOf = (items, size) => Array.from({ length: Math.ceil(items.length / size) }, (_, index) => items.slice(index * size, (index + 1) * size));

    /**
     * 強連結成分(Tarjan)。
     * @param successorsOf id から、それが使う id の並びを引く
     * @returns 成分の並び。辺 a → b があれば、b の成分が a の成分より前に来る
     */
    const componentsOf = (ids, successorsOf) => {
      const order = new Map();
      const low = new Map();
      const stack = [];
      const onStack = new Set();
      const components = [];
      const visit = (id) => {
        order.set(id, order.size);
        low.set(id, order.get(id));
        stack.push(id);
        onStack.add(id);
        for (const next of successorsOf(id)) {
          if (!order.has(next)) visit(next);
          if (onStack.has(next)) low.set(id, Math.min(low.get(id), low.get(next)));
        }
        if (low.get(id) !== order.get(id)) return;
        const component = stack.splice(stack.lastIndexOf(id));
        for (const member of component) onStack.delete(member);
        components.push(component);
      };
      for (const id of ids) if (!order.has(id)) visit(id);
      return components;
    };

    /**
     * 使う側からの深さ。強連結成分を 1 つにまとめた DAG で最長の道のりを取り、同じ成分には同じ深さを付ける。
     * 循環を打ち切りで済ませると、打ち切る位置が入力の順で変わり、段も変わる。
     * @param pairs `[使う側, 使われる側]` の並び(どちらも ids にあるもの)
     * @returns id から深さ(誰にも使われていなければ 0)
     */
    const depthsOf = (ids, pairs) => {
      const successors = new Map(ids.map((id) => [id, pairs.filter(([from]) => from === id).map(([, to]) => to)]));
      const components = componentsOf(ids, (id) => successors.get(id));
      const componentOf = new Map(components.flatMap((members, index) => members.map((id) => [id, index])));
      // 成分は使われる側から並ぶので、使う側の成分の大きい順に辺をたどれば、どの成分も深さが決まってから先へ伸ばせる。
      const links = pairs.map(([from, to]) => [componentOf.get(from), componentOf.get(to)]).filter(([from, to]) => from !== to).toSorted((a, b) => b[0] - a[0]);
      const depths = links.reduce((sofar, [from, to]) => sofar.with(to, Math.max(sofar[to], sofar[from] + 1)), components.map(() => 0));
      return new Map(ids.map((id) => [id, depths[componentOf.get(id)]]));
    };

    /** 深さごとに変更行数の多い順(同じなら入力の順)に並べ、1 段 `perRow` 個ずつの行に割る。 */
    const rowsOf = (items, { depthOf, perRow }) => {
      const deepest = Math.max(0, ...items.map((item) => depthOf.get(item.id)));
      const levels = Array.from({ length: deepest + 1 }, (_, depth) => items.filter((item) => depthOf.get(item.id) === depth).toSorted((a, b) => b.lines - a.lines));
      return levels.filter((level) => level.length > 0).flatMap((level) => chunksOf(level, perRow));
    };

    /** 組 1 つの大きさ。開いた組は中の箱を同じ規則で段に並べる。 */
    const blockOf = (group, { links, isOpen }) => {
      const lines = sumOf(group.boxes.map((box) => box.lines));
      if (!isOpen) return { group, lines, isOpen, rows: [], width: Group.width, height: Group.height };
      const paths = new Set(group.boxes.map((box) => box.path));
      const isInside = (link) => paths.has(link.from) && paths.has(link.to);
      const inner = links.filter(isInside).map((link) => [link.from, link.to]);
      const rows = rowsOf(group.boxes.map((box) => ({ ...box, id: box.path })), { depthOf: depthsOf([...paths], inner), perRow: PerRow });
      const widest = Math.max(...rows.map((row) => row.length));
      const width = Math.max(Group.width, widest * Box.width + (widest - 1) * Box.gap + Group.padX * 2);
      const height = Group.head + rows.length * (Box.height + Box.rowGap) - Box.rowGap + Group.padBottom;
      return { group, lines, isOpen, rows, width, height };
    };

    /** 段の行を上から積み、各行を図の幅の中央に寄せて、組の位置を決める。 */
    const placedBlocksOf = (rows, columnGap) => {
      const rowWidths = rows.map((row) => sumOf(row.map((block) => block.width)) + (row.length - 1) * columnGap);
      const rowHeights = rows.map((row) => Math.max(...row.map((block) => block.height)));
      const width = Math.max(0, ...rowWidths);
      const height = rows.length === 0 ? 0 : sumOf(rowHeights) + (rows.length - 1) * Spacing.rowGap;
      const blocks = rows.flatMap((row, index) => {
        const top = sumOf(rowHeights.slice(0, index)) + index * Spacing.rowGap;
        const left = (width - rowWidths[index]) / 2;
        return row.map((block, at) => ({ ...block, x: left + sumOf(row.slice(0, at).map((before) => before.width)) + at * columnGap, y: top + (rowHeights[index] - block.height) / 2 }));
      });
      return { width, height, blocks };
    };

    /**
     * 広さに収めたときの縮尺。等倍より大きくは数えない。等倍で収まる並びどうしはどれも等倍で読めるので、1 段に多く
     * 並べるほう(段が少なく、離れた段を結ぶ線が間の組を横切りにくい)を選ばせるため。図が空なら 0。
     */
    const scaleIn = (placed, room) => (placed.width === 0 ? 0 : Math.min(1, room.width / placed.width, room.height / placed.height));

    /** 1 段に並べる数の候補ごとの配置から、広さに最も大きく収まるものを選ぶ(同じなら 1 段に多く並べるほう)。 */
    const fittestOf = (candidates, room) => candidates.reduce((best, candidate) => (scaleIn(candidate, room) > scaleIn(best, room) ? candidate : best));

    const groupIdOf = (id) => `group:${id}`;
    const pathsIn = (block) => block.group.boxes.map((box) => box.path);

    /** 箱の図に描く単位。畳んだ組は 1 つ、開いた組は中の箱ごとに 1 つ。 */
    const unitsOf = (block) => {
      if (!block.isOpen) return [{ id: groupIdOf(block.group.id), kind: "group", group: block.group.id, paths: pathsIn(block), x: block.x, y: block.y, width: block.width, height: block.height }];
      return block.rows.flatMap((row, index) => {
        const rowWidth = row.length * Box.width + (row.length - 1) * Box.gap;
        const left = block.x + (block.width - rowWidth) / 2;
        const top = block.y + Group.head + index * (Box.height + Box.rowGap);
        return row.map((box, at) => ({ id: `box:${box.path}`, kind: "box", group: block.group.id, path: box.path, paths: [box.path], x: left + at * (Box.width + Box.gap), y: top, width: Box.width, height: Box.height }));
      });
    };

    /**
     * 組と箱を並べる。
     * @param groups まとめ方の組 `{id, boxes: [{path, lines}]}`(lines は変更行数)。箱の無い組は描かない
     * @param links 依存 `{from, to, status}`(使う側 → 使われる側のパス)。消えた依存(`removed`)は段に使わない
     * @param expanded 開いて中の箱を並べる組の id
     * @param room 図を置ける広さ `{width, height}`。渡せば、組を 1 段に並べる数(4〜1)を図が最も大きく収まるものにする
     *   (等倍で収まるものどうしなら 1 段に多いほう)。null なら 1 段に 4 つ
     * @param labelWidth 横に並んだ組のあいだの線に置くラベルの幅。組の間隔をそれが入るまで広げる(上限 240px)。
     *   ラベルを描かないなら 0
     * @returns 図の大きさ、描く単位(`units`)、開いた組の枠(`containers`)、パスから単位の id を引く `unitOf`
     */
    const create = ({ groups, links, expanded, room = null, labelWidth = 0 }) => {
      const drawn = groups.filter((group) => group.boxes.length > 0);
      const groupOf = new Map(drawn.flatMap((group) => group.boxes.map((box) => [box.path, group.id])));
      const isLive = (link) => link.status !== "removed" && groupOf.has(link.from) && groupOf.has(link.to) && link.from !== link.to;
      const live = links.filter(isLive);
      const crossing = live.map((link) => [groupOf.get(link.from), groupOf.get(link.to)]).filter(([from, to]) => from !== to);
      const open = new Set(expanded);
      const blocks = drawn.map((group) => ({ ...blockOf(group, { links: live, isOpen: open.has(group.id) }), id: group.id }));
      const depthOf = depthsOf(drawn.map((group) => group.id), crossing);
      const columnGap = Math.min(MaxLabelGap, Math.max(Spacing.columnGap, labelWidth + ObstaclePad * 2));
      const candidates = PerRowChoices.map((perRow) => placedBlocksOf(rowsOf(blocks, { depthOf, perRow }), columnGap));
      const placed = room === null ? candidates[0] : fittestOf(candidates, room);
      const units = placed.blocks.flatMap(unitsOf);
      const containers = placed.blocks.filter((block) => block.isOpen).map((block) => ({ id: groupIdOf(block.group.id), group: block.group.id, paths: pathsIn(block), x: block.x, y: block.y, width: block.width, height: block.height }));
      return Object.freeze({ width: placed.width, height: placed.height, units, containers, unitOf: new Map(units.flatMap((unit) => unit.paths.map((path) => [path, unit.id]))) });
    };

    const rounded = (value) => Math.round(value * 10) / 10;
    /** 2 つの単位を結ぶ線の鍵。向きによらず同じになる。 */
    const edgeKeyOf = (one, other) => [one, other].sort().join("|");

    /** 矢じりの三角形。`direction` は線の進む向き(d / u / r / l)。 */
    const headAt = (x, y, direction) => {
      const half = 4.5;
      const length = 7;
      switch (direction) {
        case "d":
          return `M${x - half} ${y - length} L${x} ${y} L${x + half} ${y - length} Z`;
        case "u":
          return `M${x - half} ${y + length} L${x} ${y} L${x + half} ${y + length} Z`;
        case "r":
          return `M${x - length} ${y - half} L${x} ${y} L${x - length} ${y + half} Z`;
        case "l":
          return `M${x + length} ${y - half} L${x} ${y} L${x + length} ${y + half} Z`;
      }
    };

    /** 線の両端と制御点。上下に離れていれば上下の辺から、重なっていれば左右の辺から出す。 */
    const endsOf = (source, target) => {
      const sourceCenter = { x: source.x + source.width / 2, y: source.y + source.height / 2 };
      const targetCenter = { x: target.x + target.width / 2, y: target.y + target.height / 2 };
      if (target.y >= source.y + source.height + 2) {
        const from = [sourceCenter.x, source.y + source.height];
        const to = [targetCenter.x, target.y - 1];
        const bend = Math.max(24, (to[1] - from[1]) / 2);
        return { from, to, controls: [from[0], from[1] + bend, to[0], to[1] - bend], direction: "d", back: "u" };
      }
      if (target.y + target.height <= source.y - 2) {
        const from = [sourceCenter.x, source.y];
        const to = [targetCenter.x, target.y + target.height + 1];
        const bend = Math.max(40, (from[1] - to[1]) / 2);
        return { from, to, controls: [from[0], from[1] - bend, to[0], to[1] + bend], direction: "u", back: "d" };
      }
      if (targetCenter.x > sourceCenter.x) {
        const from = [source.x + source.width, sourceCenter.y];
        const to = [target.x - 1, targetCenter.y];
        const bend = Math.max(16, (to[0] - from[0]) / 2);
        return { from, to, controls: [from[0] + bend, from[1], to[0] - bend, to[1]], direction: "r", back: "l" };
      }
      const from = [source.x, sourceCenter.y];
      const to = [target.x + target.width + 1, targetCenter.y];
      const bend = Math.max(16, (from[0] - to[0]) / 2);
      return { from, to, controls: [from[0] - bend, from[1], to[0] + bend, to[1]], direction: "l", back: "r" };
    };

    /**
     * 2 つの単位を結ぶ線の道筋。
     * @returns SVG の `d`(`path`)、終わりの矢じり(`head`)、始まりの矢じり(`tail`、両向きの線に使う)、
     *   ラベルを置くためのベジェ曲線の 4 点(`bezier`)
     */
    const routeOf = (source, target) => {
      const { from, to, controls, direction, back } = endsOf(source, target);
      const points = [...from, ...controls, ...to].map(rounded);
      const [x1, y1, c1x, c1y, c2x, c2y, x2, y2] = points;
      return { path: `M${x1} ${y1} C${c1x} ${c1y} ${c2x} ${c2y} ${x2} ${y2}`, head: headAt(x2, y2, direction), tail: headAt(x1, y1, back), bezier: [...from, ...controls, ...to] };
    };

    const pointOn = (bezier, t) => {
      const u = 1 - t;
      const at = (offset) => u * u * u * bezier[offset] + 3 * u * u * t * bezier[offset + 2] + 3 * u * t * t * bezier[offset + 4] + t * t * t * bezier[offset + 6];
      return { x: at(0), y: at(1) };
    };

    const overlapOf = (rect, others) => sumOf(others.map((other) => {
      const width = Math.min(rect.x + rect.width, other.x + other.width) - Math.max(rect.x, other.x);
      const height = Math.min(rect.y + rect.height, other.y + other.height) - Math.max(rect.y, other.y);
      return width > 0 && height > 0 ? width * height : 0;
    }));

    /** 1 つのラベルの置き場。箱との重なりは 2 倍に数え、重なりの無い位置が見つかればそこで止める。 */
    const bestSpotOf = (candidate, { obstacles, placed }) => {
      const spots = LabelSpots.map((t) => {
        const center = pointOn(candidate.bezier, t);
        const rect = { x: center.x - candidate.width / 2, y: center.y - candidate.height / 2, width: candidate.width, height: candidate.height };
        return { center, rect, score: overlapOf(rect, obstacles) * 2 + overlapOf(rect, placed) };
      });
      const clear = spots.find((spot) => spot.score === 0);
      return clear ?? spots.reduce((best, spot) => (spot.score < best.score ? spot : best));
    };

    return Object.freeze({
      Levels,
      create,
      /**
       * 抽象度ごとに開く組。高はすべて畳み、低はすべて開き、中は変更行数の多い上位 ⌈n/3⌉ を開く。
       * @param groups `create` と同じ組(箱の無い組は数えない)
       * @returns 開く組の id(入力の順)
       */
      expandedAt: (level, groups) => {
        const drawn = groups.filter((group) => group.boxes.length > 0);
        const linesOf = (group) => sumOf(group.boxes.map((box) => box.lines));
        switch (level) {
          case Levels.High:
            return [];
          case Levels.Low:
            return drawn.map((group) => group.id);
          case Levels.Mid: {
            const top = new Set(drawn.toSorted((a, b) => linesOf(b) - linesOf(a)).slice(0, Math.ceil(drawn.length / 3)).map((group) => group.id));
            return drawn.map((group) => group.id).filter((id) => top.has(id));
          }
        }
      },
      edgeKeyOf,
      /**
       * 単位どうしの線。両端が同じ単位のものは描かず、同じ 2 つの単位を結ぶものは 1 本にまとめる。
       * @param links `{from, to, item, leads}`(パスどうし)。線の向きは、`leads` が真の最初のもので決め、無ければ最初のもの
       * @returns 線ごとに、`key`(`edgeKeyOf`)、向きの順の端(`from` / `to`)、まとめた `items`、両向きの link を含むか
       *   (`isBothWays`)、道筋(`route`)
       */
      edgesOf: (layout, links) => {
        const unitAt = new Map(layout.units.map((unit) => [unit.id, unit]));
        const ends = links.map((link) => ({ link, from: layout.unitOf.get(link.from), to: layout.unitOf.get(link.to) }));
        const isDrawn = (end) => end.from !== undefined && end.to !== undefined && end.from !== end.to;
        const byKey = new Map();
        for (const end of ends.filter(isDrawn)) {
          const key = edgeKeyOf(end.from, end.to);
          const edge = byKey.get(key) ?? { key, ends: null, first: null, items: [], directions: [] };
          const leadsHere = edge.ends === null && end.link.leads;
          const directions = [...new Set([...edge.directions, end.from])];
          byKey.set(key, { ...edge, ends: leadsHere ? [end.from, end.to] : edge.ends, items: [...edge.items, end.link.item], first: edge.first ?? [end.from, end.to], directions });
        }
        return [...byKey.values()].map((edge) => {
          const [from, to] = edge.ends ?? edge.first;
          return { key: edge.key, from, to, items: edge.items, isBothWays: edge.directions.length > 1, route: routeOf(unitAt.get(from), unitAt.get(to)) };
        });
      },
      /** ラベルの幅の見積もり。書体を読み込む前でも同じ置き場になるよう、測らずに全角 11.2px・半角 6.8px で数える。 */
      textWidthOf: (text) => sumOf([...text].map((char) => (char.charCodeAt(0) > 255 ? 11.2 : 6.8))),
      /** ラベルが避けるもの。単位(周りに 4px の余白)と、開いた組の見出し。 */
      obstaclesOf: (layout) => [
        ...layout.units.map((unit) => ({ x: unit.x - ObstaclePad, y: unit.y - ObstaclePad, width: unit.width + ObstaclePad * 2, height: unit.height + ObstaclePad * 2 })),
        ...layout.containers.map((container) => ({ x: container.x, y: container.y, width: container.width, height: ContainerHeadHeight })),
      ],
      /**
       * ラベルを線の上に置く。優先度の高い順に、線の中ほどから端へ向かって位置を試し、箱と置いたラベルに重なる
       * 面積が最も小さい所を選ぶ。
       * @param candidates `{key, bezier, width, height, priority, allowance}`。重なりが自分の面積の allowance 倍
       *   未満なら置く(0 なら重ならない所だけ、Infinity なら必ず)
       * @returns ラベルごとの `{key, x, y, isPlaced}`(中心)。置けなかったもの(`isPlaced` が偽)は、最も重なりの
       *   小さい位置を持ち、あとのラベルの置き場を避けさせない
       */
      placeLabels: ({ candidates, obstacles }) => {
        const ordered = candidates.toSorted((a, b) => b.priority - a.priority);
        const result = ordered.reduce((sofar, candidate) => {
          const spot = bestSpotOf(candidate, { obstacles, placed: sofar.rects });
          const isPlaced = spot.score === 0 || spot.score < candidate.width * candidate.height * candidate.allowance;
          const label = { key: candidate.key, x: spot.center.x, y: spot.center.y, isPlaced };
          return { rects: isPlaced ? [...sofar.rects, spot.rect] : sofar.rects, labels: [...sofar.labels, label] };
        }, { rects: [], labels: [] });
        return result.labels;
      },
    });
  })();

  /** つながり(2 つの単位を結ぶ線)の「要するに」の文。 */
  const ConnectionSentences = (() => {
    const isRemoved = (message) => message.status === "removed";
    return Object.freeze({
      /**
       * つながりのやりとりを、向き(線の向き → 逆向き)と種類(コマンド → クエリ → イベント)ごとの文にまとめる。消えたやりとりは
       * 向きと種類から外し、最後に 1 つにまとめる。
       * @param ends 線の向きの順の 2 つの単位の id
       * @param messages つながりのやりとり
       * @param unitOf パスから単位の id を引く
       * @returns `{kind, from, to, messages}` の並び(やりとりの無いものは含まない)。kind は cmd / qry / evt / removed で、
       *   removed は from / to が null
       */
      collect: ({ ends, messages, unitOf }) => {
        const live = messages.filter((message) => !isRemoved(message));
        const directions = [[ends[0], ends[1]], [ends[1], ends[0]]];
        const sentences = directions.flatMap(([from, to]) => MessageKindOrder.map((kind) => ({ kind, from, to, messages: live.filter((message) => message.kind === kind && unitOf.get(message.from) === from) })));
        const removed = messages.filter(isRemoved);
        const gone = removed.length === 0 ? [] : [{ kind: "removed", from: null, to: null, messages: removed }];
        return [...sentences.filter((sentence) => sentence.messages.length > 0), ...gone];
      },
    });
  })();

  /** 構造マップの「戻る」で辿る、前の選択の並び。 */
  const SelectionHistory = (() => {
    const Limit = 40;
    return Object.freeze({
      /** @returns 選択を変える前の選択(`previous`、何も選んでいなければ null)を最後に足した並び。40 件を超えたら古いものから落とす */
      recorded: (history, previous) => [...history, previous].slice(-Limit),
      /**
       * @param isAvailable 選択がいまも選べるか(配置が変わって図から消えたものは選べない)
       * @returns 戻り先(最後に足した選択のうち、選べるもの)と、それより後ろを外した並び。選べるものが無ければ null
       */
      back: (history, isAvailable) => {
        const index = history.findLastIndex(isAvailable);
        return index < 0 ? null : { selection: history[index], history: history.slice(0, index) };
      },
    });
  })();

  /**
   * 構成の前後の図。呼び出しの粒度(解説の `calls`)とモジュールの粒度(地図の変更ファイルと依存)の箱と線を、変更前と変更後の
   * 2 枚に同じ配置で描く材料にする。箱と線の `status` は `added` / `removed` / `changed` か、変えていなければ null。
   */
  const CompareDiagram = (() => {
    const Statuses = ["added", "removed", "changed"];
    // 1 枚の図の幅の目安。組を 1 段に並べる数を、この幅に最も大きく収まるものにする(`GraphLayout.create` の room)。
    const RoomWidth = 640;
    const UnmappedGroupId = "";
    const FileStatuses = { A: "added", D: "removed" };

    const statusOf = (value) => (Statuses.includes(value) ? value : null);
    const isDrawn = (diagram) => diagram.kind === "drawn";
    const boxIn = (diagram, id) => diagram.boxes.find((box) => box.id === id);
    const edgeIn = (diagram, id) => diagram.edges.find((edge) => edge.id === id);

    /** 呼び出しの箱の組。箱の module の concept ごとに組を作り、地図の順(`entries` の順)に並べる。地図に無い module の箱は最後の組に入れる。 */
    const callGroupsOf = (boxes, entries) => {
      const order = new Map(entries.map((entry, index) => [entry.path, index]));
      const entryAt = new Map(entries.map((entry) => [entry.path, entry]));
      const mapped = [...new Set(boxes.map((box) => box.module))].filter((path) => order.has(path)).toSorted((a, b) => order.get(a) - order.get(b));
      const groupOf = (path) => ({ id: path, label: ExplainedMap.nameOf(entryAt.get(path), "concept"), boxes: boxes.filter((box) => box.module === path).map((box) => box.id) });
      const unmapped = boxes.filter((box) => !order.has(box.module)).map((box) => box.id);
      const strays = unmapped.length === 0 ? [] : [{ id: UnmappedGroupId, label: "地図に無い", boxes: unmapped }];
      return [...mapped.map(groupOf), ...strays];
    };

    /** 地図のどのファイルにも層を引く表。層の組の木の項目(`treePaths`)と、木に出さないファイル(`others`)の両方から引く。 */
    const layerAtOf = (layerGroups) => new Map(layerGroups.flatMap((group) => [...group.treePaths, ...group.others].map((path) => [path, group.layer])));

    /** 箱を端に持つ依存を、増えた / 消えた / 残ったに分ける。依存の相手は、その箱が使う側なら `uses`、使われる側なら `usedBy`。 */
    const dependenciesOf = (path, { dependencies, nameOfPath }) => {
      const touching = dependencies.filter((link) => link.from === path || link.to === path);
      const itemOf = (link) => {
        const other = link.from === path ? link.to : link.from;
        return { path: other, name: nameOfPath(other), direction: link.from === path ? "uses" : "usedBy" };
      };
      const withStatus = (status) => touching.filter((link) => link.status === status).map(itemOf);
      return { added: withStatus("added"), removed: withStatus("removed"), kept: withStatus("kept") };
    };

    /** 箱と線の状態ごとの件数。 */
    const statusCountsOf = (items) => Object.fromEntries(Statuses.map((status) => [status, items.filter((item) => item.status === status).length]));

    /** 選んだ箱・線のファイル。箱は自分のファイル(呼び出しの粒度は module。移動したファイルは前のパスも)、線は両端の箱のファイル。 */
    const filesOf = (diagram, id) => {
      const filesOfBox = (box) => (diagram.grain === CompareGrains.Calls ? [box.module] : [box.path, ...(box.oldPath === null ? [] : [box.oldPath])]);
      const box = boxIn(diagram, id);
      if (box !== undefined) return filesOfBox(box);
      const edge = edgeIn(diagram, id);
      if (edge === undefined) return [];
      return [...new Set([edge.from, edge.to].map((end) => boxIn(diagram, end)).filter((end) => end !== undefined).flatMap(filesOfBox))];
    };

    /** 解説の calls に書いた、選んでいないときの文。gist・text・review のどれも書いていなければ null。 */
    const writtenOf = (calls) => {
      if (!isRecord(calls)) return null;
      const gist = optionalText(calls.gist);
      const text = optionalText(calls.text);
      const review = listOf(calls.review).filter(isString);
      const isWritten = gist !== null || text !== null || review.length > 0;
      return isWritten ? { gist, text, review } : null;
    };

    return Object.freeze({
      /**
       * 呼び出しの粒度の図。
       * @param explained `ExplainedMap.create` の戻り値
       * @returns 解説が無ければ `{kind: "unexplained"}`、calls が無ければ `{kind: "unwritten"}`。あれば `{kind: "drawn", grain: "calls",
       *   boxes, edges, groups}`。groups は箱の module ごとの組(`{id, label, boxes}`。boxes は箱の id)で、地図の順に並び、地図に無い
       *   module の箱は最後の組「地図に無い」に入る
