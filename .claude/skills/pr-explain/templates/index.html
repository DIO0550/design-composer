    const hintTextOf = (view) => {
      const isTestSelected = view.selected !== null && view.selected.kind === "test";
      if (isTestSelected) return "選んだテストが確かめている範囲を表示中";
      if (state.techniques.length > 0) return "絞り込んだ観点のテストだけで数えています";
      if (!hasMessages) return "数字=その要素を確かめるテストの数 · 線はコードの依存(解説にやりとりが無いため)";
      return "数字=その要素を確かめるテストの数 · 点線=テストのないやりとり";
    };

    const renderCanvasControls = (view) => {
      const naming = explain === null ? [] : [el("div", { class: "control is-canvas" }, labeledToggleOf("表示名", { options: NamingChoices, current: state.naming, onPick: (choice) => update({ naming: choice }) }))];
      canvasControls.replaceChildren(...naming, el("span", { class: "canvas-hint", text: hintTextOf(view) }));
    };

    const containerNodeOf = (container, view) => {
      const { model, lit, selected } = view;
      const isPicked = isSameSelection(selected, { kind: "place", id: container.id });
      const hasLitInside = isPicked || container.paths.some((path) => lit.units.has(`box:${path}`));
      const node = placedAt(el("div", { class: classesOf("graph-container", { "is-picked": isPicked, "is-dim": selected !== null && !hasLitInside }), title: "ダブルクリックで折りたたむ" }, [
        el("div", { class: "graph-container-head" }, [
          el("span", { class: "graph-container-title", text: groupLabels.get(container.group) }),
          el("span", { class: "count-chip", text: `テスト ${model.placeTests(container).length}` }),
          el("span", { class: "spacer" }),
          pressable("button", { class: "mini-button", text: "折りたたむ" }, [], withoutSelecting(() => toggleGroup(container.group))),
        ]),
      ]), container);
      node.addEventListener("click", () => select({ kind: "place", id: container.id }));
      node.addEventListener("dblclick", () => toggleGroup(container.group));
      return node;
    };

    const unitNodeOf = (unit, view) => {
      const { model, lit, selected } = view;
      const testCount = model.placeTests(unit).length;
      const gapCount = model.placeGaps(unit).length;
      const isLit = lit.units.has(unit.id);
      const flags = {
        "is-picked": isLit,
        "has-gap": !isLit && state.showGaps && gapCount > 0,
        "is-dim": selected !== null && !isLit,
        "is-faint": selected === null && state.showGaps && gapCount === 0,
      };
      const isGroup = unit.kind === "group";
      const gapChip = gapCount > 0 ? [el("span", { class: "gap-chip", text: `未テスト ${gapCount}` })] : [];
      const groupBody = () => [
        el("div", { class: "node-row" }, [el("span", { class: "group-name", text: placeNameOf(unit) }), pressable("button", { class: "mini-button is-outlined", text: "展開" }, [], withoutSelecting(() => toggleGroup(unit.group)))]),
        el("div", { class: "node-row" }, [el("span", { class: "count-chip", text: `テスト ${testCount}` }), ...gapChip]),
      ];
      const boxBody = () => {
        const entry = entryAt.get(unit.path);
        const isFileName = state.naming === "file" || entry.conceptName === null;
        return [el("span", { class: classesOf("box-name", { "is-file-name": isFileName }), text: placeNameOf(unit) }), el("span", { class: classesOf("box-count", { "is-tested": testCount > 0 }), text: String(testCount) })];
      };
      const title = isGroup ? "ダブルクリックで展開" : `${unit.path} · テスト ${testCount} 件`;
      const node = placedAt(el("div", { class: classesOf(isGroup ? "graph-node is-group" : "graph-node is-box", flags), title, "data-unit": unit.id }, isGroup ? groupBody() : boxBody()), unit);
      node.addEventListener("click", () => select({ kind: "place", id: unit.id }));
      if (isGroup) node.addEventListener("dblclick", () => toggleGroup(unit.group));
      return node;
    };

    /** 線ごとの見え方。やりとりの線は、テストで確かめているか・抜けがあるかで色を変える。 */
    const edgeLookOf = (edge, view) => {
      const { model, lit, selected } = view;
      const isOn = lit.edges.has(edge.key);
      const gaps = hasMessages ? edge.items.filter(model.isGap) : [];
      const isCovered = hasMessages && edge.items.some((message) => model.coverage.get(message.id).length > 0);
      const isDim = selected !== null && !isOn;
      const isHovered = edge.key === graph.hoveredEdge();
      return { edge, isOn, gaps, isCovered, isDim, isHovered, isFaint: !isDim && !isOn && state.showGaps && gaps.length === 0 };
    };

    /** ラベルに並べるやりとり。選んだテストの線ならそのテストが確かめるもの、抜けを強調しているなら抜けだけ。 */
    const labelMessagesOf = (look, view) => {
      const sorted = look.edge.items.toSorted(byMessageKind);
      const isSelectedTestEdge = view.selected !== null && view.selected.kind === "test" && look.isOn;
      const isGapFocused = state.showGaps && look.gaps.length > 0;
      if (isSelectedTestEdge) return sorted.filter((message) => view.lit.messages.has(message.id));
      if (isGapFocused) return sorted.filter(view.model.isGap);
      return sorted;
    };

    /** 線のラベル。選んだ線・マウスが乗っている線・選んだテストが 3 件以下で通る線は、並べられるだけ並べて必ず置く。 */
    const labelOf = (look, view) => {
      const isPicked = isSameSelection(view.selected, { kind: "edge", id: look.edge.key });
      const litCount = look.edge.items.filter((message) => view.lit.messages.has(message.id)).length;
      const isImportant = isPicked || look.isHovered || (look.isOn && litCount <= 3);
      const listed = labelMessagesOf(look, view);
      const shown = listed.slice(0, isImportant ? LabelLimits.important : LabelLimits.other);
      const texts = labelTextsOf({ messages: shown, edge: look.edge, layout: view.model.layout, naming: state.naming });
      const more = listed.length - shown.length;
      const priority = isImportant ? 3 : look.isOn ? 2 : look.gaps.length > 0 ? 1 : 0;
      const allowance = isImportant ? Infinity : look.isOn ? 0.25 : 0;
      const size = labelSizeOf({ texts, more, padding: LabelPadding });
      return { look, isPicked, isImportant, shown, texts, more, candidate: { key: look.edge.key, bezier: look.edge.route.bezier, ...size, priority, allowance } };
    };

    const coverageTagOf = (message, model) => {
      const count = model.coverage.get(message.id).length;
      if (count > 0) return el("span", { class: "coverage-tag is-tested", text: `✓${count}` });
      if (model.isGap(message)) return el("span", { class: "coverage-tag is-gap", text: "未テスト" });
      return el("span", { class: "coverage-tag", text: "—" });
    };

    const renderGraph = (view) => {
      const { model } = view;
      const looks = model.edges.map((edge) => edgeLookOf(edge, view)).toSorted((a, b) => Number(a.isOn || a.isHovered) - Number(b.isOn || b.isHovered));
      const edgeNodes = looks.map((look) => {
        const flags = { "is-dependency": !hasMessages, "is-covered": look.isCovered, "is-gap": state.showGaps && look.gaps.length > 0 && !look.isOn, "is-on": look.isOn, "is-hover": look.isHovered, "is-dim": look.isDim, "is-faint": look.isFaint };
        const hit = hasMessages ? [Dom.svg("path", { class: "edge-hit", d: look.edge.route.path })] : [];
        const group = Dom.svg("g", { class: classesOf("edge", flags), ...(hasMessages ? { "data-edge": look.edge.key } : {}) }, [Dom.svg("path", { class: "edge-line", d: look.edge.route.path }), Dom.svg("path", { class: "edge-head", d: look.edge.route.head }), ...hit]);
        if (hasMessages) group.addEventListener("click", () => select({ kind: "edge", id: look.edge.key }));
        return group;
      });
      const svg = Dom.svg("svg", { class: "graph-edges", width: String(model.layout.width), height: String(model.layout.height) }, edgeNodes);
      const labels = hasMessages ? looks.map((look) => labelOf(look, view)) : [];
      const spots = GraphLayout.placeLabels({ candidates: labels.map((label) => label.candidate), obstacles: GraphLayout.obstaclesOf(model.layout) });
      const labelAt = new Map(labels.map((label) => [label.look.edge.key, label]));
      const labelNodes = spots.filter((spot) => spot.isPlaced).map((spot) => {
        const label = labelAt.get(spot.key);
        const chips = label.shown.map((message, index) => el("span", { class: classesOf("label-chip", { "is-code": state.naming === "file" }), "data-kind": message.kind }, [el("span", { text: label.texts[index] }), coverageTagOf(message, model)]));
        const more = label.more > 0 ? [el("span", { class: "label-more", text: `+${label.more} 件` })] : [];
        const flags = { "is-important": label.isImportant, "is-on": label.look.isOn, "is-picked": label.isPicked, "is-hover": label.look.isHovered, "is-dim": label.look.isDim, "is-faint": label.look.isFaint };
        const node = el("div", { class: classesOf("graph-label", flags), "data-edge": spot.key }, [...chips, ...more]);
        Object.assign(node.style, { left: `${spot.x}px`, top: `${spot.y}px` });
        node.addEventListener("click", () => select({ kind: "edge", id: spot.key }));
        return node;
      });
      const children = [...model.layout.containers.map((container) => containerNodeOf(container, view)), svg, ...model.layout.units.map((unit) => unitNodeOf(unit, view)), ...labelNodes];
      graph.show({ signature: signatureOf(state.grouping, model.layout), size: { width: model.layout.width, height: model.layout.height }, children });
    };

    const side = el("div", { class: "side" });
    const clearButton = () => pressable("button", { class: "mini-button", text: "選択解除" }, [], () => update({ selected: null }));

    const messageBodyOf = (message, model) => [
      el("span", { class: "message-chip" }, [kindChipOf(message.kind), el("span", { class: classesOf("message-name", { "is-code": state.naming === "file" }), text: messageNameOf(message) })]),
      el("span", { class: "message-route", text: `${endNameOf(model, message.from)} → ${endNameOf(model, message.to)}` }),
    ];

    /** やりとりのカード。図に線があれば、押すとその線を選ぶ。 */
    const gapCardOf = (message, model, isPressable) => {
      const key = edgeKeyBetween(model, message);
      const body = messageBodyOf(message, model);
      const isStatic = !isPressable || key === null;
      if (isStatic) return el("div", { class: "gap-card" }, body);
      return pressable("button", { class: "gap-card plain-button" }, body, () => select({ kind: "edge", id: key }));
    };

    const testCardOf = (test) => pressable("button", { class: "test-card plain-button" }, [
      el("span", { class: "test-name", text: test.name }),
      el("span", { class: "test-facts" }, [...test.techniques.map(techniqueChipOf), el("span", { class: "test-status", "data-status": test.status, text: TestStatuses[test.status].long })]),
    ], () => select({ kind: "test", id: test.id }));

    const overviewOf = (model) => {
      const countOf = (status) => tests.filter((test) => test.status === status).length;
      const isAlwaysCounted = (status) => status === "new" || status === "old" || status === "todo";
      const statuses = Object.keys(TestStatuses).filter((status) => isAlwaysCounted(status) || countOf(status) > 0);
      const head = el("div", { class: "side-block" }, [
        el("span", { class: "eyebrow", text: "テストの全体像" }),
        el("h2", { text: "このブランチで何を確かめたか" }),
        el("div", { class: "side-counts" }, statuses.map((status) => el("span", { class: `is-${status}` }, [`${TestStatuses[status].label} `, el("b", { text: String(countOf(status)) })]))),
      ]);
      if (explain === null) return [head, el("p", { class: "side-note", text: "解説が無いので、変更の地図にあるテストの追加・削除と、テストファイルの対象だけで組んでいます。左のテストを選ぶと、対象の箱が光ります。" })];
      const most = Math.max(1, ...Object.values(techniqueCounts));
      const bars = Object.entries(Techniques).map(([key, technique]) => {
        const fill = el("span", { class: "tech-bar-fill" });
        fill.style.width = `${(techniqueCounts[key] / most) * 100}%`;
        return pressable("button", { class: "tech-bar plain-button", "data-technique": key, title: "この観点で絞り込む" }, [
          el("span", { class: "tech-bar-line" }, [el("span", { class: "tech-bar-label" }, [el("span", { class: "swatch" }), technique.label]), el("span", { class: "tech-bar-track" }, [fill]), el("span", { class: "tech-bar-count", text: String(techniqueCounts[key]) })]),
          el("span", { class: "tech-bar-desc", text: technique.description }),
        ], () => update({ techniques: [key] }));
      });
      const gaps = messages.filter(model.isGap);
      const gapBlock = hasMessages ? [el("div", { class: "side-block" }, [
        eyebrowOf("テストがないやりとり", "このブランチで追加・変更したもの"),
        ...gaps.map((message) => gapCardOf(message, model, true)),
        ...(gaps.length === 0 ? [el("span", { class: "side-sub", text: "すべてテストされています。" })] : []),
      ])] : [];
      return [
        head,
        el("div", { class: "side-block" }, [el("span", { class: "eyebrow", text: "観点ごとの内訳" }), ...bars]),
        ...gapBlock,
        el("p", { class: "side-note", text: "左のテストを選ぶと、確かめている範囲がマップ上で光ります。マップの箱やラベルを選ぶと、そこを確かめているテストが分かります。" }),
      ];
    };

    const valuesOf = (values) => {
      const columns = values.columns.length;
      const hasBoundary = values.rows.some((row) => row.boundary === true);
      const grid = el("div", { class: "values-grid" }, [
        ...values.columns.map((column) => el("span", { class: "values-head", text: column })),
        ...values.rows.flatMap((row) => row.cells.map((cell, index) => {
          const tag = row.boundary === true && index === 0 ? [el("span", { class: "boundary-tag", text: "境目" })] : [];
          return el("span", { class: classesOf("values-cell", { "is-first": index === 0, "is-boundary": row.boundary === true }) }, [prose("span", {}, cell), ...tag]);
        })),
      ]);
      grid.style.gridTemplateColumns = `repeat(${columns}, minmax(max-content, 1fr))`;
      return el("div", { class: "side-block" }, [eyebrowOf("試している値", hasBoundary ? "「境目」は境界値として選んだ値" : undefined), el("div", { class: "values" }, [grid])]);
    };

    /** 解説の無いテスト(地図の追加・削除)の対象。押すとその箱を選ぶ。 */
    const targetsOf = (test, model) => {
      const places = [...new Set(test.targets.map((path) => model.layout.unitOf.get(path)).filter((id) => id !== undefined))].map((id) => model.places.get(id));

    };

    const testDetailOf = (test, model) => {
      const suiteLabel = test.suite === null ? (test.file ?? "").split("/").pop() : test.suite.label;
      const pending = test.status === "todo" ? [el("span", { class: "pending", text: "○ まだ書かれていない" })] : [];
      const head = el("div", { class: "side-block" }, [
        el("div", { class: "side-head" }, [el("span", { class: "chip", text: suiteLabel }), el("span", { class: "chip", "data-status": test.status, text: TestStatuses[test.status].long }), ...pending, el("span", { class: "spacer" }), clearButton()]),
        el("h2", { text: test.name }),
        el("span", { class: "side-path", text: test.file ?? "" }),
      ]);
      if (test.test === null) {
        const reason = test.status === "removed" ? "このブランチで消したテストです。" : "解説に無いテストです。";
        return [head, el("p", { class: "side-sub", text: `${reason}変更の地図にある名前と、テストファイルの対象だけを出しています。` }), targetsOf(test, model)];
      }
      const detail = test.test;
      const covered = test.covers.map((id) => lookup.messages.get(id)).filter((message) => message !== undefined);
      const values = detail.values === undefined ? [] : [valuesOf(detail.values)];
      const coverBlock = covered.length === 0 ? [] : [el("div", { class: "side-block" }, [
        eyebrowOf("確かめているやりとり", `${covered.length} 件`),
        ...covered.map((message, index) => {
          const key = edgeKeyBetween(model, message);
          const body = [el("span", { class: "message-row-n", text: String(index + 1) }), el("span", { class: "message-row-body" }, messageBodyOf(message, model))];
          return key === null ? el("div", { class: "message-row" }, body) : pressable("button", { class: "message-row plain-button" }, body, () => select({ kind: "edge", id: key }));
        }),
      ])];
      const code = detail.excerpt === undefined ? [] : excerptBlockOf(detail.excerpt, "テストコード");
      const commit = typeof detail.commit === "string" ? [commitLinkOf({ sha: detail.commit, label: "追加したコミット", commitAt: explained.commitAt, onPress: () => go.toCommit(detail.commit) })] : [];
      const mentions = ImpactTopics.mentionsOf(explained.impactTopics, detail.id);
      const mentionBlock = mentions.length === 0 ? [] : [el("div", { class: "side-block" }, [
        eyebrowOf("この状況を確かめている", `${mentions.length} 件`),
        ...mentions.map((mention) => jumpCardOf({
          name: mention.placeText ?? mention.topicLabel,
          tag: mention.placeText === null ? ScreenLabels.impact : mention.topicLabel,
          status: null,
          goText: `${ScreenLabels.impact}で見る`,

        head,
        el("div", { class: "side-block" }, [
          el("span", { class: "eyebrow", text: "テストの観点" }),
          ...test.techniques.map((key) => el("div", { class: "tech-line" }, [techniqueChipOf(key), el("span", { class: "tech-line-desc", text: Techniques[key].description })])),
          prose("p", { class: "why" }, detail.why),
        ]),
        el("div", { class: "gwt" }, [["前提", detail.given], ["操作", detail.when], ["期待", detail.then]].flatMap(([key, text]) => [el("span", { class: "gwt-key", text: key }), prose("span", { class: "gwt-value" }, text)])),
        ...values,
        ...coverBlock,
        ...mentionBlock,
        ...code,
        ...commit,
      ];
    };

    /** 選んだ箱・線を確かめているテスト(未実装の提案も足す)と、テストの無いやりとり。 */
    const targetDetailOf = (selected, model) => {
      const isEdge = selected.kind === "edge";
      const edge = isEdge ? model.edgeAt.get(selected.id) : null;
      const place = isEdge ? null : model.places.get(selected.id);
      const touches = (test) => (isEdge ? touchesEdge(test, edge) : touchesPlace(test, place));
      const verified = isEdge ? [...new Set(edge.items.flatMap((message) => model.coverage.get(message.id)))] : model.placeTests(place);
      const proposed = tests.filter((test) => test.status === "todo" && touches(test) && !verified.includes(test));
      const listed = [...verified, ...proposed];
      const gaps = isEdge ? edge.items.filter(model.isGap) : model.placeGaps(place);
      const title = isEdge ? `${placeNameOf(model.places.get(edge.from))} ⇄ ${placeNameOf(model.places.get(edge.to))}` : placeNameOf(place);
      const kind = isEdge ? "つながり" : place.kind === "box" ? "要素" : "グループ";
      const sub = isEdge ? `${edge.items.length} 件のやりとり:${edge.items.map((message) => `〈${message.name}〉`).join("")}` : placeSubOf(place);
      return [
        el("div", { class: "side-block" }, [el("div", { class: "side-head" }, [el("span", { class: "chip", text: kind }), el("span", { class: "spacer" }), clearButton()]), el("h2", { text: title }), el("p", { class: "side-sub", text: sub })]),
        el("div", { class: "side-block" }, [eyebrowOf("ここを確かめているテスト", `${listed.length}`), ...listed.map(testCardOf), ...(listed.length === 0 ? [el("span", { class: "warn-text", text: "まだテストがありません。" })] : [])]),
        ...(gaps.length === 0 ? [] : [el("div", { class: "side-block" }, [el("span", { class: "eyebrow", text: "テストがないやりとり" }), ...gaps.map((message) => gapCardOf(message, model, false))])]),
      ];
    };

    /** 箱の補足。概念名で出しているならパス、ファイル名で出しているなら concept 名(無ければパス)。組なら中の数。 */
    const placeSubOf = (place) => {
      if (place.kind !== "box") return `${place.paths.length} 要素をまとめた箱`;
      const entry = entryAt.get(place.path);
      const isPathShown = state.naming === "concept" || entry.conceptName === null;
      return isPathShown ? entry.path : entry.conceptName;
    };

    const renderSide = (view) => {
      const { selected, model } = view;
      if (selected === null) side.replaceChildren(...overviewOf(model));
      else if (selected.kind === "test") side.replaceChildren(...testDetailOf(tests[selected.id], model));
      else side.replaceChildren(...targetDetailOf(selected, model));
      side.scrollTop = 0;
    };

    const render = () => {
      const model = modelOf(state);
      const selected = validSelectionOf(state.selected, model);
      const isNewTestSelection = selected !== null && selected.kind === "test" && !isSameSelection(selected, previous);
      const view = { model, selected, lit: litOf(model, selected) };
      state = { ...state, selected };
      previous = selected;
      lastView = view;
      renderControls();
      renderList(view);
      renderCanvasControls(view);
      renderGraph(view);
      renderSide(view);
      const row = isNewTestSelection ? listBody.querySelector(`[data-test="${selected.id}"]`) : null;
      if (row !== null) row.scrollIntoView({ block: "nearest" });
    };
    let previous = null;
    render();

    const gapControl = hasMessages ? [controlNodes.gaps] : [];
    return {
      summary: [],
      controls: [controlNodes.grouping, controlNodes.level, ...gapControl],
      tablist: null,
      left: panelOf("left", [listHead, listBody]),
      main: graph.element,
      right: panelOf("right", [side]),
      /**
       * 他の画面から、解説のテストを選んだ状態にする。選んでいても外さず、観点の絞り込みは解く(絞り込みの外のテストでも選べるように)。
       * @param explainTestId 解説のテストの id
       */
      showTest: (explainTestId) => update({ selected: { kind: "test", id: explained.tests.indexOf(explained.testAt.get(explainTestId)) }, techniques: [] }),
    };
  };

  const StatusLabels = { A: "追加", M: "変更", R: "移動", D: "削除" };
  const StatusTones = ["A", "M", "D"];
  /** 色分けの区分。移動したファイル(R。中身も変えていることがある)は変更の色にする。変更していなければ空。 */
  const toneOf = (status) => (status === "R" ? "M" : (status ?? ""));
  const Connections = Object.freeze({ Messages: "messages", Dependencies: "dependencies" });
  const ConnectionChoices = [
    { value: Connections.Messages, label: "やりとり", title: "何を受け渡ししているか(コマンド・クエリ・イベント)" },
    { value: Connections.Dependencies, label: "コード依存", title: "どのファイルがどれを参照しているか" },
  ];
  const ScopeModes = Object.freeze({ Dim: "dim", Hide: "hide" });
  const ScopeModeChoices = [{ value: ScopeModes.Dim, label: "薄く表示" }, { value: ScopeModes.Hide, label: "表示しない" }];
  const MessageKindFilters = [{ value: "all", label: "すべて" }, ...Object.entries(Vocabulary.messageKinds).map(([value, kind]) => ({ value, label: kind.label }))];
  // 構造マップの線のラベルの、文字の外側(余白・枠・追加の印)の幅。
  const MapLabelPadding = 30;
  // 1 つの線のラベルに並べるやりとりの数。選んだ線・流れで光らせた線・マウスが乗っている線と、選んだものに関わる 3 件以下の線は 6 件まで。
  const MapLabelLimits = { important: 6, other: 1 };
  // 線の太さ。まとめた依存・やりとりの件数 1 で 1.25px、1 件増えるごとに 0.4px 太らせ、2px 分で打ち止める。
  const EdgeWidth = { base: 1.25, perItem: 0.4, extra: 2, lit: 0.75 };
  const SequenceColumnWidth = 86;

  /** 変更したファイルの数を色の区分ごとに数える。 */
  const toneCountsOf = (entries) => Object.fromEntries(StatusTones.map((tone) => [tone, entries.filter((entry) => entry.changed && toneOf(entry.status) === tone).length]));
  const statusChipsOf = (entries) => {
    const counts = toneCountsOf(entries);
    return StatusTones.filter((tone) => counts[tone] > 0).map((tone) => el("span", { class: "status-chip", "data-tone": tone, text: `${StatusLabels[tone]} ${counts[tone]}` }));
  };
  /** いくつかのファイルをまとめた色。すべて追加なら追加、すべて削除なら削除、変更があれば変更、無ければ空。 */
  const toneOfAll = (entries) => {
    const changed = entries.filter((entry) => entry.changed).map((entry) => toneOf(entry.status));
    if (changed.length === 0) return "";
    const isUniform = changed.every((tone) => tone === changed[0]);
    return isUniform ? changed[0] : "M";
  };
  /**
   * 線にまとめた依存・やりとりの状態。すべて消えたものなら removed、追加を含めば added、変更を含めば changed、
   * それ以外は kept。依存は added / kept / removed、やりとりは added / changed / removed か省いたもの。
   */
  const edgeStatusOf = (items) => {
    if (items.every((item) => item.status === "removed")) return "removed";
    if (items.some((item) => item.status === "added")) return "added";
    return items.some((item) => item.status === "changed") ? "changed" : "kept";
  };
  const selectionKeyOf = (selected) => (selected === null ? "" : `${selected.kind}:${selected.id}`);
  const baseNameOf = (path) => path.split("/").pop();

  /**
   * ファイルの木。パスをフォルダごとに割り、フォルダは名前の順、ファイルはファイル名の順に並べる。
   * @param depth いま割っているフォルダの深さ(根は 0)
   * @returns `{dirs: [{name, prefix, node}], files, all}`(all はそのフォルダの下のすべてのファイル)
   */
  const treeOf = (entries, depth) => {
    const partsOf = (entry) => entry.path.split("/");
    const isHere = (entry) => partsOf(entry).length === depth + 1;
    const deeper = entries.filter((entry) => !isHere(entry));
    const names = [...new Set(deeper.map((entry) => partsOf(entry)[depth]))].sort();
    const dirs = names.map((name) => {
      const inside = deeper.filter((entry) => partsOf(entry)[depth] === name);
      return { name, prefix: `${partsOf(inside[0]).slice(0, depth + 1).join("/")}/`, node: treeOf(inside, depth + 1) };
    });
    const files = entries.filter(isHere).toSorted((a, b) => baseNameOf(a.path).localeCompare(baseNameOf(b.path)));
    return { dirs, files, all: entries };
  };

  /** 構造マップ。左にファイルの木、中に箱の図、右に概要か選んだものの詳しいところと、やりとりの流れを出す。 */
  const MapScreen = (explained, go) => {
    const { explain, lookup } = explained;
    const materials = graphMaterialsOf(explained);
    const { entryAt, graphGroups, groupLabels, groupings, messages } = materials;
    const flows = [...lookup.flows.values()];
    const hasMessages = messages.length > 0;
    const groupAt = new Map(Object.values(explained.groupings).flat().map((group) => [groupKeyOf(group), group]));
    const highlights = explain !== null && Array.isArray(explain.overview.highlights) ? explain.overview.highlights : [];
    const tree = treeOf(explained.entries, 0);

    let state = {
      ...initialGraphStateOf(materials, explained),
      connection: hasMessages ? Connections.Messages : Connections.Dependencies,
      selected: null,
      history: [],
      scope: null,
      scopeMode: ScopeModes.Dim,
      isFocused: false,
      isChangedOnly: false,
      closedDirs: [],
      isPopoverOpen: false,
      messageKind: "all",
      isChangedMessagesOnly: false,
      flow: null,
      step: null,
    };

    /** いまの状態から、図の配置と、図に出ているやりとり・依存と線を作る。他を表示しないときは、絞った組だけを開いて並べる。 */
    const modelOf = (current) => {
      const isHiding = current.scope !== null && current.scopeMode === ScopeModes.Hide;
      const allGroups = graphGroups[current.grouping];
      const groups = isHiding ? allGroups.filter((group) => group.id === current.scope) : allGroups;
      const opened = current.expanded[current.grouping];
      const expanded = isHiding ? [...new Set([...opened, current.scope])] : opened;
      const isMessageView = current.connection === Connections.Messages;
      const labelWidth = isMessageView ? widestLabelOf({ messages, naming: current.naming, padding: MapLabelPadding }) : 0;
      const layout = GraphLayout.create({ groups, links: explained.dependencies, expanded, room: graph.room(), labelWidth });
      const isShown = (path) => layout.unitOf.has(path);
      const shownMessages = messages.filter((message) => isShown(message.from) && isShown(message.to));
      const shownDependencies = explained.dependencies.filter((link) => isShown(link.from) && isShown(link.to));
      const links = isMessageView
        ? shownMessages.map((message) => ({ from: message.from, to: message.to, item: message, leads: message.kind !== "evt" }))
        : shownDependencies.map((link) => ({ from: link.from, to: link.to, item: link, leads: true }));
      const edges = GraphLayout.edgesOf(layout, links);
      return {
        layout,
        groups,
        isMessageView,
        messages: shownMessages,
        dependencies: shownDependencies,
        edges,
        edgeAt: new Map(edges.map((edge) => [edge.key, edge])),
        places: new Map([...layout.units, ...layout.containers].map((place) => [place.id, place])),
      };
    };

    const unitIdOf = (model, path) => model.layout.unitOf.get(path);
    const pathsOfGroup = (model, id) => {
      const group = model.groups.find((candidate) => candidate.id === id);
      return group === undefined ? [] : group.boxes.map((box) => box.path);
    };
    /** 選んだパスの外で、つながっているパス。やりとりで見ているならやりとり、依存で見ているなら依存でたどる。 */
    const relatedPathsOf = (model, paths) => {
      const links = model.isMessageView ? model.messages : model.dependencies;
      const across = links.filter((link) => paths.has(link.from) !== paths.has(link.to));
      return new Set(across.map((link) => (paths.has(link.from) ? link.to : link.from)));
    };

    /** 選んだものが含むパス・つながっているパスと、それぞれの単位。木だけのファイルを選んだときは図に何も出さない。 */
    const focusOf = (model, selected) => {
      const none = { paths: new Set(), related: new Set(), units: new Set(), relatedUnits: new Set(), edge: null, message: null, file: null };
      if (selected === null) return none;
      const unitsOf = (paths) => new Set([...paths].map((path) => unitIdOf(model, path)).filter((id) => id !== undefined));
      switch (selected.kind) {
        case "file":
          return { ...none, file: entryAt.get(selected.id) };
        case "message": {
          const message = lookup.messages.get(selected.id);
          const ends = [unitIdOf(model, message.from), unitIdOf(model, message.to)];
          const edge = ends[0] === ends[1] ? null : GraphLayout.edgeKeyOf(ends[0], ends[1]);
          return { ...none, paths: new Set([message.from, message.to]), units: new Set(ends), edge, message };
        }
        case "edge": {
          const edge = model.edgeAt.get(selected.id);
          const paths = [edge.from, edge.to].flatMap((id) => model.places.get(id).paths);
          return { ...none, paths: new Set(paths), units: new Set([edge.from, edge.to]), edge: edge.key };
        }
        case "box":
        case "group": {
          const paths = new Set(selected.kind === "box" ? [selected.id] : pathsOfGroup(model, selected.id));
          const related = relatedPathsOf(model, paths);
          const units = unitsOf(paths);
          return { ...none, paths, related, units, relatedUnits: new Set([...unitsOf(related)].filter((id) => !units.has(id))) };
        }
      }
    };

    /** 配置が変わって、選んだものが図から消えたら選択を外す。 */
    const validSelectionOf = (selected, model) => {
      if (selected === null) return null;
      switch (selected.kind) {
        case "file":
          return selected;
        case "message":
          return model.messages.some((message) => message.id === selected.id) ? selected : null;
        case "edge":
          return model.edgeAt.has(selected.id) ? selected : null;
        case "box":
          return model.layout.unitOf.has(selected.id) ? selected : null;
        case "group":
          return model.groups.some((group) => group.id === selected.id && group.boxes.length > 0) ? selected : null;
      }
    };

    /** 選んだものが関わる流れと、選んでいる流れのシーケンス(参加者と行)。 */
    const sequenceOf = (model, focus, selected) => {
      const touches = (message) => {
        if (focus.message !== null) return message.id === focus.message.id;
        const ends = [unitIdOf(model, message.from), unitIdOf(model, message.to)];
        if (focus.edge !== null) return ends.every((id) => id !== undefined) && GraphLayout.edgeKeyOf(ends[0], ends[1]) === focus.edge;
        return focus.paths.has(message.from) || focus.paths.has(message.to);
      };
      const stepsOf = (flow) => flow.steps.map((id) => lookup.messages.get(id)).filter((message) => message !== undefined);
      const isNarrowed = selected !== null;
      const relevant = isNarrowed ? flows.filter((flow) => stepsOf(flow).some(touches)) : flows;
      const flow = relevant.find((candidate) => candidate.id === state.flow) ?? relevant[0] ?? null;
      if (flow === null) return { relevant, flow, parts: [], rows: [] };
      const rows = stepsOf(flow).reduce((sofar, message) => {
        const from = unitIdOf(model, message.from);
        const to = unitIdOf(model, message.to);
        const isOffGraph = from === undefined || to === undefined;
        if (isOffGraph) return sofar;
        const last = sofar[sofar.length - 1];
        const extendsSelf = from === to && last !== undefined && last.kind === "self" && last.unit === from;
        if (extendsSelf) return [...sofar.slice(0, -1), { ...last, messages: [...last.messages, message] }];
        return [...sofar, from === to ? { kind: "self", unit: from, messages: [message] } : { kind: "message", from, to, message }];
      }, []);
      const parts = [...new Set(rows.flatMap((row) => (row.kind === "self" ? [row.unit] : [row.from, row.to])))];
      return { relevant, flow, parts, rows };
    };

    /** シーケンスで押した行が、図で光らせる単位と線。やりとりの行でなければ null。 */
    const stepOf = (model, sequence) => {
      const row = state.step === null ? undefined : sequence.rows[state.step];
      const isMessageRow = row !== undefined && row.kind === "message";
      if (!isMessageRow) return null;
      const paths = [row.from, row.to].flatMap((id) => model.places.get(id).paths);
      return { units: new Set([row.from, row.to]), key: GraphLayout.edgeKeyOf(row.from, row.to), paths: new Set(paths) };
    };

    const update = (change) => {
      state = { ...state, ...change };
      render();
    };
    /** 選んだものが木で指すファイル。組なら中の箱、線とやりとりは無し。 */
    const treePathsOf = (selected) => {
      if (selected === null) return [];
      switch (selected.kind) {
        case "box":
        case "file":
          return [selected.id];
        case "group":
          return groupAt.get(selected.id).paths;
        case "edge":
        case "message":
          return [];
      }
    };
    /** 選んだもののファイルが入っているフォルダを開く。 */
    const openedFor = (selected) => {
      const paths = treePathsOf(selected);
      return state.closedDirs.filter((prefix) => !paths.some((path) => path.startsWith(prefix)));
    };
    /** 選択を変える。変わるなら、前の選択を戻る先に積む。`change` は選択と一緒に変える状態。 */
    const pick = (next, change = {}) => {
      const isChange = !isSameSelection(state.selected, next);
      const history = isChange ? SelectionHistory.recorded(state.history, state.selected) : state.history;
      update({ ...change, selected: next, history, step: null, closedDirs: openedFor(next) });
    };
    /** 同じものをもう一度押したら選択を外す。 */
    const select = (next) => pick(isSameSelection(state.selected, next) ? null : next);
    /** 戻る先。配置が変わって図から消えた選択は飛ばす。 */
    const backOf = (model) => SelectionHistory.back(state.history, (selected) => validSelectionOf(selected, model) === selected);
    const goBack = () => {
      const back = lastView === null ? null : backOf(lastView.model);
      if (back === null) return;
      update({ selected: back.selection, history: back.history, step: null });
    };
    const toggleGroup = (id) => update({ expanded: { ...state.expanded, [state.grouping]: withToggledMember(state.expanded[state.grouping], id) }, step: null });
    const setExpanded = (ids) => update({ expanded: { ...state.expanded, [state.grouping]: ids }, step: null });
    const setScope = (id) => {
      const isEdgeSelected = state.selected !== null && state.selected.kind === "edge";
      update({ scope: id, selected: id !== null && isEdgeSelected ? null : state.selected, step: null });

      const ends = [unitIdOf(model, message.from), unitIdOf(model, message.to)];
      const [fromName, toName] = [nameOfPath(message.from), nameOfPath(message.to)];
      const role = message.kind === "evt" ? `「${fromName}」から「${toName}」へ${verbOf("evt")}。` : `「${fromName}」が「${toName}」に${verbOf(message.kind)}。`;
      const members = [["送る側", fromName, ends[0]], ["受ける側", toName, ends[1]]].map(([key, name, id]) => pressable("button", { class: "member-button" }, [el("span", { class: "muted", text: key }), name], () => selectPlace(model.places.get(id))));
      const edge = focus.edge === null ? undefined : model.edgeAt.get(focus.edge);
      const siblings = edge === undefined || !model.isMessageView ? [] : edge.items.filter((item) => item.id !== message.id).toSorted(byMessageKind);
      const between = model.dependencies.filter((link) => (link.from === message.from && link.to === message.to) || (link.from === message.to && link.to === message.from));
      return [
        detailHeadOf({ kind: Vocabulary.messageKinds[message.kind].label, status: messageStatusOf(message), title: messageTextOf(message, state.naming), path: state.naming === "concept" ? message.code : message.name, role, actions: [el("div", { class: "member-row" }, members)] }),
        messageSectionOf({ title: "受け渡しの中身", sub: "", cards: [messageCardOf(message, { peer: null, view })] }),
        ...(siblings.length === 0 ? [] : [messageSectionOf({ title: "同じつながりの他のやりとり", sub: `${siblings.length} 件`, cards: siblings.map((item) => messageCardOf(item, { peer: null, view })) })]),
        importsOf(between),
      ];
    };

    const fileDetailOf = (view) => {
      const entry = view.focus.file;
      const role = entry.concept !== null && typeof entry.concept.role === "string" ? `${entry.concept.role} 依存グラフの対象外です。` : "依存グラフの対象外です。";
      const changes = entry.changed ? [el("div", { class: "side-block" }, [el("span", { class: "eyebrow", text: "コードの変更" }), changeItemOf(entry, false)])] : [];
      return [detailHeadOf({ kind: "ファイル", status: entryStatusOf(entry), title: ExplainedMap.nameOf(entry, state.naming), path: entry.path, role, actions: [] }), ...changes];
    };

    const detailOf = (view) => {
      switch (view.selected.kind) {
        case "file":
          return fileDetailOf(view);
        case "message":
          return messageDetailOf(view);
        case "edge":
          return edgeDetailOf(view);
        case "box":
          return boxDetailOf(view);
        case "group":
          return groupDetailOf(view);
      }
    };

    /** シーケンス図の 1 行。やりとりは番号つきの矢印(イベントは破線)、同じ単位の中は「内部で n 件」にまとめる。 */
    const sequenceRowOf = (row, { index, sequence, view }) => {
      const count = sequence.parts.length;
      const centerOf = (unit) => ((sequence.parts.indexOf(unit) + 0.5) / count) * 100;
      const isSelectedMessage = state.step === null && view.focus.message !== null && row.kind === "message" && row.message.id === view.focus.message.id;
      const isActive = state.step === index || isSelectedMessage;
      const node = pressable("div", { class: classesOf("sequence-row", { "is-active": isActive }), title: row.kind === "self" ? row.messages.map((message) => message.name).join(" → ") : `${Vocabulary.messageKinds[row.message.kind].label}:${row.message.name} (${row.message.code})` }, [], () => update({ step: state.step === index ? null : index }));
      if (row.kind === "self") {
        const self = el("div", { class: "sequence-self" }, [el("span", { class: "sequence-loop" }), el("span", { text: `内部で ${row.messages.length} 件` })]);
        self.style.left = `${centerOf(row.unit)}%`;
        node.append(self);
        return node;
      }
      const [from, to] = [centerOf(row.from), centerOf(row.to)];
      const isRightward = to > from;
      const span = { left: `${Math.min(from, to)}%`, width: `${Math.abs(to - from)}%` };
      const label = el("div", { class: "sequence-label" }, [el("span", { class: classesOf("sequence-text", { "is-code": state.naming === "file" }), "data-kind": row.message.kind }, [el("span", { class: "sequence-number mono", text: String(index + 1) }), el("span", { class: "kind-swatch" }), messageTextOf(row.message, state.naming), el("span", { class: "label-dot", "data-tone": messageToneOf(row.message) })])]);
      const line = el("div", { class: classesOf("sequence-line", { "is-event": row.message.kind === "evt" }), "data-kind": row.message.kind });
      const head = el("div", { class: classesOf("sequence-head", { "is-left": !isRightward }), "data-kind": row.message.kind });
      Object.assign(label.style, span);
      Object.assign(line.style, span);
      head.style.left = isRightward ? `calc(${to}% - 7px)` : `${to}%`;
      node.append(label, line, head);
      return node;
    };

    const sequenceDiagramOf = (sequence, view) => {
      const count = sequence.parts.length;
      const columns = `repeat(${count}, minmax(0, 1fr))`;
      const parts = sequence.parts.map((id) => {
        const place = view.model.places.get(id);
        const isPicked = view.focus.units.has(id);
        const isStep = view.step !== null && view.step.units.has(id);
        const sub = place.kind === "group" ? "グループ" : entryAt.get(place.path).layer;
        const isCode = place.kind === "box" && isFileNamed(entryAt.get(place.path));
        return el("div", { class: "sequence-part-cell" }, [el("div", { class: classesOf("sequence-part", { "is-picked": isPicked, "is-step": !isPicked && isStep }), title: placeNameOf(place) }, [el("span", { class: classesOf("sequence-part-name", { "is-code": isCode }), text: placeNameOf(place) }), el("span", { class: "sequence-part-sub", text: sub })])]);
      });
      const lifelines = sequence.parts.map((id, index) => {
        const line = el("div", { class: classesOf("sequence-lifeline", { "is-lit": view.focus.units.has(id) || (view.step !== null && view.step.units.has(id)) }) });
        line.style.left = `${((index + 0.5) / count) * 100}%`;
        return line;
      });
      const head = el("div", { class: "sequence-parts" }, parts);
      head.style.gridTemplateColumns = columns;
      const body = el("div", { class: "sequence-body" }, [...lifelines, head, el("div", { class: "sequence-rows" }, sequence.rows.map((row, index) => sequenceRowOf(row, { index, sequence, view })))]);
      body.style.minWidth = `${count * SequenceColumnWidth}px`;
      const note = `${count} の参加者 · ${sequence.rows.length} ステップ${count > 5 ? " — グループを折りたたむと簡潔になります" : ""}`;
      return [
        el("div", { class: "sequence" }, [body]),
        el("span", { class: "muted small", text: note }),
        el("div", { class: "sequence-legend" }, [
          el("span", {}, [el("span", { class: "legend-line" }), "コマンド・クエリ"]),
          el("span", {}, [el("span", { class: "legend-line is-event" }), "イベント(通知)"]),
          ...Object.values(MessageStatuses).map((status) => el("span", { "data-tone": status.tone }, [el("span", { class: "status-dot" }), status.label])),
          el("span", { text: "行をクリックでグラフに表示" }),
        ]),
      ];
    };

    const renderFlows = (view) => {
      const { sequence, selected } = view;
      const isFileOnly = selected !== null && selected.kind === "file";
      flowSection.hidden = flows.length === 0 || isFileOnly;
      if (flowSection.hidden) return;
      const tabs = sequence.relevant.map((flow) => pressable("button", { class: "pill-button", "aria-pressed": String(sequence.flow !== null && flow.id === sequence.flow.id), text: flow.label }, [], () => update({ flow: flow.id, step: null })));
      const empty = sequence.relevant.length === 0 ? [el("span", { class: "side-sub", text: "この要素を通る代表的な操作の流れは登録されていません。" })] : [];
      const diagram = sequence.parts.length === 0 ? [] : sequenceDiagramOf(sequence, view);
      flowSection.replaceChildren(eyebrowOf("やりとりの流れ", selected === null ? "代表的なユーザー操作" : "これを通る操作"), el("div", { class: "pill-row" }, tabs), ...empty, ...diagram);
    };

    const renderSide = (view, isNewSelection) => {
      renderSideBar(view);
      const body = view.selected === null ? overviewOf(view.model) : detailOf(view);
      renderFlows(view);
      const scrollTop = side.scrollTop;
      side.replaceChildren(...body, flowSection);
      side.scrollTop = isNewSelection ? 0 : scrollTop;
    };

    let shownKey = null;
    const render = () => {
      const model = modelOf(state);
      const selected = validSelectionOf(state.selected, model);
      state = { ...state, selected };
      const focus = focusOf(model, selected);
      const sequence = sequenceOf(model, focus, selected);
      const view = { model, selected, focus, sequence, step: stepOf(model, sequence) };
      lastView = view;
      const key = selectionKeyOf(selected);
      const isNewSelection = key !== shownKey;
      shownKey = key;
      renderControls();
      renderCanvasControls(model);
      renderTree(view);
      renderGraph(view);
      renderSide(view, isNewSelection);
      const current = isNewSelection ? treeBody.querySelector(".tree-row.is-current") : null;
      if (current !== null) current.scrollIntoView({ block: "nearest" });
    };

    /** 流れを選んだ状態にし、右のパネルをその流れまで送る。 */
    const showFlow = (id) => {
      pick(null, { flow: id });
      flowSection.scrollIntoView({ block: "start" });
    };

    /**
     * やりとりを選んだ状態にする。表示範囲の絞り込みは外す(絞り込んで他を非表示にしているときは、範囲の外のやりとりが図に無いため)。
     * 両端が図の箱でないやりとりは、絞り込みを外しても図に無いので選ばない。
     */
    const showMessage = (id) => {
      if (isDrawnMessage(lookup.messages.get(id), entryAt)) pick({ kind: "message", id }, { scope: null });
    };

    render();

    /** Backspace / Alt+← で前の選択に戻る。入力欄の中では戻らない。 */
    const onKey = (event) => {
      const isBackspace = event.key === "Backspace" && !event.metaKey && !event.ctrlKey;
      const isAltLeft = event.altKey && event.key === "ArrowLeft";
      const isBack = (isBackspace || isAltLeft) && !isTypingIn(event);
      if (!isBack) return;
      event.preventDefault();
      goBack();
    };

    return {
      summary: [countsOf(`${explained.totals.files} files`, explained.totals.additions, explained.totals.deletions)],
      controls: [controlNodes.grouping, controlNodes.level, controlNodes.scope, controlNodes.focus],
      tablist: null,
      left: panelOf("left", [panelHead("ファイル", `${changedCount} 件の変更`, [el("span", { class: "spacer" }), changedOnlySwitch]), treeBody]),
      main: graph.element,
      right: panelOf("right", [sideBar, side]),
      onKey,
      showFlow,
      showMessage,
      /** @returns 構造マップが行き先の Target で、指す先が地図にあり選べるか */
      canShow: (target) => mapGoOfTarget(target) !== null,
      /** その Target が指すものを選んだ状態にする。`canShow` が真のものだけを渡す。 */
      showTarget: (target) => mapGoOfTarget(target).onPress(),
    };
  };

  // 振る舞いの画面の節の小見出し(節の種類ごと)。
  const ImpactEyebrows = { changed: "前と後", table: "状況ごと", added: "増えた状況", kept: "前と同じ" };
  // 節の頭の札を、節の種類から引く表。表の札は変わったマスの件数から組むので、ここには無い。
  const ImpactChipLabelsByKind = { changed: "この PR で変わった", added: "この PR で増えた状況", kept: "変わらない" };

  /** 節が、この PR で変わった・増えたことを書いているか(目次の印・節の札・目次の小見出しの件数)。 */
  const isChangeTopic = (topic) => {
    switch (topic.kind) {
      case "changed":
      case "added":
        return true;
      case "table":
        return topic.changedCount > 0;
      case "kept":
        return false;
    }
  };

  /** 節の頭の札。変わったマスの無い表には付けない。 */
  const impactChipOf = (topic) => {
    const isChange = isChangeTopic(topic);
    if (topic.kind !== "table") return { tone: isChange ? "A" : "", label: ImpactChipLabelsByKind[topic.kind] };
    return isChange ? { tone: "A", label: `変わったマス ${topic.changedCount}` } : null;
  };

  /** 目次の小見出し。変わったマスのある表は件数を添える。 */
  const tocEyebrowOf = (topic) => {
    const hasChangedOutcomes = topic.kind === "table" && isChangeTopic(topic);
    return hasChangedOutcomes ? `${ImpactEyebrows.table} · 変わった ${topic.changedCount}` : ImpactEyebrows[topic.kind];
  };

  /** 節の根拠のうち、まだ書かれていないテスト(2 か所で挙げていても 1 件)。 */
  const missingTestsOf = (topic) => [...new Map(ImpactTopics.evidencePlacesOf(topic).flatMap((place) => place.evidence.missing).map((test) => [test.test.id, test])).values()];

  /**
   * 変わらないことの行の札。
   *
   * 「テストあり」とは書かない。未実装のテストだけを挙げた行も「あり」と読めるので、確かめているテストがあるかを札にする。
   */
  const guardOf = (evidence) => el("span", { class: classesOf("impact-guard", { "is-missing": !evidence.isGuarded }), text: evidence.isGuarded ? "テストで守っている" : "この PR では未確認" });

  /** これまで / これからのカード。行は使う人の言葉なので、書いたまま出す。 */
  const impactSidesOf = (topic) => beforeAfterCardsOf({
    cards: [
      { title: "これまで", sub: "", lines: topic.before, empty: "(この PR より前には無かった)" },
      { title: "これから", sub: "", lines: topic.after, empty: null },
    ],
    itemOf: (line) => el("div", { class: "behavior-item" }, [el("span", { text: line.text })]),
  });
  const impactTextOf = (text) => (text === null ? [] : [el("p", { class: "topic-text", text })]);

  /**
   * 節を 3 列(左に目次・中に節・右に今の節の欄)に並べ、本文のスクロールに合わせて今の節を決める。振る舞いと技術の手引きの
   * 2 画面が使う。狭い幅では右の欄を隠し、同じ中身を各節に畳んで出す(CSS)。節の頭・右の欄の頭・目次の行はここで組む。
   *
   * ここの DOM の配線(スクロールの購読・目次の押下・右の欄と畳んだ根拠の描き直し)と、2 画面がそれぞれ足す配線は判定表を
   * 通らず、表示確認(`rules/ui-verification.md`)でしか守られていない。見た目の比べには比べる写しと解説が要るので、繰り返し走る
   * 検査にはしていない。
   */
  const TopicColumns = (() => {
    const chipOf = ({ tone, label }) => el("span", { class: "chip", "data-tone": tone, text: label });
    const headOf = (topic) => el("div", { class: "topic-head" }, [
      el("div", { class: "section-head" }, [el("span", { class: "topic-eyebrow", text: topic.eyebrow }), ...topic.chips.map(chipOf)]),
      el("h2", { class: "prose" }, [el("span", { class: "topic-hash", text: "#" }), ...topic.labelPartsOf()]),
    ]);
    const sideHeadOf = (topic) => el("div", { class: "side-block" }, [el("span", { class: "eyebrow", text: topic.eyebrow }), el("h2", { class: "prose" }, topic.labelPartsOf())]);
    const tocPartsOf = (topic) => {
      const dot = topic.dotTone === null ? [] : [el("span", { class: "status-dot", "data-tone": topic.dotTone })];
      return [el("span", { class: "row-sub", text: topic.tocEyebrow }), el("span", { class: "change-head" }, [...dot, el("span", { class: "row-title prose" }, topic.labelPartsOf())])];
    };
    /** 本文の欄に掛かっている文字の倍率。CSS の `zoom` プロパティの computed 値を読む。子孫の値は 1 を返すので、`zoom` を掛けた本文の欄から読む。 */
    const textRatioOf = (main) => Number(getComputedStyle(main).zoom);
    /** スクロールしているのがページ全体のときの、その上端(0)と送り方。 */
    const pageArea = Object.freeze({ topOf: () => 0, scrollBy: (distance) => window.scrollBy(0, distance) });
    /** スクロールしているのが本文の欄のときの、その上端と送り方。`scrollTop` は欄の中の CSS px なので倍率で割る。 */
    const columnAreaOf = (main) => Object.freeze({
      topOf: () => main.getBoundingClientRect().top,
      scrollBy: (distance, ratio) => {
        main.scrollTop += distance / ratio;
      },
    });
    /**
     * いまスクロールしている領域。狭い幅かどうかは `@media` が本文の欄の `overflow` で決めるので、その結果を読む。
     *
     * `matchMedia` で幅を見ると `@media` の 760 を JS に写すことになり、`scrollHeight > clientHeight` は本文の量で答えが変わる。
     */
    const readingAreaOf = (main) => (getComputedStyle(main).overflowY === "visible" ? pageArea : columnAreaOf(main));

    return Object.freeze({
      /**
       * 節の 3 列を組み、最初に 1 回描く。今の節は、節が 0 件なら null、ほかは最初の節から始める。
       * @param topics 節の並び。1 件は次のものを持つ
       *   - `attributes` 節の要素(article)に付ける属性
       *   - `eyebrow` 節の頭と右の欄の頭の小見出し。`tocEyebrow` 目次の行の小見出し
       *   - `chips` 節の頭の札(`{tone, label}`)の並び。`dotTone` 目次の行の点の色(点を出さないなら null)
       *   - `labelPartsOf` 題の中身を返す。節の頭・右の欄の頭・目次の 3 か所に出すので、呼ぶたびに新しく作る
       *   - `tocDivider` 目次で、その行の前に挟む区切りの文(無ければ null)
       *   - `inlineSummary` 畳んだ欄の summary の文。`body` 本文の要素の並び
       *   - `sideBlocksOf` 右の欄と畳んだ欄の中身を返す。呼ぶたびに新しく作る
       * @param emptySide 節が無いときの右の欄の文
       * @returns `articles`(節の要素)・`toc`(目次の欄。節が無ければ空の文)・`inlineHolders`(畳んだ欄の中身を入れる要素)・
       *   `side`(右の欄)と、`follow(top, ratio)`(スクロールに合わせて今の節を決め直す)・`sendTo(index)`(節へ送る)・`render()`(描き直す)・
       *   `currentArticle()`(今の節の要素。節が 0 件なら null)
       */
      create: ({ topics, emptySide }) => {
        let current = topics.length === 0 ? null : 0;
        let shownCurrent = null;
        const side = el("div", { class: "side" });
        const inlineHolders = topics.map(() => el("div", { class: "side" }));
        const articles = topics.map((topic, index) => el("article", { class: "topic", ...topic.attributes }, [
          headOf(topic),
          el("details", { class: "topic-inline" }, [el("summary", { text: topic.inlineSummary }), inlineHolders[index]]),
          ...topic.body,
        ]));

        const render = () => {
          for (const [index, row] of tocRows.entries()) row.classList.toggle("is-current", index === current);
          for (const [index, holder] of inlineHolders.entries()) holder.replaceChildren(...topics[index].sideBlocksOf());
          side.replaceChildren(...(current === null ? [el("p", { class: "side-note", text: emptySide })] : [sideHeadOf(topics[current]), ...topics[current].sideBlocksOf()]));
          if (current !== shownCurrent) side.scrollTop = 0;
          shownCurrent = current;
        };

        /**
         * 節へ送る。今の節はスクロールを待たずにその節にする。
         *
         * 今の節が同じでも描き直す(`showMention` が選び直したマスの根拠を、ここで描かせるため)。
         */
        const sendTo = (index) => {
          current = index;
          render();
          articles[index].scrollIntoView({ block: "start" });
        };
        const tocRows = topics.map((topic, index) => pressable("button", { class: "row plain-button" }, tocPartsOf(topic), () => sendTo(index)));
        const tocItems = topics.flatMap((topic, index) => [...(topic.tocDivider === null ? [] : [el("div", { class: "topic-toc-divider", text: topic.tocDivider })]), tocRows[index]]);
        const toc = el("div", { class: "panel-scroll" }, tocItems.length > 0 ? tocItems : [emptyOf("節がありません。")]);

        /**
         * スクロールに合わせて今の節を決め直す。変わったときだけ描き直す。
         * @param top スクロールしている領域の上端の、表示領域の上端からの距離
         * @param ratio 本文の欄に掛かっている文字の倍率
         */
        const follow = (top, ratio) => {
          const next = TopicScroll.currentOf(articles.map((article) => article.getBoundingClientRect().top - top), ratio);
          if (next === current) return;
          current = next;
          render();
        };

        const currentArticle = () => (current === null ? null : articles[current]);

        render();
        return { articles, toc, inlineHolders, side, follow, sendTo, render, currentArticle };
      },
      /**
       * 本文の欄とページ全体のスクロールを `follow` へ渡す。
       * @param main 本文の欄(`main.stage`)
       * @param follow スクロールしている領域の上端の位置と、本文の欄に掛かっている文字の倍率を受け取る
       */
      subscribe: ({ main, follow }) => {
        const isShown = () => {
          const screen = main.closest(".screen");
          return screen !== null && !screen.hidden;
        };
        // スクロールしているのが本文の欄(広い幅)かページ全体(狭い幅)かは CSS の `@media` が決めるので、イベントの出どころで見分ける。
        main.addEventListener("scroll", () => follow(columnAreaOf(main).topOf(), textRatioOf(main)), { passive: true });
        // ページ全体のスクロールは、その画面が隠れているあいだはほかの画面のものなので見ない。
        window.addEventListener("scroll", () => {
          if (isShown()) follow(pageArea.topOf(), textRatioOf(main));
        }, { passive: true });
      },
      /**
       * 文字の倍率を変えるあいだ、今の節の読んでいた点を読む線に残す包みを作る。
       * スクロールする領域の先頭・末尾でスクロールが止まると、読んでいた点は読む線まで届かず、そのずれは残る。
       * @param main 本文の欄(`main.stage`)
       * @param currentColumns 今の節の 3 列(`create` の戻り値)を返す
       * @returns `keepReading(apply)`。`apply` で倍率を変え、今の節を読む線へ送り直して今の節を決め直す
       */
      keepReadingOf: ({ main, currentColumns }) => (apply) => {
        const article = currentColumns().currentArticle();
        if (article === null) {
          apply();
          return;
        }
        const area = readingAreaOf(main);
        const beforeRect = article.getBoundingClientRect();
        const before = { top: beforeRect.top - area.topOf(), height: beforeRect.height, ratio: textRatioOf(main) };
        apply();
        // ずらす量は apply 後の実測から取る。倍率から計算すると、幅が変わって折り返しが変わった分を取り込めない。
        const afterRect = article.getBoundingClientRect();
        const after = { height: afterRect.height, ratio: textRatioOf(main) };
        area.scrollBy(afterRect.top - area.topOf() - TopicScroll.keptTopOf({ before, after }), after.ratio);
        // ずらす量が 0 のときや、先頭・末尾で止まったときはスクロールのイベントが来ないので、ここで決め直す。
        currentColumns().follow(area.topOf(), after.ratio);
      },
    });
  })();

  /**
   * 振る舞い。左に節の目次、中に使う人から見た変化の節、右に今の節の根拠(仕様・関連 Issue・テスト・仕組み)を出す。
   *
   * 表示確認でしか守られていない DOM の配線(理由は `TopicColumns`): マスの押下と `aria-pressed`、仕様の欄の見出しの
   * 出し分け(「仕様」/「関連 Issue」)、仕様の場所のカード(変わらないことのカードを含む)、変えた仕様の場所のカードの届く先ごとの
   * ボタンと、その「差分で見る」の移り先(ファイル / コミット)、技術の手引きのチップと、その移り先(タブと節)。
   */
  const ImpactScreen = (explained, go) => {
    const impactTopics = explained.impactTopics;
    const topics = impactTopics.kind === "written" ? impactTopics.topics : [];
    // `selected` は表ごとに選んでいるマス(節の id → `{row, column}`)。表は最初の「変わった」マス(無ければ先頭のマス)を選んで始める。
    let selected = Object.fromEntries(topics.filter((topic) => topic.kind === "table").map((topic) => [topic.id, ImpactTopics.firstCellOf(topic)]));

    /** マスの鍵。`cell` は `{row, column}` を持つもの(マスか選択)。 */
    const cellKeyOf = (topicId, cell) => JSON.stringify([topicId, cell.row, cell.column]);
    const cellNodes = new Map();
    const body = el("div", { class: "stage-body topic-body" });
    const main = el("main", { class: "stage" }, [body]);

    /** その表で選んでいるマス。マスが 1 つも無い表は null。 */
    const selectedOutcomeIn = (topic) => {
      const cell = selected[topic.id];
      if (cell === null) return null;
      return topic.outcomes.find((outcome) => outcome.row === cell.row && outcome.column === cell.column);
    };

    const testCardOf = (test) => testJumpCardOf(test, go);

    /** 仕組みのやりとりのチップ。両端が図の箱でないやりとりは構造マップで選べないので、押せなくして「図に無い」と出す。 */
    const mechanismChipOf = ({ message, isDrawn }) => {
      const title = isDrawn ? "構造マップでこのやりとりを見る" : "両端が図の箱でないので、構造マップでは選べません";
      const chip = pressable("button", { class: "flow-chip", title }, [message.name, el("span", { class: "arrow", text: isDrawn ? "↗" : "図に無い" })], () => go.toMessage(message.id));
      chip.disabled = !isDrawn;
      return chip;
    };
    /** 仕組みの欄。やりとりのチップ → 技術の手引きのチップの順に並べ、見出しの注記「構造マップ」はやりとりのチップがあるときだけ出す。 */
    const mechanismsBlockOf = (topic) => {
      const chips = [...topic.mechanisms.map(mechanismChipOf), ...topic.primers.map((position) => primerTopicChipOf(position, `技術の手引きの「${PrimerTabTexts[position.tab].label}」でこの節を見る`, go.toPrimer))];
      if (chips.length === 0) return [];
      // 技術の手引きの行き先はチップの「言語」/「実装」で示し、注記には足さない(デザイン案の見出しは注記を持たず、そこから新しく離れないため)。
      const note = topic.mechanisms.length === 0 ? undefined : "構造マップ";
      return [el("div", { class: "side-block" }, [eyebrowOf("仕組みを知りたいとき", note), el("div", { class: "flow-chips" }, chips)])];
    };

    /** 届く先の sha のチップと移るボタン。届かない先は注意を添える。 */
    const destinationMetaOf = (destination) => {
      const { label, onPress, warning } = destinationLinkOf(destination, go);
      return el("span", { class: "ref-card-meta" }, [
        el("span", { class: "sha", text: shortSha(destination.sha) }),
        // コミットの件名は出さない(振る舞いの画面にコードの名前を持ち込まないため。理由の正本は `build-pr-explain.py` の冒頭)。
        pressable("button", { class: "review-go plain-button", title: CommitLinkTitle, text: `${label} →` }, [], onPress),
        ...warningNodesOf(warning),
      ]);
    };

    /** 仕様の場所のカードの中身。パスと位置と、どう変えたか(変えていないか)。 */
    const specLinesOf = (spec) => [
      el("span", { class: "ref-card-head" }, [`${spec.path} `, el("span", { class: "ref-card-locator", text: spec.locator })]),
      el("span", { class: "side-sub", text: spec.text }),
    ];
    /** 変わらないことの仕様の場所のカード。 */
    const keptSpecCardOf = (spec) => el("div", { class: "ref-card" }, specLinesOf(spec));
    /** 変えた仕様の場所のカード。中身に、届く先ごとの移るボタンを足す。 */
    const changedSpecCardOf = (spec) => el("div", { class: "ref-card" }, [...specLinesOf(spec), ...spec.destinations.map(destinationMetaOf)]);

    const relatedIssueCardOf = (related) => el("div", { class: "ref-card" }, [
      el("span", { class: "ref-card-head", text: `Issue #${related.issue}` }),
      el("span", { class: "side-sub", text: related.text }),
    ]);

    /**
     * 仕様の欄。仕様の場所があれば見出しは「仕様」で、関連 Issue も同じ欄に並べる。関連 Issue だけなら見出しは「関連 Issue」。
     * @param specCards 仕様の場所のカード(`changedSpecCardOf` / `keptSpecCardOf` で作ったもの)
     */
    const specBlocksOf = (specCards, relatedIssues) => {
      const cards = [...specCards, ...relatedIssues.map(relatedIssueCardOf)];
      if (cards.length === 0) return [];
      return [el("div", { class: "side-block" }, [eyebrowOf(specCards.length > 0 ? "仕様" : "関連 Issue"), ...cards])];
    };

    /**
     * 節の根拠の要素。右の欄と、狭い幅で各節に畳んだ根拠の両方がこれを出す。
     * @param topic 根拠を出す節(表なら、その表で選んでいるマスの根拠)
     */
    const evidenceBlocksOf = (topic) => {
      switch (topic.kind) {
        case "changed": {
          const blocks = [...specBlocksOf(topic.specs.map(changedSpecCardOf), topic.relatedIssues), ...mechanismsBlockOf(topic)];
          return blocks.length > 0 ? blocks : [el("p", { class: "side-note", text: "仕様の場所・関連 Issue・前後の行が指すやりとり・技術の手引きの節は、どれも書かれていません。" })];
        }
        case "table": {
          const outcome = selectedOutcomeIn(topic);
          if (outcome === null) return [el("p", { class: "side-note", text: "この表には、書かれたマスがありません。" })];
          return [el("div", { class: "side-block" }, [el("span", { class: "eyebrow", text: "状況" }), el("span", { class: "side-sub", text: outcome.situation })]), ...testsBlocksOf(outcome.tests, go)];
        }
        case "added":
          return [...testsBlocksOf(topic.tests, go), ...mechanismsBlockOf(topic)];
        case "kept":
          return [...specBlocksOf(topic.specs.map(keptSpecCardOf), []), ...topic.lines.map((line) => el("div", { class: "side-block" }, [
            el("span", { class: "side-sub", text: line.text }),
            guardOf(line.tests),
            ...line.tests.verifying.map(testCardOf),
            ...(line.tests.missing.length === 0 ? [] : [eyebrowOf("無いテスト", "未実装(提案)"), ...line.tests.missing.map(testCardOf)]),
          ]))];
      }
    };

    /** 表のマス。書かれていない組み合わせは空きにする。押すとそのマスを選ぶ(選び直すまで、スクロールしても外さない)。 */
    const outcomeNodeOf = (topic, outcome) => {
      if (outcome === null) return el("div", { class: "impact-cell is-missing", text: "(書かれていない)" });
      const was = outcome.was === null ? [] : [el("span", { class: "impact-cell-was" }, ["これまで: ", el("s", { text: outcome.was })])];
      const note = outcome.note === null ? [] : [el("span", { class: "impact-cell-was", text: outcome.note })];
      const node = pressable("button", { class: classesOf("impact-cell", { "is-changed": outcome.isChanged }), "aria-pressed": "false", title: outcome.situation }, [
        el("span", { class: "impact-cell-badge", text: outcome.isChanged ? "変わった" : "変わらない" }),
        el("span", { class: "impact-cell-result", text: outcome.result }),
        ...was,
        ...note,
      ], () => selectCell(topic.id, outcome));
      cellNodes.set(cellKeyOf(topic.id, outcome), node);
      return node;
    };

    const situationTableOf = (topic) => el("div", { class: "impact-table-wrap" }, [el("table", { class: "impact-table" }, [
      el("thead", {}, [el("tr", {}, [el("td"), ...topic.columns.map((column) => el("th", { scope: "col", text: column.label }))])]),
      el("tbody", {}, topic.rows.map((row) => el("tr", {}, [
        el("th", { scope: "row" }, [row.head.label, ...(row.head.note === null ? [] : [el("small", { text: row.head.note })])]),
        ...row.outcomes.map((outcome) => el("td", {}, [outcomeNodeOf(topic, outcome)])),
      ]))),
    ])]);

    /** 本文には、まだ書かれていないテストの件数だけを出す。中身は根拠の「無いテスト」にある。 */
    const missingNoteOf = (topic) => {
      const count = missingTestsOf(topic).length;
      if (count === 0) return [];
      return [el("div", { class: "topic-note", "data-remark": "caution" }, [el("span", { class: "topic-note-label", text: "まだ書かれていないテスト" }), el("span", { text: `${count} 件あります。中身は根拠の「無いテスト」に出ています。` })])];
    };

    const topicBodyOf = (topic) => {
      switch (topic.kind) {
        case "changed":
          return [impactSidesOf(topic), ...impactTextOf(topic.text)];
        case "table": {
          const gist = topic.gist === null ? [] : [el("div", { class: "topic-gist" }, [el("span", { class: "topic-gist-label", text: "要するに" }), el("span", { class: "topic-gist-text", text: topic.gist })])];
          return [...gist, situationTableOf(topic), ...impactTextOf(topic.text), ...missingNoteOf(topic)];
        }
        case "added":
          return [impactSidesOf(topic), ...impactTextOf(topic.text), ...missingNoteOf(topic)];
        case "kept":
          return [el("ul", { class: "impact-kept" }, topic.lines.map((line) => el("li", {}, [el("span", { class: "impact-kept-text", text: line.text }), guardOf(line.tests)]))), ...missingNoteOf(topic)];
      }
    };

    const ledeOfImpact = () => {
      const eyebrow = el("span", { class: "eyebrow", text: "振る舞い · 使う人から見て変わったこと" });
      switch (impactTopics.kind) {
        case "none":
          return [el("div", { class: "lede" }, [eyebrow, emptyOf("解説が無いので、振る舞いは出せません。理由は上の帯に出ています。")])];
        case "unwritten":
          return [el("div", { class: "lede" }, [eyebrow, emptyOf("この解説には、使う人から見て何が変わったか(振る舞い)が書かれていません。変更の経緯の「ブランチ全体の流れ」に、これまで / このブランチのあとがあります。")])];
        case "written": {
          const lede = el("div", { class: "lede" }, [eyebrow, el("h1", { text: impactTopics.title }), el("p", { text: impactTopics.lead })]);
          return topics.length > 0 ? [lede] : [lede, emptyOf("状況ごとの振る舞いは書かれていません。")];
        }
      }
    };

    const columns = TopicColumns.create({
      topics: topics.map((topic) => {
        const chip = impactChipOf(topic);
        return {
          attributes: { "data-topic": topic.id },
          eyebrow: ImpactEyebrows[topic.kind],
          tocEyebrow: tocEyebrowOf(topic),
          chips: chip === null ? [] : [chip],
          dotTone: isChangeTopic(topic) ? "A" : "",
          labelPartsOf: () => [topic.label],
          tocDivider: null,
          inlineSummary: "根拠(仕様とテスト)",
          body: topicBodyOf(topic),
          sideBlocksOf: () => evidenceBlocksOf(topic),
        };
      }),
      emptySide: "根拠を出す節がありません。",
    });

    /** 選んでいるマスに `aria-pressed` を付け直す。 */
    const renderPressed = () => {
      const selectedKeys = new Set(Object.entries(selected).filter(([, cell]) => cell !== null).map(([topicId, cell]) => cellKeyOf(topicId, cell)));
      for (const [key, node] of cellNodes) node.setAttribute("aria-pressed", String(selectedKeys.has(key)));
    };
    /** 表のマスを選び直す。今の節は変えない。 */
    const selectCell = (topicId, outcome) => {
      selected = { ...selected, [topicId]: { row: outcome.row, column: outcome.column } };
      renderPressed();
      columns.render();
    };
    renderPressed();

    body.replaceChildren(...ledeOfImpact(), ...columns.articles);
    TopicColumns.subscribe({ main, follow: columns.follow });
    const keepReading = TopicColumns.keepReadingOf({ main, currentColumns: () => columns });

    return {
      summary: [],
      controls: [],
      tablist: null,
      keepReading,
      left: panelOf("left", [panelHead("目次", "変わった → 変わらない"), columns.toc]),
      main,
      right: panelOf("right", [panelHead("根拠", "仕様とテスト"), columns.side]),
      /**
       * 他の画面から、その節へ送る。表のマスを指していれば、そのマスを選んで見える位置へ送る。
       * @param mention `ImpactTopics.mentionsOf` の 1 件
       */
      showMention: (mention) => {
        const index = topics.findIndex((topic) => topic.id === mention.topic);
        if (mention.cell === null) {
          columns.sendTo(index);
          return;
        }
        selected = { ...selected, [mention.topic]: mention.cell };
        renderPressed();
        columns.sendTo(index);
        cellNodes.get(cellKeyOf(mention.topic, mention.cell)).scrollIntoView({ block: "nearest", inline: "nearest" });
      },
    };
  };

  // 技術の手引きのタブごとの文言。`chip` は技術の手引きの節へ移るチップ(`primerTopicChipOf`)に添える、移る先のタブの短い名前。
  const PrimerTabTexts = {
    language: {
      label: "言語・フレームワーク",
      chip: "言語",
      description: "言語とフレームワークの書き方",
      tocNote: "差分に出てくる順",
      eyebrow: "技術の手引き · 言語・フレームワーク",
      title: "この PR を読むのに要る、言語とフレームワークの知識",
      lead: "この PR の差分に出てくる書き方を、出てくる場所と一緒にまとめています。順に読む必要はありません。差分を読んでいて引っかかったところだけ引いてください。このリポジトリ固有の仕組みは「この PR の実装」タブにあります。",
    },
    codebase: {
      label: "この PR の実装",
      chip: "実装",
      description: "このリポジトリで決めている形と、この PR で足した仕組み",
      tocNote: "全体から部品へ",
      eyebrow: "技術の手引き · この PR の実装",
      title: "この PR が使っている、このリポジトリの仕組み",
      lead: "言語の機能ではなく、design-composer の中で決めている形です。全体の流れから入り、部品へ降りる順に並べています。この PR で足したもの・変えたもの・前からあるものを札で分けています。",
    },
  };
  const PrimerSideTitle = "この PR で出てくる場所";
  const PrimerEmptySide = "出てくる場所を出す節がありません。";
  const TabMoveKeys = { ArrowRight: 1, ArrowLeft: -1 };

  /** 実装の節の札(状態の色と名前)。状態を省いた節(`PrimerTopics.Existing`)は「前からある」で、色の区分を持たない(`.chip` の地と文字の色)。 */
  const primerChipOf = (status) => (status === PrimerTopics.Existing ? { tone: "", label: "前からある" } : Vocabulary.primerStatuses[status]);

  /**
   * 技術の手引き。上にタブ、左に目次、中に今のタブの節、右に今の節の出てくる場所・根拠・用語を出す。
   *
   * 表示確認でしか守られていない DOM の配線(理由は `TopicColumns`): タブの切り替えと位置の保存・復元・最初に開くタブの適用・
   * 関連のチップ・ほかの画面から節へ送る入口・用語の光・出てくる場所のボタンの移り先(行 / ファイル / コミット)。
   */
  const PrimerScreen = (explained, go) => {
    const primerTopics = explained.primerTopics;
    const main = el("main", { class: "stage" });
    const left = panelOf("left", []);
    const right = panelOf("right", []);
    const screenParts = { summary: [], controls: [], main, left, right };

    const emptyLedeOf = (text) => el("div", { class: "lede" }, [el("span", { class: "eyebrow", text: "技術の手引き" }), emptyOf(text)]);
    /** 節の無いときの 3 列。本文は小見出しと空の文だけ。 */
    const emptyScreenOf = (text) => {
      const columns = TopicColumns.create({ topics: [], emptySide: PrimerEmptySide });
      main.replaceChildren(el("div", { class: "stage-body topic-body" }, [emptyLedeOf(text)]));
      left.replaceChildren(panelHead("目次", ""), columns.toc);
      right.replaceChildren(panelHead(PrimerSideTitle, ""), columns.side);
      return { ...screenParts, tablist: null };
    };
    switch (primerTopics.kind) {
      case "none":
        return emptyScreenOf("解説が無いので、技術の手引きは出せません。理由は上の帯に出ています。");
      case "unwritten":
        return emptyScreenOf("この解説には、技術の手引きが書かれていません。");
      case "written":
        break;
    }

    const tabs = Object.values(PrimerTopics.PrimerKinds);
    const termListOf = (terms) => el("dl", { class: "primer-terms" }, terms.map((term) => el("div", { class: "primer-term", "data-term": term.id }, [el("dt", { text: term.label }), prose("dd", {}, term.text)])));

    const destinationNodesOf = (destination) => {
      const { label, onPress, warning } = destinationLinkOf(destination, go);
      const link = commitLinkOf({ sha: destination.sha, label, commitAt: explained.commitAt, onPress });
      return [link, ...warningNodesOf(warning)];
    };

    const occurrencesBlockOf = (topic) => el("div", { class: "side-block" }, [
      eyebrowOf("出てくる場所", `${topic.occurrences.length} か所`),
      ...topic.occurrences.map((occurrence) => el("div", { class: "ref-card" }, [
        el("span", { class: "ref-card-head", text: occurrence.lineRange === null ? occurrence.path : `${occurrence.path} ${lineRangeOf(occurrence.lineRange)}` }),
        prose("span", { class: "side-sub" }, occurrence.text),
        ...occurrence.destinations.flatMap(destinationNodesOf),
      ])),
    ]);

    /** 節の右の欄(と畳んだ欄)の中身。出てくる場所 → (実装だけ)テスト・構造マップ → 関連 → 用語。 */
    const topicSideBlocksOf = (topic, showSeeAlso) => {
      const isCodebase = topic.kind === PrimerTopics.PrimerKinds.Codebase;
      const showsTests = isCodebase && topic.tests.verifying.length + topic.tests.missing.length > 0;
      const tests = showsTests ? testsBlocksOf(topic.tests, go) : [];
      const showsFlows = isCodebase && topic.flows.length > 0;
      const flows = showsFlows ? [el("div", { class: "side-block" }, [eyebrowOf("構造マップで見る"), el("div", { class: "flow-chips" }, topic.flows.map((flow) => flowChipOf(flow, go)))])] : [];
      const seeAlsoChips = topic.seeAlso.map((position) => primerTopicChipOf(position, `「${PrimerTabTexts[position.tab].label}」のこの節を見る`, showSeeAlso));
      const seeAlso = seeAlsoChips.length === 0 ? [] : [el("div", { class: "side-block" }, [eyebrowOf("関連"), el("div", { class: "flow-chips" }, seeAlsoChips)])];
      const terms = topic.terms.length === 0 ? [] : [el("div", { class: "side-block" }, [eyebrowOf("用語"), termListOf(topic.terms)])];
      return [occurrencesBlockOf(topic), ...tests, ...flows, ...seeAlso, ...terms];
    };

    /** 段を本文の要素にする。抜粋は中身(`text`)が足されたものだけを出す。 */
    const passageNodesOf = (passage, onMark) => {
      const marked = (tag, props, pieces) => markedProseOf({ tag, props, pieces, onMark });
      switch (passage.kind) {
        case "text":
          return [marked("p", { class: "topic-text" }, passage.pieces)];
        case "declaration":
          return [el("pre", { class: "primer-declaration", text: passage.code })];
        case "parameters":
          return [el("div", { class: "primer-parameters" }, [el("table", {}, [
            el("thead", {}, [el("tr", {}, ["引数", "型", "何を表すか"].map((text) => el("th", { text })))]),
            el("tbody", {}, passage.parameters.map((parameter) => el("tr", {}, [
              el("td", {}, [parameter.name, ...(parameter.note === null ? [] : [el("span", { class: "primer-parameter-note", text: parameter.note })])]),
              el("td", { text: parameter.type }),
              el("td", {}, [marked("span", {}, parameter.pieces)]),
            ]))),
          ])])];
        case "excerpt":
          return codeExampleOf(passage.excerpt);
        case "remark":
          return [el("div", { class: "topic-note", "data-remark": passage.remark }, [el("span", { class: "topic-note-label", text: passage.label }), marked("span", {}, passage.pieces)])];
      }
    };

    const topicBodyOf = (topic, onMark) => [
      el("div", { class: "topic-gist" }, [el("span", { class: "topic-gist-label", text: "要するに" }), markedProseOf({ tag: "span", props: { class: "topic-gist-text" }, pieces: topic.gist, onMark })]),
      ...topic.passages.flatMap((passage) => passageNodesOf(passage, onMark)),
    ];

    const ledeOf = (tab) => {
      const texts = PrimerTabTexts[tab];
      const statuses = [...Object.keys(Vocabulary.primerStatuses), PrimerTopics.Existing].map(primerChipOf);
      const legend = tab === PrimerTopics.PrimerKinds.Codebase ? [el("div", { class: "primer-legend" }, statuses.map((chip) => el("span", {}, [el("span", { class: "status-dot", "data-tone": chip.tone }), chip.label])))] : [];
      return el("div", { class: "lede" }, [el("span", { class: "eyebrow", text: texts.eyebrow }), el("h1", { text: texts.title }), el("p", { text: texts.lead }), ...legend]);
    };

    /** タブの末尾の用語集の節。用語集は節の目次の後に REFERENCE の区切りを挟んで並べる。 */
    const glossaryTopicOf = (glossary) => ({
      attributes: { "data-glossary": "" },
      eyebrow: "reference",
      tocEyebrow: "reference",
      chips: [],
      dotTone: null,
      labelPartsOf: () => ["用語集"],
      tocDivider: "REFERENCE",
      inlineSummary: PrimerSideTitle,
      body: [el("div", { class: "primer-glossary-wrap" }, [el("table", { class: "primer-glossary" }, [
        el("thead", {}, [el("tr", {}, [el("th", { text: "用語" }), el("th", { text: "意味" })])]),
        el("tbody", {}, glossary.terms.map((term) => el("tr", {}, [el("td", { text: term.label }), prose("td", {}, term.text)]))),
      ])])],
      sideBlocksOf: () => [el("p", { class: "side-sub" }, [
        el("span", { class: "primer-glossary-note is-side", text: "本文の点線の語にカーソルを合わせると、右の欄の同じ語が光ります。" }),
        el("span", { class: "primer-glossary-note is-inline", text: "本文の点線の語にカーソルを合わせると、その節の畳んだ欄(この PR で出てくる場所)の中の同じ語が光ります。" }),
        "ここには、このタブに出てくる語をまとめています。",
      ])],
    });

    /**
     * 1 つのタブの 3 列。節のあとに、用語があれば用語集の節を足す。
     * @param showSeeAlso 関連のチップを押したときに、指した節(`{tab, index}`)へ移る
     */
    const tabColumnsOf = (tab, { topics, glossary }, showSeeAlso) => {
      // 印に乗ると、右の欄とその節の畳んだ欄の同じ語を光らせる。`columns` は光らせる時点で読むので、組み立ての後でよい。
      const onMarkIn = (index) => (mark, term) => lightWhileHoveredOrFocused(mark, () => [columns.side, columns.inlineHolders[index]]
        .flatMap((node) => [...node.querySelectorAll(".primer-term")])
        .filter((node) => node.dataset.term === term.id));
      const columnTopics = topics.map((topic, index) => ({
        attributes: { "data-topic": topic.id },
        eyebrow: topic.category,
        tocEyebrow: topic.category,
        chips: topic.status === null ? [] : [primerChipOf(topic.status)],
        dotTone: topic.status === null ? null : primerChipOf(topic.status).tone,
        labelPartsOf: () => proseParts(topic.label),
        tocDivider: null,
        inlineSummary: PrimerSideTitle,
        body: topicBodyOf(topic, onMarkIn(index)),
        sideBlocksOf: () => topicSideBlocksOf(topic, showSeeAlso),
      }));
      const glossaryTopics = glossary === null ? [] : [glossaryTopicOf(glossary)];
      const columns = TopicColumns.create({ topics: [...columnTopics, ...glossaryTopics], emptySide: PrimerEmptySide });
      const empty = topics.length === 0 ? [emptyOf("このタブに書かれた技術はありません。")] : [];
      const stageBody = el("div", { class: "stage-body topic-body", role: "tabpanel", id: `primer-panel-${tab}`, "aria-labelledby": `primer-tab-${tab}` }, [ledeOf(tab), ...empty, ...columns.articles]);
      // 件数は節だけを数え、用語集を入れない(デザイン案のタブの件数も節だけを数える)。
      return { columns, stageBody, count: topics.length };
    };

    let currentTab = PrimerTopics.firstTabOf(primerTopics);
    let saved = Object.fromEntries(tabs.map((tab) => [tab, { main: 0, page: 0 }]));
    const parts = Object.fromEntries(tabs.map((tab) => [tab, tabColumnsOf(tab, primerTopics.tabs[tab], (position) => showSeeAlso(position))]));
    const tocNote = el("span", { class: "panel-sub" });
    const tabButtons = tabs.map((tab) => {
      const button = pressable("button", { class: "primer-tab", role: "tab", id: `primer-tab-${tab}`, "aria-controls": `primer-panel-${tab}`, "data-tab": tab }, [
        el("span", { class: "primer-tab-label", text: PrimerTabTexts[tab].label }),
        el("span", { class: "primer-tab-count", text: String(parts[tab].count) }),
        el("span", { class: "primer-tab-desc", text: PrimerTabTexts[tab].description }),
      ], () => showTab(tab));
      button.addEventListener("keydown", (event) => {
        const step = Object.hasOwn(TabMoveKeys, event.key) ? TabMoveKeys[event.key] : 0;
        if (step === 0) return;
        event.preventDefault();
        const next = tabs[(tabs.indexOf(tab) + step + tabs.length) % tabs.length];
        showTab(next);
        tabButtons[tabs.indexOf(next)].focus();
      });
      return button;
    });

    /** 今のタブの 3 列だけを出す。 */
    const renderTab = () => {
      for (const [index, tab] of tabs.entries()) {
        const isCurrent = tab === currentTab;
        tabButtons[index].setAttribute("aria-selected", String(isCurrent));
        tabButtons[index].setAttribute("tabindex", isCurrent ? "0" : "-1");
        parts[tab].columns.toc.hidden = !isCurrent;
        parts[tab].stageBody.hidden = !isCurrent;
        parts[tab].columns.side.hidden = !isCurrent;
      }
      tocNote.textContent = PrimerTabTexts[currentTab].tocNote;
    };

    /** 今のタブをそのタブにし、そのタブの覚えた位置(本文の欄とページ全体)を戻す(初めてなら先頭)。離れるタブの位置は覚えない。 */
    const restoreTab = (tab) => {
      currentTab = tab;
      renderTab();
      main.scrollTop = saved[tab].main;
      window.scrollTo(0, saved[tab].page);
    };

    /** この画面の中でタブを切り替える。離れるタブの位置(本文の欄とページ全体)を覚えてから、戻るタブの位置を戻す。 */
    const showTab = (tab) => {
      if (tab === currentTab) return;
      saved = { ...saved, [currentTab]: { main: main.scrollTop, page: window.scrollY } };
      restoreTab(tab);
    };

    /** 関連のチップ。指したタブへ切り替えて(位置の保存と復元を通る)から、その節へ送る。 */
    const showSeeAlso = (position) => {
      showTab(position.tab);
      parts[position.tab].columns.sendTo(position.index);
    };

    main.replaceChildren(...tabs.map((tab) => parts[tab].stageBody));
    left.replaceChildren(el("div", { class: "panel-head" }, [el("span", { class: "panel-title", text: "目次" }), tocNote]), ...tabs.map((tab) => parts[tab].columns.toc));
    right.replaceChildren(panelHead(PrimerSideTitle, ""), ...tabs.map((tab) => parts[tab].columns.side));
    renderTab();
    TopicColumns.subscribe({ main, follow: (top, ratio) => parts[currentTab].columns.follow(top, ratio) });
    const keepReading = TopicColumns.keepReadingOf({ main, currentColumns: () => parts[currentTab].columns });

    return {
      ...screenParts,
      tablist: el("div", { class: "primer-tablist", role: "tablist", "aria-label": "技術の種類" }, tabButtons),
      keepReading,
      /**
       * ほかの画面から、その節へ送る。タブが違えばそのタブの覚えた位置を戻してから送り、離れるタブの位置は覚えない。
       *
