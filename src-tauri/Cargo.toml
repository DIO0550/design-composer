[package]
name = "design-composer"
version = "0.1.0"
description = "ローカルで動く、宣言的データ駆動のデザインツール"
authors = ["DIO0550"]
license = "MIT"
repository = "https://github.com/DIO0550/design-composer"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# bin と同名にしないための接尾辞。Windows では staticlib の .lib と bin のインポート
# ライブラリが同じファイル名になり、ビルド出力がぶつかる（Linux では衝突しない）。
name = "design_composer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6" }

[dependencies]
# ファイル監視。std に相当機能が無く、Tauri 公式の tauri-plugin-fs 自身も採用している
notify = "8"
# 変更の落ち着きを待つデバウンス。非アトミックな外部書き込みの途中状態を読まないために使う
notify-debouncer-mini = "0.7"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.10.3" }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
